slug: dbt-validation
version: 1.0.0
title: "認可與生物社會解釋"
intro: "辯證行為治療（DBT）同時抓住兩件事：接納個案現在的樣子，也幫她改變。認可是接納的那一邊。它用話語告訴個案：以她經歷過的事和現在的處境來看，她的體驗說得通。認可不是同意她的結論，也不是稱讚她做的事。認可有不同的做法，這個模組稱為層次。有些回應顯示你準確地聽懂了她。有些回應說出她沒有說出口的部分。有些回應顯示，以她的成長經歷來看，她這樣反應說得通。有些回應顯示，換成幾乎任何一個處在她位置上的人，今天也會這樣反應。依當下的需要選擇層次，而且只說真的話。認可有道理的部分。不要認可「沒有人受得了我」這類想法，也不要把讓她失去想要之物的行動說成有效。第二項技能是生物社會解釋：用簡短、平實的話說明，為什麼有些人的感受來得快、來得強、平復得慢，以及多年聽到「你太誇張了」，怎樣讓人不再信任自己的感受。它描述的是一種模式，不是判決，也不責怪個案或她的家人。這個模組裡，你會認識個案 J，一位 30 歲、自由接案的平面設計師。她上一段治療做了六次就停了，她說那位治療師也覺得她很麻煩。也要知道什麼時候不該用這些技能。不要用這個解釋替某個行動開脫，也不要用它結束一段對話。不要說教。先提出來，問她合不合，讓她修正。這個階段不涵蓋危及生命行為的評估和處理。這部分要在督導下，按實習機構的守則學習。"
skills:
  - dbt-validation-levels
  - biosocial-explanation
reflection_prompts:
  - id: dbt-validation-r1
    text: "J 說上一位治療師也覺得她很麻煩。你會想怎樣替那位治療師辯護，或者向她保證你會不一樣？認可 J 的話，聽起來會是怎樣？"
  - id: dbt-validation-r2
    text: "找出一句你寫的認可回應，你當時想在後面加「不過」。你想在「不過」後面說什麼？那句話可以放在哪裡？"
  - id: dbt-validation-r3
    text: "想一次別人說你的反應太誇張的經驗。事後，你怎樣處理那份感受？這會怎樣幫你聽懂 J？"
