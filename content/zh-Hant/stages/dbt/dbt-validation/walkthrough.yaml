sessions:
  - id: dbt-validation-s1
    title: "第 1 次會談：「她也覺得我很麻煩」"
    turns:
      - id: dbt-validation-s1-t01
        speaker: therapist
        text: "J，請進，坐哪裡都可以。謝謝你來。我想先聽聽，是什麼讓你來到這裡，用你自己的話說。"
      - id: dbt-validation-s1-t02
        speaker: client
        text: "我找了差不多一個月的治療師才預約。我去年做過治療，六次，然後就停了。我也不太確定為什麼又來試。"
      - id: dbt-validation-s1-d1
        type: choice
        prompt: "J 說她不太確定為什麼又來試。你怎樣說？"
        options:
          - id: a
            text: "你不太確定要不要再試，還是來了。我想聽聽是什麼讓你來到這裡，也想聽聽你願意讓我知道的上一次的事。"
            fit: strong
            note: "它認真看待她的猶豫，並指出她是在猶豫中仍然來了。它邀請她講上一次的故事，沒有要她解釋或辯護什麼。"
          - id: b
            text: "你願意再給治療一次機會，這很好。上一次是哪裡出了問題？"
            fit: workable
            note: "它很歡迎她。可是「哪裡出了問題」，等於在第一分鐘就要她評斷另一位治療師，或評斷自己。"
          - id: c
            text: "很多人要試幾次才找到適合的治療師，所以不用氣餒。"
            fit: weak
            note: "它是好意，卻把她特有的猶豫變成人人都有的事。她要的不是鼓勵。"
        actual: "你不太確定要不要再試，還是來了。我想聽聽是什麼讓你來到這裡，也想聽聽你願意讓我知道的上一次的事。"
        rationale: "第一次認可不需要技巧。它說的是：她的猶豫說得通，而且她在猶豫中仍然來了。要說什麼，由她決定。"
      - id: dbt-validation-s1-t03
        speaker: client
        text: "是我姊姊叫我找人談的，我們吵了一架之後。上一位治療師在第六次之後跟我說，我需要「處理我的反應」，她還有排隊的人。我不覺得她想我再去。她也覺得我很麻煩。每個人都這樣。"
      - id: dbt-validation-s1-d2
        type: choice
        prompt: "J 說上一位治療師也覺得她很麻煩，然後說「每個人都這樣」。你怎樣說？"
        options:
          - id: a
            text: "我相信她不是那個意思。治療師常常都有排隊的人。"
            fit: weak
            note: "它替一位你沒見過的治療師辯護，並告訴 J 她聽到的是誤會。這句話她聽過了。"
          - id: b
            text: "第六次之後你聽到的是「很麻煩」，而「每個人都這樣」，聽起來你好像聽過很多次了。你今天帶著這麼多進來。"
            fit: strong
            note: "它把她聽到的當成對她而言是真的。它沒有評斷另一位治療師，也沒有同意她很麻煩。它用她的話「每個人都這樣」，說出這句話所包含的意思。"
          - id: c
            text: "聽起來很痛。你覺得別人對你的反應，有沒有什麼模式？"
            fit: workable
            note: "第一句很溫和。那個問題卻要她在剛受傷的幾秒內分析自己，她可能聽成那個模式是她的錯。"
        actual: "第六次之後你聽到的是「很麻煩」，而「每個人都這樣」，聽起來你好像聽過很多次了。你今天帶著這麼多進來。"
        rationale: "這是第一個「認可而不同意」的例子。你沒有說她很麻煩，也沒有說她不麻煩。你說的是：她聽到的這些，讓她有戒心說得通。"
      - id: dbt-validation-s1-t04
        speaker: client
        text: "（聳聳肩）我也不是說我沒錯。我會大聲。我五年內走出過四份工作。"
      - id: dbt-validation-s1-t05
        speaker: therapist
        text: "那幾份工作，我之後想聽聽。繼續之前，我會問每一個人同一個問題。你有沒有過傷害自己，或結束生命的念頭？"
      - id: dbt-validation-s1-t06
        speaker: client
        text: "沒有。沒有那種事。我只是想讓事情不要再爆炸。"
      - id: dbt-validation-s1-d3
        type: free
        prompt: "J 說她想讓事情不要再爆炸。寫一兩句話認可這個心願。不要同意她「太麻煩」，也不要和這個想法爭。"
        actual: "想讓事情不要再爆炸，這很說得通，畢竟有四份工作都在爭吵中結束，而上一段治療也是以「處理你的反應」結束的。我想了解事情爆炸的時候發生了什麼，如果你願意的話。"
        rationale: "它用她給你的兩個事實認可她的心願。它加了一個小而誠實的下一步。它沒有把她的反應說成問題。"
      - id: dbt-validation-s1-t07
        speaker: client
        text: "（停了一下）老實說，你是第一個一下子就懂的人。沒有人跟我說過這種話。"
      - id: dbt-validation-s1-d4
        type: choice
        prompt: "J 說你是第一個懂她的人。你怎樣回應？"
        options:
          - id: a
            text: "謝謝你。我很高興你覺得被理解。我會一直在這裡陪你。"
            fit: weak
            note: "它在第一天就過度承諾。第一次你沒有懂她的時候，J 會記得你說過「一直」。"
          - id: b
            text: "我很高興你有這樣的感覺。我相信我有時也會弄錯，如果有，我希望你告訴我。"
            fit: strong
            note: "它接受她的善意，卻沒有接下「永遠懂她的人」這個角色。它邀請她在你不夠的時候說出來。"
          - id: c
            text: "我很高興。不過，不要把我放上神壇，我只是一位治療師。"
            fit: workable
            note: "這個提醒是誠實的，但說得太早。聽到「不過」之後，她可能覺得自己很久以來第一次的好感覺是個錯誤。"
        actual: "我很高興你有這樣的感覺。我相信我有時也會弄錯，如果有，我希望你告訴我。"
        rationale: "她可能很快從「你懂我」轉到「你和其他人一樣」。你不需要去防止它。你可以讓她更容易把它說出口。"
      - id: dbt-validation-s1-t08
        speaker: client
        text: "（小笑一下）好吧。走著瞧。"
      - id: dbt-validation-s1-t09
        speaker: therapist
        text: "時間快到了。下星期，如果你願意的話，我想聽聽那四份工作其中一份。今天談這些，是什麼感覺？"
      - id: dbt-validation-s1-t10
        speaker: client
        text: "怪怪的。不是壞的那種怪。"
    notes:
      goals: "J 的目標：「我只是想讓事情不要再爆炸。」還沒有詳細共同訂下。我問了她有沒有傷害自己或結束生命的念頭，她說沒有。這個工具不示範其他答案要怎樣處理。依實習機構的守則處理，並告訴督導。"
      alliance: "情感連結：戒備，又很快變暖。「第一個一下子就懂的人」是早期的警訊，輕輕地記著。任務：還沒有約定。目標：她的目標很清楚，我的還沒有放進去。"
      formulation_update: "只是初步觀察。五年內離開四份工作，每次都在衝突之後。上一段治療在六次之後以「處理你的反應」結束。她從很多人那裡聽到「很麻煩」。還沒有談到她的家庭。"
  - id: dbt-validation-s2
    title: "第 2 次會談：「告訴我我哪裡不對」"
    turns:
      - id: dbt-validation-s2-t01
        speaker: therapist
        text: "J，你好。上星期你告訴我上一段治療和那四份工作。這個星期怎麼樣？"
      - id: dbt-validation-s2-t02
        speaker: client
        text: "很糟。一個客戶寄電郵說「這一版不太對」，我想把全部撕掉。然後我為了另一件事對姊姊大小聲。我不知道為什麼我是這樣的人。"
      - id: dbt-validation-s2-d1
        type: choice
        prompt: "J 問自己為什麼是這樣。你覺得生物社會解釋可能有幫助。你先說什麼？"
        options:
          - id: a
            text: "這有原因，而且是一個很常見的模式。讓我說明這種治療背後的理論。"
            fit: weak
            note: "它從理論開始，不是從她開始。聽起來像講課，也把「我為什麼是這樣」只當成要資訊的問題，其實那同時是一份擔心。"
          - id: b
            text: "這個問題你也許問了很久。我可以提出一個理解它的方式嗎？哪些地方合、哪些地方不合，你可以告訴我。"
            fit: strong
            note: "它先問她同不同意，把解釋縮小為「一個方式」，並把檢查的工作交給她。她仍然是自己人生的專家。"
          - id: c
            text: "你覺得原因是什麼？"
            fit: workable
            note: "這很尊重。但她已經有很多年的時間回答這個問題，答案大概是「我壞掉了」。你等於要她再說一次。"
        actual: "這個問題你也許問了很久。我可以提出一個理解它的方式嗎？哪些地方合、哪些地方不合，你可以告訴我。"
        rationale: "先問，再解釋。她同意聽的解釋，和不請自來的解釋，聽起來是不一樣的。"
      - id: dbt-validation-s2-t03
        speaker: client
        text: "好。請說。告訴我我哪裡不對。"
      - id: dbt-validation-s2-d2
        type: free
        prompt: "J 說：「告訴我我哪裡不對。」寫出你解釋的頭兩三句。用平實的話，不貼標籤，並連到 J 告訴過你的事。"
        actual: "我不覺得你有什麼不對。從你告訴我的來看，你的感受來得快、來得強，而且很久才平復。而在家裡，你難過的時候，得到的回應常常是「你太誇張了」。這兩件事放在一起，也許可以解釋很多事。"
        rationale: "她要一個判決。你給她一個想法來代替。它有兩個部分：她的感受跑得多快多強，以及遇到什麼回應。它用「也許」說出來，讓她可以糾正。"
      - id: dbt-validation-s2-t04
        speaker: client
        text: "（小聲）我媽媽以前會說「這有什麼好哭的？」我姊姊是不吵不鬧的那一個。（停了一下）你是說這是他們的錯嗎？"
      - id: dbt-validation-s2-d3
        type: choice
        prompt: "J 問這是不是她家人的錯。你怎樣說？"
        options:
          - id: a
            text: "我不是說這是誰的錯。聽起來他們是為你好，只是不知道怎樣面對這麼大的感受。這像他們嗎？"
            fit: strong
            note: "它先回應她的擔心，沒有挑一個壞人出來。它停在她告訴過你的話上，並問她合不合。"
          - id: b
            text: "某個程度上是。一個不理會孩子感受的家，會造成長久的傷害。"
            fit: weak
            note: "這在一般情況下可能是真的。但它在證據很少的時候就歸咎她的家人，而她不是替他們辯護，就是把責任全攬到自己身上。"
          - id: c
            text: "重要的不是誰的錯，而是我們現在要做什麼。"
            fit: workable
            note: "這很合理，也避開了歸咎。可是她剛說了一件關於媽媽的難受的事，它在她得到回答之前就移開了。"
        actual: "我不是說這是誰的錯。聽起來他們是為你好，只是不知道怎樣面對這麼大的感受。這像他們嗎？"
        rationale: "生物社會解釋描述的是一種不合拍，不指派責任給 J，也不指派給她的家人。先回答她提出的擔心，再和她核對這個想法。"
      - id: dbt-validation-s2-t05
        speaker: client
        text: "（停了很久）不，他們不壞。他們很累。爸爸常常不在家。（眼睛濕了）從來沒有人這樣說過。我不是壞。是不合拍。"
      - id: dbt-validation-s2-t06
        speaker: therapist
        text: "不合拍。對，這樣說很好。"
      - id: dbt-validation-s2-t07
        speaker: client
        text: "可是，那樣不就是說，我封鎖別人也沒關係嗎？因為不是我的錯？"
      - id: dbt-validation-s2-d4
        type: choice
        prompt: "J 問這個解釋是不是讓封鎖別人變得沒關係。你怎樣說？"
        options:
          - id: a
            text: "以你的成長經歷來看，你的反應說得通，這和「什麼都不能改」是兩回事。封鎖是讓痛快點停下來的辦法，說得通。我們可以一起找找看，有沒有代價少一點的辦法。"
            fit: strong
            note: "它把認可和改變放在同一個回答裡，也按這個次序說：反應說得通，行動有代價。它沒有說她有錯，也沒有說她沒有辦法。"
          - id: b
            text: "對。這一切都不是你的錯，所以你不要對自己太苛刻。"
            fit: weak
            note: "它把解釋變成藉口。它也把她當成不能改變的人，這和認可的用意剛好相反。"
          - id: c
            text: "事情沒有這麼簡單。你還是要為自己做的事負責。"
            fit: workable
            note: "這是事實，卻說在她第一次覺得被理解之後。她可能聽成：剛被放過，馬上又被教訓。"
        actual: "以你的成長經歷來看，你的反應說得通，這和「什麼都不能改」是兩回事。封鎖是讓痛快點停下來的辦法，說得通。我們可以一起找找看，有沒有代價少一點的辦法。"
        rationale: "認可說的是反應說得通，沒有說行動有效。直接說第一件，溫和地說第二件，並放在同一個回答裡。"
      - id: dbt-validation-s2-t08
        speaker: client
        text: "（慢慢地）「代價少一點」。好。這個我可以接受。"
    notes:
      goals: "J 的目標沒變，這個解釋給了它新的形狀：從「不要再這樣」，變成「找代價少一點的辦法」。還沒有寫成目標。"
      alliance: "情感連結：她哭了一點，也留下來了。「不合拍」這個說法是她自己說的。任務：她知道我會問具體的時刻。不要承諾這會很容易。"
      formulation_update: "父母「很累」，爸爸常常不在家。媽媽說「這有什麼好哭的」。姊姊是「不吵不鬧」的那一個。她覺得自己的感受不可信，這條線值得跟著走。封鎖是她讓傷痛快點停下來的辦法。留意被理解的舒緩，會不會在第一次失望時變成「你和其他人一樣」。"
