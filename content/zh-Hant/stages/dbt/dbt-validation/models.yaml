dbt-validation-e01:
  model_response: "你小時候常聽到「你太誇張了」，所以看到「戲劇化」這三個字會特別刺痛，想把手機摔出去也說得通。"
  why: "它用她自己的成長經歷當理由，也用她的字眼「把手機摔出去」。它沒有說她戲劇化，也沒有叫她別那樣。"
  avoid: "「你姊姊大概不是那個意思。」這是替姊姊辯護，等於告訴 J 她看錯了那則訊息。"
dbt-validation-e02:
  model_response: "上一段治療是那樣結束的，所以你取消了兩次、差一點就不來，這說得通。"
  why: "它把取消預約連到她說的上一段治療。它沒有稱讚她來了，否則這一刻會變成一張成績單。"
  avoid: "「我很高興你來了。別擔心，這次會不一樣。」它承諾了你不可能知道的事，也跳過了她的猶豫是為了什麼。"
dbt-validation-e03:
  model_response: "你一直是哭的那一個，她是懂事的那一個，所以你笑著替她高興、回家哭了一個小時，這說得通。"
  why: "它把她說過的舊角色連到升職之後發生的事。它用她的字眼「哭了一個小時」，也沒有提到嫉妒。"
  avoid: "「聽起來你在嫉妒姊姊。」這是標籤，而且 J 沒有這樣說。"
dbt-validation-e04:
  model_response: "以前你要說得很大聲才有人聽，所以你寫了四段，這說得通。你只是需要他明白。"
  why: "它沒有同意那封電郵太多，也沒有說電郵沒問題。它說的是：以她的經歷來看，想被明白是說得通的。"
  avoid: "「四段太長了。下次試試寫短一點。」這是建議，而且同意了她最苛刻的那個字。"
dbt-validation-e05:
  model_response: "和主管起了那場衝突之後，你在那個房間多待不了一分鐘，這說得通。"
  why: "它認可有道理的部分，也就是需要離開那個房間。它沒有說走出去是對還是錯。"
  avoid: "「走出去是個壞決定，不過我理解。」那個「不過」把理解收回去了。"
dbt-validation-e06:
  model_response: "有些人的感受來得比較快、比較強，平復得也比較慢。可能你也是這樣，所以一封只有一句話的電郵就能引起很多反應，那一天也被它帶著走。"
  why: "它用平實的話說出感受可以在快慢和強弱上不同，並連到她那封一句話的電郵。「可能」讓她可以糾正。"
  avoid: "「你的情緒反應性很高。」這是專業術語，作用就像標籤。"
dbt-validation-e07:
  model_response: "如果你小時候感受常被說成「太誇張」，後來開始懷疑它們，是很自然的。可能你現在每次都會先問自己「我是不是只是在戲劇化」，還沒來得及知道自己感覺到什麼。"
  why: "它把她的懷疑連到她說過的童年，並把懷疑當成學來的東西，不是缺點。"
  avoid: "「你大概是在否定自己。」這是專業用語，而且把 J 自己的懷疑怪在她身上。"
dbt-validation-e08:
  model_response: "如果你要哭得很大力才被聽見，那你學會把音量調大，是說得通的。這可能是一個當時有用、後來留下來的習慣，現在就被說成「太激烈」。"
  why: "它把這個習慣當成因為某個原因學來的。它用她的字眼「聽見」和「太激烈」，沒有說她激烈。"
  avoid: "「有些人覺得被忽略時，就會想要引人注意。」這是替行為貼標籤，並把責任放在她身上。"
dbt-validation-e09:
  model_response: "知道你的感受來得又快又強，也許能讓我們把你的反應看成一個說得通的模式，而不是你有問題的證據。然後我們可以一步一步，找出什麼有幫助。"
  why: "它用平實的話回答她問的「有什麼用」。它給這個想法一個用處，沒有下判決。"
  avoid: "「這很重要，因為它解釋了你為什麼是現在這個樣子。」這聽起來像標籤，而 J 已經很怕被塞進框框。"
dbt-validation-e10:
  model_response: "可能是強烈的反應之後，羞愧跟著來，在第一份負擔上又壓了第二份。如果是這樣，羞愧也是這個模式的一部分，它不證明你是什麼樣的人。"
  why: "它把羞愧說成第二層，不是性格的缺陷。「可能」讓它保持開放。"
  avoid: "「你不該覺得羞愧。」這是告訴她該有什麼感受，羞愧不會消失，只是多了一條禁令。"
dbt-validation-m01:
  model_response: "他只傳了冷冰冰的一句，你就想讓他從你的螢幕上消失。這說得通。我還不能說封鎖他是不是最好的做法，我看得懂你為什麼這樣做。"
  why: "它誠實地回答「你同意吧」。它說出自己能同意的部分，也就是這個反應說得通，沒有假裝同意封鎖是最好的做法。"
  avoid: "「對，他活該。」這同意了那個行動，也放棄了你的誠實。以後你不再同意時，J 會看出來。"
dbt-validation-m02:
  model_response: "你當時非常難受，任何能讓你好過一個小時的東西，都很難抗拒。這說得通。"
  why: "它認可她想好過一點的需要，沒有說買這個是不是明智。那個問題留到之後再談。"
  avoid: "「沒關係，每個人都會犒賞自己。」這把行動說成很平常，J 還沒看過它，話題就先關上了。"
dbt-validation-m03:
  model_response: "說出口的時候好痛快，現在卻想吐。兩件事都是真的，而那份痛快沒有維持下去，也說得通。"
  why: "它保留她的兩種感受，沒有選邊。它沒有說取消是對還是錯。"
  avoid: "「你不該取消的。也許你還可以打電話給他們。」這直接跳到建議，把想吐的感覺留在原地。"
dbt-validation-m04:
  model_response: "你從小就聽到「太敏感」，所以心裡有一部分開始懷疑她是不是對的，這說得通。"
  why: "它把她的懷疑連到她小時候聽到的話來認可。它沒有說她是不是「很麻煩」。"
  avoid: "「你一點也不敏感。」這是在和她爭，而從小到大，總有人在爭論她的感受該不該有。"
dbt-validation-m05:
  model_response: "你說的時候是認真的，現在又不確定自己是什麼意思。吵過那樣一架之後，兩種都說得通。"
  why: "它把她說的兩半放在一起交還給她。它沒有告訴她該怎麼處理姊姊。"
  avoid: "「你應該等冷靜一點再決定。」這是建議，而且把她星期日說的話當成錯誤。"
dbt-validation-m06:
  model_response: "我不覺得這是誰的錯。他們可能已經盡力了，只是面對一個感受又大又快的孩子，他們手上的回應是「你太誇張了」。這和你記得的一樣嗎？"
  why: "第一句就回應了她的擔心。接著把這個想法說成「不合拍」，用的是她給你的話，並問她合不合。"
  avoid: "「對，一個不理會孩子感受的家庭，確實會造成傷害。」這是在歸咎，J 不是起來替父母辯護，就是把責任全攬到自己身上。"
dbt-validation-m07:
  model_response: "不是壞掉。有些人的感受就是跑得比較快、比較強，這是差異，不是缺陷。這聽起來像你嗎？"
  why: "它直接回答「壞掉」這個字，再用她的處境說明這個想法。最後的問題讓她可以說不。"
  avoid: "「每個人天生的氣質都不同。」這句話是真的，但太籠統。它回答了理論，沒有回答她害怕的是什麼。"
dbt-validation-m08:
  model_response: "這和你告訴我的一樣：務實的人，沒有多少時間。可能還是有這樣的情況：一個感受很大的孩子，學會把它們收小，即使家裡沒有人存心傷害她。這聽起來對嗎？"
  why: "它先接受她說的家人，所以沒有和她爭。這個想法是放在旁邊的，不是推翻她說的。"
  avoid: "「務實的人也可能在情感上忽視孩子。」這是很重的說法，她會把它聽成指控。"
dbt-validation-m09:
  model_response: "我也不想把你塞進框框裡。我說的是你告訴我的一個模式：感受來得又快又強，而家裡的回應是「你太誇張了」。你可以糾正其中任何一個部分。"
  why: "第一句就同意她的心願，並顯示這個想法是用她自己的話建起來的。「你可以糾正」把筆交到她手上。"
  avoid: "「這不是框框，只是一個架構。」這是和她的用詞爭，而架構聽起來比對話更像框框。"
dbt-validation-m10:
  model_response: "我聽到你擔心它不會變。感受快而強，是一個起點，不是判決。人是可以學會怎樣和它們相處的。這樣想，會比較容易接受這個想法嗎？"
  why: "它回應她怕它是固定的，並把「起點」和「判決」分開。它沒有承諾結果。"
  avoid: "「當然會改變，你只要努力就好。」這是承諾，而「努力」聽起來像在說她不夠努力。"
dbt-validation-h01:
  model_response: "剛好在重點停下來，時間確實不好。我看得出來，為什麼那像是被打斷了。這樣說對嗎？"
  why: "它承認真實的部分，也就是結束的時間點很難受，沒有解釋時間限制。最後的問題讓她可以說「不，不只是這樣」。"
  avoid: "「我們一定要準時結束，這樣每個個案才公平。」這是解釋和辯護，等於證明了她的說法。"
dbt-validation-h02:
  model_response: "你遲到了，而你進來時預期我會往最壞的地方想。上一段治療是那樣結束的，這說得通。我很高興你來了。"
  why: "它沒有和「沒救了」爭，也沒有同意。它用上一段治療當理由，認可她的預期，最後以簡單的歡迎收尾。"
  avoid: "「你才不是沒救了！每個人都會遲到。」這是和她的結論爭，而且是她已學會不去相信的那種安慰。"
dbt-validation-h03:
  model_response: "有一個星期沒有會談，這確實是個空檔。在你正處理這麼困難的事的時候，它讓人很難受，也說得通。這對你是什麼感覺？"
  why: "它承認她抱怨中真實的部分，也就是那一個星期她沒有會談。它沒有說你會在哪裡、為什麼。"
  avoid: "「那不是假期，我是去開會。」這是在替自己辯護，而她其實不是在說這個。"
dbt-validation-h04:
  model_response: "她說想幫你，然後訊息就沒有回音了。再聽到這些話，當然很難。先看看再說，也說得通。"
  why: "它沒有承諾你會不一樣。它用她告訴你的原因，認可她的謹慎。"
  avoid: "「我不會那樣。我一定會回覆。」這是你做不到的承諾，而她正等著你違背它。"
dbt-validation-h05:
  model_response: "那些星期三沒有改變，講了這麼多還沒有幫上忙，你覺得厭煩，這說得通。"
  why: "它承認真實的部分，也就是星期三沒有變。它沒有爭論治療需要時間。它認可她的厭煩，沒有同意「什麼都沒用」。"
  avoid: "「改變需要時間。我們再試幾個星期吧。」這在她質疑治療的時候，替治療辯護。"
dbt-validation-h06:
  model_response: "那樣聽起來確實像被研究，很抱歉讓你有這種感覺。我說簡單一點：你告訴過我，感受很大，而在家裡得到的回應是「你太誇張了」。我想說的只有這些，這些你比我清楚。"
  why: "它接住她的反對，簡短道歉一次。然後放下理論，只留下她告訴過你的事。"
  avoid: "「這是一個很成熟的模型，適用於很多人。」這是替理論辯護，並告訴她她只是眾多案例之一。"
dbt-validation-h07:
  model_response: "我不是要把她說成壞人。她打兩份工，你想護著她，這說得通。可能是每個人都被拉得很緊，而你的感受沒有地方放。"
  why: "它直接說她不是壞人，並尊重那份忠誠。這個想法以「每個人都被拉得很緊」帶進來，用的是她給你的兩份工。"
  avoid: "「再愛孩子的父母，也可能在情感上辜負孩子。」這大致上是真的，而 J 會聽成「你媽媽辜負了你」。"
dbt-validation-h08:
  model_response: "我聽到了。那是他們用來說你的詞，我不再用它。我想說的只是你的感受來得又快又強，這說的是速度，不是缺點。「又快又強」這樣說，會好一點嗎？"
  why: "它接受她對這個詞的反對，並不再使用。它用另一種說法描述同一個想法，問她是否比較合適。"
  avoid: "「我沒有惡意，這只是個中性的詞。」這是替那個詞辯護，並要她換個方式去聽。"
dbt-validation-h09:
  model_response: "你對那種會變成藉口的解釋有戒心，是對的。這不是說什麼都不用你負責。我想說的是，我們懂了這個模式，你在下一步怎樣做，就可能有更多的主導權。這樣是不是比較接近你想用它的方式？"
  why: "它把她的懷疑當成合理，沒有堅持她錯了。它說出這個想法的一個用處：給她更多控制，不是更少。"
  avoid: "「我不是說這是藉口。你還是要為自己的行為負責。」這是在爭論，聽起來像警告。"
dbt-validation-h10:
  model_response: "可能講得太整齊了。我想知道哪些地方對不上。哪怕只有一小塊，對我都有幫助。"
  why: "它把她平淡的語氣當成資訊。它請她說出對不上的部分，讓她有東西可以頂回來。"
  avoid: "「你好像關起來了。你在想什麼？」這是替她說出她的退縮，並把她推到風口上。"
