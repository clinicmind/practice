  level: medium
  skill: link-identification
  context: "第 6 次會談。"
  client: "事後我覺得想吐，我想，我一定有什麼問題，然後我就躺在床上。"
  criteria: *li_medium
- id: dbt-chain-m10
  level: medium
  skill: link-identification
  context: "第 6 次會談。"
  client: "是從他連聲招呼都沒打開始的。只有「把檔案傳來」。我覺得自己很渺小。我把檔案傳了，然後我就沒辦法工作了。"
  criteria: *li_medium

- id: dbt-chain-h01
  level: hard
  skill: chain-questioning
  context: "第 5 次會談。你連續問了三個問題。J 的聲音拉高了。"
  client: "不要審問我！你聽起來像我的主管。"
  criteria: &cq_hard
    - "先注意並回應 J 對這些問題的反應，不為這些問題辯護。"
    - "讓下一個問題更小，或讓 J 更有掌控，例如提出放慢、跳過一部分，或讓她選擇從哪裡開始。"
    - "仍然指向鏈條的下一個步驟，不責備 J。"
