# 30 題練習：每個級別 10 題，每個級別每項技能 5 題。全部是個案 J。

- id: dbt-chain-e01
  level: easy
  skill: chain-questioning
  context: "第 5 次會談。你和 J 正一步一步回顧上星期三。"
  client: "電郵來了，然後我就失控了。"
  criteria: &cq_easy
    - "只問一個問題，只問鏈條上的一個步驟，例如剛剛發生了什麼、她接著做了什麼，或她身體有什麼感覺。"
    - "具體而開放，讓 J 可以用描述來回答。不問「為什麼」。"
    - "一兩句短句，沒有責備，也沒有評斷（「應該」「不該」「又」）。"
