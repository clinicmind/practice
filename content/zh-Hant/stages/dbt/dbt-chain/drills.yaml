- id: dbt-chain-m01
  level: medium
  skill: chain-questioning
  context: "第 5 次會談。J 對上星期三給了一個籠統的答案。"
  client: "我就是爆了。我就是這樣。"
  criteria: &cq_medium
    - "把 J 放慢到一個時刻，並請她說出她看得見或聽得見的具體細節，例如那句話、那個地方、時間或身體感覺。"
    - "不問「為什麼」，也不提出自己對環節的猜測。"
    - "先用幾個字接住 J 的話，再問一個問題。聽起來不像審問。"
