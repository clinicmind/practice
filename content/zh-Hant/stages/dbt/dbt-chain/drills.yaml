- id: dbt-chain-e06
  level: easy
  skill: link-identification
  context: "第 5 次會談。你和 J 正在建立上星期三那封電郵的鏈條。目前有：電郵來了。"
  client: "我讀了，然後我想，他們覺得我很糟。我的胸口發熱。"
  criteria: &li_easy
    - "用 J 自己的話說出她剛給的環節，並說出每個環節是哪一類，例如想法、身體感覺、衝動、行動或結果。"
    - "說出這個環節在鏈條中的位置，例如「緊接著」「然後」「在最後」，依情境列出的內容。"
    - "不加詮釋，不加自己的環節。一兩句。"
