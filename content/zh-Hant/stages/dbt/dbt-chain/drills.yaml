  level: medium
  skill: chain-questioning
  context: "第 5 次會談。"
  client: "我把那則訊息刪掉了，然後一切都變得模糊。"
  criteria: *cq_medium

- id: dbt-chain-m06
  level: medium
  skill: link-identification
  context: "第 6 次會談。你和 J 正在把環節一個一個列在鏈條上。"
  client: "我讀了，胃一沉，我想他們討厭它，然後我只想消失。"
  criteria: &li_medium
    - "把 J 說的話分成至少兩個不同的環節，例如想法、身體感覺、衝動和行動。"
    - "每個環節都用 J 自己的話，不加她沒有給的環節。"
    - "和 J 核對次序或用詞。不詮釋，也不評價。"
