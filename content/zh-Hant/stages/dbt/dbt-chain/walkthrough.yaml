sessions:
  - id: dbt-chain-s5
    title: "第 5 次會談：「像犯罪現場」"
    turns:
      - id: dbt-chain-s5-t01
        speaker: therapist
        text: "J，你好。上星期你告訴我星期三那封電郵。如果你願意，我想一步一步、慢慢地把它走一遍，像是一格一格地看影片。你隨時可以停。"
      - id: dbt-chain-s5-t02
        speaker: client
        text: "好。客戶寫的是：「這一版不太對，我們再想想。」沒有稱呼，結尾也沒有署名。然後我就失控了。"
      - id: dbt-chain-s5-d1
        type: choice
        prompt: "J 開始說鏈條。你問什麼？"
        options:
          - id: a
            text: "電郵來了。你最先注意到的是什麼，在腦中，或在身體上？"
            fit: strong
            note: "它停在一個步驟，問她注意到什麼。它指出兩個可以看的地方，腦中和身體，讓她自己選。"
          - id: b
            text: "是什麼讓你失控的？"
            fit: weak
            note: "它要的是理由，而答案會變成對她自己的判決。它也跳過了中間的步驟。"
          - id: c
            text: "從頭把一切告訴我，不要漏掉任何事。"
            fit: workable
            note: "它很徹底。但它要求一段很長、沒有結構的敘述，而「不要漏掉任何事」可能讓她覺得像在受審。"
        actual: "電郵來了。你最先注意到的是什麼，在腦中，或在身體上？"
        rationale: "鏈條是一個環節一個環節建起來的。問一個步驟，用平實的話。避免「為什麼」，因為它要她在還沒描述任何東西之前，先為自己辯護。"
      - id: dbt-chain-s5-t03
        speaker: client
        text: "我想：他們覺得我很糟。我的胸口發熱，手開始發抖。我打了一封很長的回信，然後刪掉了。"
      - id: dbt-chain-s5-d2
        type: choice
        prompt: "J 給了你一個想法、胸口發熱、發抖，還有一封她刪掉的長信。你怎樣說？"
        options:
          - id: a
            text: "所以是：「他們覺得我很糟」這個想法，胸口發熱，發抖，然後是你刪掉的那封長信。你刪掉之後，緊接著發生了什麼？"
            fit: strong
            note: "它把她的環節按次序、用她的話排好，再移到下一個。她聽得出來，鏈條是用她說的話建起來的。"
          - id: b
            text: "聽起來真的很強烈。你當時是怎樣處理的？"
            fit: workable
            note: "它很體貼。但「怎樣處理」太寬，她可能用一個總結回答，跳過那些步驟。"
          - id: c
            text: "你覺得客戶是那個意思嗎？「我們再想想」也可能只是中性的。"
            fit: weak
            note: "它在鏈條建起來之前，就質疑她的想法。她會聽成「你錯了」，也不會再告訴你事情。"
        actual: "所以是：「他們覺得我很糟」這個想法，胸口發熱，發抖，然後是你刪掉的那封長信。你刪掉之後，緊接著發生了什麼？"
        rationale: "把環節說回給她，能讓次序清楚，也讓她知道你在聽。它也給她機會糾正你。現在不要爭論任何事。那個想法是一個環節，不是一個錯誤。"
      - id: dbt-chain-s5-t04
        speaker: client
        text: "然後我把手機丟到沙發上。我叫了吃的。我很快全吃完了。我不會告訴你是什麼。（短短地笑了一聲）我們為什麼要做這個？你把它說得像犯罪現場。"
      - id: dbt-chain-s5-t05
        speaker: therapist
        text: "J，我只是想幫你。這是治療標準的一部分，你配合是很重要的。"
      - id: dbt-chain-s5-t06
        speaker: client
        text: "配合。好。（她把目光移開）算了。我今天不想做了。"
      - id: dbt-chain-s5-d3
        type: choice
        prompt: "你說了「你配合是很重要的」，J 變得冷淡。你看見了自己做了什麼。你怎麼辦？"
        options:
          - id: a
            text: "對不起。那句話說得像命令。你問了一個合理的問題，我卻像在背規定。你願意我說說這些問題是為了什麼，然後由你決定要不要繼續嗎？"
            fit: strong
            note: "它說出你做了什麼，沒有藉口，並說她的問題是合理的。接著把選擇給她。"
          - id: b
            text: "我不是那個意思。你對說話的方式很敏感。"
            fit: weak
            note: "它否認那個效果，並把原因放在她身上。它重複了傷到她的那件事：告訴她，問題在她的反應。"
          - id: c
            text: "我們先休息一下，下個星期再回來談這個。"
            fit: workable
            note: "休息也許有幫助。但如果放著不管，破裂仍在，她離開時會帶著「你和其他人一樣」。"
        actual: "對不起。那句話說得像命令。你問了一個合理的問題，我卻像在背規定。你願意我說說這些問題是為了什麼，然後由你決定要不要繼續嗎？"
        rationale: "你有時會答得不好，而 J 會注意到。修復，就是直接說出你做了什麼，以及那對她是什麼感覺，不辯護。然後把控制權給她。它也讓她看見修復是什麼樣子。"
      - id: dbt-chain-s5-t07
        speaker: client
        text: "（吸了一口氣）……好。說說它們是為了什麼。"
      - id: dbt-chain-s5-t08
        speaker: therapist
        text: "每一步，都是可能發生不同事情的地方。我不是在找你做錯了什麼。我是在找你本來可能有選擇的地方。這是你想找的嗎？"
      - id: dbt-chain-s5-t09
        speaker: client
        text: "（慢慢地）……好。剛才說到哪裡。我吃得很快。然後有一陣子覺得平靜。"
      - id: dbt-chain-s5-d4
        type: free
        prompt: "J 說她有一陣子覺得平靜。寫一個問題，移到下一個環節，不評斷那份平靜。"
        actual: "你平靜了一陣子。平靜過去的時候，發生了什麼？"
        rationale: "平靜是一個環節，也是真的。照它的樣子接受它。下一個環節是它之後發生的事，這個問題問的就是這個，沒有一個字說吃這件事好不好。"
      - id: dbt-chain-s5-t10
        speaker: client
        text: "羞愧。很多。然後我寫訊息給客戶：「我不做這個案子了。」星期四我就沒來這裡。"
      - id: dbt-chain-s5-t11
        speaker: therapist
        text: "謝謝你。這很不容易說出口。我現在有整條鏈了，從電郵到星期四。下次我們看每一個環節，哪裡可以走向別的方向。"
    notes:
      goals: "星期三事件的鏈條完成：電郵、想法、胸口發熱、發抖、寫了又刪掉的長信、丟手機、叫餐並很快吃完、平靜一陣子、羞愧、放棄案子的訊息、星期四缺席。下一步：每個環節哪裡可以改變。"
      alliance: "她問了問題，我用「你配合是很重要的」回答，她就退開了。我修復的方法是說出我做了什麼，並把選擇給她。她回來了。這次破裂和修復，要寫進給督導的記錄。"
      formulation_update: "她把問題聽成指責，這和她一直被告知「問題在你的反應」的經歷一致。短而具體的問題，比寬的問題有效。「為什麼」暫時不用。"
  - id: dbt-chain-s6
    title: "第 6 次會談：「哪裡本來可以不一樣？」"
    turns:
      - id: dbt-chain-s6-t01
        speaker: therapist
        text: "J，你好。上星期我們把星期三整件事走了一遍。這星期我想把那些環節再看一次，看看哪裡可以發生不同的事。可以嗎？"
      - id: dbt-chain-s6-t02
        speaker: client
        text: "好。環節很多。"
      - id: dbt-chain-s6-d1
        type: choice
        prompt: "你有一張列表：電郵、想法、胸口發熱、發抖、打字和刪掉、丟手機、叫餐、吃、平靜、羞愧、傳給客戶的訊息、缺席會談。J 說環節很多。你怎樣說？"
        options:
          - id: a
            text: "是不少。你看著這張列表，哪一個看起來最有可能改變，哪怕只是改變一點點？"
            fit: strong
            note: "它同意她，並請她選。介入的地方是她挑的，她比較可能真的去用。"
          - id: b
            text: "主要的問題顯然是那個想法，「他們覺得我很糟」。我們先從這裡開始。"
            fit: weak
            note: "你替她選了，還把一個環節說成「問題」。它可能選錯，她也會聽成對她的想法的判決。"
          - id: c
            text: "我看到四個我們可以介入的地方：想法、發抖、叫餐，和那則訊息。"
            fit: workable
            note: "這有用，也可能是對的。但這份列表是你的，她只能同意。"
        actual: "是不少。你看著這張列表，哪一個看起來最有可能改變，哪怕只是改變一點點？"
        rationale: "辨認環節，也包括讓個案找出她夠得到的環節。她比你更清楚，自己在哪裡有一點空間。"
      - id: dbt-chain-s6-t03
        speaker: client
        text: "就在發抖之後。如果我當時可以不打字。還有那則訊息。那則訊息讓我失去了那個客戶。"
      - id: dbt-chain-s6-d2
        type: free
        prompt: "J 自己找到了兩個地方。寫一兩句話，確認她找到的，不加你自己的環節。"
        actual: "你自己找到了兩個地方：發抖之後、打字之前，和傳出那則訊息之前的那一刻。這些都是這條鏈上真實的地方。"
        rationale: "你用她的話把她的兩個地方說回給她，並說它們是真的。你什麼都沒有加。如果第三、第四個地方重要，她比較可能自己找到。"
      - id: dbt-chain-s6-t04
        speaker: client
        text: "可是叫餐那一段，是我最討厭的部分。我們可以從那裡開始嗎？"
      - id: dbt-chain-s6-d3
        type: choice
        prompt: "J 要求從叫餐和吃的那段開始，那是她最討厭的部分。你怎樣說？"
        options:
          - id: a
            text: "那是讓你付出最多的部分，想從那裡開始，說得通。我們看看離它最近的地方：你叫餐之前的那一刻。那時你的身體是什麼樣子？"
            fit: strong
            note: "它認可她的選擇，並讓工作停在她夠得到的環節，也就是它前面那一個。問題保持具體。"
          - id: b
            text: "不能從那裡開始。它在鏈條的後面，改變前面的環節比較容易。"
            fit: weak
            note: "這可能是真的。但它推翻了她的選擇，並告訴她，她最討厭的地方不是開始的地方。"
          - id: c
            text: "好，我們從吃那一段開始。這種事一個星期發生幾次？"
            fit: workable
            note: "它跟著她走。但數次數把工作從鏈條移到數字，這個問題聽起來像在查帳。"
        actual: "那是讓你付出最多的部分，想從那裡開始，說得通。我們看看離它最近的地方：你叫餐之前的那一刻。那時你的身體是什麼樣子？"
        rationale: "她已經告訴你痛在哪裡。認可它，並把工作帶到它前面的那個環節。那裡是可能發生不同事情的地方。"
      - id: dbt-chain-s6-t05
        speaker: client
        text: "（停了一下）我整個身體都想動。像是我的手非做點什麼不可。我還想，我不能就這樣坐著。"
      - id: dbt-chain-s6-t06
        speaker: therapist
        text: "你整個身體都想動，想法是「我不能就這樣坐著」。這是一個衝動，它就在叫餐之前。"
      - id: dbt-chain-s6-t07
        speaker: client
        text: "（小聲）我從來沒有把它看成分開的。它一直是一整件事。"
      - id: dbt-chain-s6-t08
        speaker: therapist
        text: "它感覺是一整件事，其實有好幾步。這就是我們可以下手的地方。下次我們看看，在這些地方你可以做些什麼。"
    notes:
      goals: "J 自己在鏈條上找到三個地方：發抖之後、打字之前；傳出訊息之前；叫餐之前的衝動。第四個是想法本身，我注意到了，還沒有提出。下一步：在這些地方試什麼。"
      alliance: "情感連結：破裂之後更強，不是更弱。任務：她自己選要看哪裡。目標：「它一直是一整件事」是她開始看見步驟的第一個跡象。"
      formulation_update: "可能發生不同事情的四個地方：想法「他們覺得我很糟」；發抖之後、打字之前；叫餐前想動的衝動；傳出訊息之前的一刻。模組 4 會用到。這是觀察，還不是技能：問題具體的時候，她自己找得到地方。"
