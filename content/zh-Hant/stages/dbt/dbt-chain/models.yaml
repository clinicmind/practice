dbt-chain-e01:
  model_response: "電郵來了。你讀完之後，最先注意到的是什麼？"
  why: "它停在一個步驟，也就是電郵之後的那一刻，問她注意到什麼。它沒有要她解釋「失控」。"
  avoid: "「你為什麼失控？」這是在要理由，而 J 的回答會變成對自己的判決。"
dbt-chain-e02:
  model_response: "你讀完，腦中出現了「他們討厭我的作品」這個想法。這個想法出現的時候，你的身體有什麼感覺？"
  why: "它用她的話把想法交還給她，再問下一類環節，也就是身體，只問一個問題。"
  avoid: "「你真的覺得他們討厭你的作品嗎？」這是在鏈條還沒開始之前，就和那個想法爭論。"
dbt-chain-e03:
  model_response: "你的手在發抖，然後你寫了一封回信。信裡寫了什麼，你記得多少就說多少？"
  why: "它順著她的次序，並請她憑記憶描述。「記得多少就說多少」讓她容易說「我不確定」。"
  avoid: "「你那麼難受，就不該寫什麼。你寫了什麼？」第一句是評斷，後面的問題只會得到防衛。"
dbt-chain-e04:
  model_response: "你把手機放下了。放下之後，到你叫餐之前，發生了什麼？"
  why: "它問兩個環節之間的空隙，沒有問她叫了什麼，因為鏈條不需要這個。"
  avoid: "「你叫了什麼，吃了多少？」這問的是對鏈條沒有幫助的細節，也會引來羞愧。"
dbt-chain-e05:
  model_response: "你覺得糟透了，然後你傳訊息給他。你傳出去的時候，希望發生什麼事？"
  why: "它用平實的話，問行動背後的衝動，也沒有把那則訊息說成錯誤。"
  avoid: "「為什麼你又為了一封電郵就放掉一個案子？」「又」和「為什麼」把問題變成指控。"
dbt-chain-e06:
  model_response: "所以電郵之後，緊接著是「他們覺得我很糟」這個想法，然後是胸口發熱。是這個次序嗎？"
  why: "它用她的話說出一個想法和一個身體感覺，並把兩者放在電郵之後。它沒有加任何自己的東西。"
  avoid: "「那是你對自己的核心信念。」這是詮釋，把分析從鏈條移到她身上。"
dbt-chain-e07:
  model_response: "這聽起來是一個衝動：整個身體都想動，想做點什麼。它緊接在手發抖之後。"
  why: "它說出這是哪一類環節，也就是衝動，並用她的話「想動」把它放進次序。"
  avoid: "「你是想把緊張釋放出來。」這是用她沒有用過的說法解釋這個環節。"
dbt-chain-e08:
  model_response: "所以吃完之後是羞愧，而且幾乎比前面那一段更糟。這是下一個環節，在目前鏈條的最後。"
  why: "它說出一個感受，把它放在最後，並保留她的說法「比前面那一段更糟」。"
  avoid: "「這種行為之後，總是會羞愧。」這是概括，把她的經驗從她手上拿走。"
dbt-chain-e09:
  model_response: "這是一個行動，傳出訊息，它在羞愧之後。你說那是在還沒想清楚之前就傳出去了。"
  why: "它說出一個行動，並放在羞愧之後。它重複她自己的話「還沒想清楚」，沒有評論。"
  avoid: "「你傳那則訊息是為了逃開羞愧。」這加了一個她沒有給的理由。"
dbt-chain-e10:
  model_response: "所以第二天有兩個環節：沒有來，這是行動；還有「你反正也會受不了我」這個想法。"
  why: "它把行動和想法分開，想法用她的話，並把兩個都放在第二天。"
  avoid: "「你是在試探我會不會追你。」這是對她動機的猜測，並把一個環節變成指控。"
dbt-chain-m01:
  model_response: "你爆了。我們回到剛好在那之前的一刻。剛剛發生了什麼？"
  why: "它接住她的字眼「爆了」，並移到一個時刻。問題問的是發生了什麼，不是為什麼。"
  avoid: "「是什麼讓你爆的？」在她還說不出一個時刻時，這個問題要的是整個模式。"
dbt-chain-m02:
  model_response: "感覺像是什麼都一下子來。我們挑最小的一塊：開始之前的那一分鐘，你在做什麼？"
  why: "它接受「一下子來」，並給她一個小一點的起點。一分鐘比一整天容易回想。"
  avoid: "「我們從頭開始，慢慢來。」她剛說了她找不到開頭。"
dbt-chain-m03:
  model_response: "整段時間都在生氣。我們看其中一小段。你拿起手機的時候，生氣在你身體裡是什麼樣子？"
  why: "它接住那個籠統的字，並縮小到一小段。它問一個身體的細節，那是具體的。"
  avoid: "「你到底是在氣什麼？」這是要詮釋，鏈條現在還不需要。"
dbt-chain-m04:
  model_response: "你現在還不知道，這沒關係。電郵之後，你做的第一件事是什麼？"
  why: "它接受「我不知道」，把「為什麼」放在一邊，也沒有說教。它問第一個行動，她可以描述。"
  avoid: "「再想一想。一定有原因。」這是逼她找原因，她會沉默，或編一個。"
dbt-chain-m05:
  model_response: "你把它刪掉了，然後變得模糊。刪掉之後，你最後一件記得很清楚的事是什麼？"
  why: "它把模糊當成鏈條的一部分，並問最後一個清楚的地方，那是個可以開始的位置。"
  avoid: "「你一定記得些什麼。試試看。」這把模糊當成抗拒。"
dbt-chain-m06:
  model_response: "讓我核對一下環節。你的胃一沉。想法是「他們討厭它」。然後是想消失的衝動。是這個次序嗎？"
  why: "它把身體感覺、想法和衝動分開，每個都用她的話，並請她核對次序。"
  avoid: "「聽起來你覺得被拒絕了。」這把三個環節換成一個標籤。"
dbt-chain-m07:
  model_response: "我聽到四個環節：你傳了三次訊息給姊姊，她沒有回，你覺得自己什麼都不是，然後你封鎖了她。我有漏掉的嗎？"
  why: "它把行動、結果和感受分開，用她的次序和她的話，並問有沒有漏掉。"
  avoid: "「你姊姊的沉默，引發了你被拋棄的反應。」這加了一個理論，而她沒有說「被拋棄」。"
dbt-chain-m08:
  model_response: "所以是：胸口發熱，然後打字打得很快看不清楚，還有「我要讓他們看看」這個想法。次序是這樣，還是那個想法先出現？"
  why: "它把身體、行動和想法分開，並誠實地問哪個先，因為她說的次序不清楚。"
  avoid: "「你是在氣頭上做事。」這用一個字概括整個順序，跳過了環節。"
dbt-chain-m09:
  model_response: "讓我說回給你：你覺得想吐，你想「我一定有什麼問題」，然後你躺在床上。次序對嗎？"
  why: "它把身體感覺、想法和行動分開，用她的話。它核對次序，沒有評論那個想法。"
  avoid: "「不過那個想法不是真的。」這在她還沒說完鏈條之前，就反駁那個想法。"
dbt-chain-m10:
  model_response: "四個環節：他寫了「把檔案傳來」，沒有打招呼；你覺得很渺小；你把檔案傳了；然後你沒辦法工作。「渺小」和「傳檔案」之間，有沒有發生什麼？"
  why: "它用她的話列出環節，並問看得見的那一個空隙，也就是感受和行動之間。"
  avoid: "「所以是他的無禮讓你覺得渺小。」這是她的故事，你把它變成了因果。"
dbt-chain-h01:
  model_response: "那聽起來確實像審問，我不想它讓你有那種感覺。你想用自己的次序說，從你想開始的地方開始，我只聽嗎？"
  why: "它說出她的感受，沒有為問題辯護。它把步調和次序的主導權交給她，同時讓鏈條繼續。"
  avoid: "「我只是想幫你。」這是為問題辯護，聽起來像她的主管。"
dbt-chain-h02:
  model_response: "你說得對，我不需要知道吃了什麼。我需要知道的是你剛剛之前的感覺。其他的都可以跳過。"
  why: "它同意她說的有道理的部分，放掉鏈條不需要的，並指出它需要的那一件。她現在可以控制細節。"
  avoid: "「有完整的畫面很重要。」這是重複要求，並忽略她的話。"
dbt-chain-h03:
  model_response: "我聽得出來這讓你覺得被怪罪，我不是在找誰的錯。我是在找步驟，因為每一個步驟，都是可能發生不同事情的地方。我們可以一起看下一個步驟嗎？"
  why: "它說出她怕被怪罪，沒有爭論，並用一句話說明鏈條的用處。最後的問題請她同意。"
  avoid: "「我沒有怪你。你為什麼會這樣覺得？」第一句是否認，而「為什麼」又是另一個要求。"
dbt-chain-h04:
  model_response: "那個問題也許太多了。我們可以先放下它，看你接著做了什麼，如果這樣比較容易的話。"
  why: "它把沉默當成一種回應，並減輕壓力。它仍然移到鏈條的下一步。"
  avoid: "「慢慢來，我等你。」這讓問題一直開著，也讓她獨自面對它。"
dbt-chain-h05:
  model_response: "你已經看出哪裡出了問題，也不想再重複一次。我問的原因不一樣：我想找出可以走向另一個結果的那一步。你願意給我十分鐘嗎？"
  why: "它說出她的疲倦，並說鏈條的用處不是責備。這個請求很小，而且有結束的時間。"
  avoid: "「我們需要完成它，這很重要。」這是指示，而她剛說了她受夠了被人告知該怎麼做。"
dbt-chain-h06:
  model_response: "電郵來了，然後你叫了餐。中間有沒有什麼，例如一個想法或身體的一種感覺，把你從一件事帶到另一件事？"
  why: "它把她描述的兩端交還給她，並問兩端之間有沒有東西。它說出環節的種類，沒有說是哪一個。"
  avoid: "「你一定先想了些什麼。」這是斷言，她會否認。"
dbt-chain-h07:
  model_response: "你很生氣。有時候想法會很快閃過去。如果把那一刻放慢，有沒有一個字，或一個畫面，跟著那份生氣出現？"
  why: "它接受生氣，告訴她很快的想法是可能的，並請她放慢。它沒有替她說出那個想法。"
  avoid: "「你生氣，是因為你想他們討厭你。」這替她給了環節，而她可能不認得它。"
dbt-chain-h08:
  model_response: "那封電郵讓你有那種感覺。電郵上寫的是「這一版不太對」。「懶」是你從那幾個字裡聽到的嗎？"
  why: "它把寫的字和她聽到的分開，並用問句，讓她自己看出差別。"
  avoid: "「他沒有說你懶。」這是糾正她，而糾正就是在說她錯了。"
dbt-chain-h09:
  model_response: "之前你告訴我，封鎖別人的第二天你會覺得想吐。封鎖他之後，有沒有一小段時間確實覺得好一點，然後才想吐？"
  why: "它把她說過的兩件事連起來，並問次序。它把舒緩當成真的，也沒有說她自相矛盾。"
  avoid: "「可是你上次說你覺得想吐。」這是抓她的矛盾，她以後就不再描述任何事。"
dbt-chain-h10:
  model_response: "一下子從零衝到一百。如果我們放慢，在往上衝的路上，有沒有什麼東西，哪怕很小，像一個字或身體的一種感覺？"
  why: "它認真看待她的比喻，並問往上衝的路上有哪些小步驟。它舉了例子，沒有替她選。"
  avoid: "「不可能一下子從零到一百。」這是和她的比喻爭，並告訴她她錯了。"
