slug: dbt-chain
version: 1.0.0
title: "行為鏈分析"
intro: "行為鏈分析是把目標行為的某一次發生，一步一步看過去，找出哪裡本來可以不一樣。行為發生後不久，個案同意和你一起看，你就可以用它。鏈條上通常有這幾類環節：什麼觸發了它、個案怎麼想、身體有什麼感覺、她想做什麼、她做了什麼，以及接著發生什麼，包括當下和事後。這個模組教兩項技能。行為鏈提問，是一次只問一個步驟，用具體的話，不帶責備。辨認環節，是用個案自己的話說出每個環節，並和她核對次序，包括她跳過或混在一起的環節。也要知道什麼時候不該用。個案在會談中已經不堪負荷時，不要開始鏈條；目的只是找出誰有錯時，也不要。如果她覺得被審問，就放慢，並把這件事說出來。一路認可她。這個模組裡，你會分析一個星期三：J 收到客戶一封只有一句話的電郵，到了晚上，她放棄了那個案子，第二天沒有來會談。她吃了什麼之類的細節，除非需要，不放進鏈條。重點是她在哪些地方本來可以做不一樣的事。這個階段不涵蓋危及生命行為的評估和處理。這部分要在督導下，按實習機構的守則學習。"
skills:
  - chain-questioning
  - link-identification
reflection_prompts:
  - id: dbt-chain-r1
    text: "第 5 次會談，治療師用「你配合是很重要的」回應 J 的抱怨。那句話是怎樣說出口的？你受訓的過程中，是在哪裡學到說類似的話？"
  - id: dbt-chain-r2
    text: "挑一個你寫的鏈條提問。J 會不會把它聽成指責？你要怎樣問，聽起來才像好奇？"
  - id: dbt-chain-r3
    text: "想一次你自己一步一步回顧糟糕時刻的經驗。哪一步最難說出口？什麼會讓它容易一點？"
