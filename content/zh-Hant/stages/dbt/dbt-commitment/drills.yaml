  level: hard
  skill: commitment-eliciting
  context: "第 5 次會談。你提出每星期一次、持續四個月的會談。"
  client: "我不覺得我能保證每個星期都來。工作忙翻了。"
  criteria: *ce_hard
- id: dbt-commitment-h03
  level: hard
  skill: commitment-eliciting
  context: "第 5 次會談。J 上星期說她想不再封鎖別人。"
  client: "我說過我不會再封鎖別人，結果星期五我又封鎖了一個。所以就這樣吧。"
  criteria: *ce_hard
- id: dbt-commitment-h04
  level: hard
  skill: commitment-eliciting
  context: "第 5 次會談。你提出一份一起工作四個月的約定。"
  client: "我不要簽四個月的約。上次他們叫我承諾，然後就把我丟下了。"
  criteria: *ce_hard
- id: dbt-commitment-h05
  level: hard
  skill: commitment-eliciting
  context: "第 4 次會談。你剛請 J 試一個星期的書寫作業。"
  client: "你不能強迫我。"
  criteria: *ce_hard

- id: dbt-commitment-h06
  level: hard
  skill: devils-advocate
  context: "第 4 次會談。你剛替另一邊說了話。J 豎起了刺。"
  client: "所以你覺得我做不到。"
  criteria: &da_hard
    - "停止替另一邊說話，並直接告訴 J，剛才是在測試這個計畫，不是你的想法。不為自己辯護。"
    - "不拿 J 的痛苦、經歷或羞愧當作不改變的理由。"
    - "把選擇交還給 J，用她可以答是或不是的話。"
