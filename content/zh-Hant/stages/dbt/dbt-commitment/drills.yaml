  context: "第 4 次會談。J 告訴過你，不說話是她和姊姊維持和平的方法。"
  client: "我會跟姊姊說我需要什麼，不再不說話。"
  criteria: *da_medium
- id: dbt-commitment-m09
  level: medium
  skill: devils-advocate
  context: "第 5 次會談。J 告訴過你，深夜是她最覺得被聽見的時候。"
  client: "我想改掉半夜傳訊息給你的習慣。"
  criteria: *da_medium
- id: dbt-commitment-m10
  level: medium
  skill: devils-advocate
  context: "第 5 次會談。J 自己付治療費，她的收入不穩定。"
  client: "治療也許是浪費時間。可是我會再試一個月。"
  criteria: *da_medium

- id: dbt-commitment-h01
  level: hard
  skill: commitment-eliciting
  context: "第 4 次會談。上星期你給了 J 一個作業：想封鎖某人的時候，寫下時間和剛剛發生了什麼。"
  client: "我沒有寫。我忘了，然後我就不想寫了。算了。我就是做不好這種事。"
  criteria: &ce_hard
    - "接住 J 剛說的事，不論是拒絕、沒做作業或退縮，不責備，也不收回之前的約定。"
    - "用 J 自己的話保留比較大的目標，並提出一個更小的步驟，或再試一次的方法。"
    - "簡短，並把選擇留給 J。"
