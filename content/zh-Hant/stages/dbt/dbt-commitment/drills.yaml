  context: "第 5 次會談。你剛替另一邊說了話。J 變得很平淡。"
  client: "好吧，你說服我了，這很蠢。算了，忘了它吧。"
  criteria: *da_hard
- id: dbt-commitment-h10
  level: hard
  skill: devils-advocate
  context: "第 5 次會談。你剛替另一邊說了話。J 半笑著。"
  client: "哈。好招。我知道你在做什麼。"
  criteria: *da_hard
