sessions:
  - id: dbt-commitment-s3
    title: "第 3 次會談：「我想讓它停下來，可是我要留著封鎖鍵」"
    turns:
      - id: dbt-commitment-s3-t01
        speaker: therapist
        text: "J，你好。這兩個星期你告訴我六次的那段治療、那四份工作，還有你成長的經過。今天我想和你談談，你想從這個治療得到什麼。你想從哪裡開始？"
      - id: dbt-commitment-s3-t02
        speaker: client
        text: "我想不要再這樣了。一直都是這樣，好像我離毀掉自己的人生，只差一封電郵。"
      - id: dbt-commitment-s3-d1
        type: choice
        prompt: "J 說她想不要再這樣了。你怎樣說？"
        options:
          - id: a
            text: "「離毀掉自己的人生，只差一封電郵。」如果你不再這樣，一個星期之後，會有什麼不同？"
            fit: strong
            note: "它保留她自己的畫面，並請她說出自己心中改變後的樣子。由此而來的目標會是她的。"
          - id: b
            text: "好。我們一起做的，會教你調節情緒的技能，讓你不再那樣反應。"
            fit: weak
            note: "它承諾了結果，用了術語，並在她第一次談目標時，就把她的反應說成問題。"
          - id: c
            text: "我們把它寫下來當目標：「不再這樣」。你覺得最需要先改變的是什麼？"
            fit: workable
            note: "它有條理，也認真看待她。但「不再這樣」還不是她能朝著努力的目標，而且問她最優先的是什麼，跳過了她自己的畫面。"
        actual: "「離毀掉自己的人生，只差一封電郵。」如果你不再這樣，一個星期之後，會有什麼不同？"
        rationale: "承諾從個案想要的東西開始。在你提出任何建議之前，先問她心中改變後的畫面。她說的話就是目標，用她自己的話。"
      - id: dbt-commitment-s3-t03
        speaker: client
        text: "我會有喜歡我的客戶。不會和姊姊吵架。吵完不會躲在家裡。（停了一下）可是我不放棄封鎖鍵。別叫我放棄。它是唯一真的讓它停下來的東西。"
      - id: dbt-commitment-s3-d2
        type: choice
        prompt: "J 說了她想要什麼，也說她不放棄封鎖。你怎樣回應？"
        options:
          - id: a
            text: "封鎖別人，是讓這個循環繼續下去的原因之一，所以我們需要處理它。"
            fit: weak
            note: "這可能是真的。但現在說出來，就成了一個論點，而她剛說了不放棄。她會更加堅持。"
          - id: b
            text: "今天我不是要你放棄任何東西。封鎖讓它很快停下來，這很重要。它似乎也和你想要的客戶、姊姊放在一起。我們可以兩邊都看看嗎？"
            fit: strong
            note: "它尊重封鎖對她的作用，並直接說你今天不會把它拿走。它把封鎖和她的心願放進同一個畫面，請她兩邊都看。"
          - id: c
            text: "這是你的選擇，我尊重。你還想處理什麼？"
            fit: workable
            note: "它尊重她。但它放下了封鎖和她想要的東西之間的連結，她可能聽成什麼都不需要改。"
        actual: "今天我不是要你放棄任何東西。封鎖讓它很快停下來，這很重要。它似乎也和你想要的客戶、姊姊放在一起。我們可以兩邊都看看嗎？"
        rationale: "說出封鎖對她的作用，並說今天你不會把它拿走。然後把它放在她想要的東西旁邊。矛盾就是工作的內容。你不需要在這次會談把它解決。"
      - id: dbt-commitment-s3-t04
        speaker: client
        text: "（雙臂交叉）好。你說。"
      - id: dbt-commitment-s3-d3
        type: free
        prompt: "寫一個問題，邀請 J 用她自己的標準看看封鎖讓她付出什麼代價。不要告訴她代價是什麼。"
        actual: "吵架吵到一半封鎖了別人，第二天是什麼樣子？"
        rationale: "她說出的代價，比你說的更有說服力。問「第二天」很具體，也沒有告訴她應該找到什麼。"
      - id: dbt-commitment-s3-t05
        speaker: client
        text: "第二天……我覺得想吐。好像放了一把火。然後我不能解除封鎖，因為那樣太丟臉了。我就是這樣失去了兩個客戶。"
      - id: dbt-commitment-s3-d4
        type: choice
        prompt: "J 剛告訴你封鎖讓她付出的代價。你怎樣說？"
        options:
          - id: a
            text: "第二天你覺得想吐，兩個客戶也沒了。這是真實的代價。你願意試一件小事，多了解一些嗎？下次你想封鎖某人的時候，寫下時間，和剛剛發生了什麼。你不用阻止自己。"
            fit: strong
            note: "它沒有添加她說過的以外的東西，並請她做一件她可以答應的小事。它清楚說她不必停止封鎖。"
          - id: b
            text: "所以封鎖讓你失去的，比得到的多。你不覺得值得試著停下來嗎？"
            fit: workable
            note: "它用她的話來替你的論點說話，而這個問題只有一個有禮貌的答案。她可能說好，卻不是真心的。"
          - id: c
            text: "那我們就約定，你從現在起不再封鎖別人。"
            fit: weak
            note: "它在她剛說不放棄之後，就要求一個大的承諾。她會拒絕，或答應了又違反，兩種結果對你都更糟。"
        actual: "第二天你覺得想吐，兩個客戶也沒了。這是真實的代價。你願意試一件小事，多了解一些嗎？下次你想封鎖某人的時候，寫下時間，和剛剛發生了什麼。你不用阻止自己。"
        rationale: "小的第一步讓她比較容易說好，也沒有拿走封鎖對她的作用。這份書寫也給你下一個模組要用的材料。"
      - id: dbt-commitment-s3-t06
        speaker: client
        text: "（聳肩）寫下來。就這樣？……好。我可以。"
      - id: dbt-commitment-s3-t07
        speaker: therapist
        text: "就這樣。只有這個。謝謝你願意試。"
    notes:
      goals: "J 的目標，用她的話：有喜歡她的客戶、不和姊姊吵架、不躲在家裡。約定的一步：下次想封鎖某人時，寫下時間和剛剛發生了什麼。她沒有同意不再封鎖。"
      alliance: "情感連結：她雙臂交叉，然後告訴我封鎖讓她付出什麼。任務：一個小步驟，她接受了。目標：她的很清楚。我的，也就是減少封鎖，還不在約定裡，我也沒有假裝它在。"
      formulation_update: "封鎖讓傷痛很快停下來，第二天卻讓她付出代價：想吐、失去兩個客戶、不丟臉就回不去。這個代價是她自己說出來的。不要把它當成論點重複給她聽。"
  - id: dbt-commitment-s4
    title: "第 4 次會談：「從現在起」"
    turns:
      - id: dbt-commitment-s4-t01
        speaker: therapist
        text: "J，你好。書寫進行得怎麼樣？"
      - id: dbt-commitment-s4-t02
        speaker: client
        text: "我寫了一次。星期四。最後我沒有封鎖他。（停了一下）可是這個星期其他的日子我都忘了。所以我失敗了。"
      - id: dbt-commitment-s4-d1
        type: choice
        prompt: "J 做了一次作業，並說她失敗了。你怎樣說？"
        options:
          - id: a
            text: "一次比零次多，而星期四正是我希望看到的。星期四你沒有封鎖他，那時發生了什麼？"
            fit: strong
            note: "它沒有接受「失敗」這個說法。它指出那唯一成功的一次，並問那一次，因為有用的資訊在那裡。"
          - id: b
            text: "沒關係。每個人都會忘記。下星期再努力一點就好。"
            fit: weak
            note: "這是好意。但「再努力一點」告訴她，她不夠努力，而這句話她聽過了。"
          - id: c
            text: "一次是個開始。其他的日子，是什麼妨礙了你？"
            fit: workable
            note: "它肯定她，問題也合理。但它先去問哪裡出了問題，而最好的資訊在做對的地方。"
        actual: "一次比零次多，而星期四正是我希望看到的。星期四你沒有封鎖他，那時發生了什麼？"
        rationale: "個案把部分成功說成失敗時，你不爭論，也不安慰。你指給她看證據在哪裡。"
      - id: dbt-commitment-s4-t03
        speaker: client
        text: "我出去走了一圈。然後就沒那麼氣了。（停了一下）好。你知道嗎？從現在起，我就不再封鎖別人了。全部都不。不再了。我受夠了。"
      - id: dbt-commitment-s4-d2
        type: choice
        prompt: "J 突然保證永遠完全不再封鎖別人。你懷疑那超過她守得住的。你怎樣說？"
        options:
          - id: a
            text: "這是很大的承諾，而封鎖一直是很快讓傷痛停下來的辦法。你確定要完全放掉它嗎？連最糟的時刻也是？"
            fit: strong
            note: "這是魔鬼代言人，用得很溫和。它用她的話說出封鎖真實的好處，並問一個真正的問題。它沒有說她做不到。"
          - id: b
            text: "太棒了！我為你感到驕傲。"
            fit: weak
            note: "它獎勵了她守不住的承諾。她違反時，驕傲會變成羞愧，而羞愧本來就是封鎖之後會跟來的東西。"
          - id: c
            text: "這很有野心。也許我們先減少，不要一下子完全停止。"
            fit: workable
            note: "這很合理。但你替她把反對她承諾的話說了，她可能聽成「你覺得我做不到」。"
        actual: "這是很大的承諾，而封鎖一直是很快讓傷痛停下來的辦法。你確定要完全放掉它嗎？連最糟的時刻也是？"
        rationale: "她從「不要」跳到「永遠」。魔鬼代言人讓她自己去說另一邊。這裡適合用，因為關係穩定，而且她剛做了一件成功的事。"
      - id: dbt-commitment-s4-t04
        speaker: client
        text: "（停了一下）……不。最糟的時刻不行。如果有人對我很惡毒，我不會坐在那裡不動。"
      - id: dbt-commitment-s4-d3
        type: choice
        prompt: "J 從她的保證往後退了。你怎樣回應？"
        options:
          - id: a
            text: "你很誠實，這讓我們知道了真實的東西。保護自己不受惡毒對待，這一點留著。沒有那麼糟的時刻，你願意試什麼？"
            fit: strong
            note: "它沒有把她的退後說成失敗。它確認她想保留的，並問她可以改變的部分。"
          - id: b
            text: "所以你不是認真的。我還以為你想改變。"
            fit: weak
            note: "它因為她誠實而責怪她。下次她會為了躲開這個而說「好」，心裡卻是「不」。"
          - id: c
            text: "好，那麼封鎖暫時還是一個選項。"
            fit: workable
            note: "它接受了她的誠實，這很好。但它沒有一個步驟就結束了談話，她剛說可能做的事也失去了。"
        actual: "你很誠實，這讓我們知道了真實的東西。保護自己不受惡毒對待，這一點留著。沒有那麼糟的時刻，你願意試什麼？"
        rationale: "個案測試自己的承諾，就是告訴你界線在哪裡。用它。比較小的承諾，才是她守得住的。"
      - id: dbt-commitment-s4-t05
        speaker: client
        text: "像有人寄來冷冰冰的電郵。不是有人惡毒的時候。那些我可以等一等。"
      - id: dbt-commitment-s4-d4
        type: free
        prompt: "J 說出了她願意試的一個部分：訊息是冷冰冰、不是惡毒的時候，她會等一等。寫一兩句話，請她承諾這個，並說清楚選擇是她的。"
        actual: "所以計畫是：訊息冷冰冰、不是惡毒的時候，你封鎖之前先等一等。你願意在接下來兩個星期試試看嗎？這是你的決定，我們隨時可以改。"
        rationale: "它用她自己的話重複她自己的界線。它說出一個期限，方便檢討。它說選擇是她的，這也是它守得住的原因之一。"
      - id: dbt-commitment-s4-t06
        speaker: client
        text: "兩個星期。好。（停了一下）是我自己的選擇？"
      - id: dbt-commitment-s4-t07
        speaker: therapist
        text: "是。謝謝你誠實告訴我，你的界線在哪裡。"
    notes:
      goals: "約定兩個星期：訊息冷冰冰、不是惡毒時，封鎖之前先等一等。有人惡毒時封鎖，照舊。書寫的步驟繼續。"
      alliance: "情感連結：她測試了自己的承諾，並告訴了我真話。魔鬼代言人有效，是因為今天關係穩定，也因為我是問，不是說。如果她來的時候受了傷，我不會用。任務：一個有期限、她自己選的承諾。"
      formulation_update: "她很快從「不要」跳到「永遠」。這個模式可能也會出現在別的地方：大的承諾，然後崩潰。一開始就是比較小的承諾，比較安全。星期四出去走了一圈有幫助，她沒有把它說成一項技能。之後再提，不要把它變成作業。"
