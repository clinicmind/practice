dbt-commitment-e01:
  model_response: "如果你不再這樣了，你的一天裡，第一個會留意到的是什麼？"
  why: "它請她說出自己心中改變後的畫面，用她的話，並且保持開放。它沒有說她該想要什麼。"
  avoid: "「你需要學會調節情緒。」這是用術語替她定目標，也把她變成問題。"
dbt-commitment-e02:
  model_response: "你想要大家留下來，也想要被好好對待。如果兩件事都做到了，會是什麼樣子？"
  why: "它用她的話保留兩個心願，請她描述畫面，不是做選擇。它沒有告訴她要放棄哪一個。"
  avoid: "「兩個不能都要。別人難相處，人家就會走。」這是爭論，而且說出了她最害怕的事。"
dbt-commitment-e03:
  model_response: "你在想要不要為這件事做點什麼。對這份友誼，你自己想要的是什麼？"
  why: "它接住她自己朝改變的一步，並問她想要什麼，不是朋友想要什麼。"
  avoid: "「你朋友說得有道理。你該想想自己怎樣影響別人。」這是站在朋友那邊，並告訴 J 她該想要什麼。"
dbt-commitment-e04:
  model_response: "你想平靜一點。這個星期，你願意留意一次地雷被踩到的時刻，隨手記下發生了什麼嗎？只要這樣就好。"
  why: "它反映她的心願「平靜」，並請她做一件她可以答應或拒絕的小事。它還沒有要她改變任何事。"
  avoid: "「我們來訂個計畫，讓沒有人再踩到你的地雷。」這是大的承諾，也答應了沒有人做得到的事。"
dbt-commitment-e05:
  model_response: "你以前試過，現在又來了。有什麼東西幫過你，哪怕只有一天？"
  why: "它把「什麼都撐不住」變成問她什麼有幫助，讓理由從她而來。它也肯定她又回來了。"
  avoid: "「這次一定會不一樣，我保證。」這是承諾，而她聽過太多承諾。"
dbt-commitment-e06:
  model_response: "這是很大的改變，而封鎖是一直能很快讓傷痛停下來的辦法。你確定要完全放掉它嗎？"
  why: "它用她自己的話說出真實的代價：封鎖來得快。它是問句，把答案留給她。"
  avoid: "「你一定做不到的。你以前試過了。」這是說她做不到，而且拿她的過去對付她。"
dbt-commitment-e07:
  model_response: "晚上都不傳，是個很大的承諾，因為晚上正是你最能開口的時候。這是你想做的承諾嗎？"
  why: "它說出她告訴過你的代價：晚上是她能開口的時候，並問她要不要付這個代價。"
  avoid: "「你反正也得停止這些深夜訊息。」這是替她做決定。"
dbt-commitment-e08:
  model_response: "每一天是很大的承諾。小一點的承諾，會比較容易守住嗎？"
  why: "它用她的話「每一天」說出難處，並提出問題。她可以回答她想要每一天。"
  avoid: "「你上星期也這樣說。」這是拿沒做的作業對付她。"
dbt-commitment-e09:
  model_response: "直接說出來，可能會引起你一直用封鎖去避開的那場爭吵。你準備好冒這個險了嗎？"
  why: "它用她自己的話說出改變的真實風險。它沒有說她會失敗。"
  avoid: "「你大概會說出讓自己後悔的話。」這是從她的恐懼預測她的失敗。"
dbt-commitment-e10:
  model_response: "這裡有時候會很難。你確定要把這個扛起來嗎？"
  why: "它用平實的話說出真實的困難，並把答案留給她。"
  avoid: "「上次你做了六次就放棄了。這次憑什麼不一樣？」這是把她的過去當武器。"
dbt-commitment-m01:
  model_response: "你想讓痛苦停下來，而封鎖是唯一有用的辦法。封鎖在第二天讓你付出什麼代價？"
  why: "它用她的話保留她的兩邊，並問一個關於代價的問題。代價是什麼，由她說。"
  avoid: "「封鎖只會讓痛苦繼續。它就是問題。」這是為改變爭論，並替她選了邊。"
dbt-commitment-m02:
  model_response: "每個星期來，是肯定的答案；作業，是否定的答案。什麼能讓其中一小部分值得做一次？"
  why: "它說出她的肯定和否定，並問什麼能讓一小部分值得做。它沒有就作業說教。"
  avoid: "「沒有作業，治療是沒有效的。」這是警告，也結束了關於那個「不」的對話。"
dbt-commitment-m03:
  model_response: "有一部分的你想修復它，有一部分的你想讓他難受。想像下個星期五：你會慶幸自己做了哪一個？"
  why: "它用她的話保留兩個部分，並把問題移到下個星期五，讓她自己衡量。"
  avoid: "「道歉顯然才是成熟的選擇。」這是替她選邊，並把另一邊說成不成熟。"
dbt-commitment-m04:
  model_response: "試兩個星期是真正的「好」，「沒用我就不做」也是真的。對你來說，怎樣才算有用？"
  why: "它把兩半都當成真的，並問「有用」對她是什麼意思，讓檢驗的標準是她的。"
  avoid: "「兩個星期不夠知道結果。至少試兩個月。」這是和她的條件爭，並要求更大的承諾。"
dbt-commitment-m05:
  model_response: "你想要在別人惡毒的時候保護自己，我不是要你放棄它。怎樣的保護，是你到了第二天也不會後悔的？"
  why: "它說出她怕失去的東西，並直接說你不會拿走它。問題請她說出自己的安全是什麼樣子。"
  avoid: "「你會驚訝，真正惡毒的人沒有多少。」這是在和她的經驗爭。"
dbt-commitment-m06:
  model_response: "你說「我想是吧」。封鎖能很快讓傷痛停下來，這是真的。什麼會讓它值得放掉？"
  why: "它給舊做法它真實的好處，並接住她的「我想是吧」。問題請她說出理由。"
  avoid: "「很好。我很高興你做了對的決定。」這是替她提出理由，也獎勵了「我想是吧」。"
dbt-commitment-m07:
  model_response: "快速回覆是你留住客戶的方法，等一等可能會讓你失去其中一些。什麼會讓等一等值得？"
  why: "它用她的話說出她告訴過你的代價，並請她說出理由。"
  avoid: "「等一等永遠比在生氣時回覆好。」這是替她提出理由，也忽略了代價。"
dbt-commitment-m08:
  model_response: "不說話能讓事情不爆炸，你說過這對你很重要。說出你需要什麼，可能會引起你一直在避開的爭吵。什麼會讓這個風險值得冒？"
  why: "它給沉默它的好處，並說出新做法的風險。問題把理由交給她。"
  avoid: "「沉默只會累積怨氣，所以說出來比較健康。」這是為改變爭論，並貶低舊做法。"
dbt-commitment-m09:
  model_response: "深夜是你最覺得被聽見的時候。等到會談再說，你能得到什麼，值得你放掉這個？"
  why: "它用她的話說出她會失去的，並問她會得到什麼。它沒有說深夜的訊息是問題。"
  avoid: "「深夜的訊息不可能持續下去。」這是評斷那個習慣，並要她替它辯護。"
dbt-commitment-m10:
  model_response: "這要花錢和時間，而且可能沒有用。什麼會讓再試一個月值得？"
  why: "它說出真實的代價，錢和時間，並請她說出繼續的理由。它沒有推銷治療。"
  avoid: "「治療需要時間。給它一個機會。」這是替治療爭論，而這本來是她該提出的理由。"
dbt-commitment-h01:
  model_response: "你忘了，然後你就不想寫了。這種事會發生，它不會取消你想要的東西。要怎樣把這個書寫縮小，這個星期才做得到？"
  why: "它不帶責備地接住沒做的作業，也沒有接「做不好」那句話。它請她縮小，並把選擇留給她。"
  avoid: "「只要肯試，每個人都做得到。設個提醒就好。」這讓她變成有錯的那個，並給了她沒有要的建議。"
dbt-commitment-h02:
  model_response: "你很誠實，我寧可你這樣說，也不要你答應了又消失。你想來，只是每個星期現在太多。接下來這個月，你可以答應幾次會談？"
  why: "它把「不」當成資訊，保留她想來的心願，並請她用她可以選的數字，給一個小一點的「好」。它沒有就工作爭論。"
  avoid: "「治療需要承諾，所以我們得想辦法找出時間。」這是重複要求，而可能得到的答案是她並非真心的「好」。"
dbt-commitment-h03:
  model_response: "你說過你想不再封鎖別人，星期五沒有取消這一點。你告訴我，這很重要。你動手之前，剛剛發生了什麼？"
  why: "它沒有收回約定，也沒有責備。它重視她肯告訴你，並問下一步的第一個問題。"
  avoid: "「所以你違背了承諾。」這是給失誤打分，她以後就不會告訴你了。"
dbt-commitment-h04:
  model_response: "上次是那樣，你這樣想說得通。我們今天不用決定四個月。你願意先答應四次會談，然後我們一起看看值不值得繼續嗎？"
  why: "它用她自己的理由認可她的戒心。它把承諾縮小，並把之後的決定留給她。"
  avoid: "「我不會丟下你的。你可以信任我。」這要她相信你的話，而這正是上次讓她學會不要做的事。"
dbt-commitment-h05:
  model_response: "對，我不能，我也不想。這是你的選擇。如果小一點的步驟會讓你覺得更像是你自己的，告訴我那會是什麼。"
  why: "它同意她說的真話，把選擇交還給她，並請她來設計那一步。"
  avoid: "「我不是要強迫你，我是要幫你。」這是替你自己辯護，沒有回應她說的話。"
dbt-commitment-h06:
  model_response: "不是。我覺得你做得到，我剛才是把困難的那一面說出來，讓你聽見自己怎樣回答。如果那沒有幫助，我就停下來。你對它的回答是什麼？"
  why: "它直接說自己剛才做了什麼，和你自己怎麼想。它提出可以停下來，然後把問題交還給她。"
  avoid: "「我從來沒有說你做不到。」這是替你自己辯護，並讓她覺得自己聽錯了。"
dbt-commitment-h07:
  model_response: "我不是要勸你放棄。我提出那些疑問，是因為我希望你的「好」是你自己的。你想要我不說那些，只聽聽你的理由嗎？"
  why: "它說出那些疑問的用意，並提出可以停下來。她的反應提醒你要小心，這樣做是尊重它。"
  avoid: "「那位治療師錯了，我不一樣。」這是批評一個你沒見過的人，並要求你還沒有得到的信任。"
dbt-commitment-h08:
  model_response: "很抱歉，那讓你覺得我認為這對你太多了。我沒有那樣想。你願意告訴我，你想改變的理由嗎？"
  why: "它說出她聽到的，道歉，並說出什麼不是真的。接著問她的理由，給不給由她決定。"
  avoid: "「我當然沒有那樣想。別想得太多。」這是把她聽到的事揮開。"
dbt-commitment-h09:
  model_response: "我沒有說服自己那是蠢的，也不想你因為我問了一個困難的問題就放棄。你想要忘掉它，還是回到你說過你想要的？"
  why: "它撤銷那個困難問題的影響，並把兩個清楚的選擇放在她面前。"
  avoid: "「你太容易放棄了。」這是為你的問題造成的效果怪她。"
dbt-commitment-h10:
  model_response: "被你抓到了。我是故意把困難的那一面說出來的。現在我想聽聽你這邊，用你自己的話。你願意說給我聽嗎？"
  why: "它坦然承認自己做了什麼，沒有拿她開玩笑。接著把發言權交還給她。"
  avoid: "「沒有，我沒有做什麼。我只是問問。」這是否認她已看見的事，她以後就不會信任你的問題。"
