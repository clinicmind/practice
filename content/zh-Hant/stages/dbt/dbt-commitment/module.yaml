slug: dbt-commitment
version: 1.0.0
title: "承諾策略"
intro: "在辯證行為治療裡，個案要先同意去試，才會改變她做的事。承諾策略幫她走到那一步，而不用推她。個案對某個目標或對治療本身心裡有兩個聲音時，你就用它，例如她想讓痛苦停下來，又想保留那個讓痛苦很快停下來的辦法。這個模組教兩項。引出承諾，是幫個案用自己的話說出她想要什麼，以及她願意試什麼。你問改變和不改變各有什麼好處和代價；你先要求小的一步，再要求大的一步（得寸進尺）。魔鬼代言人，是你溫和地替另一邊說話，讓個案替改變那一邊說話。只有在個案已經說她傾向改變、關係穩定、而且一旦她覺得受傷，你可以坦白說明剛才是在測試計畫並立刻停下來的時候，才用魔鬼代言人。不論你做什麼，個案都保有選擇的自由，而且你要說出來。不要用這些技能去贏一場爭論，或去換取她不想給的承諾。那樣的承諾沒有多少價值，還可能讓你失去關係。她一露出受傷的樣子，就停下魔鬼代言人，回到認可。這個模組裡，你會跟著個案 J。她想讓痛苦停下來，又說不放棄封鎖別人。這個階段不涵蓋危及生命行為的評估和處理。這部分要在督導下，按實習機構的守則學習。"
skills:
  - commitment-eliciting
  - devils-advocate
reflection_prompts:
  - id: dbt-commitment-r1
    text: "J 說她不放棄封鎖別人。你想對她說什麼？那些話裡，哪些聽起來像爭論，哪些聽起來像好奇？"
  - id: dbt-commitment-r2
    text: "第 4 次會談，J 保證完全不再封鎖別人，然後又收回來。想一次你承諾得太多的經驗。什麼會幫你做出比較小的承諾？"
  - id: dbt-commitment-r3
    text: "魔鬼代言人要靠穩定的關係。在當下，什麼會告訴你現在太早，或你已經說得太過頭？"
