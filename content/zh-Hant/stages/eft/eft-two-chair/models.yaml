eft-two-chair-e01:
  model_response: "你罵自己白痴，然後就坐在那裡。有一種用兩張椅子工作的方式：你以那把聲音的身分對一張空椅子說話，然後換位置，以聽到它的那一方回答。這可能覺得怪，目的是聽到兩邊。你想試試，還是寧願不試？"
  why: "它用他的話反映兩邊，說明任務是什麼、為了什麼，最後給一個真正的選擇。"
  avoid: "「我想請你對空椅子上的那把聲音說話。」這是指令，沒有目的，也沒有退路。"
eft-two-chair-e02:
  model_response: "你有一部分說你早該走出來，另一部分覺得想放棄。我們可以給它們各一張椅子，讓你先以一個的身分說，再以另一個的身分說。這是聽到兩邊的一種方式。你想試試，還是不試？"
  why: "兩半都在她的話裡，目的用幾個字說了。「還是不試」是真正的出口。"
  avoid: "「這會幫你不再想放棄。」這是承諾結果。"
eft-two-chair-e03:
  model_response: "一把聲音說你是騙子，而你的一部分相信它。如果你願意，我們可以擺兩張椅子，各給一方，你先以一方的身分說，再以另一方的身分說。目的是把兩邊聽得更清楚。你想試試嗎？"
  why: "它說出兩邊，並說明椅子是為了什麼。問題是開放的。"
  avoid: "「我們可以用椅子證明那把聲音是錯的。」這把批評者變成敵人，還承諾結果。"
eft-two-chair-e04:
  model_response: "朋友說你對自己太苛刻。而你一犯錯就聽到「笨。又來了。」然後沒法思考。我們可以把那把聲音放在一張椅子，把聽到它的那一部分放在另一張，你以各自的身分說話。可能會覺得陌生，你也可以說不。你想試試嗎？"
  why: "它用他自己的話和他描述的次序，也承認這個任務可能覺得陌生。"
  avoid: "「學會對自己溫和地說話是個好主意。」這是建議，而且和任務無關。"
eft-two-chair-e05:
  model_response: "一部分說想要獨處是自私，另一部分內疚得享受不到。我們可以給各自一張椅子，讓各自說話。這是聽到兩邊的方式，不是要決定誰對。你想試試，還是寧願不試？"
  why: "「不是要決定誰對」告訴她任務不是為了什麼。選擇在她手上。"
  avoid: "「我們來找出哪一部分是對的。」這把任務變成判決。"
eft-two-chair-e06:
  model_response: "直接對他說。你到底對他說什麼？你是怎麼說的？"
  why: "它把話送到另一張椅子，並要求真實的字詞和真實的語氣。"
  avoid: "「這聽起來很苛刻。你為什麼這樣說？」它在評判那把聲音，還要求理由。"
eft-two-chair-e07:
  model_response: "你是在談論他。直接對他說，看著他。你對他說什麼？"
  why: "它指出從「談論」變成「對」的轉變，並要求同樣的話，對著他說。"
  avoid: "「你為什麼覺得他懶？」它要求解釋，個案繼續對著你說話。"
eft-two-chair-e08:
  model_response: "再對她說一次，用你平常真正說的方式。你還說什麼？"
  why: "它要求真實聲音裡的話，並邀請更多。很簡短。"
  avoid: "「你真的這樣想嗎？」它質疑批評者，打斷了對話。"
eft-two-chair-e09:
  model_response: "很難聽。告訴她，她這樣說的時候，你是什麼感覺。「你這樣說的時候，我……」"
  why: "它保留他的話，給一個對著她的句子開頭。它沒有替感受命名。"
  avoid: "「聽起來是受傷。」你替他把感受命名了。"
eft-two-chair-e10:
  model_response: "難過。在那裡停一下。然後用你自己的話，告訴他那是什麼感覺。"
  why: "它保留她的字，邀請她留下，並把話送給批評者。"
  avoid: "「為什麼它讓你難過？」它要求理由，她會從腦袋回答。"
eft-two-chair-m01:
  model_response: "請你坐這張椅子。在這裡，你是那把聲音，說那些苛刻話的那一位。看著另一張椅子，想像你自己坐在那裡，告訴他你對自己說的話。"
  why: "一個步驟，一個清楚的角色，一個清楚的聽者。內容留給個案。"
  avoid: "「想說什麼就說什麼。」它沒有說他在這張椅子上是誰，也沒有說對誰說。"
eft-two-chair-m02:
  model_response: "在這張椅子上，你是那把聲音。對另一張椅子說話，就像你坐在那裡。你可以像那把聲音平常那樣直接。"
  why: "一句話回答角色的問題，另一句回答聽者的問題。"
  avoid: "「你是你自己。」它沒有回答她的問題，角色仍然含糊。"
eft-two-chair-m03:
  model_response: "我們先在這裡停。你可以站起來，換到另一張椅子。現在你是聽到她說話的那一位。你剛剛聽到了這一切。"
  why: "它結束第一部分，給一個身體上的步驟，並說明她現在是誰。"
  avoid: "「你現在怎麼看這些？」它要求一個看法，而不是一個動作。"
eft-two-chair-m04:
  model_response: "告訴他。對著另一張椅子說，對著那把聲音說。說出你聽到他說這些話的時候，是什麼感覺。"
  why: "它讓聽者清楚。話是對著批評者說，不是對著治療師。"
  avoid: "「告訴我你的感覺。」它把對話變成向你報告。"
eft-two-chair-m05:
  model_response: "好。換到另一張椅子，從那裡回答他。你剛剛聽到他說的了。"
  why: "它歡迎一個由個案自己提出的移動，並說明他接下來做什麼。"
  avoid: "「還不行，讓他說完。」它推翻了一個好的直覺。"
eft-two-chair-m06:
  model_response: "你同意他：你應該做得更好。在這裡，聽到他這樣說，你裡面發生什麼？告訴他。"
  why: "它保留他的話，不爭辯，問的是經驗，並要求對批評者說。"
  avoid: "「你不必同意他。」你站到自己那一邊，開始了爭辯。"
eft-two-chair-m07:
  model_response: "她那樣說的時候，你就一片空白。在那片空白裡停一下。告訴她，她說的時候，你在裡面是什麼樣子。"
  why: "空白也是一種東西，這個邀請讓他說它。它沒有把空白叫作逃避。"
  avoid: "「你在逃避什麼？」它把空白讀成防衛，讓他很難堪。"
eft-two-chair-m08:
  model_response: "你習慣了。告訴他習慣是什麼感覺。他這樣說話，你卻不在乎，這對你意味著什麼？"
  why: "它不和「我不在乎」爭辯，而是把這句話當成值得看的東西。"
  avoid: "「我不相信你。」這是對質，只會引來更多防衛。"
eft-two-chair-m09:
  model_response: "你變得很小，想躲起來。告訴她。「你這樣說的時候，我變得很小，我想……」看看會來什麼。"
  why: "它用她的話，給一個開放的句子開頭，並沒有完成它。"
  avoid: "「你覺得羞愧嗎？」它替感受命名了。"
eft-two-chair-m10:
  model_response: "總得有人推一把。如果你不推，你擔心會怎樣？"
  why: "它認真對待批評者的工作，並問它底下的擔心。"
  avoid: "「你為什麼要這麼苛刻？」它在攻擊批評者。"
eft-two-chair-h01:
  model_response: "沒問題。我們不做，你也不必解釋。如果你願意，我們可以用別的方式談。"
  why: "它馬上接受，並繼續工作。不爭辯，也不解釋。"
  avoid: "「這幫過很多人。」它在推。"
eft-two-chair-h02:
  model_response: "是可能有這種感覺。它只是一種把每個部分聽清楚的方式。我們可以只做幾分鐘，也可以完全不做。由你決定。"
  why: "它同意這確實覺得怪，並簡短說它是什麼。選擇在她。"
  avoid: "「這是一種研究很充分的技術。」它爭辯，並把話題轉到證據。"
eft-two-chair-h03:
  model_response: "我在這裡。我們放慢。感覺一下你的腳踩在地板上。現在不用做任何別的事。"
  why: "個案不堪負荷。不提出任務。你先讓他穩下來。"
  avoid: "「我們把那把聲音放到一張椅子上。」它在一個承受不了的人身上再加一個要求。"
eft-two-chair-h04:
  model_response: "好，我們現在就停。你可以睜開眼睛，看看房間四周，呼吸。這是你的決定，沒問題。"
  why: "停止馬上被尊重。它把控制還給他，也給他一件可以做的事。"
  avoid: "「再一分鐘就好，你做得很好。」它推翻了他。"
eft-two-chair-h05:
  model_response: "我希望這是你自己的選擇，不只是我的建議。你有沒有哪一部分寧願不做？可以說出來。"
  why: "「你是專家」是順從。你把選擇還給他。"
  avoid: "「好，我們開始。」它接受了一個不是他自己的好。"
eft-two-chair-h06:
  model_response: "那很強烈。我們先停一下。你在裡面說這些，現在怎樣？你可以再說多一點嗎，還是我們停？"
  why: "它回應強度，確認他穩定，也不要求更殘忍的話。"
  avoid: "「再大聲一點。再說一次。」它給一個已不再具體的批評者加熱。"
eft-two-chair-h07:
  model_response: "你這麼努力，卻永遠不夠。慢慢來。在這裡停一下，準備好的時候，告訴他。"
  why: "它反映眼淚和她的話，定下慢的步調。「準備好的時候」把控制留在她手上。"
  avoid: "「這一定很辛苦。你已經盡力了。」它在安慰，也止住了感受。"
eft-two-chair-h08:
  model_response: "現在沒有。沒關係。我們可以在這裡留一會兒，也可以今天先到這裡。你比較想怎樣？"
  why: "它接受平淡，給一個選擇。不推他去感覺。"
  avoid: "「試著留意一些東西。」它把空白變成失敗。"
eft-two-chair-h09:
  model_response: "是有點奇怪。（微笑）我們可以留在這裡一分鐘，也可以放下。你說了算。"
  why: "笑是一種退後。你輕輕地加入，選擇留給她。"
  avoid: "「我們保持嚴肅。」它羞辱了那個笑。"
eft-two-chair-h10:
  model_response: "你爸的聲音。你從來沒有發現。在這裡停一下。現在發現了，是什麼感覺？"
  why: "個案自己找到了連結。你保留他的話，問經驗。你不解釋，也不加東西。"
  avoid: "「所以批評者就是你爸。」它把他找到的告訴了他。"
