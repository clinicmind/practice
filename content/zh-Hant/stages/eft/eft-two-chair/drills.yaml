# 30 題練習：每個級別 10 題，每個級別每項技能 5 題。
# 椅子設置題：任務周邊治療師的話，包括提出任務、擺椅子、在椅子之間移動，以及尊重個案說不。
# 強化題：個案坐在椅子上時，你的下一句話。

- id: eft-two-chair-e01
  level: easy
  skill: chair-setup
  context: "標記「自我批評分裂」存在。任務：寫一到三句話，提出雙椅任務。說明它是什麼、為了什麼，並讓個案很容易說不。"
  client: "我真的很懶。「你這個白痴，你什麼都做不完。」我每晚都這樣對自己說。然後我就坐在那裡。"
  criteria: &cs_easy
    - "用個案自己的字詞，反映個案顯示的兩邊。"
    - "用平實的話說明任務是什麼、為了什麼，不承諾結果。"
    - "讓個案很容易說不。一到三句短句。"
- id: eft-two-chair-e02
  level: easy
  skill: chair-setup
  context: "標記存在。任務：寫一到三句話，提出雙椅任務，說明它為了什麼，並讓個案很容易說不。"
  client: "我早就應該走出來了。我到底怎麼了？別人都做得到。（聲音低下去）我只覺得想放棄。"
  criteria: *cs_easy
- id: eft-two-chair-e03
  level: easy
  skill: chair-setup
  context: "標記存在。任務：寫一到三句話，提出雙椅任務，說明它為了什麼，並讓個案很容易說不。"
  client: "工作的時候，有一把聲音說我是騙子。我的另一部分，就只是相信它。"
  criteria: *cs_easy
- id: eft-two-chair-e04
  level: easy
  skill: chair-setup
  context: "標記存在。任務：寫一到三句話，提出雙椅任務，說明它為了什麼，並讓個案很容易說不。"
  client: "朋友說我對自己太苛刻。可是我一犯錯，就會聽到：「笨。又來了。」然後我就沒法思考。"
  criteria: *cs_easy
- id: eft-two-chair-e05
  level: easy
  skill: chair-setup
  context: "標記存在。任務：寫一到三句話，提出雙椅任務，說明它為了什麼，並讓個案很容易說不。"
  client: "我的一部分說，想要獨處是自私。另一部分又內疚得完全享受不到。"
  criteria: *cs_easy

- id: eft-two-chair-e06
  level: easy
  skill: heightening
  context: "個案坐在批評者的椅子上。任務：寫一到兩句話，幫批評者說得更具體、更直接。"
  client: "（對著另一張椅子）你應該更努力。你要做得更好。"
  criteria: &ht_easy
    - "請個案把話說給另一張椅子（「對他說」），而不是談論另一張椅子。"
    - "邀請個案把剛說的話說得更具體、更完整或更有感覺。不詮釋。"
    - "一到兩句短句。"
- id: eft-two-chair-e07
  level: easy
  skill: heightening
  context: "個案坐在批評者的椅子上。任務：寫一到兩句話，幫批評者對另一張椅子說話。"
  client: "（看著治療師）他就是懶。他從來不做他該做的事。"
  criteria: *ht_easy
- id: eft-two-chair-e08
  level: easy
  skill: heightening
  context: "個案坐在批評者的椅子上。任務：寫一到兩句話，幫批評者說得更具體。"
  client: "（輕聲，對著另一張椅子）你永遠做不對。"
  criteria: *ht_easy
- id: eft-two-chair-e09
  level: easy
  skill: heightening
  context: "個案已經換到另一張椅子，批評者剛說完話。任務：寫一到兩句話，幫個案說出聽到時是什麼感覺。"
  client: "（在另一張椅子上）很難聽。她這樣說的時候。"
  criteria: *ht_easy
- id: eft-two-chair-e10
  level: easy
  skill: heightening
  context: "個案坐在被批評那一部分的椅子上。任務：寫一到兩句話，幫個案留在感受裡，並對批評者說出來。"
  client: "（在另一張椅子上，輕聲）我覺得難過。你這樣說的時候。"
  criteria: *ht_easy

- id: eft-two-chair-m01
  level: medium
  skill: chair-setup
  context: "個案同意試試看。任務：寫出第一個指示。說明坐哪裡、個案在這張椅子上是誰、對誰說話。"
  client: "好。我們試試。我要做什麼？"
  criteria: &cs_medium
    - "給出一個清楚的步驟，例如坐在哪裡，或對誰說話。"
    - "告訴個案在這張椅子上他或她是誰（「在這裡你是那把聲音」），以及對誰說話。"
    - "簡短，內容留給個案。"
- id: eft-two-chair-m02
  level: medium
  skill: chair-setup
  context: "個案坐在第一張椅子上，看來不確定。任務：寫一到兩句話，讓角色清楚。"
  client: "（坐下）所以我是……我自己？還是那把聲音？我要對誰說話？"
  criteria: *cs_medium
- id: eft-two-chair-m03
  level: medium
  skill: chair-setup
  context: "個案以批評者的身分說完話。任務：寫出你怎樣請個案換到另一張椅子。"
  client: "（說完，看來疲倦）……這就是我對她說的。一直都是。"
  criteria: *cs_medium
- id: eft-two-chair-m04
  level: medium
  skill: chair-setup
  context: "個案在第二張椅子上，剛聽完批評者。任務：寫一到兩句話，讓個案清楚該對誰說話。"
  client: "（在另一張椅子上）我是告訴你我的感覺？還是告訴他？"
  criteria: *cs_medium
- id: eft-two-chair-m05
  level: medium
  skill: chair-setup
  context: "個案坐在批評者的椅子上，自己想換椅子。任務：寫出你怎樣說。"
  client: "（以批評者的身分，停下）我可以換嗎？我想回答他。"
  criteria: *cs_medium

- id: eft-two-chair-m06
  level: medium
  skill: heightening
  context: "個案坐在被批評那一部分的椅子上，同意批評者。任務：寫一到兩句話，幫他留意聽到時他裡面發生什麼。"
  client: "（在另一張椅子上）對。他說得對。我應該做得更好。"
  criteria: &ht_medium
    - "用個案自己的話，反映他或她剛說或剛做的，不和它爭辯。"
    - "邀請個案對另一張椅子說出：在這張椅子上，他或她感覺到、想要或害怕什麼。"
    - "簡短，不替個案把感受命名。"
- id: eft-two-chair-m07
  level: medium
  skill: heightening
  context: "個案坐在被批評那一部分的椅子上。任務：寫一到兩句話。"
  client: "（在另一張椅子上）我不知道。她那樣說話的時候，我腦袋就一片空白。"
  criteria: *ht_medium
- id: eft-two-chair-m08
  level: medium
  skill: heightening
  context: "個案坐在被批評那一部分的椅子上。任務：寫一到兩句話。"
  client: "（在另一張椅子上，微笑）我不在乎。我習慣了。"
  criteria: *ht_medium
- id: eft-two-chair-m09
  level: medium
  skill: heightening
  context: "個案坐在被批評那一部分的椅子上。任務：寫一到兩句話，幫個案對批評者說出來。"
  client: "（在另一張椅子上，聲音很輕）我變得很小。我想躲起來。"
  criteria: *ht_medium
- id: eft-two-chair-m10
  level: medium
  skill: heightening
  context: "個案已回到批評者的椅子上。任務：寫一到兩句話，邀請批評者說出它想要或害怕什麼。"
  client: "（以批評者的身分）總得有人去做。我不推，什麼都做不成。"
  criteria: *ht_medium

- id: eft-two-chair-h01
  level: hard
  skill: chair-setup
  context: "標記存在，你已提出任務。任務：寫一到兩句話。先回應個案剛說的，再說任務的事。"
  client: "不。我不做那種事。"
  criteria: &cs_hard
    - "先回應個案剛說或剛做的（拒絕、懷疑、痛苦），再說任何關於任務的話。"
    - "選擇留在個案手上：個案可以說不、停止或休息，而你不推。"
    - "簡短。不爭辯，也不長篇解釋。"
- id: eft-two-chair-h02
  level: hard
  skill: chair-setup
  context: "你已提出任務。任務：寫一到兩句話。先回應個案說的，再多說任務。"
  client: "（皺眉）這不是有點……做作嗎？我又不是演員。"
  criteria: *cs_hard
- id: eft-two-chair-h03
  level: hard
  skill: chair-setup
  context: "標記存在，但個案哭得很厲害，沒法說完整的句子。任務：寫一到兩句話。決定要不要提出任務，並回應正在發生的事。"
  client: "（大哭）我好沒用。我恨我自己。我沒辦法……我沒辦法……"
  criteria: *cs_hard
- id: eft-two-chair-h04
  level: hard
  skill: chair-setup
  context: "個案在第一張椅子上。任務：寫一到兩句話。回應剛剛發生的事。"
  client: "我做不到。我覺得想吐。停。請你停。"
  criteria: *cs_hard
- id: eft-two-chair-h05
  level: hard
  skill: chair-setup
  context: "你已提出任務。任務：寫一到兩句話。先回應個案說的，再繼續。"
  client: "好。你覺得這樣最好的話。你是專家。"
  criteria: *cs_hard

- id: eft-two-chair-h06
  level: hard
  skill: heightening
  context: "個案坐在批評者的椅子上。任務：寫一到兩句話。先回應剛發生的事，再要求更多。"
  client: "（以批評者的身分，大聲）你很可悲。我看到你就噁心。你總是讓每個人失望。"
  criteria: &ht_hard
    - "先回應剛發生的事（大聲、崩潰、眼淚、笑、平淡的回答、突然的領悟），再要求更多。"
    - "確認個案夠穩定，或給個案放慢或離開椅子的方式，不推動更強的強度。"
    - "簡短，不替感受命名或解釋。"
