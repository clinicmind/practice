sessions:
  - id: eft-two-chair-s6
    title: "第 6 次會談：「沒用」"
    turns:
      - id: eft-two-chair-s6-t01
        speaker: therapist
        text: "R，你好。這星期怎樣？"
      - id: eft-two-chair-s6-t02
        speaker: client
        text: "一樣。改作業。（停頓）不過星期四又來了。半夜。我對著自己的答案本，一整疊都改錯了，我罵自己……嗯，你知道的。「沒用。」「懶。」「連這個都做不好。」我現在好像會說出聲。我太太在走廊聽到了。"
      - id: eft-two-chair-s6-d1
        type: choice
        prompt: "R 又一次描述那把聲音，還說他太太聽到了。你怎樣回應？"
        options:
          - id: a
            text: "那把聲音聽起來很苛刻。你有沒有想過對自己好一點？"
            fit: weak
            note: "這是建議，而且在評判那把聲音。R 在第二次會談說過，那把聲音是事情得以完成的原因。他會為它辯護，也會聽出你認為他做錯了。"
          - id: b
            text: "一把聲音說「沒用」「懶」，還有你，坐在桌子旁，承受著。星期四，你們兩個都在。"
            fit: strong
            note: "它同時反映兩邊，不站隊：說話的一方和聽的一方。你心裡抓住那個分裂，卻沒有說它是個問題。"
          - id: c
            text: "你太太聽到的時候，她說了什麼？"
            fit: workable
            note: "這是很自然的問題，答案也可能重要。但它把會談帶到婚姻，離開了那兩個部分。你之後可以回來。"
        actual: "一把聲音說「沒用」「懶」，還有你，坐在桌子旁，承受著。星期四，你們兩個都在。"
        rationale: "標記是自我批評分裂：一把嚴厲的聲音，和一個承受它的部分。你心裡聽出來，並反映兩半，讓 R 聽到你看見的不只是一個問題。你還沒有提出任何任務。"
      - id: eft-two-chair-s6-t03
        speaker: client
        text: "（聳聳肩）這不是問題。這是方法。沒有它，我什麼都做不成。（停頓）不過我太太說，聽起來像是我恨著某個人。"
      - id: eft-two-chair-s6-d2
        type: choice
        prompt: "標記很清楚。R 對他太太聽到的話有些好奇。你決定提出雙椅任務。你怎樣說？"
        options:
          - id: a
            text: "我想請你坐到那張椅子上，扮演批評者，把它說的話對空椅子說出來。"
            fit: weak
            note: "這是指令。沒有目的，也沒有退路。一位一直在問「方法在哪裡」的個案，可能聽成一個他被期待要做的練習。"
          - id: b
            text: "你太太聽到的是真的：有一把聲音對你很苛刻，還有你的一部分承受著它。我們可以用一種方式工作，用兩張椅子。你坐在一張上，以那把聲音的身分對另一張椅子說話，然後換位置，以聽到它的那一方回答。這可能會覺得怪。目的不是讓那把聲音閉嘴，只是聽到兩邊。你想試試，還是寧願不試？"
            fit: strong
            note: "它把他太太說的和你注意到的連起來，說明任務是什麼、為了什麼，承認這可能覺得怪，最後給一個真正的選擇。它沒有承諾那把聲音會消失。"
          - id: c
            text: "你覺得那把聲音是為了什麼？多告訴我它為你做了什麼。"
            fit: workable
            note: "這是對那把聲音的尊重和好奇，R 會回答。你繼續探索，標記之後還會在。它還沒有提出這項工作。"
        actual: "你太太聽到的是真的：有一把聲音對你很苛刻，還有你的一部分承受著它。我們可以用一種方式工作，用兩張椅子。你坐在一張上，以那把聲音的身分對另一張椅子說話，然後換位置，以聽到它的那一方回答。這可能會覺得怪。目的不是讓那把聲音閉嘴，只是聽到兩邊。你想試試，還是寧願不試？"
        rationale: "每一次提出椅子任務，你都說明它是什麼、為了什麼，以及個案可以說不。對一位不習慣談感受的個案，這一點最重要。"
      - id: eft-two-chair-s6-t04
        speaker: client
        text: "（短促地笑）對著椅子說話。（停頓）不。抱歉。我會覺得很荒謬。我是老師。這感覺就像教職員培訓日。"
      - id: eft-two-chair-s6-d3
        type: choice
        prompt: "R 說不。你怎樣回應？"
        options:
          - id: a
            text: "很多人一開始都這樣覺得，過一分鐘通常就好了。我們只試一分鐘，好嗎？"
            fit: weak
            note: "他明確說了不，你卻再提一次。如果你推，他會學到他的不只在你問第二次之前有效。"
          - id: b
            text: "沒問題。我們不做。謝謝你直接告訴我。我們可以不用椅子，繼續談那把聲音。"
            fit: strong
            note: "它馬上接受這個不，向他道謝，並用另一種方式繼續工作。他學到說不是安全的。"
          - id: c
            text: "我可以問問是什麼讓你覺得荒謬嗎？我想了解。"
            fit: workable
            note: "好奇是真誠的。它也要求 R 為他的不作解釋，可能變成商議。有些個案會喜歡被問，這一位可能覺得被催。"
        actual: "沒問題。我們不做。謝謝你直接告訴我。我們可以不用椅子，繼續談那把聲音。"
        rationale: "拒絕不是會談失敗。它是資訊，也是個案在行使自己的主導權。你的接受是治療的一部分：R 在學習，他在這裡可以說不，而且不會有壞事跟著來。"
      - id: eft-two-chair-s6-t05
        speaker: client
        text: "（停頓）謝謝。（停頓）不是我覺得它很傻。嗯，有一點。是如果我對著某個人把它說出來……比我只在心裡想還要糟。"
      - id: eft-two-chair-s6-d4
        type: free
        prompt: "R 剛告訴你一件關於那把聲音的事：說出聲來，更糟。寫出一句回應，留在這件事上，不要把椅子帶回來。"
        actual: "說出聲來，它就更真實了。而你寧願不在一張椅子面前這樣做。這對我來說說得通。"
        rationale: "你認真對待他說的話。這是他第一次告訴你，那把聲音對他做了什麼。你沒有把它當作回到任務的路。選擇留在他手上。"
      - id: eft-two-chair-s6-t06
        speaker: client
        text: "（停頓）……也許不是永遠不要。只是今天不要。"
      - id: eft-two-chair-s6-t07
        speaker: therapist
        text: "今天不要，沒有問題。它還放在桌上，由你決定。"
    notes:
      goals: "沒有改變。R 仍然把那把聲音說成一種方法。他太太的話是新的，他還重複了一遍，顯示這句話觸動了他。"
      alliance: "情感連結：他清楚地說了不，你接受了，他之後還告訴你更多。任務：他現在知道椅子工作是什麼，也知道選擇在他。目標：還沒有談妥。除非他提起，不要再提椅子。"
      formulation_update: "標記：自我批評分裂。批評的聲音被描述為有用。聽到它的那一部分還沒有說話。R 說，那把聲音說出聲來更糟，這可能之後有意義。我沒有詮釋那把聲音。"
  - id: eft-two-chair-s8
    title: "第 8 次會談：「躺下來」"
    turns:
      - id: eft-two-chair-s8-t01
        speaker: client
        text: "（你還沒開口，他就坐下）我想過那個椅子的事。你說過由我選。（停頓）十分鐘。如果很蠢，我就停。"
      - id: eft-two-chair-s8-d1
        type: choice
        prompt: "R 說他想試十分鐘，如果很蠢就停。你怎樣回應？"
        options:
          - id: a
            text: "太好了。我們開始吧。我來擺椅子。"
            fit: weak
            note: "他開出了條件。你跳過了。他是附帶條件地說好，而那些條件就是安全。把它們說回給他。"
          - id: b
            text: "十分鐘，而且你隨時可以停。如果覺得不對，說一聲，我們就停。目的是聽清楚那把聲音，也聽清楚承受它的那一方。我們開始，好嗎？"
            fit: strong
            note: "它重複他的條件，用一句話重申任務為了什麼，並再問一次。他已經說了好，這個確認很簡短。"
          - id: c
            text: "你想過了，我很高興。是什麼讓你改變主意？"
            fit: workable
            note: "這很溫暖，也很好奇。但它要他為一個剛剛才勉強給出的好作辯護，也延遲了他來做的工作。"
        actual: "十分鐘，而且你隨時可以停。如果覺得不對，說一聲，我們就停。目的是聽清楚那把聲音，也聽清楚承受它的那一方。我們開始，好嗎？"
        rationale: "即使想法是個案帶來的，你仍然說明任務為了什麼，以及他可以停。他自己的條件「如果很蠢，我就停」是個好條件。你尊重它。"
      - id: eft-two-chair-s8-t02
        speaker: client
        text: "（點頭）開始吧。"
      - id: eft-two-chair-s8-d2
        type: free
        prompt: "R 同意了。寫出你怎樣擺椅子，並邀請他以批評者的身分開始。"
        actual: "我們把兩張椅子面對面放。你坐這一張。在這裡，你是那把說「沒用」「懶」的聲音。看著另一張椅子，想像你自己坐在那裡。告訴他你對他說什麼，用你平常說的方式。"
        rationale: "你交代清楚第一個位置的角色和說話對象，不預先講完後面換椅的流程。「用你平常說的方式」邀請的是他的字詞和語氣，而不是描述。內容留給他。"
      - id: eft-two-chair-s8-t03
        speaker: client
        text: "（在第一張椅子上，僵硬地看著地板）你應該……再努力一點。你要專心。你做得不夠。"
      - id: eft-two-chair-s8-d3
        type: choice
        prompt: "R 以批評者的身分，說得很籠統，眼睛看著地板。你怎樣說？"
        options:
          - id: a
            text: "很好。現在換到另一張椅子，回答他。"
            fit: weak
            note: "批評者幾乎還沒出現。如果他現在換位置，另一張椅子只會回應一些含糊的話，而且很容易就同意。"
          - id: b
            text: "告訴他你真正怎麼說。你半夜用的那些字。而且是對他說，不是談論他。"
            fit: strong
            note: "它要求具體的字詞，也要求聲音對著另一張椅子。批評者要先鮮明起來，另一邊才有真實的東西可以回應。"
          - id: c
            text: "如果他不再努力，你擔心會發生什麼事？"
            fit: workable
            note: "批評者的擔心值得去碰，你之後會問。現在批評者還沒被聽見，這個問題只是要他抽象地解釋自己。"
        actual: "告訴他你真正怎麼說。你半夜用的那些字。而且是對他說，不是談論他。"
        rationale: "強化批評者，意思是讓它具體、直接、有感覺。一個一直含糊的批評者，很容易被同意，卻很難被面對。你沒有加任何東西，只是邀請他真實的字詞。"
      - id: eft-two-chair-s8-t04
        speaker: client
        text: "（看著另一張椅子，語氣變銳利）沒用。懶。錯一題，你就在打瞌睡。你的注意力呢？粗心。你不能被信任把任何事做對。"
      - id: eft-two-chair-s8-d4
        type: choice
        prompt: "批評者現在既具體又直接。是時候讓另一邊被聽見。你怎樣說？"
        options:
          - id: a
            text: "現在坐到另一張椅子，回答他。"
            fit: weak
            note: "「回答他」邀請的是爭辯或反駁。R 很會講道理，答案會從他的腦袋來。"
          - id: b
            text: "請你過來這張椅子，成為他。你剛剛聽到了這一切。在這裡聽到，是什麼感覺？"
            fit: strong
            note: "它告訴他在這張椅子上他是誰，並問聽到是什麼感覺，這是一種經驗，不是一場論辯。"
          - id: c
            text: "我們先停一下。以批評者的身分說這些，你感覺怎樣？"
            fit: workable
            note: "這是合理的問題，批評者那一邊也重要。但它打斷了流動，而且在另一張椅子快要開口的時刻，讓 R 留在腦袋裡。"
        actual: "請你過來這張椅子，成為他。你剛剛聽到了這一切。在這裡聽到，是什麼感覺？"
        rationale: "換到另一張椅子是任務的一步，所以你說得清楚。問題問的是他作為聽到批評者的人感覺到什麼，而不是他怎麼看批評者。"
      - id: eft-two-chair-s8-t05
        speaker: client
        text: "（換位置後，停頓）嗯。他說得對。我應該發現那個錯誤的。我不想爭。（停頓）問題就是，他總是對的。"
      - id: eft-two-chair-s8-d5
        type: free
        prompt: "在第二張椅子上，R 同意批評者。寫出你說的話，幫他留意聽到這些時他裡面發生什麼，並對批評者說出來。"
        actual: "你同意他。而且你說「他總是對的」。在這裡，聽他說這一切的時候，你裡面發生什麼？告訴他。"
        rationale: "你沒有和這個同意爭辯，因為那樣你就站到「自己」那一邊。你把他的話還給他，問的是經驗。「告訴他」讓話繼續對著另一張椅子。"
      - id: eft-two-chair-s8-t06
        speaker: client
        text: "（長長的停頓）……我想……躺下來。他這樣說話的時候。我只想躺在地上，不動。"
      - id: eft-two-chair-s8-d6
        type: choice
        prompt: "R 第一次說出批評的聲音對他有什麼影響。你怎樣說？"
        options:
          - id: a
            text: "聽起來他這樣說話的時候，你就放棄了。你在別的地方也會這樣嗎？"
            fit: weak
            note: "它把他剛找到的東西變成一個模式，還要他去想別的地方。他從感受的經驗，轉到分析。"
          - id: b
            text: "你想躺下來，不動。告訴他。「你這樣說話的時候，我……」"
            fit: strong
            note: "它保留他自己的字詞，並給一個對著批評者的句子開頭。它沒有說那個感受是什麼。"
          - id: c
            text: "那個想法，你在身體哪裡感覺到？"
            fit: workable
            note: "這在另一項任務裡是好問題。這裡的方向是對批評者說話，而身體的問題把他轉向內，離開了另一張椅子。"
        actual: "你想躺下來，不動。告訴他。「你這樣說話的時候，我……」"
        rationale: "這是被批評的那一部分第一次說出同意以外的話。強化它，意思是幫它直接對批評者說。句子開頭只給一次，讓它開著。"
      - id: eft-two-chair-s8-t07
        speaker: client
        text: "（對著空椅子，低聲）你這樣說話的時候……我只想躺下來。我什麼都不做。我變得很安靜。我不再嘗試了。"
      - id: eft-two-chair-s8-t08
        speaker: therapist
        text: "先在那裡停一下。（停頓）現在，如果你願意，回到第一張椅子，再次成為那把聲音。你剛剛聽到了那些。"
      - id: eft-two-chair-s8-t09
        speaker: client
        text: "（在第一張椅子上，停頓後）嗯。問題就在這裡。你一躺下來，什麼都做不成。總要有人推你一把。"
      - id: eft-two-chair-s8-d7
        type: choice
        prompt: "批評者說總要有人推一把。你對批評者說什麼？"
        options:
          - id: a
            text: "對一個正在受傷的人說這種話，很不友善。"
            fit: weak
            note: "你站到被批評的那一邊，開口反對批評者。批評者會自我防衛，而坐在批評者椅子上的 R 會覺得被評判。"
          - id: b
            text: "總要有人推一把。如果沒有人推，你擔心會發生什麼事？"
            fit: strong
            note: "它用批評者自己的話接受它的工作，並問底下的恐懼。批評者通常帶著一個擔心，值得聽。"
          - id: c
            text: "多說一點「什麼都做不成」是什麼樣子。"
            fit: workable
            note: "它請批評者說得更具體，這有用。但它停在批評者論點的表面，恐懼要之後才會出現。"
        actual: "總要有人推一把。如果沒有人推，你擔心會發生什麼事？"
        rationale: "你不和批評者爭辯。被聽見的批評者，常常會顯露它一直背著的擔心。批評者之後可能軟化，也是這樣：它被聽見了，就不必那麼大聲。"
      - id: eft-two-chair-s8-t10
        speaker: client
        text: "（長長的停頓）他會變成……什麼都不是。一個不推自己的男人，最後什麼都不是。（停頓，更輕聲）沒有人會尊重那樣的人。"
      - id: eft-two-chair-s8-d8
        type: choice
        prompt: "十分鐘到了。R 說過他會停。你怎麼做？"
        options:
          - id: a
            text: "做得好，非常有力量。下星期同一時間見。"
            fit: weak
            note: "它稱讚他，然後結束。它沒有幫他從角色裡出來，也沒有問他怎樣。"
          - id: b
            text: "我們就在這裡停，就像說好的。站起來，甩甩手臂，回到你自己的椅子。你現在怎樣？剛才是什麼感覺？"
            fit: strong
            note: "它遵守他定的時間，用身體的方式幫他離開椅子，問的是他，不是批評者。"
          - id: c
            text: "我們再換一次，聽聽他怎樣回應批評者，好嗎？"
            fit: workable
            note: "這是任務自然的下一步。但 R 定了十分鐘，你提出超時。他可能出於禮貌而同意。"
        actual: "我們就在這裡停，就像說好的。站起來，甩甩手臂，回到你自己的椅子。你現在怎樣？剛才是什麼感覺？"
        rationale: "結束任務是任務的一部分。你遵守他定的時間，幫他走出椅子。他應該帶著這個知道離開：椅子在他決定的時候就停。"
    notes:
      goals: "沒有改變。R 留到他自己定的十分鐘結束。"
      alliance: "情感連結：他選擇試，也告訴你一件他沒有告訴過任何人的事（「我想躺下來」）。任務：他自己定時間和停的權利，保持了主導權。第九次會談開始時，問問他當時是什麼感覺。"
      formulation_update: "批評者很流暢，用字準確（「粗心」「不能被信任」）。被批評的一方先是同意，然後說他想躺下來、不再嘗試。批評者的擔心：不推自己，他就會變成什麼都不是，沒有人尊重。我沒有說那把聲音像誰。如果 R 自己連起來，就跟著他。本次尚未走到「被批評方表達需要」與「批評者軟化」，初期雙椅工作常分次進行，留待後續會談繼續。"
