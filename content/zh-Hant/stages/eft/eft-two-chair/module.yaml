slug: eft-two-chair
version: 1.0.0
title: "自我批評分裂的雙椅對話"
intro: "在情緒聚焦治療（EFT）裡，雙椅工作的標記是自我批評分裂。個案心裡有兩個聲音：一部分在批評、責備或鞭策，另一部分承受、縮小或放棄。典型的徵象有「我應該」「我真沒用」、對自己的語氣嚴厲，以及個案談到自己時，聲音或身體有了變化。對應的任務是雙椅對話。個案坐在一張椅子上，扮演批評者，對另一張椅子說話。然後個案換到另一張椅子，以被批評的那一部分來回答。你引導每一步。目的不是打敗批評者。目的是讓被批評的那一部分感受到自己的受傷，說出自己的需要，批評者才可能按自己的節奏軟化。每一次都要先說明這項任務是什麼、為了什麼，並讓個案很容易說不。個案說不，就接受，並讓門保持敞開。個案不堪負荷、還不信任你、已經說不、只是在掂量一個決定而對自己並不嚴厲、或時間不夠的時候，不要提出這項任務。如果個案看來有風險，先把任務放下，依實習機構的守則處理，並聯絡督導。在這個模組，個案 R 在第六次會談告訴你，他深夜改作業時怎樣對自己說話，並對椅子說不。第八次會談，他選擇試試看。你會練習兩項技能：椅子設置，以及強化，也就是幫每一個聲音變得更具體、更直接、更有感覺，而不是引導它說什麼。"
skills:
  - chair-setup
  - heightening
reflection_prompts:
  - id: eft-two-chair-r1
    text: "R 在第六次會談對椅子說不，在第八次會談卻選擇試試看。你認為是什麼造成這個差別？如果你在同一次會談裡再問一次，可能會怎樣？"
  - id: eft-two-chair-r2
    text: "批評者的椅子對 R 來說很容易，另一張椅子卻很難。想一次你對自己很苛刻的時候。批評的聲音說了什麼？聽到的那一部分想怎樣？"
  - id: eft-two-chair-r3
    text: "有些批評者會變得殘忍，而不是具體。寫下你會留意個案聲音和身體的哪些地方，以及批評者變得殘忍時你會怎樣做。"
