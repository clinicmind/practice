sessions:
  - id: eft-empty-chair-s10
    title: "第 10 次會談：「他在椅子上」"
    turns:
      - id: eft-empty-chair-s10-t01
        speaker: client
        text: "（坐下）我想了上星期說的那些。我沒有對他說的話。（停頓）不過沒關係了。他已經不在了。沒有意義。"
      - id: eft-empty-chair-s10-d1
        type: choice
        prompt: "R 說有些話從來沒對父親說，又說現在沒有意義。標記存在。你怎樣回應？"
        options:
          - id: a
            text: "有意義的。你應該把那些話說出來。我們把他放在那張椅子上，你可以告訴他。"
            fit: weak
            note: "它和「沒有意義」爭辯，還告訴 R 他應該做什麼。它沒有目的，也沒有退路。"
          - id: b
            text: "你有些話從來沒對他說，而且想了一整個星期。有一種工作方式，你想像他在那張椅子上，把那些話對他說。它不能改變他。它是把沒說的話說出來，看看會帶出什麼。由你決定。你想試試，還是寧願放下？"
            fit: strong
            note: "它反映兩邊，說明任務是什麼、不為了什麼，最後給一個真正的選擇。「它不能改變他」回應了「沒有意義」，卻沒有爭辯。"
          - id: c
            text: "如果可以，你會對他說什麼？"
            fit: workable
            note: "這是一個溫暖、自然的問題，他可能會回答。它邀請他談沒說的話，但還沒有提出任務。"
        actual: "你有些話從來沒對他說，而且想了一整個星期。有一種工作方式，你想像他在那張椅子上，把那些話對他說。它不能改變他。它是把沒說的話說出來，看看會帶出什麼。由你決定。你想試試，還是寧願放下？"
        rationale: "說「沒有意義」的個案，常常是在告訴你，他懷疑這做得了什麼。你不爭辯，並誠實說明這項任務能做什麼、不能做什麼。目的不是改變對方，個案必須聽到這一點。"
      - id: eft-empty-chair-s10-t02
        speaker: client
        text: "（停頓）好吧。不過不要太久。而且我不會對著一張空椅子吼。"
      - id: eft-empty-chair-s10-t03
        speaker: therapist
        text: "不要太久，也不吼。說什麼由你決定，你想停隨時可以停。"
      - id: eft-empty-chair-s10-d2
        type: free
        prompt: "R 同意了。寫出你怎樣幫他把父親帶進那張空椅子。不要告訴他父親是怎樣的人。"
        actual: "花一點時間，在那張椅子上想像他。他坐在哪裡？在做什麼？他看著你的時候，臉是什麼樣子？"
        rationale: "你問的是位置、動作和眼神，全部來自 R 自己的畫面。你沒有描述父親，也沒有暗示他是怎樣的。父親越是 R 自己的，任務就越真實。"
      - id: eft-empty-chair-s10-t04
        speaker: client
        text: "（閉上眼，再睜開）在他的扶手椅上。窗邊那張。他拿著報紙。他沒有抬頭。"
      - id: eft-empty-chair-s10-d3
        type: choice
        prompt: "R 想像父親在椅子上，拿著報紙，沒有抬頭。你怎樣說？"
        options:
          - id: a
            text: "好。現在告訴他你想說的。"
            fit: weak
            note: "父親還沒有在場，它就轉到說話。R 才剛看見他，也告訴你第一件事：他沒有抬頭。你跳過了。"
          - id: b
            text: "他拿著報紙，沒有抬頭。看他一會兒。準備好的時候，說出最先來的那句。"
            fit: strong
            note: "它保留 R 的畫面，讓他停在那個重要的細節上，也不催促。「最先來的那句」讓開頭由他來。"
          - id: c
            text: "他在世的時候，就是這樣拿著報紙的嗎？"
            fit: workable
            note: "這是關於記憶的合理問題，但它把他轉向報告，離開了椅子。"
        actual: "他拿著報紙，沒有抬頭。看他一會兒。準備好的時候，說出最先來的那句。"
        rationale: "喚起對方，是從個案的畫面出發。父親沒有抬頭，已經是核心，你不去動它。"
      - id: eft-empty-chair-s10-t05
        speaker: client
        text: "（對著椅子，僵硬地）爸。（清喉嚨）我想告訴你，喪禮辦得很好。大家都來了。食物也不錯。我付了所有的錢。一切都辦得妥妥當當。"
      - id: eft-empty-chair-s10-d4
        type: choice
        prompt: "R 正在以禮貌、正式的方式向父親報告。你怎樣說？"
        options:
          - id: a
            text: "你好像在避開你真正的感覺。你可以告訴他你真正的感覺嗎？"
            fit: weak
            note: "它把他的風格說成逃避，並挑戰它。R 會覺得被抓到，很可能收起來。"
          - id: b
            text: "你把一切都辦得妥妥當當。告訴他，你做這一切的時候是什麼感覺。"
            fit: strong
            note: "它接受他說的，並要求他的經驗，對著父親說。它沒有把禮貌叫作防衛。"
          - id: c
            text: "你告訴他這些的時候，你希望他回答什麼？"
            fit: workable
            note: "它把父親的回應提早帶進來。R 還沒有說任何自己的話，父親的回答可能只是重複舊有的距離。"
        actual: "你把一切都辦得妥妥當當。告訴他，你做這一切的時候是什麼感覺。"
        rationale: "責任和禮貌是 R 的起點，而且是真的。你不和它們爭辯。你問一個問題，把他從報告帶向他的經驗。"
      - id: eft-empty-chair-s10-t06
        speaker: client
        text: "（停頓）那……很多。（清喉嚨）總要有人去做。（更輕聲）我沒有哭。我本來以為你會……我不知道我以為什麼。"
      - id: eft-empty-chair-s10-d5
        type: free
        prompt: "R 開始說一句他以為父親會怎樣的話，然後停了。寫出一句簡短的回應，讓他繼續對父親說，而不是替他把句子說完。"
        actual: "你以為他會……對他說。「我以為你會……」"
        rationale: "你用他沒說完的話，並給一次開頭。你沒有猜結尾。接下來的話是 R 的。"
      - id: eft-empty-chair-s10-t07
        speaker: client
        text: "（對著椅子）我以為你會說……（停下）你會說點什麼。就一次。（停下）不。你不會。"
      - id: eft-empty-chair-s10-d6
        type: choice
        prompt: "R 說了「你不會」，然後沉默。你想聽聽父親的回應。你怎樣說？"
        options:
          - id: a
            text: "我們換位置。你坐到他的椅子上，成為他。他說什麼？"
            fit: weak
            note: "它沒有問，也沒有說明答案是 R 自己的畫面。一位才剛開始的個案，可能覺得被推著去變成那位讓他受傷的人。"
          - id: b
            text: "你願意坐到他的椅子上，成為他一會兒，聽聽你剛剛說的嗎？出現的會是你想像中的他，不是他本人。你也可以不要。"
            fit: strong
            note: "它問了，說明出口，也說明父親的話會是什麼：R 自己的畫面。這保護了 R，也讓練習保持誠實。"
          - id: c
            text: "你想像他會對這句話說什麼？"
            fit: workable
            note: "它不換位置，也能碰到父親的回應。R 留在自己的椅子上，比較溫和，但父親也比較不在場。"
        actual: "你願意坐到他的椅子上，成為他一會兒，聽聽你剛剛說的嗎？出現的會是你想像中的他，不是他本人。你也可以不要。"
        rationale: "以對方的身分說話，是這項任務裡最可能覺得奇怪或痛的部分。你問，你說明那些話是個案自己的畫面，也說明他可以不要。"
      - id: eft-empty-chair-s10-t08
        speaker: client
        text: "（停頓，然後換到另一張椅子，坐得很直，聲音平板而簡短）這是怎麼回事。我跟你說過了。你有飯吃。有衣服穿。受了好的教育。還有什麼。"
      - id: eft-empty-chair-s10-d7
        type: choice
        prompt: "R 現在以他父親的身分說話。你對他說什麼？"
        options:
          - id: a
            text: "爸，你聽到這話在兒子聽來是什麼樣子嗎？"
            fit: weak
            note: "你把父親當作真人對質。治療師變成在和 R 的父親對抗，R 會覺得他必須辯護，或加入你。"
          - id: b
            text: "先停在他裡面一會兒。他現在是怎樣看著他的兒子？再說一次，用他說話的方式。"
            fit: strong
            note: "它讓 R 留在角色裡，問眼神和聲音，不詮釋。父親變得更在場，R 也看到他帶著什麼。"
          - id: c
            text: "現在回到你自己的椅子，回答他。"
            fit: workable
            note: "它推進任務，也很可能是下一步。但父親只說了一句話，還很單薄。"
        actual: "先停在他裡面一會兒。他現在是怎樣看著他的兒子？再說一次，用他說話的方式。"
        rationale: "喚起對方，意思是幫個案用聲音和姿勢演出那個人。你不是要讓父親改變。你是幫 R 看見和聽見他帶著的東西。"
      - id: eft-empty-chair-s10-t09
        speaker: client
        text: "（以父親的身分，更平板了些）沒什麼了。還有什麼。（短暫停頓，聲音變薄）我不知道你要我怎樣。"
      - id: eft-empty-chair-s10-t10
        speaker: therapist
        text: "準備好了，就回到你自己的椅子。（R 移動。）成為他，是什麼感覺？"
      - id: eft-empty-chair-s10-t11
        speaker: client
        text: "（呼氣）很怪。很容易。太容易了。（停頓）然後他說「我不知道你要我怎樣」，我也不知道。"
      - id: eft-empty-chair-s10-d8
        type: choice
        prompt: "會談快結束。R 發現他不知道自己想從父親那裡要什麼。你怎樣說？"
        options:
          - id: a
            text: "這是很大的領悟。你想從他那裡要什麼？"
            fit: weak
            note: "它稱讚他，還要他馬上回答一個他剛說不能回答的問題。他可能為了討好你，快速給出一個答案。"
          - id: b
            text: "那句話在你心裡留了下來。我們今天不必回答它。你現在在自己的椅子上，怎樣？"
            fit: strong
            note: "它保留他找到的，不推進，也確認他的狀態。問題留到下次。"
          - id: c
            text: "我們回到椅子上，問問他，好嗎？"
            fit: workable
            note: "這是任務的下一步，R 也願意。但已經接近結束，短時間可能讓他帶著一個敞開的感覺離開。"
        actual: "那句話在你心裡留了下來。我們今天不必回答它。你現在在自己的椅子上，怎樣？"
        rationale: "你不趕著讓發現發生。R 還說不出的需要，是下一次會談的工作。溫和地結束椅子，並確認他的狀態，是任務的一部分。"
    notes:
      goals: "沒有改變。R 帶條件地說好（不要太久、不吼），並保持了主導權。他發現他不知道自己想從父親那裡要什麼。"
      alliance: "情感連結：他留在一項不舒服的任務裡。任務：他現在對椅子有了經驗，也選擇演出父親。下次問問它在他裡面怎樣。"
      formulation_update: "與父親的未完成事件。他從責任和禮貌開始（喪禮、安排）。他想像中的父親，平板而不理會（「還有什麼」）。需要還沒有說出來。我沒有詮釋，也沒有推他去感覺。"
  - id: eft-empty-chair-s12
    title: "第 12 次會談：「一次」"
    turns:
      - id: eft-empty-chair-s12-t01
        speaker: client
        text: "（坐下）我整個星期都在想。他說的那句，用那個聲音。「還有什麼。」（停頓）我整個星期都在生氣。不是對我兒子。是對他。"
      - id: eft-empty-chair-s12-d1
        type: choice
        prompt: "R 說他整個星期都在生父親的氣。你怎樣回應？"
        options:
          - id: a
            text: "這是進步。生氣是健康的。我們把他放到椅子上，讓你發洩出來。"
            fit: weak
            note: "它稱讚這份憤怒，還定好了計畫。R 沒有要求用椅子，他可能覺得自己被期待要生氣。"
          - id: b
            text: "你整個星期都在生他的氣，而不是你兒子的氣。你今天想回到那張椅子，還是從別的地方開始？兩樣都可以。"
            fit: strong
            note: "它反映他說的，包括離開兒子的轉變。它再次提出任務，並有一個清楚的另一條路。"
          - id: c
            text: "對他生氣，是什麼感覺？"
            fit: workable
            note: "這是好問題，也可能加深憤怒。它還沒有問他想不想用椅子。"
        actual: "你整個星期都在生他的氣，而不是你兒子的氣。你今天想回到那張椅子，還是從別的地方開始？兩樣都可以。"
        rationale: "每一次提出椅子，你都說明它是什麼，並讓它成為一個選擇。R 可以說好，也可以說今天不要。兩樣都可以。"
      - id: eft-empty-chair-s12-t02
        speaker: client
        text: "（停頓）椅子。這次我想好好地說。"
      - id: eft-empty-chair-s12-d2
        type: free
        prompt: "R 想要「好好地」說。寫出你怎樣幫他把父親再帶回椅子上。"
        actual: "花一點時間，把他帶回來。他坐在哪裡？看著他，他在了就告訴我。"
        rationale: "它像上次一樣，讓 R 自己建立畫面，沒有說父親在做什麼。「他在了就告訴我」把步調交給 R。"
      - id: eft-empty-chair-s12-t03
        speaker: client
        text: "他在了。同一張椅子。這次報紙放下了。他在看著我。"
      - id: eft-empty-chair-s12-t04
        speaker: client
        text: "（對著椅子，聲音升高）你從來沒說過。一次都沒有。三十八年。數學九十五分，你問我另外五分去了哪裡。你生病的時候，我每個星期天都去，我們談天氣。天氣！（停下）你快要死了，我們還在談天氣。"
      - id: eft-empty-chair-s12-d3
        type: choice
        prompt: "R 的憤怒出來了。它很清楚，也是對父親做過的事的控訴。你怎樣說？"
        options:
          - id: a
            text: "那一定很令人沮喪。你有權利生氣。"
            fit: weak
            note: "它站到一邊，而且在談論那份憤怒。憤怒是真實的，不需要你的許可。它關上了憤怒底下的門。"
          - id: b
            text: "留在那裡。你要的是別的東西，他卻在談天氣。那些星期天，你想從他那裡得到什麼？告訴他。"
            fit: strong
            note: "它留在憤怒裡，並問憤怒是關於什麼。需要就在它底下，R 會對父親說。"
          - id: c
            text: "多說一點你有多生氣。"
            fit: workable
            note: "它讓憤怒長大，這有價值。但還沒有碰到他想要的。"
        actual: "留在那裡。你要的是別的東西，他卻在談天氣。那些星期天，你想從他那裡得到什麼？告訴他。"
        rationale: "憤怒可以是對「沒有被看見」的健康反應。你讓它在，然後幫它說出它是為了什麼。直接說出的需要，和控訴不同。"
      - id: eft-empty-chair-s12-t05
        speaker: client
        text: "（更輕聲，長長的停頓）我想要……（清喉嚨）我想要你告訴我。這樣就好。我做得還可以。"
      - id: eft-empty-chair-s12-d4
        type: free
        prompt: "R 開始說他想要什麼，並清了喉嚨。寫出一句簡短的回應，幫他用自己的話直接對父親說出來。"
        actual: "慢慢來。你想要他告訴你，你做得還可以。直接對他說。"
        rationale: "它不評論那聲清喉嚨，重複他的話，並把它們送給父親。它沒有說那個感受是什麼。"
      - id: eft-empty-chair-s12-t06
        speaker: client
        text: "（眼裡有淚；對著椅子）我想要你說「做得好」。就這樣。只要「做得好」。一次。（聲音破了）我會記著那句話好多年。"
      - id: eft-empty-chair-s12-t07
        speaker: client
        text: "（他靜靜地哭了一會兒）"
      - id: eft-empty-chair-s12-d5
        type: choice
        prompt: "R 在椅子上靜靜地哭。你怎麼做？"
        options:
          - id: a
            text: "（遞上紙巾）沒關係。哭出來是好事。你做得很好。"
            fit: weak
            note: "它安慰他，還為他的哭打分數。他可能覺得被注視或被稱讚，也比他自己要的更早結束了這一刻。"
          - id: b
            text: "（沉默一會兒之後）我在這裡。不用急。"
            fit: strong
            note: "它讓沉默在，告訴他他不是一個人，也不必急。話越少越好。"
          - id: c
            text: "你現在感覺到什麼？"
            fit: workable
            note: "這是誠實的問題，R 也可能回答。但它要他把感受命名，可能把他拉出來。"
        actual: "（沉默一會兒之後）我在這裡。不用急。"
        rationale: "在會談中出現的哀傷不需要被處理。你的任務是留下，並說得很少。這是 R 第一次為父親哭。"
      - id: eft-empty-chair-s12-t08
        speaker: client
        text: "（擦眼睛）這是第一次。喪禮的時候什麼都沒有。（停頓）對不起。"
      - id: eft-empty-chair-s12-t09
        speaker: therapist
        text: "不用說對不起。慢慢來。"
      - id: eft-empty-chair-s12-d6
        type: choice
        prompt: "R 現在比較安靜了。你在想要不要邀請他聽聽父親的回答。你怎樣說？"
        options:
          - id: a
