        actual: "如果你願意，可以坐到他的椅子上，說出你想像他會回你什麼。或者我們留在這裡。你想怎樣？"
        rationale: "父親的回答可能打開一些東西，也可能關上一些東西。你從來不預先決定它該是什麼，並讓 R 選擇要不要去那裡。"
      - id: eft-empty-chair-s12-t10
        speaker: client
        text: "（停頓）我試試。（他移動。長長的沉默後，以父親的身分，慢慢地）我沒有……我們不說那種話。在我家裡。沒有人對我說過那樣的話。"
      - id: eft-empty-chair-s12-d7
