        actual: "也許他做不到，而你仍然需要。兩樣都是真的。關於他，你今天不必決定任何事。"
        rationale: "R 想像中的父親軟化了，這不會把任務變成原諒。你保留兩邊，讓決定保持敞開。"
      - id: eft-empty-chair-s12-t13
        speaker: client
        text: "（慢慢點頭）兩樣都是。（停頓）我還是生氣。（停頓）而且我想他。我沒想到會這樣。"
      - id: eft-empty-chair-s12-d9
        type: free
        prompt: "會談快結束。寫一到兩句話，結束椅子工作，並確認 R 現在怎樣，不替他總結。"
        actual: "我們就在這裡結束椅子。你想的話可以站起來。現在你在自己的椅子上，怎樣？"
        rationale: "你用簡單的方式結束任務，問的是他，不是父親。你沒有說他做了什麼，也沒有把它變成一個教訓。"
    notes:
      goals: "沒有改變。這項工作的目的從來不是處理好父親。R 說「我還是生氣」和「我想他」，兩樣都可以留下。"
      alliance: "情感連結：他第一次在你面前哭。任務：他選擇回到椅子，也選擇演出父親。下次問問，這之後的一個星期怎樣。"
      formulation_update: "對父親的原發適應性憤怒和哀傷。未滿足的需要，直接說出來：被告知他做得還可以（「做得好」，一次）。他想像中的父親「不知道怎麼說」。R 沒有原諒，也沒有說他會。我沒有去找它。羞愧和批評的聲音沒有消失，雙椅工作可能會回來。"
