        actual: "先停在他裡面一會兒。聽到兒子這樣說，他是什麼感覺？"
        rationale: "你在探索 R 想像中的父親，不是要他改變。你沒有要求道歉。"
      - id: eft-empty-chair-s12-t11
        speaker: client
        text: "（以父親的身分，很輕聲）我不知道。（停頓）我不知道怎麼說。"
      - id: eft-empty-chair-s12-t12
