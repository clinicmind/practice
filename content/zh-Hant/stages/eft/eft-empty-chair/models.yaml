eft-empty-chair-e01:
  model_response: "對。花一點時間，想像她坐在那裡。她怎樣坐著？在做什麼？準備好的時候，說出最先來的那句話。"
  why: "它先要求畫面，再要求第一句話，並沒有告訴他她是怎樣的人。"
  avoid: "「說出你一直想對她說的話。」它跳過了畫面。"
eft-empty-chair-e02:
  model_response: "沒關係。也許從一個你記得的地方開始。在你記得的某一刻，他在哪裡？讓他坐在那張椅子上。"
  why: "它從記憶給一個入口，畫面仍然是他的。它沒有說他看到什麼。"
  avoid: "「再努力想像一下。」它把困難變成他的錯。"
eft-empty-chair-e03:
  model_response: "她背對著你，在爐子前。在那裡停一會兒。站在那裡的她，你注意到什麼？"
  why: "它保留她的畫面，邀請她看得更多。它什麼都沒加。"
  avoid: "「她為什麼背對著你？」它要求解釋。"
eft-empty-chair-e04:
  model_response: "那種表情。為我描述一下。他那樣看著你的時候，臉上是什麼？"
  why: "它保留「那種表情」，並請他把它說成話。"
  avoid: "「是失望嗎？」它替他把表情命名了。"
eft-empty-chair-e05:
  model_response: "花一點時間看著她。然後說出你會先說的那句。不必是對的那句。"
  why: "它定下慢的步調，減輕開頭的壓力，也沒有建議字詞。"
  avoid: "「告訴她你很生氣。」它告訴她該感覺什麼。"
eft-empty-chair-e06:
  model_response: "你每次都在找他。你找的時候，想要什麼？告訴他。"
  why: "它保留「找你」，並問他想要什麼，用對父親說的話。"
  avoid: "「那一定很受傷。」它在談論感受，沒有邀請他對父親說。"
eft-empty-chair-e07:
  model_response: "負擔。你當時需要她怎樣？對她說。"
  why: "它反映她的字，從控訴走向需要。"
  avoid: "「你覺得她為什麼讓你有這種感覺？」它要求解釋。"
eft-empty-chair-e08:
  model_response: "沒有再見。你想對他說什麼，或想從他那裡聽到什麼？現在告訴他。"
  why: "它停在缺少的再見上，並問想要什麼，兩個方向都可以。"
  avoid: "「他大概不知道怎麼說。」它在解釋對方。"
eft-empty-chair-e09:
  model_response: "生氣。留在那裡。看著她，那份氣是關於什麼？告訴她。"
  why: "它停在憤怒上，問它在說什麼。它沒有讓他離開。"
  avoid: "「試著不要生氣。」它讓他離開那個感受。"
eft-empty-chair-e10:
  model_response: "你想要他為你驕傲。用你自己的話，完整地對他說。「我想要你……」"
  why: "需要已經在那裡。你幫他把它完整而直接地說出來。"
  avoid: "「他大概是驕傲的。」它在安慰，也拿走了那個需要。"
eft-empty-chair-m01:
  model_response: "你願意坐到她的椅子上，成為她一會兒嗎？那會是你對她的畫面，不是她本人。你也可以不要。"
  why: "它問了，說明那些話是他自己的想像，並給一個出口。"
  avoid: "「換椅子。當她。」這是命令，沒有目的，也沒有選擇。"
eft-empty-chair-m02:
  model_response: "先停在他裡面一會兒。他怎樣坐著？他怎樣看著他的兒子？說出他會說的話，用他會說的方式。"
  why: "它要求姿勢、眼神和聲音，讓父親更真，並沒有加任何東西。"
  avoid: "「他真正的感覺是什麼？」它要個案去解釋父親。"
eft-empty-chair-m03:
  model_response: "先停在她裡面。「我已經盡力了。」再說一次，用她會說的方式。她說的時候，臉上是什麼？"
  why: "它重複她的話，問語氣和神情，讓母親保持是個案看到的那樣。"
  avoid: "「你真的覺得她盡力了嗎？」它在評判母親，也離開了角色。"
eft-empty-chair-m04:
  model_response: "她看起來很累。先停在她裡面。現在被兒子這樣看著，她是什麼感覺？"
  why: "個案畫面裡的母親有了轉變。你跟著它，沒有決定它的意義。"
  avoid: "「所以她是在乎的。」它決定了意義。"
eft-empty-chair-m05:
  model_response: "他只會看著你。演給我看。如果你願意，坐到他的椅子上，給我那個眼神。"
  why: "它用他的話，並給他一個用演出代替描述的方式。「如果你願意」讓選擇在他。"
  avoid: "「那個眼神是什麼意思？」它要求詮釋。"
eft-empty-chair-m06:
  model_response: "什麼都好，卻什麼也沒有來。告訴他。「我需要你說……」你最需要他說什麼？"
  why: "它保留她的「什麼都好」，並要求具體的話，對他說。"
  avoid: "「他做不到。」它在解釋對方。"
eft-empty-chair-m07:
  model_response: "你很難過，他從來不了解你。告訴他，你想讓他知道什麼。"
  why: "它反映難過，並走向他希望可以說的話，用直接的話。"
  avoid: "「你覺得他會了解嗎？」它要他去猜。"
eft-empty-chair-m08:
  model_response: "想要點什麼。留在那裡。「我想要……」看看會來什麼，不清楚也沒關係。"
  why: "它接受模糊，並給一個句子開頭。它不推他給一個清楚的答案。"
  avoid: "「是愛嗎？是關注嗎？」它給了一份菜單。"
eft-empty-chair-m09:
  model_response: "你想要他注意到你。你有一部分說你不該需要這個，而你確實需要過。對他說：「我需要你注意到我。」"
  why: "它反映兩邊而沒有爭辯，並邀請用直接的話說出需要。"
  avoid: "「每個人都需要這個。」它一般化，也拿走了這一刻。"
eft-empty-chair-m10:
  model_response: "你要她說對不起。告訴她你要她說什麼，還有聽到那句話對你意味著什麼。"
  why: "它停在想要上，沒有承諾她會說。"
  avoid: "「也許她會說的。」它承諾了這個練習給不了的東西。"
eft-empty-chair-h01:
  model_response: "她確實沒辦法回答。這是一種把沒說的話說出來的方式，僅此而已。你可以說不，我們可以做別的。"
  why: "它同意真實的部分，說明任務是什麼、不是什麼，並把選擇留給他。"
  avoid: "「就算他們不在了也有用。」它在爭辯，也在承諾。"
eft-empty-chair-h02:
  model_response: "你不必看著他。你可以轉動椅子、閉上眼睛，或者停下來。由你決定。"
  why: "它馬上回應，並把控制還給個案。它給了三個出口。"
  avoid: "「你可以的，看著他。」它在推。"
eft-empty-chair-h03:
  model_response: "對父親這樣說話，感覺不對，就算現在也一樣。步調由你定，我們隨時可以停。"
  why: "它反映他說的，沒有討論習俗。選擇在他。"
  avoid: "「你父親會希望你坦率地說。」它在爭辯，還給了一條規則。"
eft-empty-chair-h04:
  model_response: "謝謝你肯試。我們不再去那裡了。先回到你自己，停一下。你現在怎樣？"
  why: "它尊重她的不，並確認她的狀態。它沒有要她解釋。"
  avoid: "「這很好，代表你靠近她了。」它稱讚了讓她痛的東西。"
eft-empty-chair-h05:
  model_response: "好，我們停。看看房間四周，感覺你的腳踩在地板上。我在這裡。你需要什麼步調，我們就用什麼步調。"
  why: "它馬上停下來，讓他穩下來，沒有再加問題。"
  avoid: "「讓它來，它會過去的。」它推翻了他。"
eft-empty-chair-h06:
  model_response: "你有一部分覺得自己應該已經走出來了。關於原諒，現在或以後，我們都不必決定什麼。你說這句話的時候，感覺到什麼？"
  why: "它拿住她的「應該」，沒有同意也沒有爭辯，並邀請她的經驗。"
  avoid: "「原諒可以讓人自由。」它在推向原諒。"
eft-empty-chair-h07:
  model_response: "沒有人要你原諒。我們就讓這句話是真的。說出來，是什麼感覺？"
  why: "它不爭辯，也不施壓。它問的是經驗。"
  avoid: "「試試看也許會有幫助。」它推向相反的方向，但仍然在推。"
eft-empty-chair-h08:
  model_response: "他給不了你。這是真的。說出來不是為了從他那裡得到，是讓你自己聽見它被說出來。我們可以繼續，也可以停在這裡。你想怎樣？"
  why: "它同意他給不了，誠實說出說它是為了什麼，並把選擇留下。"
  avoid: "「他在某個地方也許聽得到你。」它自己做了一個承諾。"
eft-empty-chair-h09:
  model_response: "把柔軟的話說出來很難。你可以繼續，也可以停在這裡。由你決定。"
  why: "它承認那個退後和眼淚，把兩者視為自然，並留下選擇。"
  avoid: "「這不傻。不要停。」它在爭辯，也在推。"
eft-empty-chair-h10:
  model_response: "你想念她。如果可以，在那裡停一會兒。不用急。"
  why: "它留在剛來到的哀傷裡，什麼都沒加。"
  avoid: "「這是健康的感受。」它給它貼了標籤。"
