slug: eft-empty-chair
version: 1.0.0
title: "未完成事件的空椅工作"
intro: "在情緒聚焦治療（EFT）裡，空椅工作的標記是未完成事件。個案對一位重要的人，帶著一份一直沒有解決的感受，談起那個人時仍然隱隱作痛。典型的徵象有「我從來沒有告訴他」「有太多話我沒有說」、一直縈繞的怨恨或思念，以及突然收起來：清喉嚨、開玩笑、轉換話題。對方可能還在世，也可能已經過世。對應的任務是空椅工作。個案想像對方坐在一張空椅子上，對那個人說話。如果有幫助，個案再換到另一張椅子，以個案想像中的對方說話，然後回來。目的不是原諒、和解，也不是改變對方。目的是讓個案說出沒有說的話，感受那裡有的東西，並說出自己曾經需要什麼。要不要原諒是個案的決定，你不推向它，也不推離它。說明任務是什麼、為了什麼，並讓個案很容易說不。個案不堪負荷、你們的關係還不夠穩、個案已經說不、沒有標記、或牽涉的關係有嚴重傷害而你沒有受過相關訓練和督導的時候，不要提出它。如果個案看來有風險，先把任務放下，依實習機構的守則處理，並聯絡督導。個案如果提起家庭責任或習俗，你就像對待其他內容一樣反映它，不要把會談變成對它的討論。在這個模組，個案 R 在第十次和第十二次會談，對他過世的父親說話。你會練習兩項技能：喚起對方，也就是幫個案讓對方足夠真切，可以對他說話；以及表達需要，也就是幫個案用直接的話，說出他或她曾經需要或現在需要什麼。"
skills:
  - evoking-the-other
  - need-expression
reflection_prompts:
  - id: eft-empty-chair-r1
    text: "第十二次會談，R 說：「也許他做不到。那不代表這樣就沒事了。」你在哪些時候，可能會想把個案引向理解或原諒？那會是為了個案，還是為了你？"
  - id: eft-empty-chair-r2
    text: "空椅工作請個案說：「我需要你……」想像你對自己生命裡的某個人說這句話。你裡面發生什麼？你會怎樣讓它停下來？"
  - id: eft-empty-chair-r3
    text: "寫下三個徵象，顯示個案還不應該做空椅工作，即使「沒說出口的話」存在。每一種情況下，你會改為怎樣做？"
