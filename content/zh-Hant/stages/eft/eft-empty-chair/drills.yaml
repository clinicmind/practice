# 30 題練習：每個級別 10 題，每個級別每項技能 5 題。
# 標記是未完成事件。除非情境另有說明，每一題的個案都已同意嘗試這項任務。
# 任務從來不是為了原諒或和解。示範回應不推向任何一邊。

- id: eft-empty-chair-e01
  level: easy
  skill: evoking-the-other
  context: "個案已同意試試和他已故母親的空椅工作。任務：寫一到三句話，幫個案讓她在椅子上在場。"
  client: "好。我要做什麼？就是……對著椅子說話？"
  criteria: &eo_easy
    - "幫個案讓對方在椅子上在場：想像、看著，或開始對他或她說話。"
    - "用個案自己的話，不告訴個案對方是怎樣的人，也不告訴個案要說什麼。"
    - "一到三句短句。"
- id: eft-empty-chair-e02
  level: easy
  skill: evoking-the-other
  context: "個案已同意試試。任務：寫一到三句話，幫個案讓他的父親在椅子上在場。"
  client: "（看著椅子）我看不到他。那只是一張椅子。"
  criteria: *eo_easy
- id: eft-empty-chair-e03
  level: easy
  skill: evoking-the-other
  context: "個案正在想像母親在椅子上。任務：寫一到三句話，幫她留在那個畫面裡。"
  client: "她在廚房。站在爐子前，背對著我。她以前總是這樣。"
  criteria: *eo_easy
- id: eft-empty-chair-e04
  level: easy
  skill: evoking-the-other
  context: "個案正看著椅子。任務：寫一到三句話，幫他描述他看到的。"
  client: "（看著椅子）他臉上有那種表情。那種表情。"
  criteria: *eo_easy
- id: eft-empty-chair-e05
  level: easy
  skill: evoking-the-other
  context: "個案已想像父親在椅子上。任務：寫一到兩句話，邀請她開始對他說話。"
  client: "好。他在了。（停頓）我要從哪裡開始？"
  criteria: *eo_easy

- id: eft-empty-chair-e06
  level: easy
  skill: need-expression
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話，幫他從發生了什麼，走到他想要什麼，用對那個人說的話。"
  client: "（對著椅子）我的比賽你一次都沒來。一次也沒有。我每次都在找你。"
  criteria: &ne_easy
    - "幫個案從發生了什麼、或對方做了什麼，走到他或她想要或需要什麼，用對那個人說的話。"
    - "用個案自己的話，不替個案把需要命名。"
    - "一到三句短句。"
- id: eft-empty-chair-e07
  level: easy
  skill: need-expression
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話，幫她說出她需要什麼。"
  client: "（對著椅子）你總是讓我覺得我是個負擔。"
  criteria: *ne_easy
- id: eft-empty-chair-e08
  level: easy
  skill: need-expression
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話。"
  client: "（對著椅子）你走了，連再見也沒說。"
  criteria: *ne_easy
- id: eft-empty-chair-e09
  level: easy
  skill: need-expression
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話。"
  client: "（對著椅子）我好氣你。"
  criteria: *ne_easy
- id: eft-empty-chair-e10
  level: easy
  skill: need-expression
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話，幫他把話完整、直接地說出來。"
  client: "（對著椅子）我只是想要你為我感到驕傲。"
  criteria: *ne_easy

- id: eft-empty-chair-m01
  level: medium
  skill: evoking-the-other
  context: "個案對她的父親說了一會兒，然後停了。任務：寫出你怎樣邀請她，如果她願意，以對方的身分說話。說明那是她自己的畫面，她可以說不。"
  client: "（對著椅子）你從來不聽。（停下）他只會說「我很忙」。他一直都是這樣。"
  criteria: &eo_medium
    - "幫個案用自己對那個人的畫面演出對方：聲音、姿勢、話語。"
    - "說清楚這是個案自己對對方的想像，個案可以說不或退後。"
    - "簡短，不把話放進對方嘴裡。"
- id: eft-empty-chair-m02
  level: medium
  skill: evoking-the-other
  context: "個案現在坐在另一張椅子上，以他的父親說話。任務：寫一到兩句話，讓父親更在場。"
  client: "（以父親的身分，聳聳肩）我不知道。"
  criteria: *eo_medium
- id: eft-empty-chair-m03
  level: medium
  skill: evoking-the-other
  context: "個案以她的母親說話。任務：寫一到兩句話。"
  client: "（以母親的身分）我已經盡力了。你要我說什麼？"
  criteria: *eo_medium
- id: eft-empty-chair-m04
  level: medium
  skill: evoking-the-other
  context: "個案以對方的身分說話，有些東西轉變了。任務：寫一到兩句話。"
  client: "（以母親的身分，輕聲）你……你看起來很累。我從來沒有注意到。"
  criteria: *eo_medium
- id: eft-empty-chair-m05
  level: medium
  skill: evoking-the-other
  context: "個案對父親說完話，回到自己的椅子上。任務：寫一到兩句話，幫他演出父親會怎樣回應。"
  client: "他什麼都不會說。他只會看著我。"
  criteria: *eo_medium

- id: eft-empty-chair-m06
  level: medium
  skill: need-expression
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話。"
  client: "（對著椅子）我需要你說點什麼。什麼都好。（停頓）可是你不肯。"
  criteria: &ne_medium
    - "用個案自己的話，反映個案剛表達的需要或感受。"
    - "幫個案用「我」的話直接對那個人說，不趕著帶向對方的回應，也不趕著帶向原諒。"
    - "簡短。"
- id: eft-empty-chair-m07
  level: medium
  skill: need-expression
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話。"
  client: "（對著椅子，輕聲）我很難過，你從來不了解我。"
  criteria: *ne_medium
- id: eft-empty-chair-m08
  level: medium
  skill: need-expression
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話。"
  client: "（對著椅子）我想要……我不知道。我就是想要點什麼。"
  criteria: *ne_medium
- id: eft-empty-chair-m09
  level: medium
  skill: need-expression
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話。"
  client: "（對著椅子）我想要你注意到我。（搖頭）可是我不該需要這個。我是個成年男人了。"
  criteria: *ne_medium
- id: eft-empty-chair-m10
  level: medium
  skill: need-expression
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話。不要承諾對方會說。"
  client: "（對著椅子）我要你說你對不起。"
  criteria: *ne_medium

- id: eft-empty-chair-h01
  level: hard
  skill: evoking-the-other
  context: "你已提出空椅工作。任務：寫一到兩句話。先回應個案剛說的，再多說任務。"
  client: "她死了。對著一張椅子說話有什麼意義？"
  criteria: &eo_hard
    - "先回應個案剛說或剛做的（懷疑、拒絕、痛苦），再說任何關於任務的話。"
    - "讓個案保持主導：個案可以說不、離開或停止，你不推、不替對方說話、也不推向和解。"
    - "簡短。"
- id: eft-empty-chair-h02
  level: hard
  skill: evoking-the-other
  context: "個案正看著空椅子。任務：寫一到兩句話。回應剛發生的事。"
  client: "（對著椅子，突然別過頭）我不行。我沒辦法看著他。"
  criteria: *eo_hard
- id: eft-empty-chair-h03
  level: hard
  skill: evoking-the-other
  context: "個案已同意試試，並一直在對父親說話。任務：寫一到兩句話。先回應個案說的，再繼續。"
  client: "在我家裡，不能這樣跟父親說話。就算現在也不行。就算是對著一張椅子也不行。"
  criteria: *eo_hard
- id: eft-empty-chair-h04
  level: hard
  skill: evoking-the-other
  context: "個案剛以對方的身分說完話。任務：寫一到兩句話。回應個案說的。"
  client: "（回到自己的椅子）那感覺很糟。太真了。我不想再當她了。"
  criteria: *eo_hard
- id: eft-empty-chair-h05
  level: hard
  skill: evoking-the-other
  context: "個案正在對椅子上的人說話。任務：寫一到兩句話。回應剛發生的事。"
  client: "（啜泣）我喘不過氣。我想停。"
  criteria: *eo_hard

- id: eft-empty-chair-h06
  level: hard
  skill: need-expression
  context: "個案剛對那個人說了話。任務：寫一到兩句話。不推向也不推離原諒。"
  client: "我應該原諒他的。好人都會這樣。我想我現在應該已經走出來了。"
  criteria: &ne_hard
    - "先回應剛發生的事（想原諒、拒絕、無法被滿足的需要、哀傷來了），再要求更多。"
    - "不推個案去原諒，也不推個案不原諒，也不趕。"
    - "簡短，選擇留給個案。"
- id: eft-empty-chair-h07
  level: hard
  skill: need-expression
  context: "個案剛對那個人說了話。任務：寫一到兩句話。"
  client: "我永遠不會原諒她。你不用問我。"
  criteria: *ne_hard
- id: eft-empty-chair-h08
  level: hard
  skill: need-expression
  context: "個案一直在對他已故的父親說話。任務：寫一到兩句話。"
  client: "他永遠給不了我需要的。他已經死了。說出來有什麼用？"
  criteria: *ne_hard
- id: eft-empty-chair-h09
  level: hard
  skill: need-expression
  context: "個案一直在對椅子上的人說話，開始哭了。任務：寫一到兩句話。"
  client: "（含淚微笑）他會說我太軟弱。（笑）我該停了。這很傻。"
  criteria: *ne_hard
- id: eft-empty-chair-h10
  level: hard
  skill: need-expression
  context: "個案一直在對她已故的母親說話。任務：寫一到兩句話。"
  client: "（很輕聲）我想我想念她。"
  criteria: *ne_hard
