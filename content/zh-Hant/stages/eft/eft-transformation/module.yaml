slug: eft-transformation
version: 1.0.0
title: "困惑的反應，以及用情緒轉化情緒"
intro: "在情緒聚焦治療（EFT）裡，系統性喚起展開的標記是困惑的反應。個案描述一個他或她自己也不明白的反應：「我不知道我為什麼會那樣反應」「反應大得不成比例」。這個反應通常是最近的，而且連著一個特定的時刻，個案的困惑是真的，不是在抱怨或辯護。對應的任務是系統性喚起展開。你幫個案慢慢重建場景，用現在式：他在哪裡、誰在場、他看到和聽到什麼。然後你停在反應的那一刻：他身體注意到什麼、他想做什麼、他說了什麼。最後，你幫他用自己的話，找到那個時刻對他意味著什麼。你不詮釋，也不替他說出意義。個案其實已經明白那個反應、個案不堪負荷、個案說不、時間不夠，或場景牽涉嚴重傷害而你沒有受過相關訓練和督導的時候，不要提出這項任務。如果個案看來有風險，先把任務放下，依實習機構的守則處理，並聯絡督導。這個模組也呈現整個階段怎樣連起來。EFT 透過用情緒轉化情緒來工作：一種痛苦、卡住的感受不是被說服走開，而是去觸及並感受另一種感受，常常是原發適應情緒，例如哀傷或憤怒，它給個案新的立足點。你的個案概念化是你自己的工作圖像，用四類情緒和未滿足的需要。你用平實的話，並以猜測的方式提供給個案。在這個模組，個案 R 在第十三次會談，重建星期天早上兒子打翻牛奶的那一刻；第十六次，也是最後一次，你看到什麼改變了、什麼才剛開始。你會練習兩項技能：重建場景，以及意義橋接，也就是幫個案用自己的話，把反應和那個時刻對他的意義連起來。"
skills:
  - scene-rebuilding
  - meaning-bridge
reflection_prompts:
  - id: eft-transformation-r1
    text: "R 發現他吼出來的那句話是他父親的。想一次你自己有過、令你意外的反應。如果你把它慢慢重放，你覺得會發現什麼？"
  - id: eft-transformation-r2
    text: "第十三次會談裡，意義來自 R，你只是問。留意你什麼時候想向個案解釋他或她的反應。這給了你什麼，又從個案那裡拿走了什麼？"
  - id: eft-transformation-r3
    text: "用你自己的話寫出 R 的個案概念化，用模組二的四類情緒：什麼是次級的、什麼是原發不適應的、什麼是原發適應的，以及它們底下的未滿足需要是什麼。然後寫出你會怎樣用平實的話對 R 說，不用這些術語。"
