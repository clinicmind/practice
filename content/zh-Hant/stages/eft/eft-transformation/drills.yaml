- id: eft-transformation-h01
  level: hard
  skill: scene-rebuilding
  context: "個案描述了一個困惑的反應，你在想要不要提出任務。任務：寫一到兩句話。先回應個案剛說的。"
  client: "這件事我已經想過一百遍了。我很清楚是為什麼。我又累又有壓力。我們不要再談了。"
  criteria: &sr_hard
    - "先回應個案剛說或剛做的（解釋、拒絕、被淹沒、空白、懷疑），再說任何關於任務的話。"
    - "讓個案保持主導：個案可以說不、離開那一刻或停止，你不推。"
    - "簡短。"
