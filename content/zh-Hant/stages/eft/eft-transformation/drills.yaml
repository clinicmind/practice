# 30 題練習：每個級別 10 題，每個級別每項技能 5 題。
# 標記是困惑的反應。示範回應從不向個案解釋那個反應。意義必須來自個案。

- id: eft-transformation-e01
  level: easy
  skill: scene-rebuilding
  context: "標記「困惑的反應」存在，個案已同意回到那一刻。任務：寫一到兩句話，用現在式帶個案回到那一刻。"
  client: "我在教職員會議上對同事發了脾氣。她只是問了時間表。我不明白為什麼我反應這麼大。"
  criteria: &sr_easy
    - "邀請個案回到一個特定的時刻，用現在式，而不是一般的描述。"
    - "請求一件具體的事：個案在哪裡、誰在場，或看到或聽到什麼。"
    - "一到兩句短句。不問為什麼，不詮釋。"
