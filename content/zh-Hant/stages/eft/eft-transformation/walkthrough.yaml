sessions:
  - id: eft-transformation-s13
    title: "第 13 次會談：「牛奶」"
    turns:
      - id: eft-transformation-s13-t01
        speaker: client
        text: "（重重坐下）星期天早餐。我兒子打翻了他的牛奶。連一整杯都不是。然後我吼了。我是說真的吼，鄰居可能都聽到了。他整個人僵住了。（停頓）我不明白。那只是牛奶。我不明白為什麼會那麼大。"
      - id: eft-transformation-s13-d1
        type: choice
        prompt: "R 描述一次令他意外的吼叫，說他不明白。你怎樣回應？"
        options:
          - id: a
            text: "累的時候發脾氣是很自然的。星期天你很累嗎？"
            fit: weak
            note: "它把那個反應解釋掉了，而這也許是真的。R 說他不明白，你在他看之前就把問題關上了。"
          - id: b
            text: "一杯牛奶，和一聲讓你自己都意外的吼叫。你想明白它。我想和你慢慢走過那一刻，一步一步，像你回到了餐桌那裡。你可以說不，我們隨時可以停。你想試試嗎？"
            fit: strong
            note: "它反映那份困惑，說明任務是什麼，並給一個真正的選擇。一位想要明白的個案，很可能會說好。"
          - id: c
            text: "牛奶打翻的時候，你腦子裡想到什麼？"
            fit: workable
            note: "這是個好問題。R 很可能說「沒有」，你就從他的想法開始，而不是從場景開始。"
        actual: "一杯牛奶，和一聲讓你自己都意外的吼叫。你想明白它。我想和你慢慢走過那一刻，一步一步，像你回到了餐桌那裡。你可以說不，我們隨時可以停。你想試試嗎？"
        rationale: "標記是困惑的反應：最近的、連著一個時刻的，而且個案真的不明白。你說明你會做什麼、為什麼，也讓他很容易說不。"
      - id: eft-transformation-s13-t02
        speaker: client
        text: "（聳聳肩）好。開始吧。"
      - id: eft-transformation-s13-d2
        type: free
        prompt: "R 同意了。寫出你說的第一句話，用現在式，帶他回到那一刻。"
        actual: "我們回到星期天早上。你在餐桌旁。你坐在哪裡？"
        rationale: "你用現在式，問一件具體的事。「你坐在哪裡」很容易回答，也開始了場景，沒有要求任何感受。"
      - id: eft-transformation-s13-t03
        speaker: client
        text: "廚房。我在平常的位置，窗邊。吐司。收音機開著，很小聲。我兒子在對面。我太太在流理台前，背對著我們。"
      - id: eft-transformation-s13-d3
        type: choice
        prompt: "R 已經把場景擺好了。你接著說什麼？"
        options:
          - id: a
            text: "然後牛奶打翻了。你有什麼感覺？"
            fit: weak
            note: "它跳到反應，並要求一個感受。場景才剛建好。R 會從記憶回答，不是從餐桌回答。"
          - id: b
            text: "你在窗邊的餐桌旁。吐司，收音機很小聲，你兒子在對面。接下來發生什麼，照你看到的次序說。"
            fit: strong
            note: "它用他的話重複他的畫面，並請他按發生的次序繼續。場景保持是活的。"
          - id: c
            text: "牛奶打翻之前，你在想什麼？"
            fit: workable
            note: "它問的是之前那一刻，這可能重要。但它要的是想法，而 R 很擅長給想法。"
        actual: "你在窗邊的餐桌旁。吐司，收音機很小聲，你兒子在對面。接下來發生什麼，照你看到的次序說。"
        rationale: "重建場景是故意放慢的。R 能看到、聽到房間裡越多東西，那個反應就會跟著出來越多。"
      - id: eft-transformation-s13-t04
        speaker: client
        text: "他伸手去拿果醬。手肘碰到杯子。我看著它倒下去。白色的，在桌上，在他的袖子上，在地上。（停頓）然後我站起來了。我站起來了。"
      - id: eft-transformation-s13-d4
        type: free
        prompt: "R 說他站起來了。寫出一句簡短的回應，在這一刻放慢他，問他注意到什麼。"
        actual: "你站起來了。就停在這裡一會兒。你注意到什麼，在你的身體裡，也在房間裡？"
        rationale: "這是反應發生的那一刻。你放慢他，問的是他注意到什麼，不是為什麼。他的身體和房間，有解釋它的細節。"
      - id: eft-transformation-s13-t05
        speaker: client
        text: "我的臉發熱。下巴。（停頓）他整個人靜止了。他在看桌子，沒有看我。（停頓）然後我聽到自己。（很輕聲）「你就不能把事情做好嗎？」（長長的停頓）「你就不能把事情做好嗎。」（抬頭）我認得這句話。"
      - id: eft-transformation-s13-d5
        type: choice
        prompt: "R 說他認得這句話。你怎樣說？"
        options:
          - id: a
            text: "這聽起來像你父親的聲音。你變成他了，是不是？"
            fit: weak
            note: "它把意義告訴他，還加上一個嚴厲的判斷。他可能同意然後覺得羞愧，也可能拒絕。無論如何，那是你的發現，不是他的。"
          - id: b
            text: "你認得這句話。在這裡停一會兒。你是從哪裡認得它的？"
            fit: strong
            note: "它留在他說的話上，給他時間，並問一個開放的問題。如果答案是他父親，那會是他自己說的。"
          - id: c
            text: "聽到自己說出這句話，你身體是什麼感覺？"
            fit: workable
            note: "它停在經驗上，這有用。但他剛剛認出了一些東西，這個問題把他從那裡拉開。"
        actual: "你認得這句話。在這裡停一會兒。你是從哪裡認得它的？"
        rationale: "通往意義的橋，是從個案自己的認出開始。你不說那是誰的聲音。你為他留出空間，讓他自己說。"
      - id: eft-transformation-s13-t06
        speaker: client
        text: "（長長的停頓）我爸。在餐桌上。我九歲的時候，打翻了一碗湯。他沒有吼。他從來不吼。他說了這句。很輕聲地。「你就不能把事情做好嗎。」（短笑；聲音變薄）然後我們安靜地把飯吃完。"
      - id: eft-transformation-s13-d6
        type: choice
        prompt: "R 找到了一個記憶和那句話。你怎樣說？"
        options:
          - id: a
            text: "所以你是在重複你父親對你做的事。這就解釋了。"
            fit: weak
            note: "它用一個解釋把問題關上了，也把 R 變成一個案例。他沒有說他在重複任何事。"
          - id: b
            text: "你九歲，在餐桌上，湯灑在地上。而星期天，你兒子在餐桌上，牛奶灑了。把這兩幕放在一起看，是什麼感覺？"
            fit: strong
            note: "它用他的話把兩個場景放在一起，並邀請他看。這是邀請，不是結論，R 可以說出它意味著什麼。"
          - id: c
            text: "那個九歲的孩子聽到那句話的時候，有什麼感覺？"
            fit: workable
            note: "它進入舊的場景，這也許之後值得做。但它在他連起兩者之前，就離開了星期天的反應。"
        actual: "你九歲，在餐桌上，湯灑在地上。而星期天，你兒子在餐桌上，牛奶灑了。把這兩幕放在一起看，是什麼感覺？"
        rationale: "意義橋接，是把兩塊東西放在一起，讓個案自己找到連結。你只用 R 給你的東西，問的是那是什麼感覺，不是那意味著什麼。"
      - id: eft-transformation-s13-t07
        speaker: client
        text: "（慢慢地）牛奶打翻的時候，我不是在生他的氣。我九歲。我在等那句話。（停頓）然後我就說了。在它從別人那裡來之前。（他的手微微發抖）"
      - id: eft-transformation-s13-d7
        type: free
        prompt: "R 剛剛做出連結，他的手在抖。寫一到兩句話，留在他找到的東西上，不詮釋、不解釋、不修補。"
        actual: "你又回到九歲，等著那句話，而出來的就是那句話。在這裡停一會兒。"
        rationale: "你把他的話按次序還給他，並留出空間。意義是他的。如果你解釋它，它就變成你的。"
      - id: eft-transformation-s13-t08
        speaker: client
        text: "（過了一會兒）我嚇到他了。（停頓）我做的就是這個。我讓他怕我。"
      - id: eft-transformation-s13-d8
        type: choice
        prompt: "R 很震動，大約還剩十分鐘。你怎麼做？"
        options:
          - id: a
            text: "這是真正的突破。我們用剩下的時間，探索你父親在這一切裡扮演什麼角色。"
            fit: weak
            note: "它稱讚這個發現，並繼續探索。R 很震動，他剛說出口的內疚需要空間。"
          - id: b
            text: "這很難看見。而你看見了。我們慢下來。你現在怎樣？剩下的時間，什麼對你有幫助？"
            fit: strong
            note: "它承認那份內疚，沒有減輕也沒有加深，確認他的狀態，並和他一起掌握步調。"
          - id: c
            text: "我們用剩下的時間，想想下次你可以怎樣不同地對待你兒子。"
            fit: workable
            note: "這很實際，之後也有用。但現在它把他帶到解決方法，而他還在震動中。"
        actual: "這很難看見。而你看見了。我們慢下來。你現在怎樣？剩下的時間，什麼對你有幫助？"
        rationale: "一個發現可能帶來內疚。你不和它爭辯，也不把它放大。你放慢，照顧他。"
    notes:
      goals: "他說的目標「脾氣不要那麼差」沒有改變。他現在明白了一部分，而這份明白不是別人給他的。"
      alliance: "情感連結：他留在一個痛苦的場景裡，並說出他發現的。任務：他接受了慢慢重放。下次問問，這個星期他和兒子相處得怎樣，還有他的內疚。"
      formulation_update: "對兒子的吼叫是次級憤怒。底下是一個九歲、在等那句話的孩子，那是原發不適應的羞愧（那句話說他不夠好）。R 自己找到了連結。椅子工作裡的適應性哀傷和憤怒，還沒有被帶進這個場景。我沒有向他說出這些。"
  - id: eft-transformation-s16
    title: "第 16 次會談：「最後一次」"
    turns:
      - id: eft-transformation-s16-t01
        speaker: therapist
        text: "R，你好。這是我們最後一次會談。你怎樣？"
      - id: eft-transformation-s16-t02
        speaker: client
        text: "（坐下）好。好多了。（停頓）我在試著不要說「還好」。（微笑）星期二。這次是麥片。他打翻了碗。我感覺到它上來，那股熱。而且我聽到它要來了。那句話。我把兩手平放在桌上。我說：「沒事。去拿塊抹布。」我的聲音在抖。但我說的就是這個。"
      - id: eft-transformation-s16-d1
        type: choice
        prompt: "R 告訴你星期二的事。你怎樣說？"
        options:
          - id: a
            text: "太好了。你真的掌握了。"
            fit: weak
            note: "它稱讚，並宣告他掌握了。那把聲音還在，如果它回來，R 可能覺得自己失敗了。"
          - id: b
            text: "你聽到那句話要來了，然後把兩手平放在桌上。那一刻是什麼感覺？"
            fit: strong
            note: "它保留他自己的細節，並問經驗。它讓他告訴你這個改變是怎樣發生的。"
          - id: c
            text: "你覺得這次是什麼讓它成為可能？"
            fit: workable
            note: "這是合理的問題，他會給一個原因。感受的那一刻就排在第二位。"
        actual: "你聽到那句話要來了，然後把兩手平放在桌上。那一刻是什麼感覺？"
        rationale: "會談以外發生的改變，正是這項工作的目的。你不把它說成進步。你請他告訴你那是什麼感覺，因為你會在那裡聽到什麼改變了。"
      - id: eft-transformation-s16-t03
        speaker: client
        text: "（停頓）像站在邊緣。我兩邊都感覺到。餐桌旁的男孩，和在吼的那個。我想：「今天不要。」（停頓）我不會說那是平靜。比較像是，我知道是誰在說話。"
      - id: eft-transformation-s16-d2
        type: free
        prompt: "R 說他「知道是誰在說話」。寫出一句回應，幫他用自己的話說出現在有什麼不同。不要告訴他答案。"
        actual: "你知道是誰在說話。對你來說，知道這件事意味著什麼？"
        rationale: "這是對改變的意義橋接。你用他的話，問它意味著什麼。答案用他的語言說，會比用你的語言好。"
      - id: eft-transformation-s16-t04
        speaker: client
        text: "（慢慢地）意味著它是舊的。是一把舊的聲音。它不是關於牛奶，也不是關於他。（停頓）而我不必服從它。我不是說我不會。但我不必。"
      - id: eft-transformation-s16-t05
        speaker: client
        text: "半夜改作業的那把聲音，還在。上星期我對它說：「夠了。我聽到了。」說出聲來。在車裡。（笑）它安靜了一會兒。"
      - id: eft-transformation-s16-d3
        type: choice
        prompt: "R 告訴你他回應了那把批評的聲音。你怎樣說？"
        options:
          - id: a
            text: "這是很大的進步。如果你一直這樣做，那把聲音就會消失。"
            fit: weak
            note: "它承諾那把聲音會消失。它也許不會，如果它回來，R 會把它當作失敗。"
          - id: b
            text: "你對那把聲音說「夠了」。對它說這句話，是什麼感覺？"
            fit: strong
            note: "它重複他的話，並問經驗。它讓他說出這句話做了什麼。"
          - id: c
            text: "你想讓那把聲音知道什麼？"
            fit: workable
            note: "它延續與那把聲音的對話，也可能得到好的答案。但它把他從剛剛做的事上帶開一步。"
        actual: "你對那把聲音說「夠了」。對它說這句話，是什麼感覺？"
        rationale: "R 像被批評的那一部分可以做的那樣，回應了批評者。你不稱讚它。你問經驗，那會顯示這個改變是什麼感覺。"
      - id: eft-transformation-s16-t06
        speaker: client
        text: "（停頓）像是我站在自己這一邊。就一下子。很奇怪。我不知道我可以這樣做。"
      - id: eft-transformation-s16-t07
        speaker: client
        text: "（看著你）所以我們現在在哪裡？好了嗎？"
      - id: eft-transformation-s16-d4
        type: free
        prompt: "R 問：「好了嗎？」寫出一個簡短、誠實、用平實語言的回答。不用專業術語，不承諾結果。說出什麼改變了、什麼才剛開始，並把最後一句話留給 R。"
        actual: "有些改變了。你更早抓到吼叫，你也聽得到那把聲音，並回應它。有些才剛開始：對你父親的難過，你才剛讓它進來。而那把聲音還在。還沒有結束，這不是失敗。你怎麼看？"
        rationale: "這是你的個案概念化，用平實的話說，並以猜測的方式提供。它誠實說出部分的改變，說出未完成的東西，也不用標籤。最後的問題讓 R 說最後一句話。"
      - id: eft-transformation-s16-t08
        speaker: client
        text: "（點頭）聽起來是對的。（停頓）我想他，你知道嗎。比我想的還多。我沒想到會這樣。"
      - id: eft-transformation-s16-d5
        type: choice
        prompt: "R 說他想念父親，比他以為的還多。你怎樣說？"
        options:
          - id: a
            text: "這是哀傷浮現了。這是健康的跡象。"
            fit: weak
            note: "它給感受貼標籤，還為它打分數。他說的是簡單而真實的話，你把它變成了成果。"
          - id: b
            text: "你想念他，比你預料的還多。這不必整理清楚。它可以就這樣在那裡。"
            fit: strong
            note: "它保留他的話，並減輕壓力。它告訴他這份感受可以保持未完成。"
          - id: c
            text: "你想多說一些想念他的事，還是現在先放著？"
            fit: workable
            note: "它給一個選擇。在最後一次會談，它可能打開一些沒有時間關上的東西。"
        actual: "你想念他，比你預料的還多。這不必整理清楚。它可以就這樣在那裡。"
        rationale: "哀傷才剛開始。治療的結束不是它的結束，你今天不需要把它做完。"
      - id: eft-transformation-s16-d6
        type: free
        prompt: "是時候結束了。寫一段簡短的結語：肯定 R 做的工作，說他隨時可以回來，也不承諾他「好了」。"
        actual: "你來的時候想要方法，而你做了更難的事。你看了牛奶、那把聲音，還有你父親。這還沒有結束，而你現在知道這些感受在哪裡。如果你想回來，歡迎。"
        rationale: "好的結束，用個案自己的話說出他做的工作，誠實說出還剩下什麼，並讓門保持敞開。"
      - id: eft-transformation-s16-t09
        speaker: client
        text: "（站起來，微笑）我始終沒有拿到我的呼吸練習。（停頓）我想我對這樣也可以。"
    notes:
      goals: "部分達成。吼叫少了很多，R 聽得到它要來了。沒有達成：半夜那把聲音沒有消失，他也不期待它消失。"
      alliance: "情感連結：很強。任務：他來的時候想要方法，結束時說他沒有也可以。目標：為結案談妥，門保持敞開。"
      formulation_update: "結果：部分改善。對兒子的次級憤怒大幅減少。原發不適應的羞愧（「不夠好」，用他父親的那句話）被認出並被回應（「夠了。我聽到了」），沒有被移除。對父親的原發適應性哀傷已經開始。未滿足的需要，被告知「做得好」，現在已不可能由他父親滿足，而 R 已開始自己去滿足它（「站在自己這一邊」）。沒有原諒，也沒有去追求它。"
