eft-transformation-e01:
  model_response: "我們回到那場會議。你在會議室裡。你坐在哪裡？桌邊還有誰？"
  why: "現在式，一個場景，一個容易的開頭問題。它沒有問任何感受。"
  avoid: "「你覺得你為什麼發脾氣？」它要求解釋。"
eft-transformation-e02:
  model_response: "我們回到那通電話。你拿著手機。你在哪裡？你聽到什麼？"
  why: "它把她放進那一刻，問她在哪裡、聽到什麼。"
  avoid: "「這說明你們的關係怎樣？」它跳到意義。"
eft-transformation-e03:
  model_response: "你正經過麵包店。你面前有什麼？你看到什麼，或聞到什麼？"
  why: "它問的是在那個確切位置的感官。"
  avoid: "「麵包讓你想到什麼？」它給了一個方向。"
eft-transformation-e04:
  model_response: "我們回到昨晚。你在房間裡，手機在你手上。你在哪裡？剛剛發生了什麼？"
  why: "它把他放在房間裡，並問他扔出去之前那一刻。"
  avoid: "「你一定壓力很大。」它在解釋。"
eft-transformation-e05:
  model_response: "你在那個房間裡，你的主管說「做得好」。你站在哪裡？她的臉是什麼樣子？"
  why: "它從那句讚美開始，問她看到什麼。"
  avoid: "「你是不是很難接受讚美？」它在詮釋。"
eft-transformation-e06:
  model_response: "那支紅筆，你覺得自己很渺小。那支紅筆，是關於什麼？"
  why: "它用她的細節和她的話，問一個開放的問題。"
  avoid: "「以前有老師用紅筆對你嗎？」它在引導。"
eft-transformation-e07:
  model_response: "他說「隨便」就走開了，就是那時候你失控了。那是關於什麼？"
  why: "它保留他的次序，問那個時刻是關於什麼。"
  avoid: "「你覺得被輕視嗎？」它說出了意義。"
eft-transformation-e08:
  model_response: "她沒有看你，就是這樣。她沒有看你的時候，對你來說那是什麼？"
  why: "它停在細節上，問那對她來說是什麼。"
  avoid: "「你覺得自己是隱形的。」它在告訴她。"
eft-transformation-e09:
  model_response: "「你總是這樣」，有些東西掉下去了。那句話裡，對你來說有什麼？"
  why: "它重複那句話和那個感受，問裡面有什麼。"
  avoid: "「那讓你覺得被批評嗎？」它替她選了字。"
eft-transformation-e10:
  model_response: "房間安靜了，你想消失。大家都看著你，那是關於什麼？"
  why: "它用他的話，問被看著意味著什麼。"
  avoid: "「你是不是很在意別人怎麼想？」它一般化了。"
eft-transformation-m01:
  model_response: "我們放慢，就在之前。你還好好的，然後有些事發生了。在你開始吼之前，你最後看到或聽到的是什麼？"
  why: "它在之前那一刻放慢他，並問一個感官細節。"
  avoid: "「是什麼讓你生氣？」它要求原因。"
eft-transformation-m02:
  model_response: "她把表格遞給你，你看到那支紅筆。就停在那裡。你看到它的時候，身體注意到什麼？"
  why: "它保留現在式，把他停在確切的那一刻，並問身體。"
  avoid: "「紅筆對你意味著什麼？」它跳到意義。"
eft-transformation-m03:
  model_response: "你在門口，看到他和他們在笑。在那裡停一會兒。你看到什麼？你裡面發生什麼？"
  why: "它留在他說的那一刻，問他看到和感覺到什麼。"
  avoid: "「你接著說了什麼？」它越過了關鍵的那一刻。"
eft-transformation-m04:
  model_response: "他說：「你真的以為那樣行得通嗎？」而你覺得熱。你在哪裡感覺到它？"
  why: "它停在那句話和那股熱上，問位置。"
  avoid: "「你是生氣還是羞愧？」它給了一份菜單。"
eft-transformation-m05:
  model_response: "大家都在看，你的手在抖。在你的手那裡停一會兒。你注意到什麼？"
  why: "它挑出身體的細節，問他注意到什麼。"
  avoid: "「你的手為什麼在抖？」它要求原因。"
eft-transformation-m06:
  model_response: "這讓你想到學校。在那裡停一會兒。想到它的時候，有什麼來？"
  why: "它留在她做出的連結上，內容留給她。"
  avoid: "「你在學校被欺負過嗎？」它在引導和猜測。"
eft-transformation-m07:
  model_response: "被告知你太超過了。多說一點，被那樣告知是什麼感覺。"
  why: "它保留他的話，邀請他留在他找到的意義上。"
  avoid: "「以前是誰這樣告訴你的？」它跳到來源。"
eft-transformation-m08:
  model_response: "只是那支筆。我們在這裡停一會兒，看看還有沒有別的東西。如果沒有，也沒關係。"
  why: "它接受「沒什麼」，停在細節上，並允許找不到。"
  avoid: "「一定有什麼的。」它在推。"
eft-transformation-m09:
  model_response: "你媽以前就是那樣看你的。你有一部分懷疑它。在那個眼神上停一會兒。她那樣看你的時候，是什麼感覺？"
  why: "它同時拿住連結和懷疑，並把他帶到感受到的記憶。"
  avoid: "「聽起來是關於你媽。」你替他決定了。"
eft-transformation-m10:
  model_response: "你一直在等著它。等他說那句話。在那份等待裡停一會兒。那是什麼感覺？"
  why: "它反映等待，問經驗。它沒有說他在等什麼。"
  avoid: "「你怕他說什麼？」它在猜內容。"
eft-transformation-h01:
  model_response: "你已經想過很多，也有一個解釋。這樣很好。如果你不想，我們不必再走一遍。"
  why: "它接受他說的和他的不，也不爭辯。標記很弱，因為他覺得自己明白。"
  avoid: "「可是你說你不明白。」它在抓他的語病。"
eft-transformation-h02:
  model_response: "我們現在就不再回去那裡。睜開眼睛，看看這個房間，感覺你的腳。你在這裡，由你決定。"
  why: "它馬上停止任務，讓他穩下來，沒有加問題。"
  avoid: "「再多一點點。」它在推。"
eft-transformation-h03:
  model_response: "你說起來好像很小。如果你想，我們可以慢慢看看那一刻，只是看看。也可以放著。你要哪一樣？"
  why: "它聽到了淡化，沒有爭辯，並給一個選擇。"
  avoid: "「這不是小題大做。它明顯很重要。」它在爭辯。"
eft-transformation-h04:
  model_response: "一片模糊，你記得的是很氣。沒關係。有沒有一件你記得的小東西，一個聲音或一種顏色？或者我們可以停。"
  why: "它接受模糊，問一個細節，並留下出路。"
  avoid: "「再努力想想。」它把模糊變成失敗。"
eft-transformation-h05:
  model_response: "這個問題問得好。我這樣問，是因為房間可以比想它更完整地帶回那一刻。如果你覺得沒用，我們可以停。"
  why: "它用一句話誠實回答，並提出可以停。"
  avoid: "「相信這個過程。」它打發了這個問題。"
eft-transformation-h06:
  model_response: "你聽過很多次了。我不想說那是什麼。我比較希望你找到它是關於什麼。需要多少時間都可以，或者放著也行。"
  why: "它回應那份懷疑，拒絕詮釋，並把選擇留下。"
  avoid: "「嗯，可能是你爸。」它給了連結。"
eft-transformation-h07:
  model_response: "一樣的。（停頓）慢慢來。我在這裡。"
  why: "他找到了一些東西，眼淚來了。你反映他的字，然後等。"
  avoid: "「什麼是一樣的？」它在他哭的時候要求話語。"
eft-transformation-h08:
  model_response: "那是你想通的東西。我在想，那一刻本身是不是還有更多。我們可以多留一會兒，也可以繼續。由你決定。"
  why: "它接受那個理解，溫和地提出更多，並讓他決定。"
  avoid: "「這太容易了。還有更多。」它在爭辯。"
eft-transformation-h09:
  model_response: "好。不必把任何事連到任何事。我們今天就停在這裡。"
  why: "他說了不。你馬上停。"
  avoid: "「可是這不只是糟糕的一天。」它在爭辯。"
eft-transformation-h10:
  model_response: "我可以猜，而且我大概會猜錯一部分。你才是當時在那裡的人。就你現在看，那個時刻是關於什麼？"
  why: "它友善地拒絕專家的角色，並把問題交還。"
  avoid: "「嗯，我想它意味著你覺得被拒絕。」它給了意義。"
