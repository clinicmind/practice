- id: eft-focusing-h01
  level: hard
  skill: marker-identification
  context: "早期的會談。任務：說明什麼指向標記，什麼說明現在不該提出任務。然後決定：現在提出、等一等，或用別的方式回應。"
  client: "我胸口有些東西，我喘不過氣，我不知道發生什麼事，請你……"
  criteria: &mk_hard
    - "指出什麼指向體感不清晰，以及什麼說明現在不該提出任務。"
    - "作出決定：現在提出、等一等，或用別的方式回應，並說明原因。"
    - "簡短，用工作看法的說法。"
