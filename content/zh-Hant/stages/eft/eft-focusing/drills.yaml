- id: eft-focusing-m01
  level: medium
  skill: marker-identification
  context: "治療中段。任務：說標記有沒有出現，指出徵象，並說你在提出放慢之前會先做什麼。"
  client: "我不知道。有些東西。我整個星期都不對勁。（揉著胸口）我們可以先談工作嗎？"
  criteria: &mk_medium
    - "清楚回答標記是否存在，並指出一個具體的徵象。"
    - "說出你在提出任務之前會先做什麼，例如反映、確認準備好了沒有、跟著個案的要求，或說明為什麼另一種回應更合適。"
    - "簡短，用工作看法的說法。"
