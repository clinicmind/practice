- id: eft-focusing-e06
  level: easy
  skill: focusing-guidance
  context: "早期的會談。標記存在。任務：寫一至兩句話，邀請個案留意那份感受。"
  client: "我的胃裡有些東西。我說不出是什麼。"
  criteria: &fg_easy
    - "邀請個案留意身體的感覺或內在的位置，是邀請，不是命令。"
    - "只有一至兩句短句。不替感受命名、不解釋、不詮釋。"
    - "留有空間：不定步調，也不問需要快速回答的問題。"
