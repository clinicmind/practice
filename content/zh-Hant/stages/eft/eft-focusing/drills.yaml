- id: eft-focusing-h06
  level: hard
  skill: focusing-guidance
  context: "個案一直在嘗試留意一份感受。任務：寫一至兩句話。在繼續引導之前，先回應剛剛發生的事。"
  client: "我在試著去感覺它，可是什麼都沒有。也許是我做錯了。"
  criteria: &fg_hard
    - "在繼續引導之前，先回應個案剛說的話或剛做的事（空白、越來越大、要求答案、解釋、想停）。"
    - "讓個案掌握主導：個案可以放慢、退後或停下，你不繼續推。"
    - "簡短，不替感受命名，也不解釋。"
