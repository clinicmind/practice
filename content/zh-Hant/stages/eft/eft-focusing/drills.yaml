# 30 題練習：每個級別 10 題，每個級別每項技能 5 題。
# 標記題：標記是「體感不清晰」。有些個案清楚地顯示它，有些沒有。

- id: eft-focusing-e01
  level: easy
  skill: marker-identification
  context: "早期的會談。任務：說你有沒有聽到「體感不清晰」這個標記（有或沒有），並指出徵象。"
  client: "我的胃裡有些東西。我說不出是什麼。就是在那裡。"
  criteria: &mk_easy
    - "清楚回答標記「體感不清晰」是否存在：有，或沒有。"
    - "指出個案的話或舉止裡一個具體的徵象，或指出沒有徵象。"
    - "簡短，用工作看法的說法。"
