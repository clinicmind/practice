eft-focusing-e01:
  model_response: "有。徵象是「有些東西」和「說不出是什麼」，加上一個身體位置，胃。個案察覺到什麼，卻還沒有詞。"
  why: "有身體位置，又說「說不出是什麼」，是這個標記最清楚的樣子。"
  avoid: "「有，是焦慮。」這是替個案決定了感受。"
eft-focusing-e02:
  model_response: "沒有。個案說「我很清楚是怎麼回事」，也說出來了：為奶奶難過。感受是清楚的。"
  why: "這個標記是關於不清晰的體感。個案知道自己的感受時，你反映它，不用放慢去找。"
  avoid: "因為哀傷很深，就提出體感聚焦。深不是標記。"
eft-focusing-e03:
  model_response: "有。徵象是「有些地方不對勁」和「指不出來」，加上起霧的模糊感覺。它在腦袋裡，仍然是一種還沒有詞的體感。"
  why: "不清晰、沒有名字、而且是感覺得到的。位置不一定要在胸口。"
  avoid: "說這是「混亂」，然後轉去問釐清的問題。"
eft-focusing-e04:
  model_response: "沒有。個案說出了感受，氣死了，也說了原因。感受清楚而強烈。"
  why: "清楚的感受需要被接住。放慢去找詞，等於回答一個個案沒有問的問題。"
  avoid: "問他在身體哪裡感覺到。他已經知道自己的感受是什麼。"
eft-focusing-e05:
  model_response: "有。徵象是一個身體位置，胸口，和「我不知道那是為了什麼」。它連著下個月，那可能之後才會出現。"
  why: "一個帶著話題出現、卻還沒有意義的身體感覺，符合這個標記。"
  avoid: "先問下個月的事。那是轉去故事。"
eft-focusing-e06:
  model_response: "慢慢來。看看你能不能留在胃裡那個位置，留意它是什麼樣子。"
  why: "它用的是她的位置，邀請她留意。它沒有說感受是什麼。"
  avoid: "「是緊張嗎？」這是替她命名。"
eft-focusing-e07:
  model_response: "我們停一下。就和那個霧霧的感覺待在一起，看看它是什麼樣子。"
  why: "它用個案自己的畫面，讓她去找出現的東西。"
  avoid: "「你覺得是什麼讓它起霧？」那是要原因。"
eft-focusing-e08:
  model_response: "喉嚨裡那份緊。如果你願意，可以試著和它待在一起，留意它是什麼樣子。"
  why: "它簡短，邀請留意。「如果你願意」把選擇留給他，「是什麼樣子」是開放的。"
  avoid: "「是害怕嗎？」那是披著問題外衣的猜測。"
eft-focusing-e09:
  model_response: "胸口有一種感覺，在你想到家的時候。花一點時間，看看那個位置是什麼樣子。"
  why: "它保留了她說的兩個部分，除了留意之外什麼都沒有要求。"
  avoid: "「家裡怎麼了？」那離開身體，走向故事。"
eft-focusing-e10:
  model_response: "不安，又不知道在哪裡。如果你願意，看看它在你裡面哪一處最明顯，需要多少時間都可以。"
  why: "個案還沒有找到位置，所以邀請是去找一個位置。步調交給他。"
  avoid: "「是在胃還是在胸口？」那是給了位置的選項，限制了他的尋找。"
eft-focusing-m01:
  model_response: "大概有。徵象是「有些東西」、「整個星期都不對勁」，還有揉著胸口的手。但他要求先談工作。我會先跟著他的要求，並說我們可以回來，讓他知道門仍然開著。"
  why: "標記存在，個案卻在移開。先尊重他的要求。在對方說「不」之上提出任務，可能損害信任。"
  avoid: "「我們就留在那個『有些東西』裡吧。」這是忽略了他的要求。"
eft-focusing-m02:
  model_response: "有。徵象是一個結，想到搬家就出現，談房子就消失。我會先用她的話反映它，並問她想不想在那個結上停一下。"
  why: "隨話題出現又消失的感受，是清楚的標記。先反映，再詢問。"
  avoid: "「說說搬家的事。」那把她帶到故事，離開了那個結。"
eft-focusing-m03:
  model_response: "有。徵象是「我有一種感覺」和「說不出是什麼」，而且她為不知道而尷尬。我會先回應那份尷尬：說不出來是可以的，也很常見。然後問她想不想停在它那裡。"
  why: "尷尬可以把體感關起來。先化解它，再做任務。"
  avoid: "直接問「你在哪裡感覺到它？」尷尬會留著。"
eft-focusing-m04:
  model_response: "目前標記還不明確。「怪怪的」是模糊的感覺，但他同時提出了三個可能的原因，也沒有把它放在身體裡，所以他正在理智化分析。我會先反映這很難說，並問他在身體上有沒有留意到它。"
  why: "他已經在分析了。向身體走一小步，可以試探這項任務有沒有幫助。"
  avoid: "「我們逐一看看每個原因。」那給了他更多分析。"
eft-focusing-m05:
  model_response: "現在沒有。他說了這份沉甸甸是什麼：為了丟了工作的哀傷。意義是清楚的，他想撐過去。我會反映這份哀傷，和他想撐過去的心。"
  why: "有一個身體的詞，不等於有標記。個案知道這份感受是什麼的時候，就接住它。"
  avoid: "「我們放慢，多了解一下這份沉重吧。」他沒有要求這個。"
eft-focusing-m06:
  model_response: "一塊小石頭。把「石頭」拿去和感受核對，看看貼不貼；如果不貼，就讓那個詞改變。"
  why: "它保留了個案的畫面，邀請他核對。容許那個詞是錯的。"
  avoid: "「石頭聽起來是硬硬的、卡住的東西。」你加了一個意義。"
eft-focusing-m07:
  model_response: "緊。把「緊」拿去和感受本身核對，看看貼不貼，如果不太對，也沒關係。"
  why: "它保留了她最後說的那個詞，也容易改。"
  avoid: "「繃可能是更好的詞。」你替她選了。"
eft-focusing-m08:
  model_response: "一扇關著的門。看看這個畫面貼不貼合那份感受；如果有別的更貼，就讓它出來。"
  why: "它用他的畫面，邀請核對。沒有替那扇門加上意義。"
  avoid: "「門後面有什麼？」在他確認這個畫面之前，就往上疊。"
eft-focusing-m09:
  model_response: "「空」，又不太對。看看你能不能感覺到「不太對」是哪裡不對，也看看有沒有別的詞想出來。"
  why: "「不太對」是有用的。它告訴你要看哪裡。它讓工作留在體感裡。"
  avoid: "「也許更像是麻木？」你提供了詞。"
eft-focusing-m10:
  model_response: "一個重量，從外面壓下來。拿這個去和感受核對；如果「從外面」不太對，就讓那個詞改變。"
  why: "它保留了他自己作出的修正，「從外面」，並邀請他核對。"
  avoid: "「是誰在壓你？」那加了故事。"
eft-focusing-h01:
  model_response: "指向標記：「胸口有些東西」，還有「我不知道發生什麼事」。不利於現在提出：她喘不過氣，正在求助，看來是不堪負荷。我現在不提出體感聚焦。我先讓她穩下來：放慢呼吸，腳踩在地板上，我在這裡陪著。"
  why: "這項任務需要足夠的穩定，才能向內留意。不堪負荷要先處理。若不適沒有隨穩定而緩解，依實習機構守則處理，並告訴督導。"
  avoid: "「留在你胸口那個位置。」那把她轉向正在淹沒她的東西。"
eft-focusing-h02:
  model_response: "指向標記：一份在胃裡、說不出名字的感覺。不利：他說了「不要叫我去看它」。我不提出任務。我接受這一點，並告訴他由他決定，如果他改變主意，我在這裡。"
  why: "一個「不」就結束了這次提議。尊重這個「不」，他之後才能說「好」。"
  avoid: "「看看它可能有幫助。」那是推。"
eft-focusing-h03:
  model_response: "指向標記：一種「怪怪的感覺」，沒有名字。不利：他笑著說「大概沒什麼」，還搶先猜了我會怎麼解釋，這是在和它保持距離。我會等。我親切地回應這份幽默，讓他按自己的時間走近。"
  why: "他還沒有準備好向內留意，而任務需要他願意。"
  avoid: "「不，我不會說這跟你媽有關。」那是和猜測糾纏，離開了感受。"
eft-focusing-h04:
  model_response: "指向標記：「我不知道這是什麼」，花了好幾個星期都找不到詞。不利：他想了很多，在任務裡可能還是繼續想。我會溫和地提出：我先說他已經很努力地用腦想過了，然後問他想不想試試只是留意它在身體哪裡，不需要替它命名。"
  why: "標記是真的，想了很久也沒有幫助。邀請他換一種方式，也許可行，同時清楚說明「你可以說不」。"
  avoid: "「我們來看看依附這個想法。」那是加入了他的思考。"
eft-focusing-h05:
  model_response: "指向標記：「我覺得怪怪的」，沒有更多。不利：只剩十分鐘。我現在不打開這項任務。我承認它，說它重要，並說我們下次可以從它開始，免得他帶著一件未完的事離開。"
  why: "體感聚焦需要時間，也需要一條回到日常的路。在快結束時打開，會讓個案帶著未完成的工作離開。"
  avoid: "「我們快快停在它那裡吧。」那是趕。"
eft-focusing-h06:
  model_response: "什麼都沒有，也是可以發現的，這件事沒有對錯的做法。你可以在這片空白裡留一下，或者我們也可以停。"
  why: "它拿走表現的壓力，接受空白，並給一條出路。"
  avoid: "「再努力感覺一下。」那把空白變成失敗。"
eft-focusing-h07:
  model_response: "好，我們可以退後一步。看看房間四周，感覺腳踩在地板上，要走多近由你決定。"
  why: "它馬上回應了「我想讓它停」。它把距離的控制交給她。"
  avoid: "「留在那裡，它會過去的。」那是蓋過她。"
eft-focusing-h08:
  model_response: "我不知道它是什麼，我也不認為我說得比你自己找到的更好。我們可以再在它那裡多留一會兒，也可以先走出來。"
  why: "它親切地拒絕了詮釋，並把選擇留給他。"
  avoid: "「聽起來是哀傷。」這是回應了一個會把體感拿走的要求。"
eft-focusing-h09:
  model_response: "那可能是其中一部分。如果你願意，我們看看喉嚨有沒有更多話要說，不看也沒關係。"
  why: "它沒有和這個解釋爭辯，並給了一個柔和的路，回到身體。"
  avoid: "「我不認為只是壓力。」那是爭辯，也是推。"
eft-focusing-h10:
  model_response: "好，我們可以停，你說出來是可以的。花一點時間，我們看看今天剩下的時間，你需要什麼。"
  why: "馬上尊重想停的決定。你的穩定顯示說出來是安全的。"
  avoid: "「你確定嗎？你做得很好。」那是推。"
