slug: eft-focusing
version: 1.0.0
title: "體感聚焦"
intro: "在情緒聚焦治療（EFT）裡，標記是會談中的一個徵象，顯示某一種工作此刻可能有幫助。這個模組談的是一個標記：體感不清晰。個案察覺到身體裡有些東西，例如胸口緊緊的、胃裡打了結，卻還說不出那是什麼。典型的徵象是「有些東西」「我不知道」這類字眼、手移向那個位置，還有停頓。對應的任務是體感聚焦。你把會談放慢，邀請個案留意那個位置，等待一個貼切的詞或畫面出現。然後請個案拿這個詞去和感受核對。治療師說得很少。詞要從個案來，不是從你來。個案已經知道感受是什麼、個案不堪負荷、個案說不、或會談快要結束的時候，不要提出這項任務。這些時候，用別的方式回應個案。這裡的體感聚焦，和你在基礎階段練習的聚焦是不同的技能。基礎階段的聚焦，是幫個案把話題收窄。在這個模組，個案 R 在第五次會談告訴你，從星期日起有「一些東西」。你會練習兩項技能：辨認標記，以及引導體感聚焦。"
skills:
  - marker-identification
  - focusing-guidance
reflection_prompts:
  - id: eft-focusing-r1
    text: "R 在會談放慢之後，才找到「重」這個詞。想一次你有一種說不出名字的感受。什麼幫助你找到詞？什麼妨礙了你？"
  - id: eft-focusing-r2
    text: "引導體感聚焦，意味著說得比自然的衝動少。留意你自己的練習中，你什麼時候急著填滿沉默。你怕等下去會發生什麼？"
  - id: eft-focusing-r3
    text: "寫下三個徵象，顯示個案還沒有準備好做這項任務，即使標記看似存在。每一種情況下，你會改為怎樣做？"
