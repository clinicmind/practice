sessions:
  - id: eft-focusing-s5
    title: "第 5 次會談：「有些東西」"
    turns:
      - id: eft-focusing-s5-t01
        speaker: therapist
        text: "R，你好。今天怎樣？"
      - id: eft-focusing-s5-t02
        speaker: client
        text: "（呼氣）還好。主要是改作業。（停頓）有些東西。我不知道。從星期日起。"
      - id: eft-focusing-s5-d1
        type: choice
        prompt: "R 說從星期日起「有些東西」，而他不知道是什麼。你怎樣回應？"
        options:
          - id: a
            text: "它比較像擔心，還是比較像難過？"
            fit: weak
            note: "你給了他一份菜單。他可能挑一個，而挑的是對感受的想法，不是感受本身。這也和他說的相反：他說他不知道。"
          - id: b
            text: "從星期日起有一些東西，而你還說不出是什麼。你想不想放慢，在它那裡停一分鐘？如果不想，也沒關係。"
            fit: strong
            note: "它重複了他說的話，用一句話說明你建議什麼，也讓他很容易說不。一位至今一直要求方法的個案，應該知道這項任務是做什麼用的。"
          - id: c
            text: "星期日發生了什麼事？"
            fit: workable
            note: "這是很自然的問題，答案也可能有幫助。但它把他轉向事件和解釋，那正是他輕易做到的。不清晰的體感，也許在故事出現之前比較容易接近。"
        actual: "從星期日起有一些東西，而你還說不出是什麼。你想不想放慢，在它那裡停一分鐘？如果不想，也沒關係。"
        rationale: "「有些東西」和「我不知道」是體感不清晰的徵象。這項任務很溫和，卻要求 R 向內看，這對他很陌生。所以你說明自己在做什麼、為什麼這樣做，也讓他容易說不。如果他說不，你就跟著他。"
      - id: eft-focusing-s5-t03
        speaker: client
        text: "（停頓）好吧。（停頓）它在這裡。（把手放在胸口）有點像一塊東西。我不知道。"
      - id: eft-focusing-s5-d2
        type: free
        prompt: "R 把手放在胸口。寫出你接著說的話，邀請他留在那個位置。不要替感受命名。"
        actual: "慢慢來。就留在你胸口那個位置，留意它是什麼樣子。"
        rationale: "你用的是他的位置，「你的胸口」，其餘的交給他。你沒有說感受可能是什麼。「留意它是什麼樣子」邀請的是性質，不是原因。「慢慢來」定下慢的步調。在這裡，字越少越好。"
      - id: eft-focusing-s5-t04
        speaker: client
        text: "（停頓很久，約三十秒）不是尖尖的。是……鈍的。壓著。像有東西坐在那裡。"
      - id: eft-focusing-s5-d3
        type: choice
        prompt: "R 把這份感受形容成鈍的、壓著的、「像有東西坐在那裡」。你說什麼？"
        options:
          - id: a
            text: "聽起來像是焦慮。這樣說對嗎？"
            fit: weak
            note: "你給了他一個詞，而這個詞來自你。如果他接受，他得到的名字是你選的。如果他拒絕，他可能失去線索。"
          - id: b
            text: "鈍的。壓著。像有東西坐在那裡。留在那裡，看看有沒有一個詞或一幅畫面出現，貼合它。不用急。"
            fit: strong
            note: "它按他的次序，把他自己的話還給他，邀請他去找自己的詞。「不用急」告訴他沉默是受歡迎的。"
          - id: c
            text: "你覺得是什麼讓它壓著？"
            fit: workable
            note: "這在找原因。它可能得到一個好的答案，卻把 R 從感受的經驗帶回分析。"
        actual: "鈍的。壓著。像有東西坐在那裡。留在那裡，看看有沒有一個詞或一幅畫面出現，貼合它。不用急。"
        rationale: "找到一個貼合的詞，等於抓到感受的一個把手。這個詞必須是個案自己的，否則對他來說不夠真。你的任務是讓空間保持開放，不要催他。"
      - id: eft-focusing-s5-t05
        speaker: client
        text: "（停頓）重。（停頓）是重。不是一塊東西。是重。"
      - id: eft-focusing-s5-t06
        speaker: therapist
        text: "重。"
      - id: eft-focusing-s5-t07
        speaker: client
        text: "（慢慢點頭）對。就是這個。重。（停頓）我不知道原來是這個詞。"
      - id: eft-focusing-s5-t08
        speaker: client
        text: "（過了一會兒，抬頭看）那它是什麼？你知道嗎？"
      - id: eft-focusing-s5-d4
        type: choice
        prompt: "R 找到了「重」這個詞，然後問你它是什麼。你怎麼說？"
        options:
          - id: a
            text: "可能是哀傷。沉重常常和哀傷一起出現。"
            fit: weak
            note: "也許這甚至是真的。但你會把剛剛打開的東西關上，並替 R 還沒找到的感受命名。他可能接受你的詞，然後停止尋找。"
          - id: b
            text: "我不知道。我們還不用知道。它是重的，也是真的。我們可以再回來。"
            fit: strong
            note: "它誠實，也保留了 R 找到的感受。它告訴他不知道是可以的，你會陪著他。它沒有推向一個答案。"
          - id: c
            text: "你覺得它是什麼？"
            fit: workable
            note: "它把問題交還給他，這是尊重他。在這一刻，它同時請他離開體感，走進腦袋。"
        actual: "我不知道。我們還不用知道。它是重的，也是真的。我們可以再回來。"
        rationale: "在 EFT 裡，意義來自個案，常常需要不止一次會談。你的工作是保護他找到的東西。留意治療師在這裡是誠實的。說「我不知道」並不是失敗。"
    notes:
      goals: "沒有改變。R 今天沒有要求方法。被給予選擇時，他留在這項工作裡。"
      alliance: "情感連結：他同意放慢，還問「你知道嗎？」，顯示有一些信任。任務：他在你說明之後，接受了一項他沒有要求的任務。下次問問它對他有沒有用。"
      formulation_update: "胸口有不清晰的體感，從星期日起。「重」這個詞對他來說貼切。意義還不知道。我沒有猜。把它保留為之後會談的一個把手。"
