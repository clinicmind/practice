eft-emotion-types-e01:
  model_response: "原發適應情緒：失去時的哀傷。線索是「我一直盼著她會走進來」。這份感受和事件相稱，也直接指向她想念的人。"
  why: "這份感受是直接的，和事件相稱，也告訴你個案需要什麼。這就是它「適應」的地方。"
  avoid: "把它當成要解決的問題。這份哀傷正在發揮它的作用。"
eft-emotion-types-e02:
  model_response: "次級情緒。線索是這條鏈：生氣，然後為生氣而內疚，然後氣自己。每一種感受都是針對前一種。"
  why: "當感受是對另一種感受的反應，你還沒有碰到最先的那一個。最先的多半是她哭的時候發生的事。"
  avoid: "在三種感受裡挑一個，說它就是「那個」感受。三種都在表面。"
eft-emotion-types-e03:
  model_response: "可能是原發不適應情緒，一種被看見時就出現的羞愧。線索是「從小就這樣」，而且它隨稱讚而來，沒有理由。"
  why: "它是舊的，和眼前的事件不相配，還讓個案想消失，不是想做什麼。它沒有給她指引。"
  avoid: "把「羞愧」當成定論告訴個案。先在心裡把它當成猜測。"
eft-emotion-types-e04:
  model_response: "工具性情緒。線索是「他每次都停下來」，還有她並不總是那麼難過。哭泣對另一個人產生了作用。"
  why: "線索是對伴侶的效果。這不表示個案在作假。很多人很早就學會這樣，而且做的時候沒有察覺。"
  avoid: "說個案在操控。這是關於這份感受有什麼作用的猜測，不是評價。"
eft-emotion-types-e05:
  model_response: "原發適應的憤怒。線索是它和事件相稱，而且帶著清楚的需要：「我要當場把它糾正過來」。"
  why: "它是對不公平的直接反應，把個案推向她需要的東西。適應不等於令人愉快。"
  avoid: "把憤怒當成「憤怒問題」。在這裡它是健康的，也提供了資訊。"
eft-emotion-types-e06:
  model_response: "最近幾乎一直都煩躁，而且你想不通為什麼。如果回到最近一次，在煩躁底下，還有什麼？"
  why: "它留在個案的話上，只向底下可能有的東西走一步，而且用問題的方式提出。"
  avoid: "「我在想你是不是其實在氣別的事。」那是你的猜測，被當成答案遞給個案。"
eft-emotion-types-e07:
  model_response: "你一直在重想，內疚也一直跟著你。當你想起她當時的樣子，你注意到什麼？"
  why: "它留在內疚上，並轉向一個更可能有真實內容的片刻。"
  avoid: "「你不用內疚，誰都會有發脾氣的時候。」在你知道這份感受是關於什麼之前，就把它關上了。"
eft-emotion-types-e08:
  model_response: "很氣自己，為了那個課程。如果在這份氣裡多停一會兒，還有什麼出現？"
  why: "它用個案的詞，問下一樣東西。對自己生氣常常是次級的。"
  avoid: "「是什麼阻礙你完成？」這會帶到原因和計畫，離開感受。"
eft-emotion-types-e09:
  model_response: "平平的，不是難過。而且是從團隊換了以後開始的。平平的，是什麼感覺？"
  why: "它尊重個案說的「不是難過」，問題保持開放，沒有標籤。換團隊是線索，提示感受可能在哪裡。"
  avoid: "「聽起來是失落。」這是告訴個案他感覺到什麼，也忽略了他說的話。"
eft-emotion-types-e10:
  model_response: "你防衛起來了，而你不知道為什麼。我們回到那一刻。他問的時候，你裡面發生了什麼？"
  why: "防衛是對某件事的反應。這句把個案帶回事情發生前的那一瞬間。"
  avoid: "「也許你覺得被批評了。」這是你對他感受的猜測，卻說得像事實。"
eft-emotion-types-m01:
  model_response: "可能是次級情緒：憤怒一直都在，卻已經不起作用。線索是「從來沒有改變過什麼」。檢驗的方法：放慢，回到最近一次，問憤怒之前有什麼。"
  why: "「一直」和「從來沒有改變過什麼」，提示一種原地打轉的感受，常常蓋住受傷或無望。你用問題去檢驗，因為你不知道。"
  avoid: "因為憤怒聽起來健康，就當成原發適應的憤怒。健康的憤怒會把人推向某件事。"
eft-emotion-types-m02:
  model_response: "可能是被壓住的原發適應哀傷。線索是濕了的眼睛，卻說「什麼感覺都沒有」。檢驗的方法：輕輕反映濕了的眼睛，看她是留在那裡，還是走開。"
  why: "感受並不是不在，而是有東西打斷了它。她對輕輕的反映有什麼反應，比她的話告訴你更多。"
  avoid: "「你明明很難過。」這在反駁她，她會為「沒感覺」辯護。"
eft-emotion-types-m03:
  model_response: "可能是原發不適應的恐懼。線索是它從學生時代開始，而且不隨準備而改變。檢驗的方法：問這份恐懼說會發生什麼，聽聽是關於簡報還是關於他自己。"
  why: "一種不隨事實改變的感受，已經變成固定的了。恐懼對這個人說了什麼，常常是工作所在。"
  avoid: "教他放鬆技巧。那是把固定的感受當成技巧問題。"
eft-emotion-types-m04:
  model_response: "工具性情緒。線索是她說這句話，是因為它對團隊產生的效果。檢驗的方法：問她失望但沒有說出來的時候，是什麼感覺。"
  why: "這個問題把感受和它的用途分開。底下可能有一份真實的感受，而她也許有一段時間沒有接觸到它。"
  avoid: "告訴她那份失望不是真的。它可以是真的，也同時有用。"
eft-emotion-types-m05:
  model_response: "原發適應的哀傷。線索是它和事件相稱，也過去了，之後她走向姊姊。檢驗的方法：留意它有移動，不是每個星期都以同樣的形式回來。"
  why: "適應的感受做了它該做的，然後平息。這一次它把她帶向連結，這就是徵象。"
  avoid: "擔心哭了一個鐘頭。那是一個反應，而且已經完結。"
eft-emotion-types-m06:
  model_response: "他沒有打來，而你說算了。我兩種都可以跟。你想不想在他沒有打來這件事上多停一下，還是先放下？"
  why: "它接住了她說小的部分，用她的話，並給了真正的選擇。"
  avoid: "「聽起來這件事對你很重要。」這在推翻「沒什麼」，還替她說了意義。"
eft-emotion-types-m07:
  model_response: "你說沒關係，可是還在想為什麼。你想在這個「想不通」上停一下，還是想去別的地方？"
  why: "它認真對待句子的兩半：「沒關係」和「我不明白」。選擇讓它保持安全。"
  avoid: "「那一定很受傷。」你只聽到她說「沒關係」。"
eft-emotion-types-m08:
  model_response: "你笑過了，可是它還跟著你。你想說說你一直回頭想的是什麼嗎？"
  why: "它反映了這個對比，邀請一步，而且很容易說不。"
  avoid: "「她說了什麼？」那是要內容，跳過了感受。"
eft-emotion-types-m09:
  model_response: "你有一部分不想為這件事哭。這樣可以。我們可以慢慢走，或者你告訴我，是什麼讓它顯得很蠢。"
  why: "它歡迎這份不情願，並給了兩條路。「蠢」是個案自己的判斷，你不和它爭辯。"
  avoid: "「一點都不蠢。」你回應了判斷，把感受留在原地。"
eft-emotion-types-m10:
  model_response: "你的腦袋說沒事，其他部分卻說著別的。可以讓我們聽聽那些其他部分，聽一分鐘嗎？"
  why: "它保留個案描述的分裂，並徵求同意，走向還沒有話語的那一邊。"
  avoid: "「你的身體在告訴你有事不對。」這是替身體說它的意思。"
eft-emotion-types-h01:
  model_response: "表面：次級情緒，大吼之後的內疚和自責，聽來是「糟糕的父母」和「何必努力」。底下：可能是原發不適應的羞愧，一種固定的「我不夠好」，大吼只是把它引了出來。我會先跟大吼之前那一刻，因為停在內疚上，只是重複她已經在做的事。"
  why: "自責是一個循環。一種正在攻擊自己的感受，不適合再深入。之前的那一刻給你一個新鮮的感受可以處理。"
  avoid: "反駁「糟糕的父母」。那是回應了判決，卻把她留在循環裡。"
eft-emotion-types-h02:
  model_response: "表面：次級情緒，「累」和「沒有生氣」，看來是被壓下去的感受。底下：可能是原發適應的憤怒。我會先溫和地跟繃緊的下巴，因為身體在說話語沒說的東西。"
  why: "下巴繃緊，又說「沒生氣」，提示一種被打斷的感受。從看得見的開始，問問它怎樣。"
  avoid: "「你聽起來很生氣。」他剛說了沒有。"
eft-emotion-types-h03:
  model_response: "表面：次級情緒，對每個人不耐煩。底下：可能是原發適應的哀傷，一份被鬆氣蓋住、由空空的感覺指向的失落。我會先跟鬆氣之後的空，因為它最沒有被解釋，不耐煩多半是從它長出來的。"
  why: "按次序出現的感受給你一條路。走到個案的話變少的那一處。"
  avoid: "因為不耐煩最響，就回應不耐煩。"
eft-emotion-types-h04:
  model_response: "表面：次級情緒，沒有自豪，怕被拆穿，是對稱讚的反應。底下：可能是原發不適應的羞愧，「跟十歲時一模一樣」。我會先跟他現在這份冒牌貨的感覺，問它在身體裡怎樣，然後才回到十歲。"
  why: "舊的感受在現在還活著，所以你現在就可以處理它。直接跳到十歲，會把它變成過去的故事。"
  avoid: "「你十歲的時候發生了什麼？」這把焦點從感受到的經驗轉到歷史。"
eft-emotion-types-h05:
  model_response: "表面：次級情緒，很快原諒，也許是為了維持和平。底下：可能是沒有空間的原發適應憤怒。我會先跟她在床上感到的憤怒，因為它在沒有人看著的時候回來了。"
  why: "她夜裡的憤怒是真實的感受。很快的原諒，可能是避開它的方法。"
  avoid: "質疑她是不是真的原諒了。那是轉向原諒，離開憤怒。"
eft-emotion-types-h06:
  model_response: "我在這裡。現在很多。我們放慢。感覺一下腳踩在地板上，跟我一起慢慢把氣呼出去。我們不需要去任何地方。"
  why: "個案不堪負荷。這句讓她穩下來、放慢，沒有給任何內容去探索。"
  avoid: "「你現在的感受是什麼？」在她已經太多的時候，這是要求更多。"
eft-emotion-types-h07:
  model_response: "好。我們不去那裡。由你決定，如果你日後想去，門還是開著。"
  why: "馬上尊重這個不。把壓力拿走，是讓關係保持穩定的原因。"
  avoid: "「我明白，可是看看它可能有幫助。」那是壓力。"
eft-emotion-types-h08:
  model_response: "你想把它倒出來，我很高興你信任我。我們今天一次談一部分，用你撐得住的步調，這樣你離開的時候不用獨自扛著它。"
  why: "它歡迎這份願望，同時放慢步調。目的是讓個案在會談後仍然安全。"
  avoid: "「說吧，全部告訴我。」那是高速深化，個案事後可能後悔。"
eft-emotion-types-h09:
  model_response: "你來是要處理你上司的事，而我問感受的問題，並不像在處理這件事。我們來確認一下你今天想要什麼。"
  why: "個案已經告訴你他不同意這項任務。先處理這一點，再談深化。"
  avoid: "「感受對這項工作很重要。」這是在為方法辯護。"
eft-emotion-types-h10:
  model_response: "你覺得很遠。我們慢慢回到這裡。你可以感覺一下身下的椅子，還有腳下的地板嗎？"
  why: "此刻發生的是抽離。先平靜地回到房間，再談任何內容。"
  avoid: "「你去了哪裡？」那是要內容，還會讓個案離得更遠。"
