slug: eft-emotion-types
version: 1.0.0
title: "分辨情緒的種類"
intro: "在情緒聚焦治療（EFT）裡，情緒除了按名稱分類，也按它的作用分類。原發適應情緒是對當下處境的直接反應，指向這個人的需要：失去時的哀傷，被不公平對待時的憤怒。原發不適應情緒是舊有、熟悉的感受，已經變成固定的反應，不再給人指引。例如一種羞愧，不論發生什麼事都出現，說著「我不夠好」。次級情緒是對另一種感受或某個想法的反應，常常蓋住底下的東西：蓋住受傷的煩躁，或發怒之後的內疚。工具性情緒主要是為了對別人產生效果而表現出來的。在這個模組，個案 R 說自己「有點煩躁」。在兩次會談中，你會聽到煩躁底下有什麼。你會練習兩項技能：分辨情緒的種類，以及深化，也就是幫個案從表面的感受向底下走一步。這些種類是你心裡的工作假設，不要當標籤告訴個案。只按個案的步調深化。個案不堪負荷、已經說不、或關係還不夠穩的時候，不要深化。這些時候，先放慢，先讓個案穩下來。"
skills:
  - emotion-differentiation
  - deepening
reflection_prompts:
  - id: eft-emotion-types-r1
    text: "想一位以憤怒或煩躁為主要感受的個案。底下可能有什麼？你看到或聽到什麼令你這樣想？什麼會告訴你自己想錯了？"
  - id: eft-emotion-types-r2
    text: "R 一碰到痛處就馬上開玩笑。想一個你自己在生活中從痛苦的感受退後的方式。你希望治療師在那一刻怎樣回應你？"
  - id: eft-emotion-types-r3
    text: "把一種情緒歸入某個類型，只是一個猜測。寫下一個你本來很肯定、後來發現猜錯的例子。在那段期間，你怎樣和個案相處？"
