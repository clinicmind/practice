- id: eft-emotion-types-m01
  level: medium
  skill: emotion-differentiation
  context: "治療中段。任務：說出最貼切的類型，指出線索，並說你會留意或詢問什麼來檢驗你的猜測。"
  client: "我對我姊姊氣得要命。說真的，我對她一直都氣得要命。（停頓）而且從來沒有改變過什麼。"
  criteria: &ed_medium
    - "說出最貼切的類型，並指出個案話裡的線索。"
    - "說出你會留意或詢問什麼來檢驗這個猜測。"
    - "是用你自己的話說出的工作猜測，不是要告訴個案的標籤。"
- id: eft-emotion-types-m02
  level: medium
  skill: emotion-differentiation
  context: "治療中段。任務：說出最貼切的類型，指出線索，並說你會怎樣檢驗你的猜測。"
  client: "離婚的事，我真的什麼感覺都沒有。（眼睛濕了）一定是這裡灰塵太多。"
  criteria: *ed_medium
- id: eft-emotion-types-m03
  level: medium
  skill: emotion-differentiation
  context: "治療中段。任務：說出最貼切的類型，指出線索，並說你會怎樣檢驗你的猜測。"
  client: "每次簡報前我都怕得要命。從學生時代就這樣，就算準備得很充分也一樣。"
  criteria: *ed_medium
- id: eft-emotion-types-m04
  level: medium
  skill: emotion-differentiation
  context: "治療中段。任務：說出最貼切的類型，指出線索，並說你會怎樣檢驗你的猜測。"
  client: "我跟團隊說我很失望，他們就會更努力。所以我常常這樣說。"
  criteria: *ed_medium
- id: eft-emotion-types-m05
  level: medium
  skill: emotion-differentiation
  context: "治療中段。任務：說出最貼切的類型，指出線索，並說你會怎樣檢驗你的猜測。"
  client: "他走了以後，我哭了一個鐘頭。很難受，可是又好像應該這樣。然後我輕鬆了一點，就打電話給姊姊。"
  criteria: *ed_medium

- id: eft-emotion-types-m06
  level: medium
  skill: deepening
  context: "治療中段。個案把事情說小了。任務：寫一句回應，讓個案可以選擇要不要再往前走。"
  client: "沒什麼啦。（停頓）只是他沒有打來。算了。"
  criteria: &dp_medium
    - "接住個案說的話，包括個案說小了的那一部分。"
    - "邀請個案按自己的步調走下一步，並給一個真正的選擇：留下來，或先放下。"
    - "簡短。不詮釋，不貼標籤。"
