- id: eft-emotion-types-e05
  level: easy
  skill: emotion-differentiation
  context: "早期的會談。任務：說出你聽到四種類型中的哪一種，並指出線索。"
  client: "同事在大家面前把我的成果當成他的。我氣炸了。我要當場把它糾正過來。"
  criteria: *ed_easy

- id: eft-emotion-types-e06
  level: easy
  skill: deepening
  context: "早期的會談。任務：寫一句回應，留在個案的感受上，並邀請個案向底下可能有的東西走一步。"
  client: "我最近一直對我先生很煩躁。我不知道自己是怎麼了。"
  criteria: &dp_easy
    - "留在個案說出的感受上，用個案自己的話。"
    - "以邀請或試探的猜測，請個案向底下可能有的東西走一步。"
    - "簡短。不含建議、不解釋過去、不貼標籤。"
