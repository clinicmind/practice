- id: eft-emotion-types-h06
  level: hard
  skill: deepening
  context: "個案哭得很厲害，呼吸急促。任務：寫一句回應。決定要不要再深入。"
  client: "我受不了……太多了。我停不下來。"
  criteria: &dp_hard
    - "回應此刻正在發生的事（不堪負荷、拒絕、急著說、不同意、抽離），不是回應底下的內容。"
    - "讓步調穩下來或放慢，或確認個案想怎樣，並讓個案掌握主導。"
    - "簡短，不開啟新的話題去探索。"
