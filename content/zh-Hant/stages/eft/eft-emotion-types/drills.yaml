# 30 題練習：每個級別 10 題，每個級別每項技能 5 題。
# 這裡的情緒類型都是工作假設。示範回應給出最貼切的類型和線索。

- id: eft-emotion-types-e01
  level: easy
  skill: emotion-differentiation
  context: "早期的會談。任務：寫兩句短句。說出你聽到四種類型（原發適應、原發不適應、次級、工具性）中的哪一種，並指出個案話裡的線索。"
  client: "我的朋友上星期搬走了。家裡空空的。我一直盼著她會走進來。"
  criteria: &ed_easy
    - "說出最貼切的類型：原發適應、原發不適應、次級，或工具性。"
    - "指出個案自己的話裡的一個線索。"
    - "是用你自己的話說出的工作猜測，不下診斷。"
- id: eft-emotion-types-e02
  level: easy
  skill: emotion-differentiation
  context: "早期的會談。任務：說出你聽到四種類型中的哪一種，並指出線索。"
  client: "她哭了，我就生氣。然後我又為自己生氣而內疚。現在我連這整件事都在氣自己。"
  criteria: *ed_easy
