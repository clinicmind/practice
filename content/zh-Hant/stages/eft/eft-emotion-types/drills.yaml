- id: eft-emotion-types-h01
  level: hard
  skill: emotion-differentiation
  context: "治療中段。任務：指出兩個層次（表面是什麼，底下可能是什麼），各給一個類型，並說你會先跟哪一層，為什麼。"
  client: "我又對女兒大吼了。我恨自己這樣。我是個糟糕的父母。說真的，我不知道自己何必這樣努力。"
  criteria: &ed_hard
    - "指出兩個層次，即表面和底下可能有的東西，各有一個類型。"
    - "說出你會先跟哪一層，以及原因。"
    - "是工作猜測的說法，不下診斷。"
