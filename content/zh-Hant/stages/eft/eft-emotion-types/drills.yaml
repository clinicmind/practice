  level: easy
  skill: deepening
  context: "早期的會談。任務：寫一句回應，留在感受上，並邀請個案向底下可能有的東西走一步。"
  client: "我哥哥問起搬家的事，我馬上就防衛起來。我自己也不知道為什麼。"
