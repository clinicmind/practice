sessions:
  - id: eft-emotion-types-s3
    title: "第 3 次會談：「我只是有點煩躁」"
    turns:
      - id: eft-emotion-types-s3-t01
        speaker: therapist
        text: "R，很高興見到你。這個星期過得怎樣？"
      - id: eft-emotion-types-s3-t02
        speaker: client
        text: "還好。很忙。整個星期都在改作業。煩躁了幾次。就這樣。"
      - id: eft-emotion-types-s3-d1
        type: choice
        prompt: "R 說他「煩躁了幾次，就這樣」。你怎樣回應？"
        options:
          - id: a
            text: "工作量太大的時候，容易煩躁，這很常見。也許我們可以看看怎樣管理你的工作量。"
            fit: weak
            note: "這句解釋了煩躁，然後轉去解決辦法。R 想要的是方法，所以這句會讓他覺得受用，風險也在這裡。你還沒聽到感受，就已經離開它。"
          - id: b
            text: "煩躁了幾次。說說最近一次吧。當時你在哪裡？之前發生了什麼事？"
            fit: strong
            note: "煩躁在表面，也是 R 最容易帶進來的感受。你沒有泛泛地談煩躁，而是跟著它走進一個真實的片刻。具體的場景，才是底下的感受能夠出現的地方。"
          - id: c
            text: "你覺得這份煩躁是因為什麼？"
            fit: workable
            note: "這是合理的問題。但它要求 R 用想的去找答案，而他很擅長這個。你會得到一個原因，多半得不到感受。"
        actual: "煩躁了幾次。說說最近一次吧。當時你在哪裡？之前發生了什麼事？"
        rationale: "煩躁常常是次級情緒。你還不知道它蓋住什麼，所以不猜。你只請他說一個場景。留意 R 把事情說小了（「就這樣」）。不要和這一點爭辯。只是對他願意告訴你的東西保持好奇。"
      - id: eft-emotion-types-s3-t03
        speaker: client
        text: "星期二晚上。兒子不肯吃飯。我煮了飯，人也累，他把碗推開。我就提高了聲音。他一下子安靜了。（清喉嚨）然後我覺得不好。算了。"
      - id: eft-emotion-types-s3-d2
        type: free
        prompt: "R 告訴你，他提高了聲音，兒子安靜下來，然後他覺得不好。寫一句回應，留在那個片刻。不要解釋，也不要設法解決。"
        actual: "你的聲音大了起來，他就安靜了，他一安靜，你心裡有什麼沉了下去。"
        rationale: "這句回應留在場景之內，用的是 R 自己說的先後次序。它把「沉下去」當成一個試探的猜測，字數很少，R 可以糾正。它沒有說「你覺得內疚」，那樣等於遞給他一個標籤；也沒有建議他接下來該做什麼。留意他說了「覺得不好」之後做了什麼：說「算了」，還清了喉嚨。他在示意想帶過。"
      - id: eft-emotion-types-s3-t04
        speaker: client
        text: "（停頓）我不喜歡他一安靜下來。那種安靜我知道。（短促地笑）沒什麼。"
      - id: eft-emotion-types-s3-d3
        type: choice
        prompt: "R 說他知道那種安靜，然後說沒什麼。你怎麼做？"
        options:
          - id: a
            text: "那種安靜是什麼樣子的？你自己的家裡也是這樣嗎？"
            fit: weak
            note: "也許這確實連到他自己的童年。但現在就說，等於越過了他那句「沒什麼」，把主導權從他手上拿走。他可能會回答，也可能會關上門。"
          - id: b
            text: "看到他安靜下來，對你來說很不好受。我們可以在這裡停一下，也可以先放下。你想怎樣？"
            fit: strong
            note: "它接住了他說的話，沒有和「沒什麼」爭辯，還把選擇交給他。一位不習慣談感受的個案，需要知道要走多遠是由他決定。"
          - id: c
            text: "聽起來不像沒什麼。你剛才話說到一半就停了。"
            fit: workable
            note: "你留意到的是真的。但在他剛把它揮開之後，馬上直接指出來，可能讓他覺得被抓到。有些個案會喜歡這樣。R 可能不會。"
        actual: "看到他安靜下來，對你來說很不好受。我們可以在這裡停一下，也可以先放下。你想怎樣？"
        rationale: "個案願意跟你走，深化才行得通。問他要不要留下來，不是軟弱，是用來確認的方法。如果 R 說「放下」，你就放下，門仍然開著。"
      - id: eft-emotion-types-s3-t05
        speaker: client
        text: "（停頓）……留下來吧，我想。（停頓）就像我看到自己。坐在那張飯桌前。"
      - id: eft-emotion-types-s3-t06
        speaker: therapist
        text: "你看到自己坐在那張飯桌前。"
      - id: eft-emotion-types-s3-t07
        speaker: client
        text: "不吃東西。等著這一切過去。（清喉嚨）可是我不該對他發脾氣。他才六歲。"
      - id: eft-emotion-types-s3-d4
        type: choice
        prompt: "R 給了你三樣東西：煩躁、事後覺得不好，還有飯桌前的一個男孩。他剛說了「我不該」。你跟哪一樣？"
        options:
          - id: a
            text: "你說得對，他才六歲。下次你可以怎樣做不同？"
            fit: weak
            note: "這句同意了那個「應該」，馬上跳到解決辦法。它讓 R 學到：感受是要處理的問題。飯桌前的男孩就被丟在後面。"
          - id: b
            text: "先是煩躁，然後覺得不好。我留意到的是飯桌前的那個男孩。可以回到那裡一下嗎？"
            fit: strong
            note: "你在心裡分類：煩躁是次級情緒，「我不該」是自我批評的想法，而飯桌最接近屬於 R 自己的東西。你跟的是這一個，而且先問過他。"
          - id: c
            text: "你聽起來對自己很嚴格。你覺得這是從哪裡來的？"
            fit: workable
            note: "自我批評是真的，你之後會回到它。這個問題要他解釋它從哪裡來，R 會在腦子裡給一個答案。飯桌那一幕更有生命。"
        actual: "先是煩躁，然後覺得不好。我留意到的是飯桌前的那個男孩。可以回到那裡一下嗎？"
        rationale: "分辨情緒的種類是無聲的工作。R 聽不到任何標籤。他聽到的是你留在最重要的東西上，也聽到你先徵求他同意。煩躁和內疚都是真的，它們也在通往別的地方的路上。"
      - id: eft-emotion-types-s3-t08
        speaker: client
        text: "（停頓，聲音更輕）嗯。那張飯桌。對。"
    notes:
      goals: "R 想要「幾個方法」來處理脾氣。目前沒有改變。被問到時，他願意留在一個場景裡。"
      alliance: "情感連結：給他選擇時他留了下來，是好的跡象。任務：他仍然期待方法，而今天做的不是方法。之後的會談要把這一點說開。目標：還未達成共識。"
      formulation_update: "待驗證的工作想法：對兒子的煩躁是次級情緒。它跟在兒子安靜下來之後，讓 R 回到童年的一個場景（一張飯桌，等著一切過去）。自我批評（「我不該」）緊接而來。原發的感受還沒有名字，我也不替他說。"
  - id: eft-emotion-types-s4
    title: "第 4 次會談：「那另外五分去了哪裡？」"
    turns:
      - id: eft-emotion-types-s4-t01
        speaker: therapist
        text: "上星期你回到了那張飯桌前。之後的感覺是怎樣的？"
      - id: eft-emotion-types-s4-t02
        speaker: client
        text: "我斷斷續續想過。多數是在車上。（停頓）我想起我的成績單。中三。數學九十五分。我爸看了很久。"
      - id: eft-emotion-types-s4-t03
        speaker: therapist
        text: "看了很久。"
      - id: eft-emotion-types-s4-t04
        speaker: client
        text: "然後他說：「那另外五分去了哪裡？」（短促地笑）經典。我現在飯局上還會講這個故事。"
      - id: eft-emotion-types-s4-d1
        type: choice
        prompt: "R 把這個故事當笑話講。他先說的是「看了很久」，說的時候還別開了視線。你怎麼做？"
        options:
          - id: a
            text: "（微笑）這個好笑。你怎麼回他的？"
            fit: weak
            note: "你加入了這個笑話。R 會高興，那一刻就過去了。他可能會當成你也比較喜歡把這件事當笑話。"
          - id: b
            text: "你把它當成好笑的故事來講。可是你先說的是那個很久的眼神。"
            fit: strong
            note: "它同時反映了兩邊：他講故事的方式，和他最先記得的東西，沒有偏向哪一邊。它讓他自由地說出那個眼神是什麼。"
          - id: c
            text: "聽起來那讓你很受傷。"
            fit: workable
            note: "這可能是真的，之後你多半會說類似的話。現在說，是替 R 說出他還沒說的感受。他可能覺得被看穿，也可能又用笑話帶過。"
        actual: "你把它當成好笑的故事來講。可是你先說的是那個很久的眼神。"
        rationale: "笑話和清喉嚨，是 R 從感受退後的方式。它們不是敵人。把這個對比反映出來，讓他知道你看到了故事，也看到了那個眼神，你沒有選邊。"
      - id: eft-emotion-types-s4-t05
        speaker: client
        text: "（輕聲）那個眼神。對。我在等。等他……（清喉嚨）算了。他也沒說錯吧。那份考卷我本來可以做得更好。有幾個粗心的錯誤。"
      - id: eft-emotion-types-s4-d2
        type: choice
        prompt: "R 說他父親沒有說錯。你感覺到底下有些東西，也許是羞愧，但你不確定。你怎麼做？"
        options:
          - id: a
            text: "聽起來你當時覺得很羞愧。"
            fit: weak
            note: "你甚至可能是對的。但先說出這個詞，等於告訴 R 他感覺到什麼，而他自己還沒走到那裡。一位和感受保持距離的人，可能同意這個詞，卻什麼都沒感覺到。"
          - id: b
            text: "你在等一些東西，然後聽到那五分。那個男孩聽到這句話，是什麼感覺？"
            fit: strong
            note: "它讓場景保持鮮活，問的是他的經驗，不是他的解釋。它沒有替感受命名。它留空間給 R 找自己的詞，那個詞會比你的更有分量。"
          - id: c
            text: "你把他說得很有道理。你當時希望他說什麼？"
            fit: workable
            note: "底下的需要，也就是希望被告知自己做得好，是真的，你會走到那裡。現在問，卻跳過了痛的那一段：被告知相反的話是什麼感覺。"
        actual: "你在等一些東西，然後聽到那五分。那個男孩聽到這句話，是什麼感覺？"
        rationale: "在你心裡，你把「他沒說錯」這個次級的自我辯護底下，可能的原發不適應情緒，也就是羞愧，分出來了。你把它當成猜測，沒有說出口。你問的是經驗，讓 R 自己找到詞。"
      - id: eft-emotion-types-s4-t06
        speaker: client
        text: "（停頓很久，輕聲）就像……我又做錯了。又一次。像我身上有什麼不對，而我看不到。（停頓，然後突然開朗）算了，我現在不也好好的，哈哈。老師、房貸，什麼都有。"
      - id: eft-emotion-types-s4-d3
        type: free
        prompt: "R 說了一句痛的話，然後馬上開了個玩笑。寫一句回應，同時接住他說的話和他退後的這一步，不要把他推回去。"
        actual: "這句話不容易說出口，退後一步也很合理。我們可以按你的步調走。"
        rationale: "這句回應肯定了他說那句話需要的勇氣，把玩笑看成合理的一步，不看成失敗。它沒有任何要求。它告訴 R 步調由他決定。下次他走近的時候，他知道會發生什麼。"
      - id: eft-emotion-types-s4-t07
        speaker: client
        text: "（呼氣）嗯。（停頓）這句話我沒對任何人說過。「我身上有什麼不對」。"
      - id: eft-emotion-types-s4-d4
        type: choice
        prompt: "會談快要結束。你想給 R 一個今天所聽到的整體圖像。你怎麼說？"
        options:
          - id: a
            text: "你描述的是羞愧。在嚴格的父母底下長大的人，這很常見。"
            fit: weak
            note: "這句給了 R 一個標籤，還把他歸入一般的類別。他可能一時覺得被理解，然後覺得自己只是一個案例。它也告訴了他他感覺到什麼。"
          - id: b
            text: "今天我們聽到煩躁底下的一部分：一個覺得自己有什麼不對的男孩。我還不知道這樣說對不對。你聽了是什麼感覺？"
            fit: strong
            note: "它把圖像當成猜測提出，並說明你不知道。它用的是他自己的話。它把最後的話留給他。"
          - id: c
            text: "今天談了很多。談這些的時候，你覺得怎樣？"
            fit: workable
            note: "問問會談的感受，是好習慣。這個版本沒有給 R 一個可以抓住的圖像，所以他帶著感覺離開，卻沒有一個形狀。"
        actual: "今天我們聽到煩躁底下的一部分：一個覺得自己有什麼不對的男孩。我還不知道這樣說對不對。你聽了是什麼感覺？"
        rationale: "這個圖像是工作假設，屬於你們兩人。如果 R 說「不，不是這樣」，你想知道。"
    notes:
      goals: "目標沒有改變。R 仍然把這份工作看成「學方法」。他說了一件從沒對人說過的事。"
      alliance: "情感連結：他把一件事託付給你，然後用笑話把自己拉回來。你讓笑話留著，沒有推他。繼續這樣。任務：這份工作和方法完全不同，而 R 沒有反對。不久後要公開問一問。"
      formulation_update: "第一次接觸到看來是原發不適應的羞愧（「我身上有什麼不對」），形成於父親面前，圍繞成就。被一個玩笑打斷，這也是他處理它的方式。煩躁和「我不該」是次級情緒。原發適應的感受，也就是未被看見的哀傷和憤怒，還沒有出現。不要去找。"
