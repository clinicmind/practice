sessions:
  - id: eft-attunement-s1
    title: "第 1 次會談：「我只是想學點方法」"
    turns:
      - id: eft-attunement-s1-t01
        speaker: therapist
        text: "R，請進，坐哪裡都可以。謝謝你來。我想先聽聽，是什麼讓你來到這裡，用你自己的話說。"
      - id: eft-attunement-s1-t02
        speaker: client
        text: "我太太覺得我應該來。我最近脾氣不好。我無緣無故對兒子發了火。我想，這種事總有方法的。呼吸啊，情緒管理啊，之類的。我只是想要一些工具。"
      - id: eft-attunement-s1-d1
        type: choice
        prompt: "R 一開口就要方法。你怎樣說？"
        options:
          - id: a
            text: "有一些很好的方法可以處理脾氣。在教你之前，我想多了解一點，這樣才能選對方法。"
            fit: workable
            note: "它認真看待他的要求，也坦白表示不會一開始就教技巧。但它把他的要求當成通往別處的一步，而且在你還不知道要教什麼之前，就先承諾了技巧。"
          - id: b
            text: "你來是想帶走一些用得上的東西，這個要求很合理。要讓它適合你，我想聽聽最近一次發生的情形。那一刻對你來說是什麼樣子？"
            fit: strong
            note: "它接受他的要求，卻沒有答應用某個方法，並且給出一個他自己看得懂的理由。問題指向他對一個時刻的體驗，不是泛泛地問他的感受。"
          - id: c
            text: "方法有幫助，不過我的經驗是，持久的改變來自了解憤怒底下的感受。"
            fit: weak
            note: "這可能是你相信的。但在第一分鐘就說，等於和他的要求爭辯，告訴他他誤會了治療。想保持距離的個案，聽了只會退得更遠。"
        actual: "你來是想帶走一些用得上的東西，這個要求很合理。要讓它適合你，我想聽聽最近一次發生的情形。那一刻對你來說是什麼樣子？"
        rationale: "你不必贏得「治療是什麼」的爭論。要求工具的個案，是在告訴你他希望怎樣被幫助。認真看待這一點，並提供一條從他自己的體驗出發的入口。"
      - id: eft-attunement-s1-t03
        speaker: client
        text: "上星期。我兒子把書包從椅子上碰掉了，我就……唉，其實沒什麼大不了。他才六歲。我提高了聲音，他就不作聲了。就是這一點讓我難受。"
      - id: eft-attunement-s1-d2
        type: choice
        prompt: "R 說讓他難受的是兒子不作聲了。你怎樣說？"
        options:
          - id: a
            text: "他不作聲了，這一點你放不下。"
            fit: strong
            note: "它用的是他自己指出的位置。他告訴你哪裡痛，你幾乎用他的原話交還給他。它沒有替他說出感受，也沒有發問。"
          - id: b
            text: "聽起來是內疚。你希望自己沒有提高聲音。"
            fit: workable
            note: "這可能完全說中了。但他沒有說「內疚」，這樣一個標籤可能會把這一刻關上。他指出的是那份安靜。"
          - id: c
            text: "你覺得是什麼引發了你大聲說話？是累了、工作壓力，還是別的？"
            fit: weak
            note: "它從他最鮮活的一句話，直接跳到找原因。他要的是方法，所以可能樂意跟著你走。你會得到一張原因清單，卻失去了那份安靜。"
        actual: "他不作聲了，這一點你放不下。"
        rationale: "當個案說「就是這一點讓我難受」，他已經告訴你他體驗的邊緣在哪裡。停在那裡。原因以後有的是時間談。"
      - id: eft-attunement-s1-t04
        speaker: client
        text: "嗯。（停頓）反正，所以我才想，如果有幾個技巧，我就能在發火之前截住自己。"
      - id: eft-attunement-s1-d3
        type: free
        prompt: "剛有了一刻接觸，R 又回到要技巧。寫一句回應，同時保留他的要求和他剛才顯露的東西。"
        actual: "你想在發火之前截住自己，這樣他就不用再那樣安靜下來。這個我們一起做。我也想把你和兒子的那一刻放在旁邊，因為它好像對你很重要。"
        rationale: "這不是在他的要求和他的體驗之間二選一。你對他想要的說好，也沒有放下他剛才差點讓你看見的那一刻。你也沒有指出他退回去了，那會讓他覺得自己被盯著。留意：他是自己走到邊緣的。"
      - id: eft-attunement-s1-t05
        speaker: client
        text: "（聳聳肩）好吧，可以。你還需要我做什麼？"
      - id: eft-attunement-s1-t06
        speaker: therapist
        text: "如果你願意，說說一個平常的晚上在家的樣子。想到什麼就說什麼。"
      - id: eft-attunement-s1-t07
        speaker: client
        text: "沒什麼特別。我回到家，我太太已經把兒子哄睡了。我隨便吃點東西。家裡有點……空空的，我想。沒關係的。只是晚上而已。"
      - id: eft-attunement-s1-d4
        type: choice
        prompt: "R 提到家裡空空的，又說沒關係。你怎樣做？"
        options:
          - id: a
            text: "「空空的」是你想到的詞，就算你不覺得它重要。我想多聽一點，如果你願意的話。"
            fit: strong
            note: "它留住他的用詞，也沒有和「沒關係」爭辯。邀請由他決定接受還是不接受。"
          - id: b
            text: "聽起來一天之中這個時候，你會覺得孤單。"
            fit: workable
            note: "語氣溫和，也是合理的猜測。但「孤單」是你的詞，他沒有給過這個詞。而淡化自己體驗的個案，很可能只答一句「也不是」。"
          - id: c
            text: "這有沒有影響你的睡眠、食慾、工作上的專注力？"
            fit: weak
            note: "一份清單。這類問題有適當的時機，但在這裡問，是告訴他他那個詞不夠，並把一句輕輕的披露變成了症狀。"
        actual: "「空空的」是你想到的詞，就算你不覺得它重要。我想多聽一點，如果你願意的話。"
        rationale: "習慣淡化的個案，常常正好指出了該看哪裡。你不必推。邀請就夠了，而且他可以拒絕。"
      - id: eft-attunement-s1-t08
        speaker: client
        text: "（停頓）很靜。就這樣。電視開著，但我沒有在看。（清喉嚨）反正。"
      - id: eft-attunement-s1-t09
        speaker: therapist
        text: "電視開著，你沒有在看。今天先停在這裡。時間差不多了。談這些，感覺怎樣？"
      - id: eft-attunement-s1-t10
        speaker: client
        text: "沒有我想像中那麼糟。不過我還是想要那些工具。"
      - id: eft-attunement-s1-t11
        speaker: therapist
        text: "那我們就把這一項留在清單上。如果你同意，我也想我們多留意那些晚上。"
    notes:
      goals: "R 說出的目標：控制脾氣的工具。你們兩人還沒有共同的目標。可能的方向：了解他提高聲音前後發生了什麼。"
      alliance: "情感連結：小心翼翼。他在試探你會不會認真看待他的要求。任務：他期待方法，而你還沒有解釋自己怎樣工作。現在不要長篇解釋。目標：他的目標很清楚，你的目標還未成為其中一部分。"
      formulation_update: "初步觀察，輕輕放著。煩躁、事後後悔、晚上空空的。接觸一靠近，他就退回技巧。家庭和過去的事暫時沒有談到。"
  - id: eft-attunement-s2
    title: "第 2 次會談：「呼吸那一招，有一次有用」"
    turns:
      - id: eft-attunement-s2-t01
        speaker: therapist
        text: "R，你好。這個星期過得怎樣？"
      - id: eft-attunement-s2-t02
        speaker: client
        text: "還好。我試了網上找到的那個呼吸法。有一次有用。（停頓）然後星期四就沒用了。"
      - id: eft-attunement-s2-d1
        type: choice
        prompt: "R 試了一個技巧，有一次有用，後來沒用。你怎樣說？"
        options:
          - id: a
            text: "你肯試很好。我們來看看星期四為什麼沒用，再調整一下。"
            fit: workable
            note: "合理，也尊重他想要方法的心意。但它把技巧變成話題，把星期四變成技巧的失敗。他在星期四發生了什麼，才是更值得看的。"
          - id: b
            text: "你是認真試過了，而星期四不一樣。星期四是怎樣的？"
            fit: strong
            note: "它肯定了他的嘗試，並把焦點移到他身上發生的事，而不是技巧做了什麼。"
          - id: c
            text: "呼吸練習不是我們這裡做的事。我們處理的是感受。"
            fit: weak
            note: "它否定了他真心做過的事，也把這個取向放到了他的來意的對面。"
        actual: "你是認真試過了，而星期四不一樣。星期四是怎樣的？"
        rationale: "他的匯報是一份禮物：一個近期、具體的時刻。肯定他的努力，不為技巧辯護，也不攻擊它，然後問那一刻。"
      - id: eft-attunement-s2-t03
        speaker: client
        text: "星期四……我在廚房桌子上改最後一批作業。大概半夜了。我自己的答案本上有一題寫錯了，我就罵了自己。小聲地。「沒用。連這個都做不好。」（輕輕笑了一下）"
      - id: eft-attunement-s2-d2
        type: free
        prompt: "R 告訴你他對自己說了什麼，然後笑了。寫一句同理回應。停在他告訴你的內容上。不要詮釋，也不要問這代表什麼。"
        actual: "半夜，一個人在廚房，一題寫錯了，那個詞就對著自己說出來。然後你笑了。"
        rationale: "它照他給的樣子，把場景一塊一塊交還給他，也包括那一下笑，卻沒有說笑代表什麼。它沒有給那把聲音貼標籤，也沒有告訴他它很苛刻。他已經用自己的方式告訴你了。"
      - id: eft-attunement-s2-t04
        speaker: client
        text: "（笑聲淡去）嗯。人就是這樣的。要對自己狠一點。不然怎麼把事情做好？"
      - id: eft-attunement-s2-d3
        type: choice
        prompt: "R 為那把苛刻的聲音辯護。你怎樣說？"
        options:
          - id: a
            text: "那把聲音替你做了一份工作。事情靠它才做得成。"
            fit: strong
            note: "它沒有同意他沒用，也沒有和那把聲音爭辯。它說出他剛剛說這把聲音為他做的事，所以他留在對話裡。"
          - id: b
            text: "你覺得這樣對自己說話有幫助嗎？你會這樣對兒子說嗎？"
            fit: weak
            note: "這是挑戰，還附帶一個製造內疚的比較。它把對那把聲音的第一眼，變成了對他作為父親的裁決。"
          - id: c
            text: "很多人對自己都很嚴苛。這很常見。"
            fit: workable
            note: "是事實，也是好意。但它把他自己的經驗變成人人都有的東西，同時把話題關掉了。"
        actual: "那把聲音替你做了一份工作。事情靠它才做得成。"
        rationale: "現在還早。你的目標是了解這對他來說是怎樣的，不是改變它。這個階段後面，當個案的自我批評出現了相應的標記，有專門的任務處理。那不是這次會談的工作。"
      - id: eft-attunement-s2-t05
        speaker: client
        text: "（聳聳肩）我就是這樣被帶大的。對自己心軟，是不會有出息的。（停頓）所以我們到底在做什麼？方法在哪裡？"
      - id: eft-attunement-s2-d4
        type: choice
        prompt: "R 直接問方法是什麼。你怎樣回答？"
        options:
          - id: a
            text: "問得好。我們會慢下來，停在像星期四晚上那樣的時刻，我幫你留意那一刻你裡面正在發生什麼。很多時候，是這份留意改變了你接下來怎麼做。走到多深由你決定，也隨時可以停。"
            fit: strong
            note: "它誠實、簡短地用他聽得懂的話回答。它告訴他方法在哪裡，也把節奏交在他手上。"
          - id: b
            text: "方法就是治療關係本身。相信這個過程就好。"
            fit: weak
            note: "聽起來像個答案，其實什麼都沒告訴他。要求工具的個案，是想知道自己答應了什麼。"
          - id: c
            text: "我們會慢慢累積一些技巧，不過先要了解憤怒背後是什麼。"
            fit: workable
            note: "有一部分是誠實的。但它承諾了你可能不會教的技巧，而「憤怒背後」又暗示憤怒只是症狀。"
        actual: "問得好。我們會慢下來，停在像星期四晚上那樣的時刻，我幫你留意那一刻你裡面正在發生什麼。很多時候，是這份留意改變了你接下來怎麼做。走到多深由你決定，也隨時可以停。"
        rationale: "個案一問，你就欠他一個說明：你怎樣工作，用平實的話。說得簡短，把選擇留給他。同理調頻不等於對自己的方法一言不發。"
      - id: eft-attunement-s2-t06
        speaker: client
        text: "嗯。（停頓）好吧。我再試幾個星期。"
    notes:
      goals: "他的目標仍然是工具。出現了第一個和你重疊的地方：留意事情出錯的時刻發生了什麼，例如星期四晚上。還未一起說出口。"
      alliance: "情感連結：暖了一點。他說了星期四和那把聲音，也讓你問方法。任務：你簡短解釋了自己怎樣工作。留意「我再試幾個星期」：這是許可，不是同意。"
      formulation_update: "注意到自我批評的聲音：「沒用」，他為它辯護，說是必要的。「被這樣帶大」是一個入口，還沒有探索。他沒有先提起之前，不要主動去碰。記住第一次會談的那些空空的晚上。"
