eft-attunement-e01:
  model_response: "你一進門，有些東西讓你在走廊停下來，停在那片安靜裡。聽起來好像那片安靜裡有些東西，你還說不出來。"
  why: "它用的是他自己的畫面：走廊和安靜。它把「我也不知道為什麼」當成一個還開著的邊緣，而不是一個要填的空白。"
  avoid: "「也許你回到家覺得孤單。」它替他補上了一個他說自己沒有的答案。"
eft-attunement-e02:
  model_response: "你對她說「很好」，也許你裡面有一部分知道，這不太是真的。"
  why: "它把他說的兩件事並排放著，不選其中一邊。"
  avoid: "「你為什麼不告訴她你真正的感覺？」這是建議，也跳過了那個知道真相的部分。"
eft-attunement-e03:
  model_response: "有什麼東西讓你留在書桌前，遠遠超過必須的時間。也許很難找到那個可以停下來的地方。"
  why: "它停在他描述的那股拉力上，沒有解釋它。「也許」讓他可以糾正。"
  avoid: "「你可能是完美主義者。」這是一個標籤，探索就此結束。"
eft-attunement-e04:
  model_response: "他問了一個很簡單的問題，而你發現自己什麼都答不出來。這件事好像一直留在你心裡。"
  why: "它照他說的把那一刻交還給他，其餘留給他自己。"
  avoid: "「小孩常常不明白大人的怒氣。」這是解釋，把他還站在其中的那一刻的重量拿走了。"
eft-attunement-e05:
  model_response: "休息聽起來像一片空出來的地方，也許你不知道該放什麼進去。"
  why: "它接上他自己的話，「休息的時候要做什麼」，並提出一個他可以糾正的猜測。"
  avoid: "「你還是應該試試。休息很重要。」這是建議，而且回應的是別人的話，不是他的。"
eft-attunement-e06:
  model_response: "好像有一塊石頭壓在你的胸口。不是尖的，只是沉，一直在那裡。"
  why: "它留住他的畫面和細節（「不是尖的」「就是在那裡」）。它只加了「沉」，而這是從石頭自然帶出來的。"
  avoid: "「聽起來是悲傷。」一個標籤，比他給你的畫面平淡得多。"
eft-attunement-e07:
  model_response: "你裡面一下子全靜下來，好像有人把聲音關掉了。"
  why: "它停在他的感官字眼「靜」上，只延伸了一小步。"
  avoid: "「所以你是封閉起來了。」它把他的畫面翻譯成術語，而畫面才是最好的部分。"
eft-attunement-e08:
  model_response: "你的手比你自己先抖了。好像你的身體先知道了。"
  why: "它像他一樣先說身體，並把「先知道」當成猜測提出。"
  avoid: "「你在氣什麼？」它轉去問故事，把那雙手留在後面。"
eft-attunement-e09:
  model_response: "到了晚上，房子好像長大了，你身邊多出太多空間。"
  why: "它把「太大」變成看得見的東西。沒有加入事件，也沒有解釋。"
  avoid: "「你晚上會覺得孤單嗎？」它發了問，還給他的畫面貼上標籤。"
eft-attunement-e10:
  model_response: "你盯著那張紙，感覺它好像是別人的。"
  why: "它用的是他自己的動作（盯著），和他自己的距離（「不像是在說我」）。"
  avoid: "「你當時嚇呆了。」它替他說出一種狀態，也把那張紙從畫面裡拿走了。"
eft-attunement-m01:
  model_response: "大家說話，你聽著，而「一向都是這樣」聽起來好像帶著些什麼。也許你有一部分，一直待在桌子的邊上。"
  why: "它抓住「一向都是這樣」裡的分量，給了一個畫面，沒有催他說得比已經說的更多。"
  avoid: "「那樣有沒有讓你覺得孤單？」它要求一個他沒有給出的感受，他可以直接說沒有。"
eft-attunement-m02:
  model_response: "是很小的事，可是它還是碰到你了。你有一部分好像在和這份難受爭辯，而它還在這裡。"
  why: "它沒有和「可笑」爭辯。它用他的字眼，並指出同時有兩件事在發生。"
  avoid: "「一點也不可笑。」它糾正了他的用詞，讓他不得不為它辯護。"
eft-attunement-m03:
  model_response: "有一部分的你已經準備好走，另一部分抓著那十二年。兩邊都是真的。"
  why: "它兩邊都留住，也沒有說哪一邊才是對的。"
  avoid: "「如果你離開了，你會做什麼？」它在他還沒有感受這個兩難之前，就開始解決它。"
eft-attunement-m04:
  model_response: "「沒什麼好說的」，然後你停了一下。聽起來好像在那個停頓後面，有些什麼。"
  why: "它把他自己的停頓交還給他，沒有追問停頓後面是什麼。"
  avoid: "「你沒有告訴她的是什麼？」它要求內容，把停頓變成了障礙。"
eft-attunement-m05:
  model_response: "她為你很辛苦，而「我們不算親近」聽起來，裡面好像比你平常說出口的多一些。"
  why: "它先承認他給出的東西，也就是她的辛苦，然後輕輕點到他說得很輕的那一部分。"
  avoid: "「你希望你們更親近一些。」它很肯定地說出一個他沒有說出口的願望。"
eft-attunement-m06:
  model_response: "鈴聲穿過你，你整個身體在你還沒看一眼螢幕之前就繃緊了。"
  why: "它停在他的緊繃上，並把它變成一段有先後的時間：先是鈴聲，然後是繃緊，這個次序他認得出來。"
  avoid: "「電話響的時候你會焦慮。」是真的，但很平，把這一刻漏掉了。"
eft-attunement-m07:
  model_response: "到了星期四，那個笑容已經變成你一直撐著的東西。你的臉都痠了。"
  why: "它用他的細節，也就是痠痛的臉，並說出從裡面看是什麼樣子。"
  avoid: "「你假裝得很累。」它說出一個他沒有承認過的動機。"
eft-attunement-m08:
  model_response: "大家都在慶祝，而你裡面很平，好像本來該亮起來的燈，沒有亮。"
  why: "它留住外面和裡面的對比，並給「平」一個具體的畫面。"
  avoid: "「你一定很失望。」它猜的是另一種感受，不是他說出的那一種。"
eft-attunement-m09:
  model_response: "她的手臂環住你，你就站在那裡，僵得像一塊木板，好像你的身體不知道該拿這個怎麼辦。"
  why: "它停在木板這個畫面上，並對那份僵硬是什麼樣子，提出一個猜測。"
  avoid: "「你不喜歡被碰嗎？」它把一個時刻變成了對他的結論。"
eft-attunement-m10:
  model_response: "聽起來是中間的十分鐘，坐在車裡，一天在身後，那扇門在前面。"
  why: "它把他說的放成一個「中間」的時刻，只用他給的細節：車、十分鐘、那扇門。那個空間裡有什麼，由他填。"
  avoid: "「你不想回家。」它替他說出了那個停頓的意思。"
eft-attunement-h01:
  model_response: "你想要一些真的用得上的東西，而你已經等了夠久了。告訴我，你最希望哪裡不一樣，我們就從那裡開始。"
  why: "它對要求說好，也說出要求底下的壓力。它沒有為感受爭辯，下一步也保持實際。"
  avoid: "「要先了解你的感受，技巧才有用。」它和他的要求爭辯，告訴他他看錯了治療。"
eft-attunement-h02:
  model_response: "你寧可我不要，那我不逼你。不過剛才有些東西靠得很近。你想放多久都可以。"
  why: "它尊重那句「不要」，誠實地說出兩個人都看到的，並把什麼時候回來的主導權交給他。"
  avoid: "「在這裡哭沒關係的。」它用一個他沒有要求的許可，蓋過了他的「不要」。"
eft-attunement-h03:
  model_response: "你一直在把日子過下去，你覺得沒有什麼不對。坐在這裡不容易，因為是別人看見了些什麼。"
  why: "它相信他的話，並說出被送來的那份不自在。它沒有告訴他他錯了。"
  avoid: "「你太太一定很擔心你。」它站到她那一邊，把他變成了問題。"
eft-attunement-h04:
  model_response: "壓力，每個人都有的那種。你是這樣看的，而你不想把它說成更大的事。"
  why: "它接受他的框架，並說出他的心願：讓事情保持簡單。它沒有說還有更多。"
  avoid: "「有時候壓力是用來蓋住更深的東西。」它和他的框架爭辯。"
eft-attunement-h05:
  model_response: "（輕聲）有些東西浮上來了，而「沒什麼」是現在最合適的詞。我們可以和這份安靜待在一起。"
  why: "它把沉默當成工作的一部分，對他沒有任何要求。「沒什麼」這個詞被接受，沒有被質疑。"
  avoid: "「我覺得那裡有些東西。你可以告訴我嗎？」它又問了他一次，而他剛剛才說了不。"
eft-attunement-h06:
  model_response: "星期二全垮了，而咖啡是唯一撐住的東西。聽起來那天你是靠抓住一些小東西熬過來的。"
  why: "它把他的玩笑當成入口，說得具體，也停在他自己選的強度。"
  avoid: "「聽起來那真的很痛苦。」它推向一個他不肯說出的感受，他會聽出他的玩笑沒有奏效。"
eft-attunement-h07:
  model_response: "哭不是你處理事情的方式。你很快擦了一下眼睛，我只是留意到。"
  why: "它尊重他的規則，只描述看得見的東西。它沒有說出一種感受，也沒有說他應該讓它出來。"
  avoid: "「在這裡你不用忍著。」它用一個他沒有要求的邀請，蓋過了「我不哭」。"
eft-attunement-h08:
  model_response: "嚴格，結實，沒有人能越過那道門。聽起來它讓你在那間課室裡覺得安全。"
  why: "它反映了他對這個形象的自豪，並對它為他做的事提出一個試探的猜測。"
  avoid: "「嚴格會不會讓人覺得孤單？」它瞄準了他自豪背後的感受，而他沒有要這個。"
eft-attunement-h09:
  model_response: "很靜，只有你和紙頁。聽起來是一個沒有人向你要求任何東西的地方。"
  why: "它停在他描述的場景裡，並跟著「很靜」前那個小小的停頓，卻沒有說那個停頓是什麼意思。"
  avoid: "「離開家人，會不會覺得輕鬆？」它加入了一個他沒有提過的家人。"
eft-attunement-h10:
  model_response: "她看著你，而你覺得自己被看穿了「只是累了」。那是一種你寧願不要落在身上的眼神。"
  why: "它交還了那個眼神，和它對他的作用。它沒有偏幫他太太，也沒有說他在藏什麼。"
  avoid: "「她是擔心你。」它替她辯護，把他獨自留在那個眼神裡。"
