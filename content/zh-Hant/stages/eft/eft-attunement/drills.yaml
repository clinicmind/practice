# 30 題練習：每個級別 10 題，每個級別每項技能 5 題。

- id: eft-attunement-e01
  level: easy
  skill: empathic-exploration
  context: "早期的會談。個案在描述他的晚上。"
  client: "我回到家，家裡很靜。我就在走廊站一會兒。我也不知道為什麼。"
  criteria: &ee_easy
    - "停在個案剛說的內容上，用他自己的字詞或細節。不轉換話題。"
    - "以猜測的方式提出，讓個案可以糾正，例如「聽起來好像」「也許」。"
    - "留空間讓個案多說。不包含建議、解釋或安慰。"
- id: eft-attunement-e02
  level: easy
  skill: empathic-exploration
  context: "早期的會談。"
  client: "我姐姐一直問我還好不好。我說我很好。但我覺得我不太好。"
  criteria: *ee_easy
- id: eft-attunement-e03
  level: easy
  skill: empathic-exploration
  context: "早期的會談。"
  client: "這個月我每晚都改作業改到半夜。沒有人要我這樣做。我就是好像停不下來。"
  criteria: *ee_easy
- id: eft-attunement-e04
  level: easy
  skill: empathic-exploration
  context: "早期的會談。"
  client: "我兒子問我，為什麼要吼他。我答不出來。"
  criteria: *ee_easy
- id: eft-attunement-e05
  level: easy
  skill: empathic-exploration
  context: "早期的會談。"
  client: "每個人都叫我休息一下。我不知道休息的時候要做什麼。"
  criteria: *ee_easy

- id: eft-attunement-e06
  level: easy
  skill: evocative-reflection
  context: "早期的會談。個案說話時按著胸口。"
  client: "胸口好像壓了一塊石頭。不是尖的。就是在那裡。"
  criteria: &er_easy
    - "用具體的字眼說出這份體驗，例如一種身體感覺、一個畫面或一個動作，而不只是一個感受的標籤。"
    - "建立在個案自己的字詞和細節上。不加入新的故事或事件。"
    - "一兩句短句，以試探的方式提出，沒有提問，也沒有建議。"
- id: eft-attunement-e07
  level: easy
  skill: evocative-reflection
  context: "早期的會談。"
  client: "他那樣說的時候，我裡面一下子全靜下來了。"
  criteria: *er_easy
- id: eft-attunement-e08
  level: easy
  skill: evocative-reflection
  context: "早期的會談。"
  client: "我走出會議室，手在發抖。我連自己在生氣都不知道。"
  criteria: *er_easy
- id: eft-attunement-e09
  level: easy
  skill: evocative-reflection
  context: "早期的會談。"
  client: "晚上的時候，房子好像變得太大了。"
  criteria: *er_easy
- id: eft-attunement-e10
  level: easy
  skill: evocative-reflection
  context: "早期的會談。"
  client: "結果出來的時候，我只是盯著那張紙。感覺不像是在說我。"
  criteria: *er_easy

- id: eft-attunement-m01
  level: medium
  skill: empathic-exploration
  context: "第二次會談。個案以平淡的聲音描述一次家庭聚餐。"
  client: "還好。大家都在說話。我大部分時間在聽。一向都是這樣。"
  criteria: &ee_medium
    - "捕捉個案話語邊緣的東西，例如隱含的、保留的或分裂的部分，並且不催促地交還給他。"
    - "尊重個案的說法。不和淡化的字眼爭辯，也不糾正。"
    - "試探性的、簡短，結尾開放。不包含建議，也不解釋原因。"
- id: eft-attunement-m02
  level: medium
  skill: empathic-exploration
  context: "第二次會談。"
  client: "我知道為了在工作時打翻一杯飲料就這麼難受，是不應該的。很可笑。"
  criteria: *ee_medium
- id: eft-attunement-m03
  level: medium
  skill: empathic-exploration
  context: "第二次會談。"
  client: "有一部分的我想離開這份工作。另一部分說，這樣就把十二年都丟掉了。"
  criteria: *ee_medium
- id: eft-attunement-m04
  level: medium
  skill: empathic-exploration
  context: "第二次會談。個案停了一下，然後繼續說。"
  client: "我太太說我什麼都不跟她說。我說沒什麼好說的。（停頓）也不完全是這樣。"
  criteria: *ee_medium
- id: eft-attunement-m05
  level: medium
  skill: empathic-exploration
  context: "第二次會談。"
  client: "她把我帶大，我想是吧。她很辛苦。我們不算親近，不過就是這樣。"
  criteria: *ee_medium

- id: eft-attunement-m06
  level: medium
  skill: evocative-reflection
  context: "第二次會談。個案的肩膀抬高了。"
  client: "每次電話一響，我整個人就繃緊。我知道這很傻。"
  criteria: &er_medium
    - "用個案給出的、或明顯隱含的身體、畫面或動作細節，把這一刻說得鮮活。"
    - "捕捉這一刻對個案來說是怎樣的，而不只是發生了什麼。"
    - "貼近個案顯露的東西。不說出個案沒有暗示過的更深感受，也不提問。"
- id: eft-attunement-m07
  level: medium
  skill: evocative-reflection
  context: "第二次會談。"
  client: "我在學校對每個人微笑。到了星期四，我的臉都痛了。"
  criteria: *er_medium
- id: eft-attunement-m08
  level: medium
  skill: evocative-reflection
  context: "第二次會談。"
  client: "論文交了。大家都在恭喜我。我就是覺得……很平。"
  criteria: *er_medium
- id: eft-attunement-m09
  level: medium
  skill: evocative-reflection
  context: "第二次會談。"
  client: "她抱了我，我就那樣站著，像一塊木板。"
  criteria: *er_medium
- id: eft-attunement-m10
  level: medium
  skill: evocative-reflection
  context: "第二次會談。"
  client: "一天結束的時候，我會在車裡坐十分鐘，才進屋。"
  criteria: *er_medium

- id: eft-attunement-h01
  level: hard
  skill: empathic-exploration
  context: "第三次會談。你剛問他吵架時有什麼感覺。"
  client: "感覺。好吧。你看，我是個務實的人。你可不可以直接告訴我該怎麼辦？"
  criteria: &ee_hard
    - "尊重個案剛說的話或要求，例如拒絕、玩笑或請求。不爭辯，不為這種取向辯護，也不解釋為什麼感受重要。"
    - "仍然停在個案的體驗上，例如他承受的壓力、他的防備，或剛好在表面之下的東西。不轉去建議或教導。"
    - "簡短，並讓個案有路可以繼續，包括輕輕地說下去，或說不。"
- id: eft-attunement-h02
  level: hard
  skill: empathic-exploration
  context: "第三次會談。個案的眼眶剛紅了。然後他笑了。"
  client: "（笑）你是要讓我哭出來，對不對？不要。"
  criteria: *ee_hard
- id: eft-attunement-h03
  level: hard
  skill: empathic-exploration
  context: "第三次會談。"
  client: "我這些年一直都很好。什麼都沒變。我不知道我太太為什麼要我來。"
  criteria: *ee_hard
- id: eft-attunement-h04
  level: hard
  skill: empathic-exploration
  context: "第三次會談。"
  client: "你看，這只是壓力。每個人都有壓力。沒有什麼更深的東西。"
  criteria: *ee_hard
- id: eft-attunement-h05
  level: hard
  skill: empathic-exploration
  context: "第三次會談。你問起上星期在學校的情形。他望向窗外，看了好一會兒。"
  client: "（很長的沉默）……沒什麼。沒什麼。"
  criteria: *ee_hard

- id: eft-attunement-h06
  level: hard
  skill: evocative-reflection
  context: "第三次會談。個案以輕快、開玩笑的語氣說一個痛苦的星期。"
  client: "哦，老樣子。星期二全都垮了，不過嘛，至少咖啡不錯。"
  criteria: &er_hard
    - "具體或鮮活，但只到個案容許的強度。不推向更深的感受。"
    - "個案防備或開玩笑時，可以反映這一點，而且不稱之為逃避或抗拒。"
    - "簡短而試探，個案可以輕輕回應，也可以不回應。"
- id: eft-attunement-h07
  level: hard
  skill: evocative-reflection
  context: "第三次會談。個案的眼睛紅了，他很快地抹了一下。"
  client: "我不哭的。從來都不。"
  criteria: *er_hard
- id: eft-attunement-h08
  level: hard
  skill: evocative-reflection
  context: "第三次會談。"
  client: "學生都說我是最嚴的那個。我喜歡這樣。沒有人敢惹我。"
  criteria: *er_hard
- id: eft-attunement-h09
  level: hard
  skill: evocative-reflection
  context: "第三次會談。"
  client: "星期天晚上我備課。那是一個星期裡最好的時間。（小小的停頓）很靜。"
  criteria: *er_hard
- id: eft-attunement-h10
  level: hard
  skill: evocative-reflection
  context: "第三次會談。"
  client: "我跟我太太說沒事，只是累了。她看了我一眼。我討厭那種眼神。"
  criteria: *er_hard
