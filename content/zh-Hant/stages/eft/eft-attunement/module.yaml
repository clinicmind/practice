slug: eft-attunement
version: 1.0.0
title: "同理調頻與同理探索"
intro: "情緒聚焦治療從個案一刻接一刻的體驗出發。同理調頻，是緊貼著這份體驗，一次又一次、帶著試探地確認自己有沒有聽對。這個階段後面的任務都要等標記出現才用，同理調頻不用等。每一次會談都用得上，其他一切都建立在它上面。同理探索不等於教技巧，也不等於蒐集資料。它跟著個案剛好說得出口的邊緣走，邀請他多說一點。這個模組裡，你會認識個案 R，一位 38 歲的中學教師，是妻子建議他來的。他說自己最近脾氣差，想學點方法。你會練習兩項技能：同理探索，以及喚起式反映，也就是把體驗化成具體、鮮活的話語。也要知道什麼時候不該用。不要用鮮活的語言把個案推向他沒有表現出來的更多感受。個案要求實用的東西時，回應他的要求，同時保持貼近。不要為感受的價值去爭辯。練習題是獨立的情境，不一定是 R 的故事。"
skills:
  - empathic-exploration
  - evocative-reflection
reflection_prompts:
  - id: eft-attunement-r1
    text: "R 一開口就要方法。順著他的要求，而不解釋為什麼感受重要，對你來說難在哪裡？你受訓的過程中，是在哪裡學到了想去解釋？"
  - id: eft-attunement-r2
    text: "找出你寫的一句喚起式反映。它有沒有停在個案已經表現出來的強度？如果它走得更遠，是什麼讓你想多伸手一步？"
  - id: eft-attunement-r3
    text: "想一位說起感受時簡短、務實的個案。和你相處十分鐘之後，你希望他留意到和你在一起是怎樣的感覺？"
