- id: assessment-e01
  level: easy
  skill: focusing
  context: "第三次會談。你問了這個星期過得怎樣。"
  client: "工作還好。我妹來探我，很開心。星期二晚上很難熬，我也不知道為什麼。還有，我的單車終於修好了。"
  criteria: &fo_easy
    - "從個案說的內容中挑出一條線索，並用個案自己的字眼說出它。"
    - "用一句陳述或一個開放式問題，邀請個案多說這條線索。"
    - "不加入你自己的話題，也不解釋你為什麼選這條線索。"
- id: assessment-e02
  level: easy
  skill: focusing
  context: "早期的會談。"
  client: "我一向都很容易擔心。錢、爸媽的健康、有沒有鎖門。最近主要是擔心工作。"
  criteria: *fo_easy
- id: assessment-e03
  level: easy
  skill: focusing
  context: "早期的會談。"
  client: "頭痛大概是三月開始的。差不多那時候我也搬了家，主管也換了人。醫生說沒有問題。"
  criteria: *fo_easy
- id: assessment-e04
  level: easy
  skill: focusing
  context: "早期的會談。"
  client: "早上我大致還好。是晚上，孩子睡了，家裡安靜下來的時候。那時候最難受。"
  criteria: *fo_easy
- id: assessment-e05
  level: easy
  skill: focusing
  context: "早期的會談。"
  client: "我跟大部分人都相處得不錯。不過我哥和我從葬禮之後就沒說過話。除此之外，家人都很親。"
  criteria: *fo_easy

- id: assessment-e06
  level: easy
  skill: summary
  context: "會談開始了十分鐘。"
  client: "大概就是這樣。我睡不著，不再去健身房，一直吃垃圾食物。我只是覺得不像自己。"
  criteria: &su_easy
    - "用比個案更少的字，整合兩至三個要點。"
    - "用你自己的話，不加入詮釋、建議或新資訊。"
    - "最後確認，例如「我這樣理解對嗎？」"
- id: assessment-e07
  level: easy
  skill: summary
  context: "個案描述了自己的工作經歷。"
  client: "我在銀行做了三年，很討厭，然後轉去慈善機構，很喜歡，直到資金沒了。現在我在做臨時工，決定不了下一步。"
  criteria: *su_easy
- id: assessment-e08
  level: easy
  skill: summary
  context: "個案描述了典型的一天。"
  client: "我六點起床，送孩子上學，上班到五點，煮飯，哄孩子睡覺，然後坐在沙發上滑手機滑到半夜。"
  criteria: *su_easy
- id: assessment-e09
  level: easy
  skill: summary
  context: "個案描述了自己的支持來源。"
  client: "有我先生，他很好，只是常常出差。我媽每個星期四幫忙帶寶寶。還有一個同事，是我可以真的講心事的人。"
  criteria: *su_easy
- id: assessment-e10
  level: easy
  skill: summary
  context: "評估會談的尾聲。"
  client: "我想我想要的是少擔心一點，好好睡覺，還有不要再對伴侶發脾氣。"
  criteria: *su_easy

- id: assessment-m01
  level: medium
  skill: focusing
  context: "早期的會談。個案說得很快，在某一處慢了下來。"
  client: "大學還好，朋友不錯，成績也好。二年級有點不順。然後畢業，找到工作，搬來這裡。其實一切都按計畫進行。"
  criteria: &fo_medium
    - "挑出個案很快帶過或淡化的那條線索。"
    - "用個案自己的字眼說出那條線索，不暗示情況比個案說的更糟。"
    - "只有一個簡短的邀請，不問「為什麼」。"
- id: assessment-m02
  level: medium
  skill: focusing
  context: "早期的會談。"
  client: "我們小時候我爸會喝一點酒。總之，我真正想談的是我老闆這件事。"
  criteria: *fo_medium
- id: assessment-m03
  level: medium
  skill: focusing
  context: "早期的會談。說到最後一句時，個案的聲音低了下來。"
  client: "恐慌發作會在火車上、開會時、超級市場裡出現。都是我走不了的地方。第一次是在我的婚禮上。"
  criteria: *fo_medium
- id: assessment-m04
  level: medium
  skill: focusing
  context: "早期的會談。"
  client: "忙的時候我沒事。老實說，問題是週末。嗯，星期日。準確一點說，是星期日下午。"
  criteria: *fo_medium
- id: assessment-m05
  level: medium
  skill: focusing
  context: "早期的會談。"
  client: "我以前也有過低潮，斷斷續續的。生完孩子之後當然有。大學時有一次。這一次不一樣，雖然我說不出哪裡不一樣。"
  criteria: *fo_medium

- id: assessment-m06
  level: medium
  skill: summary
  context: "個案描述了兩段已經結束的感情。"
  client: "跟阿森在一起的時候，總是我在安排所有事，後來我受夠了，就走了。跟阿祖也是一樣，所有事都是我做，然後有一天我受夠了。"
  criteria: &su_medium
    - "把重複的元素以同樣的次序並排，讓個案看見重複的地方。"
    - "不說出模式，也不解釋模式。沒有「所以看起來」。"
    - "比個案說的短，最後確認。"
- id: assessment-m07
  level: medium
  skill: summary
  context: "個案描述了焦慮什麼時候好些、什麼時候差些。"
  client: "星期一早上和團隊會議之前很糟。去健身房沒事，跟孩子在一起也沒事。噢，還有考績面談的時候糟透了。"
  criteria: *su_medium
- id: assessment-m08
  level: medium
  skill: summary
  context: "個案在描述對媽媽的複雜感受。"
  client: "她為我們做了所有事。打三份工。卻從來沒有問過我好不好。我欠她一切。我跟她待在同一個房間超過一個小時就受不了。"
  criteria: *su_medium
- id: assessment-m09
  level: medium
  skill: summary
  context: "個案描述了三次中斷治療的經過。"
  client: "第一個輔導員，她去放假之後我就沒再去了。第二個轉去了別的診所，我沒有跟過去。最後一個，我取消了一次，之後就沒有再約。"
  criteria: *su_medium
- id: assessment-m10
  level: medium
  skill: summary
  context: "個案描述了喝酒的情況。"
  client: "平日我不喝酒。嗯，工作不順的話會喝一杯。最近幾乎天天都不順。不過我從來不會自己一個人喝。除非伴侶不在家。"
  criteria: *su_medium

- id: assessment-h01
  level: hard
  skill: focusing
  context: "你問了個案的童年。"
  client: "噢，又來了。最後總是會繞回媽媽身上，對吧？好啊。童年很快樂，房子很好，下一題。"
  criteria: &fo_hard
    - "保持或選擇一個焦點，不爭辯，不為你的問題辯護，也不完全放棄這個話題。"
    - "聚焦在個案剛表現出來或說出來的東西上，這可以是反對本身。"
    - "簡短、平實，讓個案可以說不。"
- id: assessment-h02
  level: hard
  skill: focusing
  context: "每次你問到個案的婚姻，個案就談工作。"
  client: "總之，重組才是真正的問題。我有沒有跟你說過，他們又把我的座位搬走了？"
  criteria: *fo_hard
- id: assessment-h03
  level: hard
  skill: focusing
  context: "你問了個案被送進醫院那一晚的事。"
  client: "我記得不多。我不明白這有什麼重要。我現在不是在這裡了嗎？"
  criteria: *fo_hard
- id: assessment-h04
  level: hard
  skill: focusing
  context: "個案已經不停說了十五分鐘，說了很多事。"
  client: "……然後是鄰居，還有我妹離婚，還有車，老實說那些政府部門全都沒用，還有我的膝蓋，別讓我說起這個。"
  criteria: *fo_hard
- id: assessment-h05
  level: hard
  skill: focusing
  context: "你問了個案喝多少酒。"
  client: "為什麼每個人都那麼在意我喝酒？你說話跟我太太一模一樣。"
  criteria: *fo_hard

- id: assessment-h06
  level: hard
  skill: summary
  context: "個案抱怨各種服務已經抱怨了一段時間。"
  client: "家庭醫生敷衍我，危機熱線叫我等，上一個地方見了六次就把我結案，現在還給我一個實習生。真好。"
  criteria: &su_hard
    - "公平地、以原來的力度摘要個案的說法，包括和你有關的部分。"
    - "不包含任何辯護、道歉或承諾。"
    - "簡短，最後確認你有沒有理解對。"
- id: assessment-h07
  level: hard
  skill: summary
  context: "個案很生氣，在不同話題之間跳來跳去。"
  client: "他在錢的事上說謊，我媽站在他那邊，律師一點用都沒有，而你要我談感受？"
  criteria: *su_hard
- id: assessment-h08
  level: hard
  skill: summary
  context: "評估會談的尾聲。個案一直只給簡短的回答。"
  client: "你問完你那四十個問題了。你到底知道了什麼？因為我什麼都沒學到。"
  criteria: *su_hard
- id: assessment-h09
  level: hard
  skill: summary
  context: "個案對你之前說的話提出異議。"
  client: "我不是這樣說的。我沒說我抑鬱。我是說我很累，工作很辛苦，我看不到做事情的意義。你們這些人總是急著貼標籤。"
  criteria: *su_hard
- id: assessment-h10
  level: hard
  skill: summary
  context: "個案是被僱主要求來的。"
  client: "人事部說我不來就會丟工作。就那麼一次事件。一次。我替他們做了十年。現在我變成了問題。"
  criteria: *su_hard
