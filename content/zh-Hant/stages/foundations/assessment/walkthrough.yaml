sessions:
  - id: assessment-s4
    title: "第 4 次會談：三次發作"
    turns:
      - id: assessment-s4-t01
        speaker: therapist
        text: "我們第一次見面時，你說這不是你第一次這麼低落。我想了解每一次的情況。你想從哪裡開始？"
      - id: assessment-s4-t02
        speaker: client
        text: "第一次吧，我想。初二。我們四個人，總是在一起。然後有一天，午飯的時候，再也沒有人幫我留位子了。沒有人說為什麼。就是……停了。之後我就不想上學。睡不著。成績也掉了。大概四個月。我媽為了成績很不高興。然後到了暑假，好像就慢慢好了。"
      - id: assessment-s4-d1
        type: choice
        prompt: "M 給了你朋友、位子、不想上學、睡眠、成績、媽媽和暑假。你聚焦在哪裡？"
        options:
          - id: a
            text: "你覺得那些朋友為什麼不再讓你加入？"
            fit: weak
            note: "它要 M 去猜十一年前別人的動機。她不可能知道，而一個關於被排擠的「為什麼」問題，聽起來可能像是答案在她身上。"
          - id: b
            text: "我們先停留在那四個月。在最難受的時候，有誰知道你有多辛苦？"
            fit: strong
            note: "它挑出一條線索，並停留在那裡。它問的是 M 能夠回答的事，也是理解她的低落怎樣運作的關鍵：她怎樣處理這份低落，以及有沒有人知道。"
          - id: c
            text: "那第二次是什麼時候？"
            fit: workable
            note: "你確實需要時間線，這個問題能拿到它。但第一次發作就只剩下一個輪廓。如果你收集了三個輪廓，你會有日期，卻沒有任何能解釋它們的東西。"
        actual: "我們先停留在那四個月。在最難受的時候，有誰知道你有多辛苦？"
        rationale: "聚焦就是選擇。評估中好的焦點，是能告訴你問題怎樣運作，而不只是發生了什麼。你從第二次會談已經有一個工作假設：M 會隱藏痛苦。這個問題拿她的過去來檢驗這個假設。"
      - id: assessment-s4-t03
        speaker: client
        text: "其實沒有人知道。我試過跟我媽說一次。她說，也許我應該想想自己做了什麼惹朋友討厭。（停頓）所以之後我就不再提了。我跟學校輔導員說我沒事，只是累。"
      - id: assessment-s4-t04
        speaker: therapist
        text: "你試過一次，結果變成是你的錯，之後你就把它留給自己。說說第二次吧。"
      - id: assessment-s4-t05
        speaker: client
        text: "那時十七歲。最後一年。其實是考試壓力，大家都很有壓力。我最好的朋友，我唯一會講心事的人，拿到外地的學位，秋天就走了。之後就只剩下讀書。我對自己變得很苛刻。我跟你說過的那些念頭，就是那時候有的。我看了家庭醫生幾個月，然後就沒有再去。沒有人發現我沒再去。"
      - id: assessment-s4-d2
        type: free
        prompt: "寫一段兩次發作的摘要。把事實並排放好，讓 M 看見重複的地方。不要告訴她模式是什麼。最後確認。"
        actual: "我確認一下我有沒有理解對。十四歲的時候，朋友疏遠了你。你試過一次跟媽媽說，之後四個月都自己扛著。十七歲的時候，你最親近的朋友離開了，考試來了，又一次沒有人知道情況變得多糟。是這樣嗎？"
        rationale: "摘要就是取捨。這一段在每次發作中保留同樣的兩件事，誰離開了，誰知道，並用同樣的次序排列。它沒有加上「所以看起來」。如果模式真的存在，M 自己看得見，而她自己看見的模式，比被告知的更有價值。最後的確認是真的確認。她可能會糾正你。"
      - id: assessment-s4-t06
        speaker: client
        text: "（停頓）對。我從來沒有把它們這樣放在一起看過。（較長的停頓）而現在也一樣。他是春天走的，我好幾個星期都沒有跟任何人說。後來終於跟朋友說了，我還把它講成一個笑話。"
      - id: assessment-s4-d3
        type: choice
        prompt: "M 剛剛自己補上了第三次發作。你說什麼？"
        options:
          - id: a
            text: "所以模式是，每當有人離開你，你就會抑鬱。"
            fit: weak
            note: "這可能很接近事實。但這是你的句子，就在她快要說出自己的句子前一刻說出來，而且比證據更整齊。她會同意。她同意大部分事情。"
          - id: b
            text: "你留意到一些東西。當你把三次並排放著，你看到什麼？"
            fit: strong
            note: "它標記了這一刻，把發現交還給她。她接下來說的話會是她自己的話，你也會知道她怎樣理解這件事。"
          - id: c
            text: "這是一個非常重要的領悟。"
            fit: workable
            note: "這是鼓勵。但它同時在給她打分數，而對 M 來說，稱讚往往會讓探索停下來。她還沒有說出領悟是什麼。"
        actual: "你留意到一些東西。當你把三次並排放著，你看到什麼？"
        rationale: "做得好的評估本身就已經是介入。在做個案概念化的是 M。你的部分是把三次發作放在她面前，然後不要擋路。"
      - id: assessment-s4-t07
        speaker: client
        text: "總是有人離開之後。然後我就不說話了。（停頓）我一直以為自己只是一個會抑鬱的人。像天氣一樣。"
      - id: assessment-s4-t08
        speaker: therapist
        text: "像天氣一樣。自己就會來的東西。而今天它看起來沒那麼像天氣了。有人離開，你就不說話了。"
      - id: assessment-s4-t09
        speaker: client
        text: "（慢慢點頭）我還不知道要怎樣面對這件事。"
      - id: assessment-s4-t10
        speaker: therapist
        text: "你現在還不需要對它做什麼。我們之後會再回來談。現在，我也想了解你目前普通的一個星期是怎樣的。"
      - id: assessment-s4-d4
        type: choice
        prompt: "你想請 M 用一個星期簡單記錄自己的活動和心情。你怎樣提出？"
        options:
          - id: a
            text: "作業方面，我需要你每天填這張表。"
            fit: weak
            note: "這是一個沒有理由的指令。M 要麼為了你填得完美無缺，要麼漏了一天然後帶著羞愧來。無論哪種，你知道的都是她有多順從，而不是她的一個星期。"
          - id: b
            text: "如果能看到你一個星期實際是怎樣過的，會對我很有幫助：大概做了什麼，心情又怎樣跟著起伏。你願意簡單記一下嗎？隨便記就可以。如果沒有記到，那也會告訴我們一些東西。"
            fit: strong
            note: "它說明理由，徵求她的同意，刻意降低標準，並在這個星期開始之前，就先拿走了沒做到的羞愧。對任務的共識，是治療聯盟三個部分之一。"
          - id: c
            text: "有些人覺得寫情緒日記有幫助。你自己決定。"
            fit: workable
            note: "它尊重她的選擇，卻沒有給她任何可以用來選擇的東西。她不知道這個任務的理由，只能猜你比較想要哪個答案。M 非常擅長猜別人想要什麼。"
        actual: "如果能看到你一個星期實際是怎樣過的，會對我很有幫助：大概做了什麼，心情又怎樣跟著起伏。你願意簡單記一下嗎？隨便記就可以。如果沒有記到，那也會告訴我們一些東西。"
        rationale: "會談之間的任務應該是提出、說明、然後取得同意的。對一個預期會被評價的個案，要事先說明沒有做到會怎樣。"
      - id: assessment-s4-t11
        speaker: client
        text: "好。隨便記。（淺淺一笑）我會盡量不要記得太完美。"
    notes:
      goals: "了解三次發作的經過。開始了解目前的一個星期。同意第一個會談之間的任務。"
      alliance: "更穩固了。M 今天做了真正的工作，停留在一個困難的發現裡，沒有道歉。第一次拿自己開了一個小玩笑，語氣是溫暖的，不是貶低自己。任務是在說明理由之後同意的。"
      formulation_update: "三次發作之間的模式，用 M 自己的話說：「總是有人離開之後。然後我就不說話了。」十四歲時，她試過一次跟媽媽說，得到的回應是叫她檢討自己的行為。從那以後，她在撐不住的時候沒有再告訴任何人。每一次，她得到的幫助都在沒有人留意的情況下中斷了。還需要了解的是：如果她現在真的告訴別人，她相信會發生什麼事。"
