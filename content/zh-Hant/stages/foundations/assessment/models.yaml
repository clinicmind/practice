assessment-e01:
  model_response: "說說星期二那個難熬的晚上。"
  why: "四件事之中，只有一件是困難。這個回應用個案的字眼說出它，並邀請個案多說。"
  avoid: "四件事逐一回應。那是聊天，不是聚焦。"
assessment-e02:
  model_response: "最近主要是工作。關於工作，你擔心的是什麼？"
  why: "個案已經說了眼下是哪一種擔心。這個回應跟隨這條線索。"
  avoid: "「你一向都很焦慮嗎？」個案已經給了具體的一點，它卻退回到籠統的層面。"
assessment-e03:
  model_response: "三月前後改變了很多事。我們先從頭痛本身開始。頭痛是怎樣的？"
  why: "它順帶記下時間點，然後選一條線索，也就是主訴，先請個案描述。"
  avoid: "「所以頭痛是壓力造成的。」這是結論，而你還沒有評估任何東西。"
assessment-e04:
  model_response: "家裡安靜下來的時候。那時候你會怎樣？"
  why: "它拿個案說得最準確的一句話，問那一刻的情況。"
  avoid: "問早上的事。個案已經告訴你早上還好。"
assessment-e05:
  model_response: "你和哥哥從葬禮之後就沒說過話。如果你願意，我想聽聽這件事。"
  why: "在一段大致正面的描述中，它挑出唯一的例外，並先徵求同意才走進去。"
  avoid: "「其他家人都很親，這很好。」這是聚焦在不需要關注的那部分。"
assessment-e06:
  model_response: "睡眠、運動和飲食都走了樣，你也覺得不像自己。我這樣理解對嗎？"
  why: "一句話帶出三個要點和整體感覺，再加上確認。"
  avoid: "補上一句「這些都是抑鬱的徵狀」。那是新資訊，也是標籤。"
assessment-e07:
  model_response: "一份你討厭的工作，一份你喜歡卻失去了的工作，現在一邊做臨時工一邊在想下一步。是這樣嗎？"
  why: "它按次序保留三個階段，以及每個階段附帶的感受。"
  avoid: "「你的生活一直很不穩定。」這是你對這段經歷的判斷。"
assessment-e08:
  model_response: "從六點到孩子睡覺，一天都屬於其他人。然後晚上就在沙發上和手機一起過到半夜。是這樣嗎？"
  why: "它把七個步驟濃縮成上下兩半，而且一直停留在描述。"
  avoid: "「你需要一些自己的時間。」這是建議。"
assessment-e09:
  model_response: "所以有你先生，在他在家的時候；有你媽媽，在星期四；還有一個你可以真的講心事的朋友。我有沒有漏了誰？"
  why: "它列出三個支持來源，連同個案說的限制，而確認的問題也邀請個案補充。"
  avoid: "「你的支持網路很好。」個案描述的是三個人，每一個都有限制。"
assessment-e10:
  model_response: "少擔心一點，好好睡覺，對伴侶多一點耐性。是這三個嗎？"
  why: "它把個案的目標簡短地說回去，讓個案在你寫下來之前可以確認。"
  avoid: "馬上把它們改寫成可量度的目標。先確定這些是對的目標。"
assessment-m01:
  model_response: "二年級有點不順。那時候發生了什麼事？"
  why: "它走到個案唯一放慢的那一句，用個案自己溫和的字眼，開放地問。"
  avoid: "「聽起來二年級好像發生了很困難的事。」這把事情說得比個案說的大。"
assessment-m02:
  model_response: "我們可以談你老闆的事。在那之前，你提到小時候爸爸會喝酒。如果可以的話，我想之後某個時候再回來談這件事。"
  why: "它尊重個案想談的事，同時標記了被帶過的線索，讓它不會遺失。"
  avoid: "堅持現在就談爸爸，或完全放下他。前者凌駕了個案。後者等於配合了那句「總之」。"
assessment-m03:
  model_response: "第一次是在你的婚禮上。說說那一天。"
  why: "個案的聲音在那裡低了下來。這個回應用一個平實的邀請跟上去。"
  avoid: "列出更多情境，檢查有沒有逃避。這之後會有用，但它錯過了感受所在的地方。"
assessment-m04:
  model_response: "準確一點說，是星期日下午。星期日下午會發生什麼？"
  why: "個案把範圍收窄了三次。這個回應信任這一點，正正問那個時段。"
  avoid: "「你週末通常做什麼？」個案剛收窄的範圍，它又擴闊了。"
assessment-m05:
  model_response: "這一次不一樣，你暫時還說不出哪裡不一樣。你最先留意到的不同是什麼？"
  why: "它停留在個案自己的不確定裡，並提供一個小小的入口。"
  avoid: "先了解之前幾次低潮的經過。個案指向的是這一次。"
assessment-m06:
  model_response: "跟阿森在一起時，你負責安排，直到受夠了，然後離開。跟阿祖在一起時，你包辦所有事，直到受夠了，然後離開。是這樣嗎？"
  why: "兩個故事用同樣的三個步驟說出來，重複就看得見，而不用說破。"
  avoid: "「你好像總是選一些不肯出力的伴侶。」這是詮釋，而且帶著責備。"
assessment-m07:
  model_response: "星期一早上、團隊會議之前、考績面談時比較糟。在健身房和跟孩子在一起時沒事。這兩張清單我列對了嗎？"
  why: "把例子分成兩張清單，個案就能看見每張清單的共通點。"
  avoid: "「所以是關於被評價。」個案只差一步就會自己說出來。"
assessment-m08:
  model_response: "她付出了一切，也從來沒有問過你好不好。你欠她，一個小時也是你的極限。這些全部同時存在。是這樣嗎？"
  why: "四句陳述，沒有一句被說軟，也沒有排先後，連在一起讓它們並存。"
  avoid: "「聽起來你很怨她。」個案同時抱著兩面，它卻只選了其中一面。"
assessment-m09:
  model_response: "三次都是出現了一個空檔，放假、搬走、取消了一次，然後你就沒有再回去。我理解得對嗎？"
  why: "它把共同的形狀，先有空檔、然後沒有回去，當作事件的描述說出來。這對這次治療也很重要。"
  avoid: "「你有中途退出的模式。」準確，但帶著指控。"
assessment-m10:
  model_response: "平日不喝，除非那天不順，而最近大部分日子都不順。不會自己一個人喝，除非伴侶不在家。大概是這樣嗎？"
  why: "它按個案的次序，把每條規則和它的例外說回去，不加評論。"
  avoid: "「所以你幾乎每天都在喝。」加起來是對的，但個案會聽成是指控。"
assessment-h01:
  model_response: "以前也有人問過你媽媽的事，你已經聽厭了。之前那幾次發生了什麼？"
  why: "它不為問題辯護，也不放下話題。它把反對本身當作焦點。"
  avoid: "「這是標準問題，每個人我都會問。」這是辯護，也證實了個案只是在被走流程。"
assessment-h02:
  model_response: "我留意到，每次我問起你的婚姻，我們最後都會回到工作。我在想，婚姻是不是比較難談。"
  why: "它試探地說出房間裡正在發生的事，把這件事當作焦點，而不強迫談那個話題。"
  avoid: "更強硬地再問一次婚姻的問題，或者跟著去談座位。"
assessment-h03:
  model_response: "你現在在這裡，這很重要。我問那一晚，是因為我想了解那時候對你來說是怎樣的。我們可以慢慢來，也可以今天先不談。"
  why: "它保持焦點，用一句話說明理由，並在節奏上給出真正的選擇。"
  avoid: "「評估需要這個資料。」個案問的是為什麼重要，一份表格不是理由。"
assessment-h04:
  model_response: "很多事同時壓在你身上。如果今天我們只能看其中一件，你會選哪一件？"
  why: "一句話承認負荷，然後請個案自己來聚焦。"
  avoid: "由你自己挑膝蓋或妹妹的事。對一個正被淹沒的個案，你的選擇只會變成清單上多一項。"
assessment-h05:
  model_response: "你在我的問題裡聽到了你太太的聲音。她問的時候，是怎樣的情況？"
  why: "它不為問題辯護。它聚焦在個案剛透露的事上：喝酒在家裡是一個問題。"
  avoid: "「我沒有在評判你。」個案沒有這樣說，現在卻變成你提起了它。"
assessment-h06:
  model_response: "家庭醫生、危機熱線、上一個服務，每一個都讓你失望，現在你被安排給一個實習生，感覺又是同樣的事。我理解得對嗎？"
  why: "它把和你有關的部分，當作個案清單上的其中一項，毫不退縮地包括在內。"
  avoid: "「很遺憾你有過這些經歷。」這很有禮貌，卻把你自己放在清單之外。"
assessment-h07:
  model_response: "他說謊，你媽媽站在他那邊，律師幫不上忙，而我問感受，好像完全不切題。是這樣嗎？"
  why: "按個案的次序說出四件事，包括對你的批評，然後確認。"
  avoid: "解釋為什麼感受很重要。此刻個案需要的，是證明你跟得上。"
assessment-h08:
  model_response: "我問了很多問題，你都回答了，而你離開時什麼新東西都沒有。這是合理的不滿。你的感覺是這樣嗎？"
  why: "它按個案經驗到的樣子摘要這次會談，不聲稱這次會談有用。"
  avoid: "列出你知道了什麼。它回答了字面上的問題，卻錯過了不滿。"
assessment-h09:
  model_response: "你說得對。你說的是你很累，工作很辛苦，看不到做事情的意義。你也不想這些被變成一個標籤。這次我理解對了嗎？"
  why: "它用三個字承認錯誤，準確地重述個案的三點，並把反對也包括在內。"
  avoid: "「不過這些都是抑鬱的徵狀。」你也許是對的，而你會失去這個個案。"
assessment-h10:
  model_response: "做了十年，一次事件，現在被告知不來這裡就會丟工作。你被當成了問題。是這樣嗎？"
  why: "它按個案自己的比重，把個案的說法交還給他。你可以這樣做，而不必同意每一部分。"
  avoid: "「我們來談談那次事件。」也許有必要，但太早了，而且站在人事部那邊。"
