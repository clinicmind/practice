slug: assessment
version: 1.0.0
title: "評估：由故事到資料"
intro: "個案帶著一個故事來。評估把故事轉化成可以用的資料：發生了什麼，在什麼時候，以什麼次序，之後又發生什麼。風險是評估變成審問，或者你收集了一段歷史，卻沒有留意到其中重複的東西。在這個模組，個案 M 告訴你三次情緒低落的經過。你會練習兩項整理個案所帶來的內容、又不把它接管過來的技能：聚焦於一條線索，以及摘要。"
skills:
  - focusing
  - summary
reflection_prompts:
  - id: assessment-r1
    text: "M 在聽到一段摘要之後，自己看見了模式。想一次你把自己留意到的模式告訴個案的經驗。個案怎樣處理它？如果用摘要，可能會有什麼不同？"
  - id: assessment-r2
    text: "當個案一次給你五件事，你根據什麼決定跟隨哪一件：情緒最強的、最近發生的、你最明白的，還是讓你最自在的那一件？"
  - id: assessment-r3
    text: "M 的媽媽叫她想想自己做了什麼惹朋友討厭。讀到這裡時，你有什麼感覺？這份感覺可能怎樣影響你接下來問的問題？"
