alliance-e01:
  model_response: "你覺得很自豪。這份感覺陪著你一路回到家。"
  why: "「自豪」配得上一路停不下來的笑。第二句用的是個案自己說的細節。"
  avoid: "「太好了，做得好！」那是你的高興。情感反映是把個案的感受交還給他。"
alliance-e02:
  model_response: "你太想念她了，想念到手會自己伸去拿電話。"
  why: "它說出想念，並連到個案自己的畫面。"
  avoid: "「她仍然在心裡陪著你。」太早給的安慰，可能讓個案覺得悲傷應該小一點。"
alliance-e03:
  model_response: "你對星期五非常焦慮，你的身體整個星期都在告訴你這一點。"
  why: "「非常焦慮」配得上打了一整個星期的結。「有點緊張」就太弱了。"
  avoid: "教面試技巧。個案告訴你的是一種感受。"
alliance-e04:
  model_response: "聽起來很氣人。而且對方提都沒提，好像讓這件事更難受。"
  why: "它以合適的強度說出惱怒，也留意到最困擾個案的是哪一部分。"
  avoid: "「你有沒有跟室友談過？」這是合理的下一步，但它跳過了感受。"
alliance-e05:
  model_response: "聽起來是鬆了一口氣。你本來準備好面對更難的反應。"
  why: "它說出鬆一口氣，也說出之前的擔心。"
  avoid: "「你看，事情從來沒有我們想的那麼糟。」它把個案的這一刻變成了一堂課。"
alliance-e06:
  model_response: "睡得那麼少，耐性很快用完，是說得通的。"
  why: "它把反應和原因連起來。這個連結就是認可。"
  avoid: "「所有新手爸媽都會經歷這些。」也許是真的，但它離開了眼前這位家長。"
alliance-e07:
  model_response: "會緊張是說得通的。上星期你對一個幾乎陌生的人說了對你很重要的事，今天你又回來，準備再說一次。"
  why: "它具體說出為什麼今天的緊張是可以理解的。"
  avoid: "「沒有什麼好緊張的。」這等於告訴個案，這份感受是錯的。"
alliance-e08:
  model_response: "你當然還會想她。她是你每天分享生活的人，一年的時間取代不了。"
  why: "「已經一年了」裡面藏著自我懷疑。它解釋這份感受為什麼會持續，從而回應了那份懷疑。"
  avoid: "「你會交到新朋友的。」個案沒有說自己缺朋友。"
alliance-e09:
  model_response: "你逼自己考了兩次，想躲起來是說得通的。這件事對你很重要。"
  why: "它把想躲的衝動連到個案付出的努力和他在乎的事，從而認可它。"
  avoid: "「很多人都考了不只兩次。」比較不能認可任何東西。"
alliance-e10:
  model_response: "那次意外讓你的身體學到，坐車可能是危險的。不是你自己開車的時候，它保持警戒，是說得通的。"
  why: "它把繃緊解釋為一件事發生之後合理的結果。"
  avoid: "「但你知道你現在是安全的。」這個「但」抵銷了前面所有的話。"
alliance-m01:
  model_response: "你替他高興。同時那裡面可能還有別的東西，比較沉重的東西。"
  why: "它保留說出口的感受，並溫和地指向沒說出口的那一個，沒有替個案命名。"
  avoid: "「你聽起來在妒忌。」也許準確，但那是一個判決。"
alliance-m02:
  model_response: "你明白大家都忙，被忘記也還是刺痛了你。"
  why: "理解和受傷都反映出來，用「也」連在一起。"
  avoid: "「你真的很體諒人。」它獎勵了表面的掩飾，錯過了底下的東西。"
alliance-m03:
  model_response: "你在笑，我猜這對你是一次真正的打擊。"
  why: "它試探地說出笑容和事件之間的落差，沒有叫個案別笑。"
  avoid: "跟著一起笑。個案會學到，你也只看到表面。"
alliance-m04:
  model_response: "很難知道自己是什麼感覺。也許在你這麼擔心他的時候，打掃是唯一感覺還應付得來的事。"
  why: "它先反映「不知道」，那正是個案說的話，然後才提出一種可能的感受。"
  avoid: "「你明顯是焦慮。」個案剛告訴你他不知道。"
alliance-m05:
  model_response: "其他人都在慶祝，而你感覺到的比較接近害怕。"
  why: "它把預期中的感受和真正的感受並排，並說出真正的那一個。"
  avoid: "「你知道嗎，這是你應得的。」這是在回應一個個案沒有說出口的懷疑。"
alliance-m06:
  model_response: "過了幾個小時，這件事還壓在你心上。溫柔地對待他，顯然對你很重要。"
  why: "它認可她的難受，並說出背後的價值。既不同意她是壞媽媽，也不爭辯她是好媽媽。"
  avoid: "「你是個很好的媽媽，每個人有時都會大聲。」那是安慰，她不會相信。"
alliance-m07:
  model_response: "如果十年後還會痛，那件事一定傷得很深。"
  why: "個案把傷痛持續這麼久當成對自己不利的證據。這句話把它看成是那件事有多重要的資訊。"
  avoid: "「這不可笑。」你會變成在和自我批評爭辯，感受則沒有被處理。"
alliance-m08:
  model_response: "你看得到自己擁有的，也還是有些東西缺了。兩樣同時都是真的。"
  why: "它同時認可感恩和缺少，沒有把個案的痛苦和別人的拿來排名次。"
  avoid: "「至少你看得到好的一面。」「至少」總會把感受變小。"
alliance-m09:
  model_response: "你想去，也有些東西阻止了你。這件事困擾你，是因為那些朋友對你很重要。"
  why: "它認可想去的心和事後的懊悔，不去碰「靠不住」這個標籤。"
  avoid: "「你不是靠不住的人。」個案會為這個標籤辯護。"
alliance-m10:
  model_response: "一件漫長又艱難的事結束了，覺得鬆一口氣是說得通的。這份鬆一口氣，也可以和你對他的其他感受放在一起。"
  why: "它說出什麼會帶來鬆一口氣，從而認可它。至於這份感受可不可怕，它不作判決。"
  avoid: "「這完全正常。」說得很快，卻關上了個案冒險打開的話題。"
alliance-h01:
  model_response: "你對這件事感到挫折，也對我的問題感到挫折。"
  why: "它用很少、很平實的字，反映指向你的感受，然後停下。"
  avoid: "「我問是因為感受在治療中很重要。」那是解釋，而且正好證明了個案的說法。"
alliance-h02:
  model_response: "你說沒關係。我感覺到，我遲到這件事其實讓你不舒服。"
  why: "它反映繃緊的下巴透露的感受，不強迫個案承認，也說出原因是你遲到。"
  avoid: "接受「沒關係」就開始。也要避免長篇道歉，那會變成個案要照顧你。"
alliance-h03:
  model_response: "那感覺像是可憐你，你很討厭這樣。"
  why: "它以原來的力度，準確反映個案反對的東西。"
  avoid: "「我不是在可憐你。」也許是真的，但它告訴個案，他對你的解讀是錯的。"
alliance-h04:
  model_response: "你冒了很大的險告訴我，感覺卻像我連留意都沒有留意到。這讓你受傷了。"
  why: "它反映受傷和當時你所冒的風險，暫時不解釋你做了什麼。"
  avoid: "「我有聽到，我本來打算之後再回來談。」那是辯護，個案又變成孤單一人。"
alliance-h05:
  model_response: "有些什麼，讓那一刻說出來感覺太冒險了。"
  why: "它反映退回去這個動作本身，不追問內容，也不同意那不重要。"
  avoid: "「你確定嗎？你可以跟我說任何事。」這會加壓。說「好」也不會更好，因為那等於同意它不重要。"
alliance-h06:
  model_response: "三次會談是實實在在的時間和金錢。想看到一些成果，是說得通的。"
  why: "它找到合理的地方，也就是付出和成果的比較，並且只說這一點。"
  avoid: "「改變需要時間。」這是事實，也是辯護，而且暗示個案太心急。"
alliance-h07:
  model_response: "你說得對，我沒有經歷過。懷疑一個局外人能不能真正明白，是說得通的。"
  why: "它承認真實的部分並認可懷疑，既不聲稱明白，也不放棄。"
  avoid: "「我和很多跟你處境相似的人工作過。」在個案需要被聽見的時候，你在出示資歷。"
alliance-h08:
  model_response: "對我生氣了整整一個星期。我很高興你告訴我。如果那句話讓你很不好受，它一直留在你心裡是說得通的。"
  why: "在知道你說了什麼之前，它先歡迎這份怒氣，並認可它。內容可以接著談。"
  avoid: "用擔心的語氣問「我說了什麼？」。這樣個案就要處理你的驚慌。"
alliance-h09:
  model_response: "你來尋求幫助，卻發現被安排給一個還在受訓的人。你當然想知道，自己是不是得到比較少。"
  why: "它說出底下合理的擔心，也就是吃虧，而不為機構或你自己辯護。"
  avoid: "「我有督導緊密地指導。」這是之後有用的資訊。第一句就說，就是辯護。"
alliance-h10:
  model_response: "來這裡會翻起一些東西，然後你要一個人帶著它們回家。每週這樣結束很難受，你會開始質疑，是說得通的。"
  why: "它認可這份經驗和質疑，也不承諾個案會好過一點。"
  avoid: "「通常會先變差，然後才變好。」這是口號，而且要個案憑信任去承擔代價。"
