sessions:
  - id: alliance-s2
    title: "第 2 次會談：「我好了一點」"
    turns:
      - id: alliance-s2-t01
        speaker: therapist
        text: "M，很高興見到你。這個星期過得怎樣？"
      - id: alliance-s2-t02
        speaker: client
        text: "不錯！其實好了一點。我覺得上星期談一談真的有幫助。我多睡了一點。所以，謝謝你。"
      - id: alliance-s2-d1
        type: choice
        prompt: "才一次會談，M 就說自己好了一點，還向你道謝。你怎樣回應？"
        options:
          - id: a
            text: "太好了。我很高興上星期對你有幫助。"
            fit: weak
            note: "你收下了這份禮物。如果 M 的報告有一部分是為了你，她現在知道好消息會讓你高興，之後要帶難過的一週來就更難了。"
          - id: b
            text: "我很高興你多睡了一點。說說這個星期吧，好一點的部分，和不那麼好的部分。"
            fit: strong
            note: "它接收了好消息，但沒有大做文章，也清楚表示其他部分同樣受歡迎。你沒有指責她什麼。你只是擴闊了她可以報告的範圍。"
          - id: c
            text: "很多人在第一次會談後都會覺得輕鬆一點。不一定會持續。"
            fit: workable
            note: "這是事實，某個時候說出來也合理。在這裡說，卻是在你聽到這一週的任何事之前就先糾正她，聽起來也可能像是懷疑。"
        actual: "我很高興你多睡了一點。說說這個星期吧，好一點的部分，和不那麼好的部分。"
        rationale: "你還無法知道這是真的改善、說出來之後的舒緩，還是 M 在照顧你的感受。你不需要知道。你的任務是讓兩種星期都可以安全地帶進來。留意她向你道謝。把這一點和上星期的道歉放在一起看。"
      - id: alliance-s2-t03
        speaker: client
        text: "嗯。星期一、星期二還可以。星期三我要向新團隊做簡報，準備到凌晨兩點，然後星期四就請了病假。（停頓）我就只是躺著。連貓都到下午才餵。（聲音哽住）牠就坐在碗旁邊，一直等，連叫都沒叫……"
      - id: alliance-s2-t04
        speaker: client
        text: "（哭）對不起。對不起，好傻。只是一隻貓而已。"
      - id: alliance-s2-d2
        type: free
        prompt: "M 在哭，已經道歉了兩次。寫一句情感反映。不要安慰她，也不要提問。"
        actual: "牠不吵不鬧地等著你，這件事有些地方讓你很心痛。"
        rationale: "這句反映走到故事底下的感受，用的是 M 自己的畫面。它沒有告訴她不用道歉。那樣是回應了道歉，卻把感受留在原地。它也沒有問「這些眼淚是為了什麼？」，那會把她送進思考裡。留意她選的畫面：一個有需要、在等待、卻不吭聲的存在。這可能不只是關於貓。你現在先不說。"
      - id: alliance-s2-t05
        speaker: client
        text: "（點頭，哭得更厲害了一會兒，然後慢下來）我應該起來的。牠需要我，我卻只是躺著。我好內疚。到現在還是。"
      - id: alliance-s2-t06
        speaker: therapist
        text: "內疚，到現在還背著。你很在乎不要讓牠失望，難怪星期四那天你這麼難原諒自己。"
      - id: alliance-s2-t07
        speaker: client
        text: "（小聲）對。（長長吸一口氣）我平常不會在別人面前哭。"
      - id: alliance-s2-t08
        speaker: therapist
        text: "我留意到你哭的時候道歉了。在這裡哭了，是什麼感覺？"
      - id: alliance-s2-t09
        speaker: client
        text: "很奇怪。很尷尬。可是也……你看起來沒有不自在。我一直在等你露出不自在的樣子。"
      - id: alliance-s2-d3
        type: choice
        prompt: "M 說她一直在等你露出不自在的樣子。你怎樣回應？"
        options:
          - id: a
            text: "我一點都沒有不自在。你需要的時候，隨時都可以在這裡哭。"
            fit: workable
            note: "這句話體貼，也多半是真的。但它是在替你自己回答，也把話題關上了。有意思的地方是，她一邊哭一邊在看你的臉。"
          - id: b
            text: "就算在哭的時候，你也有一部分在看我怎樣接收。這聽起來像是你以前就需要這樣做。"
            fit: strong
            note: "它在事情發生的當下，溫和地反映出她剛剛讓你看到的，她和別人相處的方式。它連到她的過去，卻沒有聲稱知道那段過去是什麼。"
          - id: c
            text: "在你的生活中，誰會在你難過的時候露出不自在的樣子？"
            fit: workable
            note: "這是好問題，你之後會問到。現在問，卻在你們之間剛發生了一件新的事的時刻，把她帶離這個房間，去上一堂歷史課。"
        actual: "就算在哭的時候，你也有一部分在看我怎樣接收。這聽起來像是你以前就需要這樣做。"
        rationale: "情感連結就是在這樣的時刻建立的。M 預期自己的痛苦會成為負擔，結果發現沒有。把她在「看」這件事說出來，這個經驗就成為你們兩人都看得見的東西。這是你在第一次會談後就在想的那個模式，第一個清楚的跡象。"
      - id: alliance-s2-t10
        speaker: client
        text: "（輕輕笑了一下）我媽。我難過的時候，她會說：「你這樣，我很累。」所以我學會了先看一看。"
      - id: alliance-s2-t11
        speaker: therapist
        text: "所以你學會了，在讓任何東西露出來之前，先看看有沒有空間容得下它。這讓很多事情都說得通了。我想我們把這一點記住。今天結束之前，我想問你希望我們一起的時間帶來什麼。如果這些會談進行得順利，會有什麼不一樣？"
      - id: alliance-s2-t12
        speaker: client
        text: "我不知道。你覺得我應該處理什麼？你才是懂這些的人。"
      - id: alliance-s2-d4
        type: choice
        prompt: "M 請你替她選目標。你怎樣做？"
        options:
          - id: a
            text: "從你告訴我的情況來看，我建議我們處理你的睡眠，還有重新開始畫畫這類活動。"
            fit: weak
            note: "這些都是合理的目標。但它們是你的。M 會同意，就像她同意大部分事情一樣，而你會有一個只有一個人在裡面的計畫。對目標的共識是治療聯盟三個部分之一。順從不是共識。"
          - id: b
            text: "我確實有些想法，我也會說出來。不過先有一件事我很好奇。你把這個問題直接交回給我了。當你試著自己回答時，會發生什麼？"
            fit: strong
            note: "它沒有拒絕她，也沒有假裝你沒有看法。它帶著好奇去看剛剛發生的事。說出自己想要什麼，正是 M 覺得困難的事，所以訂立目標的困難本身就是工作的一部分。"
          - id: c
            text: "目標由你自己定是很重要的。慢慢來。"
            fit: workable
            note: "原則是對的。但它讓她獨自面對一個她剛表現出還做不到的任務，聽起來也可能像一條她沒有做到的規則。"
        actual: "我確實有些想法，我也會說出來。不過先有一件事我很好奇。你把這個問題直接交回給我了。當你試著自己回答時，會發生什麼？"
        rationale: "雙方達成共識、而不只是被接受的目標，需要比較長的時間。對 M 來說，第一個目標可能就是：能夠說出我想要什麼。這是你無法替她選出來的。"
      - id: alliance-s2-t13
        speaker: client
        text: "（停頓）腦袋會一片空白。然後我會想，不管我說想要什麼，都一定是不應該要的。（停頓）我想……我想不要再覺得自己無時無刻都要沒事。這算是目標嗎？"
      - id: alliance-s2-t14
        speaker: therapist
        text: "這是目標。而且是你的。我們就從這裡開始。"
    notes:
      goals: "第一個目標，用 M 自己的話說：不要再覺得自己無時無刻都要沒事。還沒有轉化成具體的內容。任務還沒有討論。"
      alliance: "情感連結：真正的一步。她哭了，留意對方有沒有不自在，沒有看到，也說了出來。目標：一個屬於她的目標。任務：還沒有任何共識。繼續留意來得太快的同意。"
      formulation_update: "第一個連結。M 難過時，媽媽會說：「你這樣，我很累。」M 學會了在表露感受之前，先看看有沒有空間容得下它。在會談中，這表現為道歉、報告改善、留意治療師的臉色，以及把決定交回給對方。工作假設，有待驗證：M 預期自己的感受和想要會成為別人的負擔，所以把它們藏起來，然後就沒有人知道她需要什麼。"
