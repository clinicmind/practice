slug: alliance
version: 1.0.0
title: "建立治療聯盟"
intro: "治療聯盟有三個部分：對目標的共識、對達成目標的任務的共識，以及情感連結。在許多研究和許多種治療之中，治療聯盟的品質都是預測治療結果較穩定的因素之一。個案有禮貌，不等於治療聯盟穩固。在這個模組，個案 M 告訴你她覺得好了一點，她哭了、道歉，又請你替她選目標。你會練習兩項建立情感連結的技能：情感反映和認可。"
skills:
  - reflection-of-feeling
  - validation
reflection_prompts:
  - id: alliance-r1
    text: "M 在第二次會談說自己好了一點。是什麼讓你覺得這可能是順從，而不是改變？如果是你自己的個案，你會怎樣分辨？"
  - id: alliance-r2
    text: "想一位你說什麼他都同意的個案。治療聯盟的三個部分（目標、任務、情感連結）之中，哪些是真的已經建立，哪些是你假設已經建立？"
  - id: alliance-r3
    text: "認可不等於同意。找一次你滑向安慰或同意的作答，把它改寫成只說出個案的反應在哪裡是合理的。"
