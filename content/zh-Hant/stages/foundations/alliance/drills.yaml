# 30 題練習：每個級別 10 題，每個級別每項技能 5 題。

- id: alliance-e01
  level: easy
  skill: reflection-of-feeling
  context: "第二次會談。個案在描述這個星期。"
  client: "經理在大家面前稱讚我的報告。我回家一路上都忍不住在笑。"
  criteria: &rf_easy
    - "說出一種感受，而且用詞和個案表現出來的強度相符，不更弱，也不更強。"
    - "以你的感覺提出，例如「你覺得……」「聽起來……」，讓個案可以糾正。"
    - "是一句簡短的陳述，不包含提問、建議或安慰。"
- id: alliance-e02
  level: easy
  skill: reflection-of-feeling
  context: "第二次會談。"
  client: "我奶奶上個月過世了。我還是常常拿起電話想打給她。"
  criteria: *rf_easy
- id: alliance-e03
  level: easy
  skill: reflection-of-feeling
  context: "早期的會談。"
  client: "我星期五有個面試，整個星期胃都像打了結一樣。"
  criteria: *rf_easy
- id: alliance-e04
  level: easy
  skill: reflection-of-feeling
  context: "早期的會談。"
  client: "室友又吃了我的東西，連提都沒提一句。"
  criteria: *rf_easy
- id: alliance-e05
  level: easy
  skill: reflection-of-feeling
  context: "早期的會談。"
  client: "我終於跟爸媽說我要轉系了。他們的反應比我想像中好。"
  criteria: *rf_easy

- id: alliance-e06
  level: easy
  skill: validation
  context: "早期的會談。"
  client: "寶寶出生之後我一直好累。我對每個人都很兇。"
  criteria: &val_easy
    - "說出在個案的處境下，他的反應在哪裡是合理的。"
    - "不安慰、不稱讚，也不說這種反應每個人都會有。"
    - "簡短，不包含「但是」「不過」。"
- id: alliance-e07
  level: easy
  skill: validation
  context: "第二次會談的頭幾分鐘。"
  client: "今天來的時候我很緊張。走到門口差點就掉頭走了。"
  criteria: *val_easy
- id: alliance-e08
  level: easy
  skill: validation
  context: "早期的會談。"
  client: "我最好的朋友搬去了外國，已經一年了，我還是很想她。"
  criteria: *val_easy
- id: alliance-e09
  level: easy
  skill: validation
  context: "早期的會談。"
  client: "我駕駛考試第二次不及格。我只想躲起來。"
  criteria: *val_easy
- id: alliance-e10
  level: easy
  skill: validation
  context: "早期的會談。"
  client: "自從那次車禍之後，每次坐別人的車，我全身都會繃緊。"
  criteria: *val_easy

- id: alliance-m01
  level: medium
  skill: reflection-of-feeling
  context: "早期的會談。個案語氣平板。"
  client: "我哥訂婚了。我替他高興。當然。"
  criteria: &rf_medium
    - "反映個案沒有說出口的感受，或在有兩種感受時兩種都反映。"
    - "語氣試探，不告訴個案他「其實」有什麼感受。"
    - "是一句簡短的陳述，沒有提問，也不解釋個案為什麼有這種感受。"
- id: alliance-m02
  level: medium
  skill: reflection-of-feeling
  context: "早期的會談。"
  client: "他們忘了我生日也沒關係。大家都忙。"
  criteria: *rf_medium
- id: alliance-m03
  level: medium
  skill: reflection-of-feeling
  context: "早期的會談。個案在微笑。"
  client: "所以對，我星期一被裁員了。哈。很像我會遇到的事。"
  criteria: *rf_medium
- id: alliance-m04
  level: medium
  skill: reflection-of-feeling
  context: "早期的會談。"
  client: "我不知道自己是什麼感覺。我爸在住院，我就一直在打掃家裡。"
  criteria: *rf_medium
- id: alliance-m05
  level: medium
  skill: reflection-of-feeling
  context: "早期的會談。"
  client: "我升職了。每個人都一直恭喜我。我只覺得想吐。"
  criteria: *rf_medium

- id: alliance-m06
  level: medium
  skill: validation
  context: "早期的會談。"
  client: "我今天早上對兒子大吼。哪有媽媽會這樣？"
  criteria: &val_medium
    - "認可的是感受或需要，不認可自我批評，也不和自我批評爭辯。"
    - "說出這個反應顯示個案在乎的是什麼。"
    - "簡短，沒有安慰，沒有「但是」，也沒有「至少」。"
- id: alliance-m07
  level: medium
  skill: validation
  context: "早期的會談。"
  client: "我知道十年前的事到現在還在難過，是很可笑的。"
  criteria: *val_medium
- id: alliance-m08
  level: medium
  skill: validation
  context: "早期的會談。"
  client: "我應該感恩才對。我有工作，有地方住。別人的情況差得多了。"
  criteria: *val_medium
- id: alliance-m09
  level: medium
  skill: validation
  context: "早期的會談。"
  client: "我又放朋友鴿子了。我就是個靠不住的人。"
  criteria: *val_medium
- id: alliance-m10
  level: medium
  skill: validation
  context: "早期的會談。個案看了你一眼，又把視線移開。"
  client: "我爸過世的時候，我覺得鬆了一口氣。是不是很可怕？"
  criteria: *val_medium

- id: alliance-h01
  level: hard
  skill: reflection-of-feeling
  context: "第三次會談。"
  client: "你一直問我有什麼感覺。我覺得這根本沒有意義。"
  criteria: &rf_hard
    - "用平實的話，反映個案對你或對治療的感受。"
    - "不包含任何辯護、道歉或解釋。"
    - "是一句簡短的陳述，把下一句話留給個案。"
- id: alliance-h02
  level: hard
  skill: reflection-of-feeling
  context: "你遲到了五分鐘。個案的下巴繃得很緊。"
  client: "沒有，沒關係。真的。我們開始吧。"
  criteria: *rf_hard
- id: alliance-h03
  level: hard
  skill: reflection-of-feeling
  context: "第三次會談。你剛對一件痛苦的事作出溫暖的回應。"
  client: "不要又歪著頭，一副很可憐我的樣子。"
  criteria: *rf_hard
- id: alliance-h04
  level: hard
  skill: reflection-of-feeling
  context: "會談開始時。"
  client: "我上星期跟你說了一件很重大的事，你卻直接問下一個問題。"
  criteria: *rf_hard
- id: alliance-h05
  level: hard
  skill: reflection-of-feeling
  context: "個案開口說話，又停了下來，已經沉默了一段時間。"
  client: "……算了。不重要。"
  criteria: *rf_hard

- id: alliance-h06
  level: hard
  skill: validation
  context: "第三次會談。"
  client: "我已經來了三次，什麼都沒有改變。我到底在付錢買什麼？"
  criteria: &val_hard
    - "具體說出個案的不滿在哪裡是合理的。"
    - "不為你自己或治療辯護，也不讓步，不承諾效果，不同意治療沒有用。"
    - "簡短，結尾不把問題推回給個案。"
- id: alliance-h07
  level: hard
  skill: validation
  context: "早期的會談。"
  client: "你不可能明白的。你根本沒有經歷過。"
  criteria: *val_hard
- id: alliance-h08
  level: hard
  skill: validation
  context: "會談開始時。"
  client: "你上星期說了一句話，我之後一直都很生氣。"
  criteria: *val_hard
- id: alliance-h09
  level: hard
  skill: validation
  context: "第二次會談。"
  client: "我上網查過你。你還是學生。為什麼他們給我安排一個學生？"
