slug: intervention
version: 1.0.0
title: "介入時維持治療聯盟"
intro: >-
  遲早你會請個案做一些事：嘗試一個任務，聽一些資訊，在一種感受裡多停留一會兒。
  這正是關係最容易受壓的時刻，也是實習生容易推得太用力或退得太快的時刻。
  在這個模組，個案 M 沒有完成任務就來了，頭幾分鐘一直在道歉。
  你會練習兩項承載介入的技能：用個案用得上的方式提供資訊，以及引導會談中發生的事。
skills:
  - information-giving
  - process-direction
reflection_prompts:
  - id: intervention-r1
    text: "M 沒有做任務，治療師說：「我很有興趣。」當個案沒有做到你們同意的事，你的第一個反應是什麼？個案看到了這個反應的哪些部分？"
  - id: intervention-r2
    text: "想想你上一次向個案解釋某件事。你有沒有先了解個案已經知道什麼？之後有沒有了解個案怎樣理解你說的話？"
  - id: intervention-r3
    text: "引導會談包括打斷、放慢，以及請個案嘗試一些事。這些之中哪一樣對你最難？你在迴避它的時候，是在保護什麼？"
