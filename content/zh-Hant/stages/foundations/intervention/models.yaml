intervention-e01:
  model_response: "如果我說說那時候身體裡發生了什麼，會有幫助嗎？恐慌時，你的身體拉響了警報，心跳加速是警報的一部分。它感覺很危險。你的醫生已經檢查過你的心臟，發現是健康的。這跟你的感受對得上嗎？"
  why: "它先詢問，用三句平實的話解釋，以已經做過的身體檢查為依據，然後確認。"
  avoid: "「只是焦慮而已。」「只是」這兩個字，等於告訴個案他的驚恐很可笑。"
intervention-e02:
  model_response: "是的，很多人都有這種經驗。我們在這裡打開了一些平常關著的東西，之後它們可能會翻騰一陣子。會談之後那幾天，你是怎樣過的？"
  why: "簡短而誠實的回答，把這說成是常見的，而不是每個人都會，然後回到個案的經驗。"
  avoid: "「這代表治療有效。」你並不知道。"
intervention-e03:
  model_response: "這是個好問題。我可以說說其中一部分嗎？情緒低落、做得少了，精力往往會掉得更低，所以做得少反而可能讓人更累。這跟你的情況吻合嗎，還是你的累感覺不一樣？"
  why: "它提供部分答案，連到個案停止了活動這件事，並為其他原因留下空間。"
  avoid: "「你需要多活動。」它把資訊變成了指令。"
intervention-e04:
  model_response: "對，就是這個詞。一次又一次地想同一件事，卻沒有想出任何新東西。它常常感覺像是在解決問題，這也是它難以停下來的原因之一。你感覺是這樣嗎？"
  why: "它確認個案自己用的詞，補充一個有用的重點，然後詢問。"
  avoid: "完整介紹關於反芻的研究。個案問的只是自己有沒有用對詞。"
intervention-e05:
  model_response: "不好意思，我用了這個詞卻沒有解釋。自動化思考就是在某個情境中，在你還沒時間衡量之前，第一個閃過腦海的念頭。上星期經理皺眉時，你的就是「我搞砸了」。這樣說明白嗎？"
  why: "它承認自己用了術語，用一句話下定義，並用個案自己的例子。"
  avoid: "用更多術語來定義它，例如「由基模引發的認知」。"
intervention-e06:
  model_response: "沒關係。我們先不用找字眼。給自己一點時間，看看你能不能留意到，此刻這種感覺在你身體的哪裡。"
  why: "它拿走要用字眼描述的要求，給出一件清楚、不急的事去做。"
  avoid: "「還是試著形容一下吧。」這是重複個案剛說自己做不到的事。"
intervention-e07:
  model_response: "三天裡發生了三件事。我想我們挑一件慢慢走一遍。哪一件現在最還在你心裡？"
  why: "它說出你想怎樣運用會談，並讓個案選擇內容。"
  avoid: "每件事都問一點。你會三件都談到，卻一件都不了解。"
intervention-e08:
  model_response: "謝謝你，這很多。繼續之前，我們兩個都先吸一口氣。在你告訴我的所有事情中，今天最值得看的是哪一部分？"
  why: "它明白說出要放慢，把自己也包括在停頓裡，並請個案選擇。"
  avoid: "用你自己連珠炮似的問題，跟上個案的速度。"
intervention-e09:
  model_response: "只唸第一個就好，然後停下來。我們先好好看那一個，再繼續。"
  why: "這是一個具體的指示，理由已經包含在內。"
  avoid: "「好啊，唸吧。」一口氣唸完十個想法，就沒有空間處理任何一個。"
intervention-e10:
  model_response: "你願意在這裡說一些嗎？你可以當他就坐在那張椅子上，對他說。慢慢來，想停就停。"
  why: "它把談論轉化成實際去做，步驟清楚，也可以停下。"
  avoid: "「你會說什麼？」這是請個案作摘要。目的是讓個案親口說出那些話。"
intervention-m01:
  model_response: "這是一個很可怕的想法，很多人都有。我可以說說通常會怎樣嗎？強烈的感受往往會升高、到頂點、然後減弱，比較像一個浪，而不是洪水。我不能保證你的會怎樣。我們可以做的，是一次讓一點點進來，看看會怎樣。你怎樣看？"
  why: "它把恐懼看成常見的，說出一般的過程但不作保證，並提議逐步找出答案。"
  avoid: "「不會這樣的。」你不可能知道，而且個案的恐懼沒有被聽見。"
intervention-m02:
  model_response: "短期來說，它確實讓你安全，我會認真看待這一點。問題是，在你逃避的時候，恐懼不會變小，因為它永遠不會發現本來會發生什麼。所以安全的範圍往往會越縮越小。你有沒有遇過這種情況？"
  why: "它同意真實的部分，補上代價，並請個案用自己的生活去檢驗。"
  avoid: "「逃避就是問題所在。」這是以糾正的方式說出來，抹去了個案說的話。"
intervention-m03:
  model_response: "其中有些可能真的是對的。這個想法不是說念頭都是假的。而是說，一個念頭不論是不是事實，感覺起來都可能像事實，所以有些值得檢查一下。我們可以挑一個，一起看看支持它的證據嗎？"
  why: "它承認個案的論點，準確地重述這個概念，並提出一個測試。"
  avoid: "「想法不等於事實。」這正是個案剛否定的那句口號。"
intervention-m04:
  model_response: "我明白你為什麼會這樣推論。就我所理解，「化學物質失衡」是一個簡化的說法，情緒低落似乎同時牽涉幾樣東西：身體、這個人經歷過的事，以及他每天做的事。談話作用在後面兩樣上。它並不排除其他東西。你覺得這樣說怎樣？"
  why: "它尊重個案的推理，把那個說法描述為簡化，但不誇大已知的部分，也沒有對用藥作任何評論。"
  avoid: "「那個理論已經被推翻了。」這誇大了事實，也讓個案因為讀過它而變成錯的一方。"
intervention-m05:
  model_response: "是誰告訴你六個月的？我不知道悲傷有任何時間表。每個人差別很大，想念一個人，不等於沒有復原。是什麼讓你覺得自己應該已經走出來？"
  why: "它質疑這條規則，簡短地提供資訊，並問「應該」從哪裡來。"
  avoid: "介紹悲傷的階段。這會給個案一個新的時間表去落後。"
intervention-m06:
  model_response: "你顯然想過這件事，那本書也很可能是對的。我比較好奇的是更貼近此刻的東西。當你跟我說這些的時候，你留意到自己有什麼感受？"
  why: "它肯定個案的思考，然後詢問當下的經驗。"
  avoid: "和個案討論依附理論。這很有趣，卻讓你們兩人都保持距離。"
intervention-m07:
  model_response: "我們可以談週末。剛才有些東西浮了上來，你的眼眶濕了。我們可以先在那裡多停留一會兒嗎？"
  why: "它不拒絕新話題。它說出自己看到的，並請求回到那裡。"
  avoid: "鬆一口氣地跟著換話題。"
intervention-m08:
  model_response: "跟她共事聽起來真的很難。我想把焦點從她身上轉到你身上一會兒。她把整個團隊加進副本的時候，你心裡發生了什麼？"
  why: "它用一句話站在個案那邊，然後把焦點移到個案身上。"
  avoid: "分析那位同事。在接受治療的不是她。"
intervention-m09:
  model_response: "你在笑，而在笑之前，你的聲音哽住了。我不覺得這只是關於一隻貓。我們可以慢下來，停留在笑之前的那個東西上嗎？"
  why: "它不帶嘲弄地留意到感受，也留意到掩蓋感受的笑，並請求回到那裡。"
  avoid: "跟著一起笑，然後繼續。"
intervention-m10:
  model_response: "這些你一口氣就說完了。如果你願意，我想回頭，只看第一部分。他走了。那一天你記得些什麼？"
  why: "它不帶批評地留意到速度，並選一個部分放慢。"
  avoid: "「那一定很難受。」對整張清單表示同情，會讓它和說出來時一樣平板。"
intervention-h01:
  model_response: "你想要一個名稱，這是合理的。我是實習生，作出診斷不是我可以做的事。我可以告訴你的，是到目前為止我對你的困難怎樣運作的理解，你可以告訴我哪裡不對。如果正式的診斷對你很重要，我會去了解這裡誰可以為你評估。"
  why: "它尊重這個願望，說出限度，提供一些實在的東西，並說明其餘的可以在哪裡得到。"
  avoid: "「標籤沒有幫助。」個案剛告訴你，一個標籤會有幫助。"
intervention-h02:
  model_response: "這個問題要問替你處方的人。不是我能回答的。在改變任何事之前，請先跟他們談。我能做的，是幫你想清楚你想跟他們說什麼。開始服藥之後，你留意到什麼？"
  why: "它不對藥物發表任何看法，清楚地把個案轉向處方者，並提供在角色範圍內的幫助。"
  avoid: "對藥物有沒有作用發表任何意見，無論是哪一個方向。"
intervention-h03:
  model_response: "不能，我不能保證，如果有人說他能，我也不會相信。情緒低落是可能再回來的。現在不一樣的是，你知道自己的早期訊號，也知道什麼有幫助。我們可以一起把這些寫下來，萬一你需要，就已經準備好了。"
  why: "它先給誠實的答案，然後給一樣具體的東西，代替保證讓個案可以抓住。"
  avoid: "「你會沒事的。」這正是你剛說自己給不了的保證。"
intervention-h04:
  model_response: "讀到這樣的東西很可怕。我沒辦法判斷你看到的那一頁。我可以說的是，你自己的醫生已經替你檢查過，發現你身體沒有問題。如果你仍然擔心，最適合問的人就是那位醫生，我也鼓勵你去問。那一頁上有什麼一直留在你心裡？"
  why: "它不跟網路爭辯，停留在角色範圍內，以個案自己的身體檢查為依據，並指向正確的來源。"
  avoid: "「那是胡說八道。」也要避免作出一個不屬於你的、很有把握的醫學判斷。"
intervention-h05:
  model_response: "問得合理。我知道這些是來自訓練和督導，不是多年的執業經驗。你不用只聽我說。我們可以拿你自己的經驗來檢驗。當你逃避某件事的時候，隨著時間過去，恐懼變成怎樣？"
  why: "它不動氣地誠實回答，並把檢驗從你的權威轉到個案自己的證據上。"
  avoid: "列出你的資歷，或者沉默下來。"
intervention-h06:
  model_response: "好。我們不做。如果你就這樣坐著，用你自己的方式告訴我，你想讓他知道什麼，會不會不一樣？"
  why: "它立刻接受拒絕，並提出一個朝向同一目的、更小的一步。"
  avoid: "「很多人試過之後都覺得有幫助。」在一個清楚的拒絕之後，這是在說服。"
intervention-h07:
  model_response: "（微笑）報告我就冒險寫一寫吧。我留意到，每次我們慢下來，玩笑就剛好出現。我在想，它們在擋住什麼。"
  why: "它以幽默接住玩笑，然後說出模式，但不施壓。"
  avoid: "開玩笑回去，然後繼續。也要避免說「你用幽默作為防衛」。"
intervention-h08:
  model_response: "好，今天我們可以談實際的事。上星期的確很重。我可以先問一件事嗎？上次會談之後，你是怎樣的？"
  why: "它同意這個要求，連到上星期，並針對要求背後的原因只問一個問題。"
  avoid: "堅持要談感受。也要避免同意了卻從來不問為什麼。"
intervention-h09:
  model_response: "好。我不再問這個了。至少目前，這對你顯然不是一個有用的問題。有什麼更好的方式，讓我可以問一件事對你有什麼影響？"
  why: "它停下來，不覺得被冒犯，並請個案幫忙找一個入口。"
  avoid: "「每個人的身體都會有感覺。」這等於告訴個案，他對自己經驗的理解是錯的。"
intervention-h10:
  model_response: "你說得對，我是打斷了，很抱歉讓你覺得被截斷。請說完。說完之後，我想問你哪一部分對你最重要，因為我想確定自己不會錯過它。"
  why: "它為造成的影響道歉，把發言權交還，並事先說明你會問什麼和為什麼。"
  avoid: "在個案還在惱火的時候，解釋你為什麼打斷。"
