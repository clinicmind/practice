sessions:
  - id: intervention-s9
    title: "第 9 次會談：任務沒有發生的那個星期"
    turns:
      - id: intervention-s9-t01
        speaker: therapist
        text: "上星期你告訴我第一則訊息的結果。你寫了「今天好爛」，K 四分鐘就回覆了，還叫你打電話給她。你原本的預測是好幾個小時、很短的回覆，以及 K 覺得煩。這個星期的計畫是告訴她一件稍微大一點的事。進行得怎樣？"
      - id: intervention-s9-t02
        speaker: client
        text: "我沒有做。對不起。我知道我們說好了。我本來打算星期三做，結果就是沒有做。真的很對不起。我浪費了你的時間。你只給了我一件事要做。"
      - id: intervention-s9-d1
        type: choice
        prompt: "M 沒有做任務，還一再道歉。你說什麼？"
        options:
          - id: a
            text: "沒關係。不用擔心。"
            fit: weak
            note: "出發點是體貼，卻把話題關上了。M 學到的是任務並不重要，或者你在掩飾你的失望。這個星期最有用的材料就這樣沒有被檢視。"
          - id: b
            text: "我不是失望。我是有興趣。星期三有些東西擋住了你，那正是我們需要了解的。我們可以慢慢把那個晚上走一遍嗎？"
            fit: strong
            note: "它用兩句簡短的話回應道歉背後的恐懼，然後把會談引導到一個具體的晚上。沒有發生的任務，就是關於循環的資料。"
          - id: c
            text: "那我們這個星期再定一次吧。"
            fit: workable
            note: "它讓計畫繼續下去。但你還不知道它為什麼失敗，所以它很可能以同樣的方式再失敗一次，M 就會有兩次失敗要道歉。"
        actual: "我不是失望。我是有興趣。星期三有些東西擋住了你，那正是我們需要了解的。我們可以慢慢把那個晚上走一遍嗎？"
        rationale: "引導歷程就是選擇會談關注什麼、以什麼速度進行。在這裡，你選了一個晚上和慢的速度。你也平實地說出自己的感受，因為 M 正在留意這一點，否則她會往最壞的方向想。"
      - id: intervention-s9-t03
        speaker: client
        text: "（吸一口氣）好。星期三。那天很糟。我坐在沙發上，手裡拿著手機，已經打好了：「我好想他，我也好討厭自己還在想他。」然後我想，她上次對我那麼好。她自己也有自己的問題。如果我一直這樣，我會把她耗盡。所以我把它刪了，把手機放下。"
      - id: intervention-s9-t04
        speaker: therapist
        text: "那你把手機放下的時候呢？"
      - id: intervention-s9-t05
        speaker: client
        text: "鬆了一口氣。大概一分鐘吧。然後我覺得比之前更糟。我看了點東西，就去睡了。"
      - id: intervention-s9-d2
        type: free
        prompt: "給 M 一小段關於逃避和舒緩的資訊。先徵求同意。把它連到星期三發生的事。最後問她是否吻合。"
        actual: "我可以跟你說一下這種情況通常是怎樣運作的嗎？當我們從害怕的事情退開，舒緩會立刻出現，而且這份舒緩是真的。代價是恐懼從來沒有被檢驗，所以下一次它還是一樣強。星期三你放下手機，覺得好了一分鐘，而「我會把她耗盡」這個想法，還是原封不動地留在那裡。這跟當時的感覺吻合嗎？"
        rationale: "資訊在這些情況下才有用：是個案要求或同意的、簡短的，並且立刻連到個案自己的例子。然後你要確認。如果跳過確認，你就是在講課。留意「通常」這個說法。這是一個常見的模式，不是定律。"
      - id: intervention-s9-t06
        speaker: client
        text: "對。先是鬆了一口氣，然後更糟。好像我證明了一樣。證明她應付不來。"
      - id: intervention-s9-t07
        speaker: therapist
        text: "好像你證明了一樣。而 K 從來沒有機會讓你看到結果是怎樣。如果你願意，我想在這裡試一件事。你刪掉的那則訊息。你可以現在對我說出來，當我是 K 嗎？"
      - id: intervention-s9-t08
        speaker: client
        text: "現在？在這裡？"
      - id: intervention-s9-d3
        type: choice
        prompt: "你邀請 M 把刪掉的訊息說出來，她猶豫了。你怎樣引導這一刻？"
        options:
          - id: a
            text: "就試試看吧。只是練習而已，不算數的。"
            fit: weak
            note: "如果不算數，就沒有理由去做。M 的猶豫正表示這件事非常算數。把它說得很輕，等於告訴她，你沒有留意到自己在要求多少。"
          - id: b
            text: "現在，如果你願意的話。先給自己一點時間。用你打過的那些字。我會聽著，之後我們再一起看那是什麼感覺。你也可以說不。"
            fit: strong
            note: "這是一個清楚的引導，每一步都說明了：什麼時候、怎樣做、你會做什麼、之後會怎樣。拒絕的空間是真的，這讓答應變得有意義。"
          - id: c
            text: "或者我們談談你本來可能會說什麼，如果這樣比較容易的話。"
            fit: workable
            note: "這比較安全，對某些個案、在某些日子，這是對的一步。但談論說一件事，和真的說出來不一樣，而 M 剛剛說明了退縮讓她付出了什麼代價。"
        actual: "現在，如果你願意的話。先給自己一點時間。用你打過的那些字。我會聽著，之後我們再一起看那是什麼感覺。你也可以說不。"
        rationale: "當你請個案在會談中做一件事，要具體、不急，並且讓拒絕成為可能。如果你自己的不安讓你說得含糊，引導就會變成壓力，個案只能去猜你想要什麼。"
      - id: intervention-s9-t09
        speaker: client
        text: "（長時間停頓，看著自己的手）「我這個星期很糟。我好想他，我也好討厭自己還在想他。我本來不想告訴你，因為你上次對我那麼好。」（哭）"
      - id: intervention-s9-t10
        speaker: therapist
        text: "（過了一會兒）你說出來了。說出來之後，是什麼感覺？"
      - id: intervention-s9-t11
        speaker: client
        text: "好可怕。然後……輕了一點。（抬起頭）你還在這裡。"
      - id: intervention-s9-t12
        speaker: therapist
        text: "我還在這裡。這並沒有太多。"
      - id: intervention-s9-t13
        speaker: client
        text: "（擦眼淚，半笑著）對不起。我把整節會談都用在一件本來應該在家做的事上。"
      - id: intervention-s9-d4
        type: choice
        prompt: "M 為這樣用了這次會談而道歉。你說什麼？"
        options:
          - id: a
            text: "你不需要道歉。"
            fit: workable
            note: "這是真的，也很溫和。它回應了道歉，卻錯過了說出這一小時實際發生了什麼的機會。"
          - id: b
            text: "我會換一個說法。今天你趁一件事還是真的時候，把它告訴了一個人，這正是那個任務。你先在這裡做了，然後才在家裡做。我也留意到，道歉緊接著就來了。"
            fit: strong
            note: "它準確地重新框定這次會談，連到她的目標，並說出道歉而不責備。她離開時知道自己做了什麼。"
          - id: c
            text: "今天是第幾次道歉了？我們說好要數的。"
            fit: weak
            note: "數道歉是說好了的，對某些個案來說，這份輕鬆會受歡迎。但緊接在眼淚和一次真正的冒險之後，可能會讓她覺得被抓到。"
        actual: "我會換一個說法。今天你趁一件事還是真的時候，把它告訴了一個人，這正是那個任務。你先在這裡做了，然後才在家裡做。我也留意到，道歉緊接著就來了。"
        rationale: "結束一個介入時，用個案自己的目標，說出個案做了什麼。對自己很嚴苛的個案，往往要有人描述出來，才看得見自己走了一步。"
      - id: intervention-s9-t14
        speaker: client
        text: "（小聲）我今晚可能會傳出去。同樣的字。"
      - id: intervention-s9-t15
        speaker: therapist
        text: "這由你決定。如果你傳，先把你的預測寫下來。"
    notes:
      goals: "了解任務為什麼沒有發生。提供關於逃避和舒緩的資訊。在會談中完成任務。把下一步留給 M。"
      alliance: "受到考驗，也撐住了。M 預期會看到失望，遇到的卻是興趣。她在房間裡冒了一次險，並且留意到「你還在這裡」。計畫沒有被放棄，也沒有被強迫。"
      formulation_update: "一個新的信念，用 M 的話說：「如果我一直這樣，我會把她耗盡。」她把收到的好意當作一筆債，所以 K 溫暖的回覆反而讓第二則訊息更難。星期三的逃避：舒緩了一分鐘，然後更糟，「好像我證明了一樣」。治療中第一次否證：她說出來了，治療師還在。"
