- id: intervention-e01
  level: easy
  skill: information-giving
  context: "個案的醫生已經替他檢查過，心臟是健康的。"
  client: "我恐慌的時候，心跳快到我以為自己心臟病發。"
  criteria: &ig_easy
    - "先徵求同意，或先了解個案已經知道什麼。"
    - "用一至三句平實的話提供準確的資訊，並連到個案自己的例子。"
    - "最後問這和個案的經驗是否吻合。"
- id: intervention-e02
  level: easy
  skill: information-giving
  context: "第七次會談。"
  client: "會談之後一兩天覺得更難受，是正常的嗎？"
  criteria: *ig_easy
- id: intervention-e03
  level: easy
  skill: information-giving
  context: "個案情緒低落了幾個月，大部分活動都停了。"
  client: "我明明什麼都沒做，為什麼還是一直這麼累？"
  criteria: *ig_easy
- id: intervention-e04
  level: easy
  skill: information-giving
  context: "第七次會談。"
  client: "那次吵架我在腦中一直重播，一次又一次。這就是別人說的反芻嗎？"
  criteria: *ig_easy
- id: intervention-e05
  level: easy
  skill: information-giving
  context: "第七次會談。"
  client: "你上星期說了「自動化思考」。那到底是什麼？"
  criteria: *ig_easy

- id: intervention-e06
  level: easy
  skill: process-direction
  context: "個案剛描述了一個困難的時刻。"
  client: "就是一種很可怕的感覺。我形容不出來。"
  criteria: &pd_easy
    - "清楚告訴個案現在、在會談中要做的一件事。"
    - "詢問個案是否願意，或簡短說明理由。"
    - "語氣不急，個案可以說不。"
- id: intervention-e07
  level: easy
  skill: process-direction
  context: "會談開始時。"
  client: "星期日我跟我媽吵架，星期一跟老闆吵架，然後星期二車又壞了。"
  criteria: *pd_easy
- id: intervention-e08
  level: easy
  skill: process-direction
  context: "個案已經不停地快速說了十分鐘。"
  client: "……總之，這個星期發生的事就是這些。"
  criteria: *pd_easy
- id: intervention-e09
  level: easy
  skill: process-direction
  context: "個案按照約定，帶來了一頁寫下的想法。"
  client: "我照你說的把想法寫下來了。要我全部唸出來嗎？"
  criteria: *pd_easy
- id: intervention-e10
  level: easy
  skill: process-direction
  context: "第七次會談。"
  client: "我一直在想，如果有機會，我會跟我爸說什麼。"
  criteria: *pd_easy

- id: intervention-m01
  level: medium
  skill: information-giving
  context: "第七次會談。"
  client: "如果我讓自己難過，我就會開始哭，然後停不下來。"
  criteria: &ig_medium
    - "認真看待個案的信念，不讓個案因為有這個信念而覺得自己很蠢。"
    - "用平實的話提供準確的資訊，並誠實說出哪些地方不確定或因人而異。"
    - "最後問個案怎樣看，不堅持。"
- id: intervention-m02
  level: medium
  skill: information-giving
  context: "第七次會談。"
  client: "避開這些事才讓我安全。我到底為什麼要停下來？"
  criteria: *ig_medium
- id: intervention-m03
  level: medium
  skill: information-giving
  context: "第七次會談。"
  client: "我不覺得我的想法「只是想法」。我會這樣想，是因為它們是真的。"
  criteria: *ig_medium
- id: intervention-m04
  level: medium
  skill: information-giving
  context: "第七次會談。"
  client: "我看到說抑鬱只是化學物質失衡。所以我不明白談話可以改變什麼。"
  criteria: *ig_medium
- id: intervention-m05
  level: medium
  skill: information-giving
  context: "第七次會談。"
  client: "她過世已經六個月了。我現在應該已經走出來了。"
  criteria: *ig_medium

- id: intervention-m06
  level: medium
  skill: process-direction
  context: "個案在用理論的說法解釋自己的困難。"
  client: "我覺得大概是依附的問題。我看過一本書講這個。焦慮逃避型，差不多是這樣。"
  criteria: &pd_medium
    - "承認個案正在做或正在說的事，不批評。"
    - "溫和而清楚地，把方向轉回個案此刻的經驗，或某一個具體的時刻。"
    - "是詢問而不是堅持，並保持不急。"
- id: intervention-m07
  level: medium
  skill: process-direction
  context: "個案的眼眶濕了，然後轉了話題。"
  client: "總之，沒事了。我有沒有跟你說我們週末要去旅行？"
  criteria: *pd_medium
- id: intervention-m08
  level: medium
  skill: process-direction
  context: "這次會談大部分時間，個案都在談一位同事的行為。"
  client: "……然後她竟然還把整個團隊都加進副本。你相信嗎？她對每個人都這樣。"
  criteria: *pd_medium
- id: intervention-m09
  level: medium
  skill: process-direction
  context: "個案的聲音剛剛哽住了。"
  client: "（笑著）天啊，你看我。為了一隻貓這麼激動。"
  criteria: *pd_medium
- id: intervention-m10
  level: medium
  skill: process-direction
  context: "個案用平板而快速的語氣，描述一段痛苦的時期。"
  client: "然後他走了，然後我們搬家，然後我媽病了，大概就是這樣。"
  criteria: *pd_medium

- id: intervention-h01
  level: hard
  skill: information-giving
  context: "你是實習生。你沒有資格作出診斷。"
  client: "直接告訴我我有什麼問題吧。我的診斷是什麼？"
  criteria: &ig_hard
    - "停留在你所知道和你的角色容許的範圍內。不作診斷，不給用藥建議，也不作保證。"
    - "即使如此，仍然給個案一些真實而有用的東西，不只是拒絕。"
    - "不帶防衛，並說出個案可以在哪裡得到你給不了的東西。"
- id: intervention-h02
  level: hard
  skill: information-giving
  context: "你沒有處方的資格。"
  client: "我應該停藥嗎？那些藥根本沒有作用。"
  criteria: *ig_hard
- id: intervention-h03
  level: hard
  skill: information-giving
  context: "接近治療尾聲。"
  client: "你可以保證它不會再回來嗎？"
  criteria: *ig_hard
- id: intervention-h04
  level: hard
  skill: information-giving
  context: "個案的醫生檢查過，他身體沒有問題。你已經解釋過身體的警報反應。"
  client: "我在網上看到的不是這樣。網上說恐慌發作可以致命。"
  criteria: *ig_hard
- id: intervention-h05
  level: hard
  skill: information-giving
  context: "你剛解釋了逃避怎樣讓恐懼持續下去。"
  client: "你是實習生。你怎麼會知道？"
  criteria: *ig_hard

- id: intervention-h06
  level: hard
  skill: process-direction
  context: "你邀請個案把他想對經理說的話說出來。"
  client: "我不要做角色扮演。太荒謬了。"
  criteria: &pd_hard
    - "尊重拒絕。不推，不求，不說服。"
    - "不放棄目的。說出正在發生的事，或提出一個朝向同一目的、更小的一步。"
    - "平靜、簡短，不為方法辯護。"
- id: intervention-h07
  level: hard
  skill: process-direction
  context: "每次你讓會談慢下來，個案就開玩笑。"
  client: "小心點。你會把我弄哭，然後你就要寫報告了。"
  criteria: *pd_hard
- id: intervention-h08
  level: hard
  skill: process-direction
  context: "上星期的會談情緒很重。"
  client: "今天可以不要談感受嗎？我只想處理一些實際的事。"
  criteria: *pd_hard
- id: intervention-h09
  level: hard
  skill: process-direction
  context: "你已經問了兩次個案在身體上留意到什麼。"
  client: "不要再問我這個了。我身體沒有任何感覺。"
  criteria: *pd_hard
- id: intervention-h10
  level: hard
  skill: process-direction
  context: "個案講一個很長的故事講了二十分鐘。你試過兩次讓他停一停。"
  client: "你為什麼一直打斷我？讓我說完。"
  criteria: *pd_hard
