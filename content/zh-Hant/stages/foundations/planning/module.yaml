slug: planning
version: 1.0.0
title: "治療計畫"
intro: >-
  治療計畫是把個案概念化化為行動。每個目標都應該來自你們一起畫出的循環中的某一環，
  而且個案應該說得出它為什麼在那裡。最常出錯的有兩種情況。一是治療師寫了合理的目標，
  個案只是接受。二是目標大得沒有人分辨得出是否已經達成。在這個模組，個案 M 把她的循環
  轉化成三個小目標。你會練習一起訂立目標，以及為你提出的建議說明理由。
skills:
  - collaboration-on-goals
  - rationale-giving
reflection_prompts:
  - id: planning-r1
    text: "M 說第一步讓她「有點想吐」。治療師怎樣處理這句話？當個案對任務感到焦慮時，你通常會怎樣做：安慰、把任務縮小，還是放棄它？"
  - id: planning-r2
    text: "從你自己的個案中拿一個目標出來。它作用在個案概念化的哪一環？如果你說不出來，這告訴你目標或個案概念化有什麼問題？"
  - id: planning-r3
    text: "回看你在困難級說明理由的作答。你有沒有承諾了超過你所能知道的？改寫其中一個，讓它誠實說出什麼可能行不通。"
