planning-e01:
  model_response: "沒那麼焦慮。如果焦慮低一點，你會在做什麼現在沒有做的事？"
  why: "它保留個案的字眼，並請個案把目標說成行為。"
  avoid: "「我們的目標是把你的焦慮分數減半。」這可以量度，但不是個案自己的目標。"
planning-e02:
  model_response: "上班時更有自信。你最希望先在哪一個情境裡留意到它？"
  why: "它把一個廣泛的目標收窄到一個情境，由個案選擇是哪一個。"
  avoid: "「那我們就處理自我肯定。」目標還沒有出現，就先定了方法。"
planning-e03:
  model_response: "跟女兒的關係好一點。在一個普通的晚上，「好一點」會是什麼樣子？"
  why: "它請個案在一個描述得出來的尺度上，描繪目標的畫面。"
  avoid: "「你有沒有試過多花點時間陪她？」這是為一個還沒有人定義的目標提供解決方法。"
planning-e04:
  model_response: "睡眠是最主要的。對你來說，一個「夠好」的晚上會是怎樣的？"
  why: "它確認優先次序，並請個案自己定義成功，「夠好」讓目標保持實際。"
  avoid: "直接談睡眠習慣。你還不知道個案的目標是什麼。"
planning-e05:
  model_response: "你希望怒氣不再主導一切。當它少一點的時候，你的一天會有什麼不一樣？"
  why: "它重述這個願望，並問什麼改變會是看得見的。"
  avoid: "「生氣是正常的情緒。」這是事實，但它糾正了一個個案才剛說出口的目標。"
planning-e06:
  model_response: "你說過你不確定自己睡了多少。每天早上簡單記幾筆，我們就會看到真實的情況，只靠記憶的話就只能猜，然後我們就知道要處理什麼。你願意試一個星期嗎？"
  why: "它用平實的話，以個案自己的不確定作為理由，然後詢問。"
  avoid: "「這是治療的標準程序。」這只是說出一個程序，沒有給理由。"
planning-e07:
  model_response: "你說過，事情留給你自己處理就會鬆掉。每星期見一次，可以讓一條線一直延續，我們就能接著上星期做下去，不用每次都重新開始。一個月後我們可以再檢討。你覺得怎樣？"
  why: "它把頻率連到個案說過的話，並提出檢討的安排。"
  avoid: "「治療就是這樣進行的。」它用關上問題的方式來回答問題。"
planning-e08:
  model_response: "這個想法很合理。麻煩的是，在一直避開巴士的時候，平靜通常不會出現，因為逃避會不斷告訴你的身體，巴士是危險的。坐一個站，給你的身體一個機會學到不一樣的東西。你願意試坐一個站嗎？"
  why: "它尊重個案的邏輯，用一句話說明機制，並讓這一步保持小而可以選擇。"
  avoid: "「你一定要面對恐懼。」這是口號，沒有告訴個案為什麼。"
planning-e09:
  model_response: "也許沒有關係。我問是因為你提過爸爸會批評你每一份成績表，而做簡報也是一個被評價的時刻。如果兩者有關，它可能會告訴我們恐慌在預期什麼。你怎樣想？"
  why: "它承認這個連結並不確定，用個案自己的細節，然後詢問。"
  avoid: "「早期經驗塑造了我們。」這太籠統，對任何人都成立。"
planning-e10:
  model_response: "你說得對，一杯咖啡治不好。我的想法是這樣的。自從你情緒低落，你就不再見朋友，而接觸少了，往往會讓情緒一直低落下去。一杯咖啡是一個小小的測試，看看多一點接觸會不會帶來任何改變。我們試試看？"
  why: "它同意合理的部分，用個案自己的退縮來說明連結，並把任務定位為一個測試。"
  avoid: "「相信我，有幫助的。」個案要的是理由，它卻要求信任。"
planning-m01:
  model_response: "你當然希望這樣。在他喝酒的日子裡生活，聽起來很辛苦。在他還在喝的時候，你希望你自己有什麼不一樣？"
  why: "它尊重這個願望，然後問個案自己的生活，沒有發表一番關於控制的演說。"
  avoid: "「我們不能改變別人，只能改變自己。」個案會聽到自己的目標被否決了。"
planning-m02:
  model_response: "正常。如果你明天醒來覺得正常，你第一件會留意到的事是什麼？"
  why: "它接受個案的用詞，並請個案說出它的內容。"
  avoid: "「什麼是正常呢？」這是哲學問題，避開了個案的意思。"
planning-m03:
  model_response: "我確實有一些想法，我也會說出來。不過，你才是你自己生活的專家。如果這次治療進行得順利，有一件你希望不一樣的事會是什麼？"
  why: "它沒有拒絕個案，也沒有接管。它只問一件事，這比問目標容易。"
  avoid: "列出三個目標讓個案批准。他會批准的。"
planning-m04:
  model_response: "焦慮讓你吃了這麼多苦，我明白你為什麼會想要這樣。我沒辦法給你「永遠」。如果焦慮有時還是會出現，卻不再主導你的生活，你會可以自由地做什麼？"
  why: "它認可這個願望，用一句話誠實說出限度，並問目標背後的生活。"
  avoid: "簡短講解焦慮為什麼有用。內容準確，時機卻不對。"
planning-m05:
  model_response: "這是一個我可以一起努力的目標。要有什麼不一樣，你才會覺得自己不需要再來？"
  why: "它把這句話當作正當的目標，並問結束治療的標準是什麼。"
  avoid: "聽起來受傷，或問「你為什麼不想來這裡？」。兩者都會讓個案反過來照顧你。"
planning-m06:
  model_response: "這很值得知道，我也不會假裝它是治療方法。它不能阻止恐慌。它有時能做到的，是讓第一分鐘沒那麼難受，好讓你可以留在原地。如果它以前對你完全沒有作用，我們可以不用它。在你決定之前，你願意在這裡和我一起試一次嗎？"
  why: "它接受個案的經驗，說出一個謙虛而誠實的目的，並讓選擇保持開放。"
  avoid: "「你大概是做得不對。」它把方法失敗歸咎於個案。"
planning-m07:
  model_response: "我沒辦法給你一個日期，如果我給了，那也是我編出來的。我可以建議的是，每四次會談我們檢查一下有沒有任何改變，如果沒有就調整方向。這樣對你可以嗎？"
  why: "它拒絕承諾時間，並提供一個具體的追蹤方法。"
  avoid: "「大部分人在六到八次會談後會覺得好一點。」個案會把它聽成是對他的承諾。"
planning-m08:
  model_response: "當下確實會更難受，我不會假裝不是這樣。我的想法是，一段你一直推開的回憶，會一直像事發當天一樣赤裸，而有人陪著你慢慢走過它，可以讓它沒那麼赤裸。這不適合每一個人。我們會按你的步調走，你隨時都可以停下來。你怎樣想？"
  why: "它承認代價，平實地說明理由，說出限度，並把步調的主導權交給個案。"
  avoid: "「先會變差，然後才會變好。」這是一句套話，什麼都沒有解釋。"
planning-m09:
  model_response: "建議可以真的很有幫助，我有看法時也會告訴你。我問問題，是因為你知道很多我不知道的、關於你生活的事，建基於這些的計畫通常會比較合適。如果你想我多給一些直接的建議，就告訴我。你想嗎？"
  why: "它不貶低朋友的治療師，說明提問的理由，並表示願意調整。"
  avoid: "「好的治療不是給建議。」它批評另一位治療師，也否定了個案的要求。"
planning-m10:
  model_response: "這樣說的話，聽起來確實是反過來的。原因是，每一次你避開電梯，恐懼就拿到一個證據，證明電梯是危險的。站在門開著的電梯裡，是收集不同證據的一個小方法。這一步也許太大了，如果是這樣，我們就把它縮小。由你決定。"
  why: "它同意這聽起來奇怪，說明機制，並讓這一步的大小成為個案的決定。"
  avoid: "「這是唯一有效的方法。」這是誇大，也拿走了選擇。"
planning-h01:
  model_response: "所以你來這裡，是因為她希望你來。如果這些會談可以做到一件你自己真的想要的事，就算很小，那可能會是什麼？"
  why: "它不爭辯地接受個案的立場，並尋找任何屬於個案自己的願望。"
  avoid: "「她對你有什麼目標？」這樣主導會談的就變成了太太。"
planning-h02:
  model_response: "回去上班對你很重要，我明白。我現在沒辦法寫那封信，也不會假裝我可以。我可以做的，是和你一起處理擋在你和準備好之間的東西。那會是什麼？"
  why: "它說出底下的願望，直接說明限度，並提出一個為同一目的服務的目標。"
  avoid: "對那封信含糊其辭。現在不清楚的答案，之後會變成一個被打破的承諾。"
planning-h03:
  model_response: "不用填表。你被問這個問題太多次了。忘了那個詞吧。到我們結束的時候，有沒有任何事是你希望會不一樣的？"
  why: "它放下觸動個案的那個詞，用日常的話問同一個問題。"
  avoid: "「目標很重要，這樣我們才知道往哪裡走。」它在為表格辯護。"
planning-h04:
  model_response: "我說說到目前為止我留意到的，你可以告訴我哪裡不對。你說了兩次，你已經厭倦了做那個撐住一切的人。這可以是一個起點嗎？"
  why: "它不和個案爭誰該先說。它把個案自己的話交還給他，作為一個可能的起點，並且可以修正。"
  avoid: "「訂立你的目標不是我的角色。」原則上是對的，在這裡卻讀起來像是有所保留。"
planning-h05:
  model_response: "四次，什麼都沒有改變。換了是我，也不會想再列第五張清單。之前那些目標出了什麼問題？"
  why: "它接受拒絕，並問失敗的經過，那是目前最有用的資料。"
  avoid: "「這一次會不一樣。」另外四個人大概也這樣說過。"
planning-h06:
  model_response: "很多確實是常識，你說得對。雜誌做不到的，是把它配合你的一個星期，以及在事情沒有按計畫進行時，和你一起看看發生了什麼。這值不值得你花時間，由你決定。"
  why: "它承認對方的論點，說出唯一誠實的差別，也不要求被重視。"
  avoid: "「這其實是有實證基礎的介入。」它訴諸權威，而且帶著防衛。"
planning-h07:
  model_response: "我是實習生，也有督導指導。這個方法幫助過很多有類似困難的人，我不能承諾它一定會幫到你。我們會一起去找出答案，一邊進行一邊檢討。如果你比較想見一位已經取得資格的治療師，我可以替你問問。"
  why: "它誠實回答兩半問題，不作承諾，並提供一個真正的選擇。"
  avoid: "向個案保證你的能力。誠實的回答，才是能贏得信任的回答。"
planning-h08:
  model_response: "它確實不是對每個人都有幫助。我沒辦法事先告訴你，你會是哪一類。我能做的，是定期和你確認它有沒有幫助，如果沒有，我會誠實說出來。"
  why: "它不引用數字，同意個案說法中真實的部分，並以定期確認代替承諾。"
  avoid: "憑記憶引用統計數字反駁。你會開啟一場你無法裁決的辯論。"
planning-h09:
  model_response: "付了錢，期望得到一些東西，是合理的。每星期和我一小時，只是你一星期中很小的一部分，而改變要在其餘的時間發生，那裡我不在。這是任務唯一的理由。如果這個任務看起來沒有用，告訴我，我們可以找一個有用的，或者乾脆不做。"
  why: "它接受個案的前提，說出唯一真正的理由，並讓任務可以商量。"
  avoid: "「你要自己努力，治療才會有效。」聽起來像一個警告。"
planning-h10:
  model_response: "那麼再解釋第四次也沒有幫助。你聽過理由了，它說服不了你。我們放下這個任務吧。如果有的話，你覺得什麼值得做？"
  why: "它停止推銷，尊重拒絕，並請個案提出另一個選擇。"
  avoid: "第四次、更慢地解釋。個案第一次就聽懂了。"
