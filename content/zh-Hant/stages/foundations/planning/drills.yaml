- id: planning-e01
  level: easy
  skill: collaboration-on-goals
  context: "你問了個案希望從治療中得到什麼。"
  client: "我只是想沒那麼焦慮。"
  criteria: &cg_easy
    - "保留個案描述自己想要什麼時所用的字眼。"
    - "提出一個問題，讓目標朝向個案會在做或會留意到的事。"
    - "目標的內容留給個案決定，不替個案提供目標。"
- id: planning-e02
  level: easy
  skill: collaboration-on-goals
  context: "訂立計畫的會談。"
  client: "我希望上班時可以更有自信。"
  criteria: *cg_easy
- id: planning-e03
  level: easy
  skill: collaboration-on-goals
  context: "訂立計畫的會談。"
  client: "我希望跟女兒的關係好一點。"
  criteria: *cg_easy
- id: planning-e04
  level: easy
  skill: collaboration-on-goals
  context: "訂立計畫的會談。"
  client: "我想我是想睡得著。這是最主要的。"
  criteria: *cg_easy
- id: planning-e05
  level: easy
  skill: collaboration-on-goals
  context: "訂立計畫的會談。"
  client: "我不想再一天到晚都這麼生氣。"
  criteria: *cg_easy

- id: planning-e06
  level: easy
  skill: rationale-giving
  context: "你建議個案寫睡眠日記。個案之前告訴過你，他不確定自己睡了多少。"
  client: "為什麼要寫下來？我直接告訴你就好了。"
  criteria: &rg_easy
    - "用一至三句平實的話說明理由，沒有專業術語。"
    - "把理由連到這位個案告訴過你的事。"
    - "最後問個案怎樣想，或願不願意。"
- id: planning-e07
  level: easy
  skill: rationale-giving
  context: "你提議每週會談一次。個案之前說過，事情交給他自己處理就會鬆掉。"
  client: "為什麼要每星期？我有需要的時候再來不行嗎？"
  criteria: *rg_easy
- id: planning-e08
  level: easy
  skill: rationale-giving
  context: "個案自從一次恐慌發作之後就避免坐巴士。你建議從坐一個站開始。"
  client: "等我覺得平靜一點再去坐巴士，不是比較合理嗎？"
  criteria: *rg_easy
- id: planning-e09
  level: easy
  skill: rationale-giving
  context: "個案在做簡報前會恐慌。之前他提過，爸爸會批評他每一份成績表。"
  client: "我的童年跟上班恐慌有什麼關係？"
  criteria: *rg_easy
- id: planning-e10
  level: easy
  skill: rationale-giving
  context: "個案自從情緒低落之後就不再見朋友。你建議這個星期約一次喝咖啡。"
  client: "我看不出喝一杯咖啡怎樣可以治好抑鬱。"
  criteria: *rg_easy

- id: planning-m01
  level: medium
  skill: collaboration-on-goals
  context: "訂立計畫的會談。"
  client: "我希望我丈夫戒酒。"
  criteria: &cg_medium
    - "認真看待個案的願望，不否定，也不糾正。"
    - "透過提問，轉向個案自己能影響的範圍。"
    - "不替個案提供目標，也不說教什麼可以控制、什麼不可以。"
- id: planning-m02
  level: medium
  skill: collaboration-on-goals
  context: "訂立計畫的會談。"
  client: "我其實沒有什麼目標。我只是想正常。"
  criteria: *cg_medium
- id: planning-m03
  level: medium
  skill: collaboration-on-goals
  context: "訂立計畫的會談。"
  client: "你覺得怎樣最好就怎樣。你是專家。"
  criteria: *cg_medium
- id: planning-m04
  level: medium
  skill: collaboration-on-goals
  context: "訂立計畫的會談。"
  client: "我想永遠不要再焦慮。"
  criteria: *cg_medium
- id: planning-m05
  level: medium
  skill: collaboration-on-goals
  context: "訂立計畫的會談。"
  client: "老實說？我的目標是盡快不用再來這裡。"
  criteria: *cg_medium

- id: planning-m06
  level: medium
  skill: rationale-giving
  context: "你建議在恐慌開始的頭幾分鐘慢慢呼吸。"
  client: "呼吸練習我以前試過了。沒有用。"
  criteria: &rg_medium
    - "認真看待懷疑，並說出其中合理的地方。"
    - "誠實說明理由，包括這個任務可能做不到的事，不承諾任何效果。"
    - "簡短，最後把決定留給個案。"
- id: planning-m07
  level: medium
  skill: rationale-giving
  context: "訂立計畫的會談。"
  client: "要多久才會開始有效？"
  criteria: *rg_medium
- id: planning-m08
  level: medium
  skill: rationale-giving
  context: "你建議談一段個案一直迴避的回憶。"
  client: "談這件事只會讓我更難受。為什麼我要故意這樣做？"
  criteria: *rg_medium
- id: planning-m09
  level: medium
  skill: rationale-giving
  context: "訂立計畫的會談。"
  client: "我朋友的治療師直接給她建議，她覺得很好。為什麼你一直問我問題？"
  criteria: *rg_medium
- id: planning-m10
  level: medium
  skill: rationale-giving
  context: "個案害怕搭電梯。你提議他站在電梯裡，讓門開著。"
  client: "你要我去做我最怕的事。這聽起來跟幫助剛好相反。"
  criteria: *rg_medium

- id: planning-h01
  level: hard
  skill: collaboration-on-goals
  context: "訂立計畫的會談。個案是在太太堅持下才來的。"
  client: "我沒有目標。是我太太對我有目標。"
  criteria: &cg_hard
    - "不替個案提供目標，不爭辯，也不說服個案他需要一個目標。"
    - "尋找個案確實想要的東西，即使很小，或者只是想不被打擾。"
    - "簡短、平實，把個案的立場當作正當的立場。"
- id: planning-h02
  level: hard
  skill: collaboration-on-goals
  context: "訂立計畫的會談。在這個階段，你無法寫這樣的信。"
  client: "我的目標是你寫一封信，證明我適合上班。"
  criteria: *cg_hard
- id: planning-h03
  level: hard
  skill: collaboration-on-goals
  context: "你剛說了「目標」這個詞。"
  client: "目標。好極了。又一個要我填表寫感受的人。"
  criteria: *cg_hard
- id: planning-h04
  level: hard
  skill: collaboration-on-goals
  context: "訂立計畫的會談。個案雙手抱胸。"
  client: "你告訴我啊。受過訓練的人是你。"
  criteria: *cg_hard
- id: planning-h05
  level: hard
  skill: collaboration-on-goals
  context: "訂立計畫的會談。"
  client: "我跟四個治療師訂過目標。什麼都沒有改變。所以，不要。"
  criteria: *cg_hard

- id: planning-h06
  level: hard
  skill: rationale-giving
  context: "你說明了一個安排活動的計畫。"
  client: "這只是包裝過的常識。我在雜誌上也看得到。"
  criteria: &rg_hard
    - "不辯護，不誇大，也不搬出你受過的訓練。"
    - "給出誠實的理由，並清楚說出你不能承諾什麼。"
    - "讓個案有真正的選擇，包括說不的選擇。"
- id: planning-h07
  level: hard
  skill: rationale-giving
  context: "你是實習生。你剛提出了第一個任務。"
  client: "這個到底有沒有用，還是你在拿我來練習？"
  criteria: *rg_hard
- id: planning-h08
  level: hard
  skill: rationale-giving
  context: "訂立計畫的會談。"
  client: "我查過了。心理治療對很多人都沒有用。"
  criteria: *rg_hard
- id: planning-h09
  level: hard
  skill: rationale-giving
  context: "你建議了一個會談之間的任務。"
  client: "我為什麼要做作業？我付錢是要你解決問題的。"
  criteria: *rg_hard
- id: planning-h10
  level: hard
  skill: rationale-giving
  context: "你已經解釋過這個任務的理由兩次。"
  client: "你已經解釋了三次。我還是覺得沒有意義。"
  criteria: *rg_hard
