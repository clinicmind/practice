sessions:
  - id: planning-s7
    title: "第 7 次會談：由循環到計畫"
    turns:
      - id: planning-s7-t01
        speaker: therapist
        text: "上星期我們畫了循環。我帶來了。今天我想和你一起找出你希望什麼不一樣，以及從哪裡開始。在第二次會談，你說你想不要再覺得自己無時無刻都要沒事。現在還是這樣嗎？"
      - id: planning-s7-t02
        speaker: client
        text: "對。不過有點模糊，對吧。我不知道要怎樣量度。"
      - id: planning-s7-d1
        type: choice
        prompt: "M 的目標是真實的，也是模糊的。你怎樣幫她把它變得具體？"
        options:
          - id: a
            text: "我覺得你的第一個目標應該是告訴 K 你真正的狀況。"
            fit: weak
            note: "這是一個好目標，也是從循環推出來的。但它是你的。M 會立刻接受，而你不會知道她是同意了，還是服從了。"
          - id: b
            text: "如果你離「不用無時無刻都要沒事」再近一點點，我會看到你在做什麼現在沒有做的事？"
            fit: strong
            note: "它保留她的目標和她的字眼，並請她把目標想像成行為。「近一點點」讓答案保持小。不論她說什麼，都會是一件可以被留意到的事。"
          - id: c
            text: "我們把它變得具體、可量度、有時限。如果滿分是十分，你現在會給它幾分？"
            fit: workable
            note: "結構有幫助，評分之後也可能有用。但一開始就談方法，會讓方法主導對話。為「要沒事」打一個十分制的分數，也不會告訴你們任何一方下一步要做什麼。"
        actual: "如果你離「不用無時無刻都要沒事」再近一點點，我會看到你在做什麼現在沒有做的事？"
        rationale: "具體的目標描述的是個案會在做的事。請個案描繪畫面，讓個案自己去畫。這樣得出的目標是她的，也是可以檢查的。"
      - id: planning-s7-t03
        speaker: client
        text: "（想了想）我會在事情還在發生的時候就告訴 K。不是兩個月之後。還有我會重新畫畫。也許也不會那麼常道歉。我在來的路上數過，九點之前我已經跟四個人說了對不起。"
      - id: planning-s7-t04
        speaker: therapist
        text: "那就是三件事。在事情還在發生的時候告訴 K。重新畫畫。少一點道歉。你會從哪裡開始？"
      - id: planning-s7-t05
        speaker: client
        text: "應該是畫畫吧。那個最容易。（停頓）大概就是因為這樣我才選它。你會從哪裡開始？"
      - id: planning-s7-d2
        type: free
        prompt: "M 問你會從哪裡開始。你會從告訴 K 開始。說明你的理由，把它連到她循環中的一步，並把選擇留給她。"
        actual: "我說說我的想法，然後由你決定。在你的循環裡，讓其他部分一直轉下去的那一步是「沒有人知道」。在事情還在發生的時候，告訴 K 一件小小的真實的事，就是在那一步打斷循環。而 K 是最安全的嘗試對象。畫畫也很重要，可以同時進行。你覺得這樣說得通嗎？還是你會排一個不同的次序？"
        rationale: "說明理由，是用個案自己的個案概念化，說出為什麼是這個、為什麼是現在。這正是讓一個任務變成個案自己選擇的東西。因為 M 問了你的看法，說出來是誠實的。連同理由說出來，再把決定交還給她，計畫就仍然是共同的。"
      - id: planning-s7-t06
        speaker: client
        text: "說得通。（停頓）同時也讓我有點想吐。"
      - id: planning-s7-d3
        type: choice
        prompt: "M 同意這個道理，一想到就覺得想吐。你說什麼？"
        options:
          - id: a
            text: "你會沒事的。K 是你的朋友，她會想知道的。"
            fit: weak
            note: "你在預測 K 的反應，那是你無法知道的，也在告訴 M 她的害怕是不必要的。如果結果不好，你錯了。如果她做不到，她就是在一件你說會沒事的事情上失敗了。"
          - id: b
            text: "這告訴我，這一步的方向是對的，大小也許不對。我們可以怎樣把它縮小，小到會不舒服、但做得到？"
            fit: strong
            note: "它把想吐的感覺看成是關於這一步大小的資訊，並邀請 M 重新調整大小。難度仍然由她掌握。"
          - id: c
            text: "如果比較容易，我們也可以先從畫畫開始。"
            fit: workable
            note: "它尊重她的限度，從個案能開始的地方開始也是合理的。但她剛告訴你，她選畫畫是因為它避開了困難的部分。如果你把它遞回給她，你就加入了逃避。"
        actual: "這告訴我，這一步的方向是對的，大小也許不對。我們可以怎樣把它縮小，小到會不舒服、但做得到？"
        rationale: "當個案對任務感到焦慮時，除了安慰和退讓，還有第三個選擇：把任務縮小。完全不會帶來不舒服的一步，大概碰不到循環；會帶來恐懼的一步，則不會發生。讓個案自己決定大小。"
      - id: planning-s7-t07
        speaker: client
        text: "傳訊息。不打電話。像是「今天好爛」這樣。不是整件事。只是在那一天，說一件那一天是真的事。"
      - id: planning-s7-t08
        speaker: therapist
        text: "在那一天，說一件那一天是真的事。用訊息。清清楚楚，而且是你自己定的。"
      - id: planning-s7-t09
        speaker: client
        text: "那如果她不回呢？"
      - id: planning-s7-d4
        type: choice
        prompt: "M 問如果 K 不回覆會怎樣。你怎樣回應？"
        options:
          - id: a
            text: "我相信她一定會回。"
            fit: weak
            note: "你並不確定，M 也不確定。這個問題是循環在說話：「對她來說會太多。」安慰回答了問題，卻讓這個信念沒有被檢驗。"
          - id: b
            text: "這就是你循環裡的那個想法：「對她來說會太多。」我們把你預測會發生什麼寫下來。下星期我們再看實際發生了什麼。不管發生什麼，我們都會學到一些東西。"
            fit: strong
            note: "它把擔心連到個案概念化，並把任務變成一個寫下了預測的實驗。沒有任何結果算是失敗，這對 M 非常重要。"
          - id: c
            text: "如果她不回，對你來說代表什麼？"
            fit: workable
            note: "這個意義很重要，值得知道。但在她還沒有嘗試任何事之前就深入探索，可能會變成用十分鐘預演最壞的情況。"
        actual: "這就是你循環裡的那個想法：「對她來說會太多。」我們把你預測會發生什麼寫下來。下星期我們再看實際發生了什麼。不管發生什麼，我們都會學到一些東西。"
        rationale: "計畫應該包括你們兩人怎樣知道發生了什麼。在任務之前寫下預測，之後再拿來比較，就能把令人害怕的一步，變成一個找出答案的方法。"
      - id: planning-s7-t10
        speaker: client
        text: "（寫下來）「她會過好幾個小時才回，回的時候會很短，然後我就知道我讓她煩了。」（抬起頭）寫下來看，好像有點狠。"
      - id: planning-s7-t11
        speaker: therapist
        text: "是有點狠。我們看看這個星期會告訴我們什麼。"
    notes:
      goals: "三個目標，用 M 的話說。一：在事情發生的那一天，傳訊息告訴 K 一件真實的事。二：這個星期畫畫兩次，每次二十分鐘。三：數一數自己道歉的次數，暫時不用嘗試停止。第一個作用在「沒有人知道」。第二個找回一樣曾經屬於她的東西。第三個讓「裝作沒事」這一步變得看得見。"
      alliance: "目標和任務現在都有了共識，理由也是 M 可以自己複述的。她出聲指出了自己的逃避（「大概就是因為這樣我才選它」），並詢問治療師的看法，卻沒有把決定交出去。"
      formulation_update: "M 寫下的預測，讓這個信念變成可以檢驗的形式：「她會過好幾個小時才回，回的時候會很短，然後我就知道我讓她煩了。」道歉：照她自己數，早上九點前已經四次。"
