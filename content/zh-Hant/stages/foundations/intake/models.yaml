intake-e01:
  model_response: "最近最常在你心裡的是什麼？"
  why: "這是開放式的，給個案一個開始的地方，又不替他選話題。"
  avoid: "「從哪裡開始都可以」聽起來很體貼，但它把個案剛說出的難題原封不動交還給他。"
intake-e02:
  model_response: "是什麼讓你覺得，這對你也可能有幫助？"
  why: "它跟隨個案來這裡的理由，把焦點從姊姊的經驗移到個案自己身上。"
  avoid: "問關於姊姊的事。她不是個案。"
intake-e03:
  model_response: "這個壓力對你來說是怎樣的？"
  why: "它停留在個案用的詞「壓力」上，並問他對壓力的經驗。"
  avoid: "「哪些考試？」只是收集事實，會讓對話收窄。"
intake-e04:
  model_response: "接下來的時間是你的。關於你為什麼來這裡，你希望我了解些什麼？"
  why: "先回答個案問的問題，再用一個開放的邀請開始會談。"
  avoid: "把整個初次會談的程序講一遍。個案問的是接下來會怎樣，不是每次會談會怎樣。"
intake-e05:
  model_response: "搬來之後，你過得怎樣？"
  why: "這是開放式的，用的是個案自己的時間範圍，他可以談工作、這個地方，或低落的情緒。"
  avoid: "「你想家嗎？」這是包裝成問題的猜測，一個字就可以回答。"
intake-e06:
  model_response: "新工作，加上搬家，兩件事同時來。"
  why: "幾個字就帶出個案兩句話的內容，沒有多加任何東西。"
  avoid: "「聽起來壓力很大。」這可能是真的，但那是你的標籤。個案說的是「事情好多」。"
intake-e07:
  model_response: "上班的時候還撐得住，一回到家，重量就來了。"
  why: "它保留了個案在上班和回家之間劃出的對比，用的是新的字眼。"
  avoid: "問「你覺得為什麼會這樣？」個案還沒有被聽見。"
intake-e08:
  model_response: "她的電話是出於關心，你也每次都被掏空。"
  why: "兩部分都保留，並且用「也」連起來，媽媽的關心和個案的疲累可以同時是真的。"
  avoid: "建議個案少接幾次電話。沒有人要求解決方法。"
intake-e09:
  model_response: "爬山以前是你每週固定會做的事。現在停了，你也說不太清楚發生了什麼。"
  why: "它說回事實，也說回個案的困惑，沒有替這些提供解釋。"
  avoid: "「人在情緒低落時，常常會失去興趣。」這是在了解之前就先解釋。"
intake-e10:
  model_response: "你希望可以重新找回像自己的感覺。"
  why: "簡短，用你自己的話，並且把這個希望當作目前已經足夠。"
  avoid: "馬上要求個案把希望變成可量度的目標。訂立目標是之後的事。"
intake-m01:
  model_response: "你的伴侶留意到什麼，所以建議你來？"
  why: "它不和「大致上還好」爭辯，而是走向個案給出的唯一一項資訊，並開放地問。"
  avoid: "「所以你覺得自己不需要來這裡？」這可以用「是」或「不是」回答，而且等於邀請個案離開。"
intake-m02:
  model_response: "如果要說這個故事，你會從哪一段開始？"
  why: "它接住故事，略過「無聊」而不反駁。這比說「我有興趣」更能讓人感受到你有興趣。"
  avoid: "「我相信一點都不無聊！」安慰是要個案相信你。提問讓他自己發現。"
intake-m03:
  model_response: "發生了什麼事，讓你覺得自己誇張？"
  why: "它用個案自己的詞，並問詞背後是什麼。個案可以描述發生的事，而不用為自己的反應辯護。"
  avoid: "「你為什麼這樣說？」「為什麼」的問題是要人提出理由，而那一聲笑表示個案已經在批評自己。"
intake-m04:
  model_response: "睡得不好的晚上，是怎樣的？"
  why: "個案很快列了三件事。這個問題挑出聽起來像困難的那一件，請他描述。"
  avoid: "按次序用三個封閉式問題逐項問。你會再得到三個簡短的答案。"
intake-m05:
  model_response: "見那位輔導員的經驗，是怎樣的？"
  why: "說「還可以」之前的停頓，就是被略過的部分。一個關於經驗的開放式問題，讓個案自己決定說多少。"
  avoid: "「是不是沒有幫助？」這是封閉式問題，而且替個案給了答案。"
intake-m06:
  model_response: "你喜歡這份工作，同時從星期六下午開始，對星期一的害怕就已經來了。"
  why: "兩面份量相同，用「同時」連起來。"
  avoid: "「所以你其實不是真的喜歡你的工作。」這是替個案解決矛盾，而且多半解決錯了。"
intake-m07:
  model_response: "所有事都還是做完了，也很少有事情能讓你提起興趣。"
  why: "它把能運作和平淡感放在一起，也尊重個案說這不是難過。"
  avoid: "說這是抑鬱或倦怠。替狀況命名不是重述。"
intake-m08:
  model_response: "你爸爸常常不在，你也把這看成是那時候每家都一樣的事。"
  why: "它說回事實，也說回個案對事實的看法。既不同意「沒什麼大不了」，也不反駁。"
  avoid: "「那一定很孤單吧。」個案剛告訴你那很正常。你之後也許說得對，但現在太早。"
intake-m09:
  model_response: "你跟她說沒關係，之後兩個星期，你一個訊息也沒傳。"
  why: "它把兩件事實並排放著，然後停下。個案可以看見中間的落差，而不用被告知那代表什麼。"
  avoid: "「所以你其實在生她的氣。」這是詮釋，而個案剛說過自己沒關係。"
intake-m10:
  model_response: "你有一部分想來這裡，也有一部分覺得自己應該一個人應付。"
  why: "兩部分都說成是屬於個案的，沒有站在任何一邊。"
  avoid: "「每個人有時都需要幫助。」這是站在其中一部分那邊，並告訴另一部分它錯了。"
intake-h01:
  model_response: "你的醫生希望你哪些地方可以不一樣？"
  why: "它不為治療辯護。它開放地問轉介的事，那是個案和你目前唯一共有的東西。"
  avoid: "解釋治療怎樣運作。個案沒有問，這會讓第一分鐘變成辯論。"
intake-h02:
  model_response: "我是實習生，在督導的指導下工作。和一個比你年輕的人一起工作，你擔心的是什麼？"
  why: "直接問你的身分，就用一句誠實的話回答。接著的開放式問題，把個案的顧慮當作一份真實的顧慮來看待。"
  avoid: "列出你的資歷，或問「我的年紀是問題嗎？」前者是辯護。後者是封閉式問題，聽起來像受傷了。"
intake-h03:
  model_response: "你不需要說什麼特定的話。現在坐在這裡，你感覺怎樣？"
  why: "它拿走個案感受到的要求，並問此時此刻，那是他唯一讓你看到的東西。"
  avoid: "連續問幾個問題來填滿沉默。每多問一題，就多一分「有正確答案」的感覺。"
intake-h04:
  model_response: "已經講了三次，真的很多。這一次，你希望有什麼不一樣？"
  why: "一句簡短的確認，不替制度道歉，然後一個開放式問題，讓個案對會談怎樣進行有一點主導權。"
  avoid: "「不好意思，我還是需要完整的背景。」這也許是程序，但它用一條規則回應個案的疲倦。"
intake-h05:
  model_response: "這些是我自己的筆記，只會留在這個機構裡。你擔心它們會怎樣？"
  why: "事實性的問題，先得到事實性的回答。然後開放式問題走向底下的擔心。"
  avoid: "「不用擔心，全部都是保密的。」這打發了個案的顧慮，也承諾了超過你能做到的事。"
intake-h06:
  model_response: "六個星期，你得到的只有點頭。你是付了錢的。"
  why: "它把不滿以原來的力度說回去，包括錢的部分，沒有多加任何東西。"
  avoid: "「我的做法不一樣。」這是一個你還沒有贏得的承諾，也等於邀請個案來測試它。"
intake-h07:
  model_response: "你被叫過太多次要敞開心扉，所以我還沒開口，你已經預期我會這樣說。"
  why: "它重述了過去的經驗，也重述了對你的預測，沒有否認這個預測。"
  avoid: "「我不會這樣說。」個案的重點正是：他已經不再相信別人說自己會怎樣做。"
intake-h08:
  model_response: "你來了，你會回答，你也寧願不用做這件事。"
  why: "它用平實的話說出「好啦，隨便」背後的意思，不責備，也不懇求。"
  avoid: "當作什麼都沒聽到，直接問你的第一個問題。這證實了你只想要你的問題被回答。"
intake-h09:
  model_response: "時間很緊，你希望這次談得實際一點。"
  why: "它把這個要求當作一個真正的要求來看待。重述它，不代表你同意永遠避開感受。"
  avoid: "解釋為什麼感受在治療中很重要。個案只有四十分鐘，也剛說了他想怎樣用。"
intake-h10:
  model_response: "因為是收錢的，所以很難相信這份聆聽是真的。"
  why: "它準確說出這份懷疑，並讓它留在那裡。被聽見的懷疑，比被回答的懷疑更容易處理。"
  avoid: "「我是真心關心我的個案的。」這是辯護，也正是一個收錢聆聽的人會說的話。"
