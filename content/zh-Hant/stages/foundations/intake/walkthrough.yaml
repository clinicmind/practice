sessions:
  - id: intake-s1
    title: "第 1 次會談：認識個案 M"
    turns:
      - id: intake-s1-t01
        speaker: therapist
        text: "M，你好。請進，坐哪裡都可以。這裡容易找嗎？"
      - id: intake-s1-t02
        speaker: client
        text: "還好，找到了。不好意思，我早到了一點。我不知道過來要多久。"
      - id: intake-s1-t03
        speaker: therapist
        text: "不用不好意思。開始之前，我想先簡單說一下這裡是怎樣進行的，之後的時間就交給你。可以嗎？"
      - id: intake-s1-t04
        speaker: client
        text: "好。可以。"
      - id: intake-s1-t05
        speaker: therapist
        text: "我們今天有五十分鐘。我是實習生，意思是我在一位督導的指導下工作。我會和督導討論我的工作，讓你得到更好的照顧。你在這裡說的話，只會留在我們之間和督導那裡。"
      - id: intake-s1-t06
        speaker: client
        text: "那……我媽媽不會知道吧？她不知道我來這裡。我想就這樣。"
      - id: intake-s1-d1
        type: choice
        prompt: "M 剛剛問媽媽會不會知道。你怎樣回答？"
        options:
          - id: a
            text: "不用擔心，這裡的一切都是百分之百保密的。"
            fit: weak
            note: "這句話溫暖，但不是事實。保密有限制。如果有一天你必須依其中一項限制行事，M 會知道第一次見面頭十分鐘的承諾並沒有兌現。對一個預期自己的感受會帶來代價的人來說，這一課太沉重。"
          - id: b
            text: "你媽媽不會從我這裡聽到任何事。你是成年人，來這裡是你自己的事。有一個例外我想讓你知道：如果我非常擔心你或其他人有危險，我需要讓其他人參與，以保障你的安全。只要可以，我會先告訴你。"
            fit: strong
            note: "先回答她問的問題，再說一般規則。限制說得清楚，一口氣說完，也說明你會怎樣做。M 聽到的是：她的隱私是真的，你也不會讓她措手不及。"
          - id: c
            text: "保密受我們的專業守則和法律規範。有幾種例外情況，包括對自己或他人有傷害的風險、涉及兒童保護的情況，以及法院命令。"
            fit: workable
            note: "準確，也完整。只是它回答的不是 M 問的問題。她想知道的是媽媽。一串法律上的例外聽起來像警告，而她仍然不知道答案。"
        actual: "你媽媽不會從我這裡聽到任何事。你是成年人，來這裡是你自己的事。有一個例外我想讓你知道：如果我非常擔心你或其他人有危險，我需要讓其他人參與，以保障你的安全。只要可以，我會先告訴你。"
        rationale: "先回答眼前這個人，再說規則。知情同意要個案真的明白才算數，所以要用她緊張時也聽得進的話來說。也留意 M 無意中告訴了你的事：二十五歲的她，在向媽媽隱瞞自己求助。現在先不探索。你記住就好。"
      - id: intake-s1-t07
        speaker: client
        text: "好。這樣很合理。謝謝。"
      - id: intake-s1-t08
        speaker: therapist
        text: "那麼，是什麼讓你來這裡？"
      - id: intake-s1-t09
        speaker: client
        text: "我不知道，可能沒什麼。只是累了一段時間。睡得不太好。工作很忙。我想，也許應該在它變得……我不知道。其實真的沒那麼嚴重。"
      - id: intake-s1-d2
        type: free
        prompt: "M 說她很累、睡得不好，又兩次說這不嚴重。寫一句重述。不要安慰她，也先不要追問。"
        actual: "你累了一段時間，也睡得不好。同時你心裡有一部分在想，這些值不值得拿來這裡說。"
        rationale: "這句重述同時接住兩半：困難本身，和她對困難的淡化。如果你只接前一半，說「聽起來真的很辛苦」，你就走得比她遠，而像 M 這樣的個案會出於禮貌跟著你走。如果你只接後一半，同意可能沒什麼，這次會談就結束了。兩半都重述，她可以自己選擇多說哪一邊。"
      - id: intake-s1-t10
        speaker: client
        text: "嗯。對。我是說，別人才有真正的問題。（停頓）大概六個月了吧。差不多是我和男朋友分手的時候開始。不過那不是……我已經放下了。"
      - id: intake-s1-d3
        type: choice
        prompt: "M 提到分手，又立刻說自己已經放下。你問什麼？"
        options:
          - id: a
            text: "你肯定你已經放下了嗎？睡不好六個月，好像不是這樣。"
            fit: weak
            note: "你可能說得對，但你剛剛告訴她，你比她更了解她自己。在第一次會談，對一個很容易讓步的個案，她多半會同意你，然後覺得這裡沒那麼安全。"
          - id: b
            text: "這六個月，對你來說是怎樣過的？"
            fit: strong
            note: "這是開放式的，用的是她自己的時間範圍，也不用她為「已經放下」辯護。她可以從任何地方開始：睡眠、工作，或分手。"
          - id: c
            text: "你和男朋友在一起多久？"
            fit: workable
            note: "問得合理，你之後也會想知道答案。但這是封閉式問題，而且直接把她帶回她剛剛走開的那個話題。她會簡短回答，然後等你問下一題。"
        actual: "這六個月，對你來說是怎樣過的？"
        rationale: "開放式提問把方向交還給個案。在初次會談早段，個案選擇往哪裡走，本身就是資料。M 先選了工作和疲倦，分手只是順帶提到。這個次序讓你知道，哪些話對她來說比較容易說出口。"
      - id: intake-s1-t11
        speaker: client
        text: "大部分時間就是……平平的。起床，上班，上班的時候沒問題。然後回到家，我就只是……坐著。我以前會畫畫，現在不畫了。我推掉朋友的約，推完又覺得內疚。（輕輕笑了一下）有些日子，我起床只是因為要餵貓。"
      - id: intake-s1-t12
        speaker: therapist
        text: "所以上班的時候你撐得住，回到家就沒剩多少了。以前屬於你自己的東西，畫畫、見朋友，都慢慢不見了。"
      - id: intake-s1-t13
        speaker: client
        text: "（小聲）對。（停頓）其實這不是第一次。中學的時候發生過，兩次。我以為已經過去了。"
      - id: intake-s1-t14
        speaker: therapist
        text: "謝謝你告訴我。我想聽聽那兩次的事，我們之後會再回來談。有一件事，每個告訴我自己曾經這麼低落的人，我都會問，我也想問問你。"
      - id: intake-s1-d4
        type: choice
        prompt: "你需要問關於死亡或自殺的念頭。你用哪一種說法？"
        options:
          - id: a
            text: "你沒有想過傷害自己吧？"
            fit: weak
            note: "這個問題告訴她你希望聽到什麼答案。M 很留意別人想從她身上得到什麼。她會說沒有，而你什麼也沒有知道。"
          - id: b
            text: "在這種很平、很沒勁的時候，無論是現在還是以前，你有沒有想過活著沒有意思，或者想過結束自己的生命？"
            fit: strong
            note: "直接，也平靜。用平常的話說出那件事，涵蓋現在和過去，兩種答案都可以說。直接問不會把念頭放進別人腦中。它讓她知道，這件事在這裡是可以說的。"
          - id: c
            text: "你有沒有，你知道的，一些比較負面的念頭？"
            fit: workable
            note: "它打開了話題，但含糊的說法透露了你自己的不自在。她不知道你在問什麼，所以可以回答一個比較容易的版本。之後你還是要再問得清楚一點。"
        actual: "在這種很平、很沒勁的時候，無論是現在還是以前，你有沒有想過活著沒有意思，或者想過結束自己的生命？"
        rationale: "直接問，用日常的話，語速和其他問題一樣。這段療程走讀只示範怎樣問。聽到答案後怎樣處理，不是你一個人可以決定的：依照實習機構的風險守則處理，並在當天告訴督導，無論個案怎樣回答。"
      - id: intake-s1-t15
        speaker: client
        text: "（長時間停頓）十七歲的時候，有一段時間，我睡覺前會希望自己不要醒來。我沒有做過什麼。也沒有跟任何人說過。現在……沒有。現在不是那樣。我只是累。"
      - id: intake-s1-t16
        speaker: therapist
        text: "十七歲的時候，你一個人扛著這些。現在是疲倦，沒有那些念頭。我很高興你告訴我。我之後會不時再問你，因為這很重要。如果有一天情況變了，我希望我們可以在這裡談。"
      - id: intake-s1-t17
        speaker: client
        text: "好。（停頓）對不起，說得有點沉重。"
      - id: intake-s1-t18
        speaker: therapist
        text: "在這裡，你不需要為這個道歉。這個房間就是為這些而設的。"
      - id: intake-s1-t19
        speaker: client
        text: "（點頭）通常要多久？我是說，治療。我不想佔了別人更需要的時段。"
      - id: intake-s1-d5
        type: choice
        prompt: "M 問治療要多久，又補充說她不想佔了別人的位置。你怎樣回答？"
        options:
          - id: a
            text: "這真的因人而異。我們現在先不用想這個。"
            fit: weak
            note: "她問了一個實際的問題，卻沒有得到答案。「先不用想」也讓她學到，她對治療架構的疑問是不受歡迎的。"
          - id: b
            text: "我建議我們每週見一次，先見四次，了解發生了什麼事，然後再一起決定之後怎樣做對你有幫助。你後半句話我也聽到了：這個時段是你的。你不需要比別人更糟，才有資格用它。"
            fit: strong
            note: "提出一個具體、有限度的建議，並讓決定成為雙方共同的事。然後簡短回應藏在問題裡的擔心，不把它變成一個她沒有要求的詮釋。"
          - id: c
            text: "有這類困難的人，大多需要十二到二十次會談。"
            fit: workable
            note: "這是直接的回答，她可能會欣賞。但你還不知道她的困難是什麼，而第一次會談給出的數字，往往會被記成一個承諾。它也略過了她說的佔別人位置那部分。"
        actual: "我建議我們每週見一次，先見四次，了解發生了什麼事，然後再一起決定之後怎樣做對你有幫助。你後半句話我也聽到了：這個時段是你的。你不需要比別人更糟，才有資格用它。"
        rationale: "清楚的治療架構是一種體貼。焦慮的個案聽到「先見四次，然後一起決定」，會比聽到「因人而異」更安穩。最後一句也很重要。五十分鐘之內，M 為早到道歉，說自己的困難沒什麼，為沉重的時刻道歉，現在又提出讓出自己的位置。今天你不會去詮釋這些。但你要回應它。"
      - id: intake-s1-t20
        speaker: client
        text: "（眼眶濕了，把視線移開）好。四次。下星期同一時間？"
      - id: intake-s1-t21
        speaker: therapist
        text: "下星期同一時間。"
    notes:
      goals: "用平常的話建立治療架構和它的限制。用 M 自己的說法聽她呈現的困難。詢問風險。同意先見四次。"
      alliance: "有禮、小心、很快同意。道歉了三次，又一次提出讓出自己的位置。接近尾聲，聽到這個時段是她的，她有一點點打開。現在還太早，說不準她的同意是真的同意，還是順從。"
      formulation_update: "目前只有觀察。情緒低落約六個月，大約從一次分手開始，她說自己已經放下。中學時有兩次較早的發作。十七歲時有被動的死亡念頭，沒有告訴任何人。她向媽媽隱瞞自己求助。她淡化自己的痛苦，拿自己和有「真正問題」的人比較。帶到下一步的問題：當 M 讓別人看到自己撐不住時，她學到了會發生什麼事？"
