slug: intake
version: 1.0.0
title: "初次會談與治療架構"
intro: >-
  第一次會談要同時做兩件事。一是建立治療架構：治療是什麼，什麼會保密、什麼不能保密，
  會見多久。二是開始聆聽。實習生常常把第一件事做得像填表，把第二件事做得像面試。
  在這個模組，你會跟著個案 M 走過她的第一次會談，然後練習初次會談最常用的兩項技能：
  開放式提問和重述。
skills:
  - open-question
  - restatement
reflection_prompts:
  - id: intake-r1
    text: "建立治療架構時，哪一部分你最難說出口：保密和它的限制、費用和時間，還是治療能做和不能做的事？難在哪裡？"
  - id: intake-r2
    text: "個案 M 把自己的困難說得很輕。當個案淡化自己的狀況時，你通常會怎樣做：安慰、追問，還是帶過？每一種做法可能讓個案感受到什麼？"
  - id: intake-r3
    text: "回看你在困難級的作答。當個案懷疑你或反駁你時，在你回答之前，你心裡發生了什麼？這怎樣反映在你的用字上？"
