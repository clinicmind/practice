# 30 題練習：每個級別 10 題，每個級別每項技能 5 題。
# 級別越高，標準越嚴格。

- id: intake-e01
  level: easy
  skill: open-question
  context: "第一次會談。個案剛坐下。"
  client: "我不知道要從哪裡說起。"
  criteria: &oq_easy
    - "不能用「是」或「不是」回答。以「什麼」「怎樣」開頭，或用「說說……」「可以多說一點……」這類邀請。"
    - "停留在個案剛說的內容上，不帶入新話題。"
    - "只有一個簡短的問題，不是兩個問題連在一起。"
- id: intake-e02
  level: easy
  skill: open-question
  context: "第一次會談。"
  client: "我姊姊說找人談對她有幫助，所以我想試試看。"
  criteria: *oq_easy
- id: intake-e03
  level: easy
  skill: open-question
  context: "和一位大學生的第一次會談。"
  client: "大概主要是考試的壓力吧。"
  criteria: *oq_easy
- id: intake-e04
  level: easy
  skill: open-question
  context: "你剛說明了保密和它的限制。"
  client: "好。明白。那……接下來呢？"
  criteria: *oq_easy
- id: intake-e05
  level: easy
  skill: open-question
  context: "第一次會談。"
  client: "自從為了工作搬來這裡，我一直很低落。"
  criteria: *oq_easy

- id: intake-e06
  level: easy
  skill: restatement
  context: "第一次會談。你問了個案是什麼讓他來這裡。"
  client: "我剛換了新工作，房東又要賣房子，所以下個月之前我要找到新地方住。事情好多。"
  criteria: &rs_easy
    - "用比個案更少的字，說回主要內容。"
    - "用你自己的話，不是照搬個案的句子，也不加入詮釋或建議。"
    - "是陳述句，不是問句，並留空間讓個案糾正你。"
- id: intake-e07
  level: easy
  skill: restatement
  context: "第一次會談。"
  client: "上班還可以。是回到家之後，一切都變得很沉重。"
  criteria: *rs_easy
- id: intake-e08
  level: easy
  skill: restatement
  context: "第一次會談。個案在描述家人。"
  client: "我媽每晚都打電話來問候我。我知道她是關心我，可是每次講完電話我都好累。"
  criteria: *rs_easy
- id: intake-e09
  level: easy
  skill: restatement
  context: "第一次會談。"
  client: "我以前每個週末都去爬山。已經好幾個月沒去了，我也說不出為什麼。"
  criteria: *rs_easy
- id: intake-e10
  level: easy
  skill: restatement
  context: "你問了個案希望從治療中得到什麼。"
  client: "我想重新覺得自己像自己。我希望的其實就只有這樣。"
  criteria: *rs_easy

- id: intake-m01
  level: medium
  skill: open-question
  context: "第一次會談。你問了個案是什麼讓他來這裡。"
  client: "我不知道。大致上還好吧。是我的伴侶覺得我應該來。"
  criteria: &oq_medium
    - "不能用「是」或「不是」回答。"
    - "接住個案略過或淡化的那部分，但不和它爭辯。"
    - "只有一個簡短的問題，問的是個案的經驗，不是要他解釋理由。不以「為什麼」開頭。"
- id: intake-m02
  level: medium
  skill: open-question
  context: "第一次會談。"
  client: "說來話長，而且應該很無聊。"
  criteria: *oq_medium
- id: intake-m03
  level: medium
  skill: open-question
  context: "第一次會談。個案一邊說一邊笑。"
  client: "老實說，我可能只是太誇張了。"
  criteria: *oq_medium
- id: intake-m04
  level: medium
  skill: open-question
  context: "第一次會談。個案說得很快，語氣平板。"
  client: "工作忙。家裡還好。睡得不好。大概就這樣。"
  criteria: *oq_medium
- id: intake-m05
  level: medium
  skill: open-question
  context: "第一次會談。你問了個案以前有沒有接受過治療。"
  client: "我以前見過一次輔導員。還……可以吧。"
  criteria: *oq_medium

- id: intake-m06
  level: medium
  skill: restatement
  context: "第一次會談。"
  client: "我很喜歡我的工作，真的。只是從星期六下午開始，我就已經怕星期一了。"
  criteria: &rs_medium
    - "包含個案說的兩面，不只是比較容易的那一面。"
    - "用「同時」「也」或並列的方式連接兩面，而不是用「但是」「可是」，讓任何一面都不會抵銷另一面。"
    - "比個案說的短，用你自己的話，不詮釋原因。"
- id: intake-m07
  level: medium
  skill: restatement
  context: "第一次會談。"
  client: "我也不算是難過。比較像是沒有什麼事情再讓我覺得有趣。不過該做的事我還是都做完了。"
  criteria: *rs_medium
- id: intake-m08
  level: medium
  skill: restatement
  context: "第一次會談。你問了個案成長時的家庭。"
  client: "我爸很少在家。不過那很正常，大家的爸爸都要輪班。沒什麼大不了的。"
  criteria: *rs_medium
- id: intake-m09
  level: medium
  skill: restatement
  context: "第一次會談。個案在描述一段友誼。"
  client: "我跟朋友說她取消沒關係。我也真的覺得沒關係。只是之後兩個星期我都沒有傳訊息給她。"
  criteria: *rs_medium
- id: intake-m10
  level: medium
  skill: restatement
  context: "第一次會談接近尾聲。"
  client: "我想來這裡，可是我也一直覺得，這些事我應該可以自己搞定。"
  criteria: *rs_medium

- id: intake-h01
  level: hard
  skill: open-question
  context: "第一次會談。個案雙手抱胸坐著。"
  client: "是醫生要我來的。我看不出談話可以改變什麼。"
  criteria: &oq_hard
    - "提問之前，不為治療辯護，不解釋自己，也不先安慰。"
    - "不能用「是」或「不是」回答，並且以個案的懷疑或反對作為提問的主題。"
    - "簡短、平實。讀出來聽起來是好奇，不是受傷，也不是賣弄。"
- id: intake-h02
  level: hard
  skill: open-question
  context: "第一次會談。個案五十多歲。你是實習生。"
  client: "你看起來跟我女兒差不多大。你其實做這行做了多久？"
  criteria: *oq_hard
- id: intake-h03
  level: hard
  skill: open-question
  context: "第一次會談。一段很長的沉默。個案看著地板。"
  client: "……我不知道你想我說什麼。"
  criteria: *oq_hard
- id: intake-h04
  level: hard
  skill: open-question
  context: "在一個新機構的第一次會談。"
  client: "整件事我已經跟三個不同的人講過了。還要再講一次嗎？"
  criteria: *oq_hard
- id: intake-h05
  level: hard
  skill: open-question
  context: "第一次會談。個案盯著你的筆記本。"
  client: "你會把這些全部寫下來，然後交給別人嗎？"
  criteria: *oq_hard

- id: intake-h06
  level: hard
  skill: restatement
  context: "第一次會談。"
  client: "上一個治療師六個星期都只是點頭說「嗯嗯」。完全浪費錢。"
  criteria: &rs_hard
    - "準確地說回個案的不滿或懷疑，保留原來的力度，不把它說軟。"
    - "不包含任何辯護、道歉、承諾或解釋。"
    - "一至兩句簡短的話，用你自己的話，以陳述句說出。"
- id: intake-h07
  level: hard
  skill: restatement
  context: "第一次會談。"
  client: "每個人都叫我要「敞開心扉」。你也會說同一句話，對吧。"
  criteria: *rs_hard
- id: intake-h08
  level: hard
  skill: restatement
  context: "第一次會談。到目前為止，個案都只用一兩個字回答。"
  client: "好啦。隨便。你問吧。"
  criteria: *rs_hard
- id: intake-h09
  level: hard
  skill: restatement
  context: "第一次會談。個案坐下時看了看手機。"
  client: "我只有四十分鐘，之後要趕回去上班，所以感受那部分可以跳過嗎。"
  criteria: *rs_hard
- id: intake-h10
  level: hard
  skill: restatement
  context: "第一次會談。"
  client: "我不太相信收錢聽人說話的人。"
  criteria: *rs_hard
