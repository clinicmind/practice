slug: formulation
version: 1.0.0
title: "和個案一起做個案概念化"
intro: >-
  治療師獨自寫好、再交給個案的個案概念化，只是一份報告。和個案一起建構的個案概念化，
  才是改變的開始，因為個案會看見問題的各個部分怎樣互相影響。這也是實習生最想表現聰明的地方。
  在這個模組，你和個案 M 一起畫出讓她的情緒低落持續下去的循環，
  也會看到當理解一下子變成自責時，可以怎樣做。你會練習兩項為個案加上他還沒說出的東西的技能：
  詮釋和挑戰。
skills:
  - interpretation
  - challenge
reflection_prompts:
  - id: formulation-r1
    text: "當 M 問「那是不是我的錯」時，你第一個想說的是什麼？拿它和治療師說的話比較。在那一刻，安慰會帶來什麼？個案概念化又會帶來什麼？"
  - id: formulation-r2
    text: "想一個你曾經對個案提出、內容正確卻沒有幫助的詮釋。你會改變什麼：時機、用詞，還是根本該不該說？"
  - id: formulation-r3
    text: "挑戰是說出兩件不吻合的事。哪一樣你覺得比較難：說出不吻合本身，還是說出來時不讓人覺得你抓到了個案的錯處？"
