formulation-e01:
  model_response: "我在想這兩件事會不會有關連。低著頭是你在爸爸身邊保護自己的方法，也許老闆走近時，你的身體也在做同一件事。"
  why: "它試探地把個案並排放著的兩件事連起來，並把僵住描述成曾經有用的東西。"
  avoid: "「你對權威有未處理的問題。」這是術語，也是判決。"
formulation-e02:
  model_response: "聽起來你很早就學到，求助會加重別人的負擔。我在想，這是不是到現在仍然是你上班時的規則。"
  why: "它把家裡的事實轉化成一件學回來的事，並以提問的方式連到現在。"
  avoid: "「你應該多求助。」個案知道。需要關注的是他為什麼不求助。"
formulation-e03:
  model_response: "我有一個想法，如果不對你告訴我。九歲時，一件好事毫無預兆地結束了。也許由你自己來結束，是一種讓自己永遠不會再那樣措手不及的方法。"
  why: "它為這個模式提供一個讓它成為保護的理由，並且先邀請個案糾正。"
  avoid: "「你在破壞自己的感情。」它把結果說成好像是目的。"
formulation-e04:
  model_response: "也許在你家裡，生氣的樣子就是打掃，所以你的生氣也是這個樣子。"
  why: "一句簡短的話，把媽媽的習慣和個案的習慣連起來，也說出個案沒有說出的感受。"
  avoid: "長篇解釋孩子怎樣從父母身上學習。證據個案已經提供了，缺的只是那個連結。"
formulation-e05:
  model_response: "所以在那一刻，你不是一個面對經理的員工。你回到了學校，準備挨罵。是這樣嗎？"
  why: "個案差不多已經自己連起來了。這句話把它完成，並且確認。"
  avoid: "「這是不理性的反應。」個案還在學校時，這個反應是說得通的。重點正在這裡。"
formulation-e06:
  model_response: "你真的很想把身體練好，同時從一月到現在你都沒去過。你怎樣看這件事？"
  why: "兩半都用個案自己的話說出，用「同時」連起來，再交還給個案。"
  avoid: "「所以你其實不是真的想。」這是在決定哪一半才是真的。"
formulation-e07:
  model_response: "你告訴我你沒有生氣，我也留意到你的拳頭握得很緊。我很好奇現在發生了什麼。"
  why: "它把話語和身體並排，作為一個觀察，然後提問。"
  avoid: "「你明顯在生氣。」個案剛說了沒有，現在你在跟他爭辯。"
formulation-e08:
  model_response: "家人對你最重要，同時這幾個月，你的晚上都給了工作。這兩件事放在一起，你感覺怎樣？"
  why: "它說出價值和事實，不暗示虛偽，並問個案對這個落差的經驗。"
  avoid: "「如果家人真的是你的首要，你就會回家。」這是評判，不是挑戰。"
formulation-e09:
  model_response: "你不在乎別人怎樣看你，同時挑那套衣服用了三個小時。幫我明白一下，這兩件事是怎樣放在一起的。"
  why: "語氣輕鬆、準確、好奇，並請個案解釋。"
  avoid: "揚起眉毛說「真的嗎？」。諷刺會讓個案去捍衛第一句話。"
formulation-e10:
  model_response: "你覺得自己已經放下他，同時你幾乎每天都會看他的頁面。你覺得這樣看是為了什麼？"
  why: "它接受這份感覺是屬於個案的，說出行為，並問行為的目的。"
  avoid: "「這聽起來不像是放下了。」這是顯而易見的一點，讓個案沒有東西可以自己發現。"
formulation-m01:
  model_response: "我在想，照顧所有人，會不會也是你確保自己有一個位置的方法。如果你停下來，你心裡可能有一部分不太確定，別人是不是仍然需要你。"
  why: "它比疲累多走一步，走到照顧為個案換來了什麼，並把它看成一種歸屬的方式。"
  avoid: "「你需要設界線。」這是建議，而且把這個模式當作一個簡單的錯誤。"
formulation-m02:
  model_response: "你說你不知道十二歲為什麼會有關係，然後你就告訴我你十二歲時發生了什麼事。我在想，看著女兒到了那個年紀，會不會讓你想起自己在那個年紀時的樣子。"
  why: "它用個案自己的兩句話，把連結作為一個可能性提出。"
  avoid: "「這明顯是跟你媽媽生病有關。」「明顯」這個詞，讓個案沒有任何空間。"
formulation-m03:
  model_response: "其他事情從不遲到，只有這裡會。我在想，你心裡是不是有一部分對來這裡有點猶豫。如果是這樣也說得通。我們談的都是難談的事。"
  why: "它認真看待個案自己的疑惑，把矛盾的心情當作可以理解的事提出，也沒有責備。"
  avoid: "「遲到是一種抗拒。」這是教科書上的句子，而且讓個案變成理虧的一方。"
formulation-m04:
  model_response: "在你長大的地方，夠硬才安全，好意是不會出現的。也許他對你好的時候，碰到了你心裡一個曾經要收起來的部分，煩躁就把它推回去。"
  why: "它把個案描述的家和個案解釋不了的反應連起來，並把煩躁看成是一種保護。"
  avoid: "「你覺得自己不配被好好對待。」也許是真的，但這個說法比目前的證據所能支持的更大。"
formulation-m05:
  model_response: "三次升職，三次生病。可能是運氣不好。我也在想，被提拔會不會帶來一種壓力，你的身體比你更早察覺到。"
  why: "它讓個案的解釋繼續成立，再根據個案報告的模式，加上一個另外的可能。"
  avoid: "「你害怕成功。」這是口號，個案說的話裡沒有任何東西支持它。"
formulation-m06:
  model_response: "你聽起來很肯定要離開。同時你們兩個在挑八月去旅行的日子。這兩件事怎樣放在一起？"
  why: "它先認真看待這個決定，然後說出另一件事實，不暗示哪一件會勝出。"
  avoid: "「所以你其實不會離開。」個案也許真的會。人在離開的過程中也會計畫旅行。"
formulation-m07:
  model_response: "你告訴我你不介意，我相信你希望這是真的。我也留意到，房子今天已經出現了三次。你怎樣看這件事？"
  why: "它先接納否認背後的願望，再把重複作為一個觀察說出來。"
  avoid: "「你明顯是介意的。」個案會第四次說不。"
formulation-m08:
  model_response: "你信任我，這對我很重要。同時有些事你永遠不會告訴任何人，這也包括我。我很好奇這兩樣怎樣同時都是真的。"
  why: "它接收這份信任，然後指出它的界限，但不要求個案說出秘密。"
  avoid: "「你可以告訴我任何事。」它用壓力來回應不吻合。"
formulation-m09:
  model_response: "你想少喝一點，我聽到了。同時你要留下的那一杯，是讓你睡得著的那一杯，聽起來差不多是每一晚。那少喝一點這件事，還剩下多少空間？"
  why: "它認可這個願望和睡眠的困難，然後讓個案自己算一算。"
  avoid: "「其實酒精會讓睡眠更差。」也許準確，但在個案需要一個問題的時候，這是一堂課。"
formulation-m10:
  model_response: "你現在覺得自己是個很糟糕的家長。同時你剛才告訴我，他生病時你整晚坐著陪他。這兩件事怎樣放在一起？"
  why: "挑戰也可以指向一項長處。它把個案的判決和個案自己的證據並排。"
  avoid: "「你不是很糟糕的家長。」這是安慰。個案自己的故事比你的意見更有力。"
formulation-h01:
  model_response: "有道理。我走到了你沒有要求去的地方。我們就談方法。說說你已經試過什麼，結果怎樣。"
  why: "個案拒絕了那個想法，所以不再重複。不帶脾氣地跟隨個案的要求，就是這裡不防衛的做法。"
  avoid: "「了解原因本身就是一個方法。」這是在爭辯，也是換個說法重複了被拒絕的想法。"
formulation-h02:
  model_response: "聽起來是有點像。我不覺得任何事全都是因為某一樣東西。我比較感興趣的是你今天說的一句話：在其他人都開心之前，你沒辦法放鬆。我在想，一個人是在哪裡學到這件事的。"
  why: "它承認老套，放下籠統的說法，並根據個案在這次會談中自己說的話，提出一個範圍更窄的想法。"
  avoid: "為童年的影響作一般性的辯護。你會贏了這場爭論，卻失去了個案。"
formulation-h03:
  model_response: "我很高興你來了。我留意到一件事，也許是我想錯了。你缺席的那幾個星期，每一次都在你哭過的會談之後。我在想，經過那樣的會談之後再回來，會不會很難。"
  why: "它建基於治療中可以觀察到的事實，說得小心，也給了清楚的退路。"
  avoid: "第三次接受「工作的事」，或者說「每次情緒一來你就取消」。前者是共謀。後者是指控。"
formulation-h04:
  model_response: "我剛才的沉默，感覺就像他的沉默。我明白為什麼會這樣。我在想，當有人不說話時，你是不是就會回到和他在一起時的處境，不知道對方怎樣看你。"
  why: "它不抗議地接受這個比較，並利用這一刻提出過去和現在之間的連結。"
  avoid: "「我是在給你空間。」這是真的，也是辯護。"
formulation-h05:
  model_response: "你早就料到了，這讓你很煩。我在想，以前被問到感受時，是不是通常都沒有好結果，所以先擋住它是說得通的。"
  why: "它從你們之間剛發生的事開始，提出一個試探性的理由，也尊重了那個白眼。"
  avoid: "再反映一次難過。個案剛告訴你他對這件事的看法。"
formulation-h06:
  model_response: "這感覺像在浪費時間。同時八個星期以來，你每個星期都準時來了。我很好奇是什麼讓你一直回來。"
  why: "它照字面接受不滿，說出出席的事實但不帶勝利感，並提出一個真正的問題。"
  avoid: "「如果真的是浪費時間，你就不會一直來。」用的是同樣的事實，目的卻是贏。"
formulation-h07:
  model_response: "你說過你沒問題，我相信你的話。我也留意到，今天這件事已經提了四次。我在想，關於我要離開一段時間，是不是還有更多想說的。"
  why: "它沒有說個案在說謊。它說出重複，並打開這個話題。"
  avoid: "「你明顯不是沒問題。」也要避免鬆一口氣地就此放下。"
formulation-h08:
  model_response: "感覺像是我沒有給你任何可以用的東西。我也記得上星期提過兩個想法，你覺得都不太對。幫我明白一下，怎樣的建議會讓你覺得有用。"
  why: "它接受這份感受，說出事實但不爭分數，並請個案描述他想要什麼。"
  avoid: "「不是這樣的，我上星期給了你兩個建議。」這是對的，也是反駁。"
formulation-h09:
  model_response: "我聽得出你是認真的。同時這是你第三個星期作出這個承諾。我不覺得答案是更用力地承諾。回到家之後，是什麼擋住了你？"
  why: "它相信這份意願，平實地說出模式，並從承諾轉到障礙。"
  avoid: "「你上次也是這樣說。」這會讓人羞愧。「好，下星期見」也不會更好，因為那是共謀。"
formulation-h10:
  model_response: "你是說，這對我來說只是一份工作。同時剛才，當我記起你春天告訴過我的事，你心裡有些東西被觸動了。我在想，當你開始覺得我可能在乎時，會發生什麼。"
  why: "它不抗議說你在乎。它把個案的說法和個案剛表現出來的並排，並問那一刻的事。"
  avoid: "「我當然在乎你。」個案的重點正是：這樣的話不用付出任何代價。"
