- id: formulation-e01
  level: easy
  skill: interpretation
  context: "第五次會談。"
  client: "我爸脾氣很差，所以我們全家都學會了低著頭做人。總之，另一件事：我發現每次老闆走過我的座位，我就會僵住。"
  criteria: &in_easy
    - "把個案說過、但個案自己沒有連起來的兩件事連起來。"
    - "以一個想法的方式提出，用「我在想……」這類說法，讓個案可以很容易說不。"
    - "簡短，用日常的話，沒有專業術語，也沒有責備。"
- id: formulation-e02
  level: easy
  skill: interpretation
  context: "第五次會談。"
  client: "我上班從來不求助。我們家有五個孩子，媽媽總是累壞了，所以什麼事都自己搞定。"
  criteria: *in_easy
- id: formulation-e03
  level: easy
  skill: interpretation
  context: "第五次會談。"
  client: "每次跟交往的人進展得好好的，我就會找個理由分手。我九歲時爸媽分開了。完全沒有預兆。"
  criteria: *in_easy
- id: formulation-e04
  level: easy
  skill: interpretation
  context: "第五次會談。"
  client: "我不開心的時候就會打掃。整個家都打掃。我媽也是這樣。只要吸塵機一拿出來，你就知道她在生氣。"
  criteria: *in_easy
- id: formulation-e05
  level: easy
  skill: interpretation
  context: "第五次會談。"
  client: "經理說「可以跟你談幾句嗎？」的時候，我的心一下子沉了下去。讀書的時候，「談幾句」一定代表我闖禍了。"
  criteria: *in_easy

- id: formulation-e06
  level: easy
  skill: challenge
  context: "第五次會談。"
  client: "我今年真的很想把身體練好。其實從一月加入健身房到現在，我一次都沒去過。"
  criteria: &ch_easy
    - "準確說出兩件不吻合的事，用詞貼近個案自己的話。"
    - "用「同時」「也」把兩件事連起來，語氣好奇，沒有指責，也不用「但是」。"
    - "最後問個案怎樣理解這兩件事。"
- id: formulation-e07
  level: easy
  skill: challenge
  context: "個案握緊拳頭，聲音繃得很緊。"
  client: "我一點都沒有生她的氣。"
  criteria: *ch_easy
- id: formulation-e08
  level: easy
  skill: challenge
  context: "第五次會談。"
  client: "家人是我生命中最重要的。這幾個月我每晚都在辦公室待到九點。"
  criteria: *ch_easy
- id: formulation-e09
  level: easy
  skill: challenge
  context: "第五次會談。"
  client: "我不在乎別人怎樣看我。那次派對要穿什麼，我想了三個小時。"
  criteria: *ch_easy
- id: formulation-e10
  level: easy
  skill: challenge
  context: "第五次會談。"
  client: "我已經完全放下前男友了。我幾乎每天都會看看他的個人頁面，只是看看而已。"
  criteria: *ch_easy

- id: formulation-m01
  level: medium
  skill: interpretation
  context: "第六次會談。"
  client: "我總是那個照顧所有人的人。上班是這樣，朋友之間也是。好累。可是如果我不做，誰會做？"
  criteria: &in_medium
    - "比個案說的多走一步，並且建基於個案自己的話或行動。"
    - "語氣試探，把這個行為描述成說得通的事，不把它當作缺點。"
    - "簡短，用日常的話，結尾讓個案可以不同意。"
- id: formulation-m02
  level: medium
  skill: interpretation
  context: "第六次會談。"
  client: "女兒十二歲之前我都好好的。我不知道為什麼十二歲會有關係。我十二歲那年，我媽病了。"
  criteria: *in_medium
- id: formulation-m03
  level: medium
  skill: interpretation
  context: "個案第四次遲到十分鐘。"
  client: "對不起，對不起。我做其他事情從來不遲到。我不知道星期四到底怎麼了。"
  criteria: *in_medium
- id: formulation-m04
  level: medium
  skill: interpretation
  context: "第六次會談。"
  client: "伴侶對我好的時候，我反而會煩躁。我不明白。家裡從來沒有人對人很好。你要夠硬才行。"
  criteria: *in_medium
- id: formulation-m05
  level: medium
  skill: interpretation
  context: "第六次會談。"
  client: "我升職了三次，每一次都在一個月內生病。我想是運氣不好吧。"
  criteria: *in_medium

- id: formulation-m06
  level: medium
  skill: challenge
  context: "第六次會談。"
  client: "我決定了。我一定會離開他。我們只是在看八月去旅行的日子。"
  criteria: &ch_medium
    - "先承認其中一面或兩面真實或可以理解的地方。"
    - "準確說出兩件不吻合的事，用「同時」「也」連起來。"
    - "請個案自己去理解，不暗示哪一面才是真的。"
- id: formulation-m07
  level: medium
  skill: challenge
  context: "這次會談中，個案已經第三次提起哥哥繼承遺產的事。"
  client: "老實說，房子給了我哥，我一點都不介意。"
  criteria: *ch_medium
- id: formulation-m08
  level: medium
  skill: challenge
  context: "第六次會談。"
  client: "我完全信任你。只是有些事我永遠不會告訴任何人。"
  criteria: *ch_medium
- id: formulation-m09
  level: medium
  skill: challenge
  context: "第六次會談。"
  client: "我想少喝一點酒。不過那是唯一能讓我睡著的東西，所以這部分我不會停。"
  criteria: *ch_medium
- id: formulation-m10
  level: medium
  skill: challenge
  context: "較早時，個案描述過兒子生病時，自己整晚坐著陪他。"
  client: "我是個很糟糕的家長。真的。"
  criteria: *ch_medium

- id: formulation-h01
  level: hard
  skill: interpretation
  context: "你剛把個案的過度工作和他父親的期望連起來。"
  client: "不要分析我。我來這裡是要方法的。"
  criteria: &in_hard
    - "建基於個案在這次會談中說過或做過的事，可以包括你們之間剛發生的事。"
    - "語氣試探，個案真的有機會拒絕。如果個案已經拒絕過某個想法，不要重複那個想法。"
    - "不為自己辯護，也不爭論。"
- id: formulation-h02
  level: hard
  skill: interpretation
  context: "第六次會談。"
  client: "所以你覺得全都是因為我的童年。有點老套吧？"
  criteria: *in_hard
- id: formulation-h03
  level: hard
  skill: interpretation
  context: "個案在三次哭過的會談之後，每次都取消了下一次會談。"
  client: "上星期不好意思。工作的事。又是。"
  criteria: *in_hard
- id: formulation-h04
  level: hard
  skill: interpretation
  context: "個案談到父親的冷漠之後，你沉默了一會兒。"
  client: "你跟他一模一樣。坐在那裡什麼都不說。"
  criteria: *in_hard
- id: formulation-h05
  level: hard
  skill: interpretation
  context: "你剛反映了難過的感受。個案翻了個白眼。"
  client: "我就知道你會這樣說。治療師總是要扯到感受上。"
  criteria: *in_hard

- id: formulation-h06
  level: hard
  skill: challenge
  context: "八個星期以來，個案每次會談都準時出席。"
  client: "這根本是浪費時間。"
  criteria: &ch_hard
    - "準確、平靜地說出兩件不吻合的事，其中至少一件和你或治療有關。"
    - "不反擊，不爭一分，不為自己辯護，也不從不吻合之處退開。"
    - "帶著真正的好奇，問個案怎樣理解這件事。"
- id: formulation-h07
  level: hard
  skill: challenge
  context: "這次會談中，個案已經四次提起你即將放假的事。"
  client: "我說過了，你去放假我沒問題。"
  criteria: *ch_hard
- id: formulation-h08
  level: hard
  skill: challenge
  context: "上星期你提出了兩個建議。個案說兩個都行不通。"
  client: "你從來都不給我任何建議。"
  criteria: *ch_hard
- id: formulation-h09
  level: hard
  skill: challenge
  context: "這是個案連續第三個星期作出同樣的承諾。"
  client: "這個星期我會做那個練習。我保證。"
  criteria: *ch_hard
- id: formulation-h10
  level: hard
  skill: challenge
  context: "一分鐘前，你記起六個星期前的一個細節，個案的眼眶濕了。"
  client: "你根本不在乎。這對你來說只是一份工作。"
  criteria: *ch_hard
