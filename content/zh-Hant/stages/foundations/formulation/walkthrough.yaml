sessions:
  - id: formulation-s6
    title: "第 6 次會談：畫出循環"
    turns:
      - id: formulation-s6-t01
        speaker: client
        text: "我帶了紀錄來。（遞上一張整整齊齊、用顏色分類的紙）不好意思。我知道你說隨便記就可以。我沒辦法讓它亂糟糟的。可能太多了。"
      - id: formulation-s6-d1
        type: choice
        prompt: "M 做了一份很仔細的紀錄，還為此道歉。你怎樣接收？"
        options:
          - id: a
            text: "這份做得非常好。你真的做得很徹底。"
            fit: weak
            note: "你給了她一個分數。M 會為分數拚命，一個星期後，這份紀錄就會變成為了再拿一個好分數。"
          - id: b
            text: "謝謝你。我看得到你花的心思。在我們一起看之前，你記錄的時候，有什麼讓你特別留意到的？"
            fit: strong
            note: "它溫暖地接收這份功課，卻不評分，然後立刻轉到 M 自己觀察到什麼。紀錄是幫助她理解的工具，不是為了得到你的認同而做的。"
          - id: c
            text: "我說過隨便記就可以。要讓它保持隨便，是不是很難？"
            fit: workable
            note: "這是一個關於真實模式的真實問題。但在你還沒對她發現了什麼表示興趣之前就先問，這個任務就變成了她有毛病的證據。"
        actual: "謝謝你。我看得到你花的心思。在我們一起看之前，你記錄的時候，有什麼讓你特別留意到的？"
        rationale: "你怎樣接收會談之間的功課，會教會個案這些功課是為了什麼。把完美主義和道歉記下來，留待之後。它們屬於個案概念化，放在那裡會比作為這一小時的第一句評語更合適。"
      - id: formulation-s6-t02
        speaker: client
        text: "晚上最難受，這個我本來就知道。不過如果那天上班時我一直在「撐場面」，晚上會更糟。一直笑，幫每個人解決問題。那些晚上，我連窗簾都拉不動。然後有一個晚上是好的。我朋友 K 突然打電話來，我們聊了一個小時。我覺得自己差不多像正常人。"
      - id: formulation-s6-t03
        speaker: therapist
        text: "所以白天你越是為了別人撐住自己，晚上剩下的你就越少。而有一個晚上，有人碰觸到你，心情就好起來了。"
      - id: formulation-s6-t04
        speaker: client
        text: "對。不過我自己是絕對不會打給她的。我那樣的時候，從來不會打給任何人。"
      - id: formulation-s6-d2
        type: free
        prompt: "提出一個試探性的詮釋，把 M 十四歲時學到的東西和她現在的做法連起來。只用她告訴過你的內容。讓她可以很容易地不同意。"
        actual: "我有一個想法，如果不對你告訴我。十四歲那年，你唯一一次讓人看到你有多難受，結果變成是你的錯。所以不說話，可能是你當時能做的最安全的事。我在想，它是不是變成了一條一直跟著你的規則：我撐不住的時候，就留給自己。"
        rationale: "詮釋是加上一個個案還沒有連起來的連結。這一個完全由 M 自己的材料構成。它先表明這只是一個想法，並一開始就邀請她否定。它把不說話描述成一件說得通的事，這是準確的，而且對一個把大部分話都聽成批評的個案來說很重要。"
      - id: formulation-s6-t05
        speaker: client
        text: "（長時間停頓）對。那甚至不是一個決定。我就是會這樣做。"
      - id: formulation-s6-t06
        speaker: therapist
        text: "我們可以把它畫出來嗎？我希望我們兩個都看得見。有些事讓你難受。然後你腦中會閃過什麼？"
      - id: formulation-s6-t07
        speaker: client
        text: "沒有人想聽。對他們來說會太多。所以我裝作沒事。我很幫得上忙。然後……就沒有人知道。然後我一個人帶著它，它越來越重。然後我就會想，嗯，當然了。沒有人會留下。"
      - id: formulation-s6-t08
        speaker: therapist
        text: "（一邊畫）難受。「對他們來說會太多。」裝作沒事，幫忙。沒有人知道。一個人帶著它，越來越重。「沒有人會留下。」而最後這一句又連回最上面，對不對。下一次有事讓你難受時，你會更加肯定那對別人來說會太多。"
      - id: formulation-s6-t09
        speaker: client
        text: "（看著那張紙）所以一直都是同一件事。（停頓，聲音變小）那就是我的錯了。他們離開是我的錯。他說他從來不知道我在想什麼。"
      - id: formulation-s6-d3
        type: choice
        prompt: "不到一分鐘，個案概念化就變成了自責。你說什麼？"
        options:
          - id: a
            text: "不是，當然不是你的錯。"
            fit: weak
            note: "說得快，也很體貼，但 M 不會相信。安慰是要她拿你的話去對抗她自己的信念。它也結束了一個正好讓你看見模式在運作的時刻。"
          - id: b
            text: "留意一下剛剛發生了什麼。我們畫出一樣東西，解釋你是怎樣變成會這樣做的，不到一分鐘，它就變成了一份控告你的證據。那又是十四歲時學到的那一課：出了事，就檢討自己做了什麼。我的看法不一樣。不說話這件事，當時保護了你，現在讓你付出代價。這兩樣都不等於是你的錯。"
            fit: strong
            note: "它用個案概念化來回應自責。它指出模式正在房間裡發生，平實地說出你自己的看法，並提供一個她可以帶走的區分：當時保護了你，現在讓你付出代價。"
          - id: c
            text: "是什麼讓你說這是你的錯？"
            fit: workable
            note: "探索是合理的，她也答得了。但她會用回答把控告自己的證據建得更詳細，而你會陪著她一起聽。"
        actual: "留意一下剛剛發生了什麼。我們畫出一樣東西，解釋你是怎樣變成會這樣做的，不到一分鐘，它就變成了一份控告你的證據。那又是十四歲時學到的那一課：出了事，就檢討自己做了什麼。我的看法不一樣。不說話這件事，當時保護了你，現在讓你付出代價。這兩樣都不等於是你的錯。"
        rationale: "對任何會自我批評的個案，都要預期這個轉折。個案概念化解釋一個行為，而會自我批評的個案會把解釋聽成指控。解釋也包括了這個行為的理由。把這一點說出來，也說出：為改變一個模式負責，和為擁有這個模式而受責備，是兩回事。"
      - id: formulation-s6-t10
        speaker: client
        text: "（流淚）當時保護了我。現在讓我付出代價。（停頓）好。（擦眼淚）不過 K 不一樣。我真的會跟 K 說事情。"
      - id: formulation-s6-d4
        type: choice
        prompt: "在第四次會談，M 說她過了兩個月才告訴 K 分手的事，而且是當作笑話說的。現在她說自己真的會跟 K 說事情。你怎樣做？"
        options:
          - id: a
            text: "不過這不完全是事實，對吧？你告訴過我你等了兩個月。"
            fit: weak
            note: "事實是對的，語氣卻像盤問。M 會覺得被抓到，然後道歉，並學會對告訴你的事更加小心。"
          - id: b
            text: "你和 K 比和任何人都親近。我也記得你說過，分手的事你過了兩個月才告訴她，而且說出來的時候變成了一個笑話。這兩件事，在你看來是怎樣放在一起的？"
            fit: strong
            note: "它先肯定真實的部分，再按她說過的原樣說出另一部分，用「也」連起來，並請她自己去理解這兩件事。這是挑戰。它說出不吻合的地方，但不作評判。"
          - id: c
            text: "我很高興你有 K。"
            fit: workable
            note: "K 是真實的保護因素，值得肯定。但你放過了 M 對自己的看法和她所描述的事之間的落差，而這個落差是有用的。"
        actual: "你和 K 比和任何人都親近。我也記得你說過，分手的事你過了兩個月才告訴她，而且說出來的時候變成了一個笑話。這兩件事，在你看來是怎樣放在一起的？"
        rationale: "挑戰是指出個案說過或做過、彼此不吻合的兩件事，再讓個案自己找出意思。目的不是證明 M 對 K 的看法是錯的。就算是對最安全的人，她還是會先看一看。這讓你們兩人都知道，第一個小實驗可以從哪裡開始。"
      - id: formulation-s6-t11
        speaker: client
        text: "（輕輕笑了一下）我想就算是對 K，我也會先看一看。我會等到事情舊到可以拿來說笑。"
      - id: formulation-s6-t12
        speaker: therapist
        text: "等到事情舊到可以拿來說笑。如果可以，我想把這句加到圖上。這張紙是你的。隨著我們知道得更多，它會改變。"
    notes:
      goals: "建構共同的個案概念化。用個案概念化本身回應自責。找出改變可能從哪裡開始。"
      alliance: "穩固到足以承載一個詮釋和一個挑戰。M 有一次不同意治療師（「不過 K 不一樣」），而且沒有道歉。這是新的。"
      formulation_update: "共同的循環，用 M 的話說：有事讓我難受；「對他們來說會太多」；裝作沒事、幫忙；沒有人知道；一個人帶著它，越來越重；「沒有人會留下」；然後帶著更大的確定回到起點。來源：十四歲時，告訴媽媽的結果變成是她的錯。保護性的例外：K，而就算是對 K，她也會等到「事情舊到可以拿來說笑」。對治療的預測：M 會隱藏難過的星期，也會把治療師的任何距離，解讀成自己太多了的證據。"
