slug: termination
version: 1.0.0
title: "結束治療"
intro: >-
  治療的結束是治療的一部分。對許多個案來說，他們來治療的原因和關係怎樣結束有關，
  所以最後幾次會談會再一次帶出核心主題，而這一次你也在其中。實習生常常匆匆結束，
  或用建議填滿結束的過程。在這個模組，個案 M 來到她最後一次會談。
  你會練習回顧治療中的工作，讓個案擁有自己的改變，以及談論結束本身。
skills:
  - review
  - processing-ending
reflection_prompts:
  - id: termination-r1
    text: "M 說：「這一次離開的人是你。」在你自己的生活中，你通常怎樣處理結束：提早、拖延、輕輕帶過，還是根本不處理？這可能怎樣反映在你和個案的最後幾次會談中？"
  - id: termination-r2
    text: "治療師告訴 M，工作要結束了，自己感到難過。什麼時候說這樣的話是有用的？什麼時候它服務治療師多於服務個案？"
  - id: termination-r3
    text: "M 的治療以部分改善結束。她的情緒好了一些，和媽媽的關係只有少許改變。對你來說，一個「夠好」的結束是什麼樣子？哪些未完成的事是你覺得難以放下的？"
