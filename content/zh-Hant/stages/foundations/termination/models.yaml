termination-e01:
  model_response: "我也看到了。十二個星期前，你會讓電話一直響到停，上星期你自己打電話去銀行。你是靠一次打一通電話做到的。你還留意到哪些不同？"
  why: "它給出一個具體的前後對比，肯定個案自己的方法，並請個案說更多。"
  avoid: "「你做得真好。」很溫暖，卻沒有告訴個案任何可以留住的東西。"
termination-e02:
  model_response: "她留意到的是真的。你回到了合唱團，而且每個星期都去。那是你自己的決定。對你來說，「以前的自己」是什麼意思？"
  why: "它把姊姊的話連到個案採取的一個具體行動，並請個案自己下定義。"
  avoid: "把姊姊的評語當作回顧。"
termination-e03:
  model_response: "一年了，星期六你自己一個人做到了。你是靠先做短短的路程走到這一步的，即使在你不想去的日子也去了。站在排隊的人龍裡，是什麼感覺？"
  why: "它說出這個成就，把它放在個案自己走的步驟上，並問當時的經驗。"
  avoid: "「我就知道你做得到。」這一刻就變成了關於你的預測。"
termination-e04:
  model_response: "明白。以前它一開始你就離開，現在你留下來，它就過去了。你是靠留下來教會自己的。你會這樣形容嗎？"
  why: "它把個案的說法變成一個具體的改變，並和個案確認用詞。"
  avoid: "解釋背後的理論。個案已經說得更好了。"
termination-e05:
  model_response: "我說一個我看到的。我們剛開始時，你沒辦法對經理說不。上個月你推掉了額外的班，也沒有發生什麼可怕的事。那句話你先在這裡練習過。這跟你的記憶吻合嗎？"
  why: "它用一個具體的例子回答問題，留意到個案自己的練習，然後確認。"
  avoid: "一張長長的清單。一個清楚的例子，比十個更容易讓人相信。"
termination-e06:
  model_response: "對。下星期是我們最後一次會談。說出這句話，是什麼感覺？"
  why: "它用平實的話確認結束，並詢問感受。"
  avoid: "「不過你隨時都可以回來。」在個案感受到結束之前，就先把它說軟了。"
termination-e07:
  model_response: "你會想念。我很高興你說得出來。你會想念什麼？"
  why: "它接收這份感受，請個案多說，不急著安慰。"
  avoid: "「你現在有很多支持了。」它用一個替代品來回應想念。"
termination-e08:
  model_response: "事情剛好起來就要結束，確實很奇怪。你心裡可能有一部分在想，沒有這些會談，它還撐不撐得住。想到要停下來，你心裡浮現什麼？"
  why: "它同意個案的感覺，輕輕說出一個可能的擔心，然後詢問。"
  avoid: "「這正是停下來最好的時候。」也許是對的，但它把感受關上了。"
termination-e09:
  model_response: "結束的時候心情複雜，是說得通的。兩面都說說吧。"
  why: "它很簡短，把複雜的感受看成是合適的，並邀請個案說出兩面。"
  avoid: "只問正面的那一面。"
termination-e10:
  model_response: "什麼感覺都有。有人鬆一口氣，有人難過，有人自豪，很多時候是混在一起的。我比較好奇的是你。我們走到最後，你有什麼感覺？"
  why: "它簡短而誠實地回答，然後把問題帶回這位個案身上。"
  avoid: "長篇描述一般的反應。個案可能是在徵求允許，好讓自己有自己的感受。"
termination-m01:
  model_response: "那就是兩件事。你睡得好一點了，你是靠連週末也固定時間上床做到的。而你爸爸那邊，還是跟以前一樣。我不想假裝不是這樣。把那部分留在原地，你有什麼感覺？"
  why: "它平實地說出兩件事，肯定個案的進步是自己做到的，並詢問未完成的部分。"
  avoid: "「但你看看你睡得好多了！」這個「但」抹去了爸爸的部分。"
termination-m02:
  model_response: "兩樣很可能都有幫助。我想補上我看到你做的事。你重新去游泳，也回到星期四的課，還跟經理談了工作量。這些不是時間做的。你會給它們多少分量？"
  why: "它不反駁個案的解釋，也不評論藥物。它補上個案自己的行動，然後詢問。"
  avoid: "「不，那是你自己努力的成果。」你不可能知道比例，而且你會變成在爭辯。"
termination-m03:
  model_response: "我留意到你在請我下判決。我可以誠實說的是：你做了一些對你來說很難的事，而它們帶來了改變。我比較感興趣的是你自己的判斷。如果由你自己打分數，你會怎樣說？"
  why: "它溫和地說出這個要求，給出誠實而具體的回答，並把評價交還給個案。"
  avoid: "「對，你做得太棒了！」在要離開的時刻，它餵養了對外在認同的需要。"
termination-m04:
  model_response: "這是一個真實的擔心。我在這裡，這是重要的。不過，在超級市場裡的不是我，跟你姊姊講電話的也不是我。是你。你覺得你會帶走什麼？"
  why: "它認真看待這份擔心，承認你的部分，並指向個案自己一個人做到的事。"
  avoid: "「全部都是你自己做到的。」這不是事實，個案也知道。"
termination-m05:
  model_response: "你本來希望有更多，我想聽聽這部分。你原本預期現在會到哪裡？"
  why: "它為失望騰出空間，不去糾正它，並請個案說出細節。"
  avoid: "列出進步，證明個案錯了。"
termination-m06:
  model_response: "也許是沒有。我確實留意到，在接近結束的時候，最後三次會談我們錯過了兩次，我在想，這會不會是一種一點一點離開的方式。你怎樣看？"
  why: "它接受個案的說法有可能是真的，提出一個試探性的觀察，然後詢問。"
  avoid: "「我覺得結束對你的影響比你承認的大。」這是在告訴個案他有什麼感受。"
termination-m07:
  model_response: "我想聽聽，今天我們就用來談它。不過，我們下星期還是會結束。我留意到，就在我們快要結束的時候，一件大事出現了，我在想，停下來是不是困難的一部分。"
  why: "它認真看待新的問題，守住結束，並溫和地把時間點連起來。"
  avoid: "當場延長治療。也要避免把新問題當作逃避而打發掉。"
termination-m08:
  model_response: "我們可以這樣做。這會讓我們兩個都省掉一些東西。我想保留這兩次會談，因為我們怎樣結束是重要的。我在想，「拖拖拉拉」對你來說會是什麼感覺。"
  why: "它承認這個提議的吸引力，說出你的立場和理由，並問個案想避開的是什麼。"
  avoid: "鬆一口氣地同意。"
termination-m09:
  model_response: "謝謝你。你想到這件事，對我有意義。在我可以收下之前，我需要先確認一下我們機構的規定。今天我可以收下的，是它所代表的意思。你想它說些什麼？"
  why: "它溫暖地接收這個心意，誠實說明規定，並詢問它的意義。"
  avoid: "以規定為由生硬地拒絕。也要避免沒有確認規定就收下。"
termination-m10:
  model_response: "你在笑，我不覺得這完全是玩笑。不，我不會高興。我在想，你心裡是不是有一部分預期，你離開時別人會鬆一口氣。"
  why: "它聽到幽默底下的擔心，用幾個字如實回答，然後詢問。"
  avoid: "跟著一起笑。也要避免急急地說「當然不會！」。"
termination-h01:
  model_response: "你要離開了，卻沒有帶走你來這裡要的東西，這是真實的失望。我不會跟這份感覺爭辯。你確實告訴過我，你睡得比較多了，也回去全職上班了。我明白那些可能不是對你來說算數的改變。你最希望什麼會不一樣？"
  why: "它尊重失望，把個案自己報告過的事實說一次但不強調，並問什麼才是重要的。"
  avoid: "「不是這樣的，你看看你達成了多少。」這是在和個案自己的經驗爭辯。"
termination-h02:
  model_response: "聽起來可能是這樣。那些是你告訴過我的改變，我不應該一開口就說這些。忘了我的清單吧。你會怎樣形容你現在的狀況？"
  why: "它不為動機抗議。它放下清單，請個案用自己的方式說。"
  avoid: "為你的真誠辯護。"
termination-h03:
  model_response: "你做的事多了，而恨自己的感覺仍然在。那是最重要的部分，它卻沒有動。我很遺憾它沒有。我不覺得帶著這個離開是一件小事。對於它，你現在希望怎樣？"
  why: "它說出兩個事實，不淡化仍然存在的部分，並在不作承諾的情況下詢問下一步。"
  avoid: "「做多一點是第一步。」它把個案的痛苦變成路上的一個階段。"
termination-h04:
  model_response: "以前你不用去想它，現在你沒辦法不去想它。這是真實的代價，我不想說服你它不是。去想這些事，是怎樣的經驗？"
  why: "它接受治療帶來了代價，並在不為工作辯護的情況下詢問這個代價。"
  avoid: "「覺察是改變的第一步。」這是口號，也是辯護。"
termination-h05:
  model_response: "不講演說。告訴我你怎樣看。"
  why: "它用很少的字尊重這個要求，並詢問個案的看法。"
  avoid: "講一個比較短的版本。"
termination-h06:
  model_response: "感覺像被丟下了。你讓我進來，現在結束這段關係的人卻是我。我確實要結束，因為我在這裡的時間快完了，我也看得到這對你來說是什麼滋味。我不是因為你告訴我的任何事而結束。多說一點，這是什麼感覺。"
  why: "它以原來的力度說出感受，給出真正的理由，糾正它的意義，並留下來。"
  avoid: "「我們一開始就同意了會談次數。」這是用一份合約來回應一道傷口。"
termination-h07:
  model_response: "我明白你為什麼想要，我也很高興這段工作對你很重要。我不能給你我的電話號碼。這裡不容許在結束之後聯絡，我也覺得這個規定是對的。我能做的，是確保你離開時，知道事情變得困難時可以聯絡誰。你心裡想的「以防萬一」是什麼？"
  why: "它尊重這個願望，不道歉也不推卸地說出界線，提供可以做到的事，並詢問背後的恐懼。"
  avoid: "把責任推給規定（「如果可以的話我會給」）。也要避免任何私下的安排。"
termination-h08:
  model_response: "既然要結束，何必坐著經歷結束。我明白。我還是希望你會來。我覺得提早離開，會是一種不說再見的方式，而我希望我們好好完成這一部分。你會考慮一下嗎？"
  why: "它理解這個邏輯，說出你的願望和理由，並把決定留給個案。"
  avoid: "「這是你的選擇。」這是真的，聽起來卻像你不在乎。"
termination-h09:
  model_response: "你說得對。我們停下來，是因為我的實習結束了，不是因為你已經完成了。這對你不公平，你為此生氣是說得通的。我們來談談你還需要什麼，以及可以在哪裡得到。"
  why: "它同意這個準確的說法，認可怒氣，並轉向實際的下一步。"
  avoid: "「不過我覺得你已經準備好了。」它用一個你還沒有贏得的說法來為結束辯護。"
termination-h10:
  model_response: "我確實要離開，所以在這一點上，我沒有不一樣。可能不一樣的是，我把這件事告訴你，我會留到最後一分鐘，而且我為離開感到難過。之前那些離開是怎樣的？"
  why: "它承認事實，不誇大地說出這次結束有什麼不同，並詢問過去的經驗。"
  avoid: "「我跟其他人不一樣。」從個案的角度看，你做的正是他們做過的事。"
