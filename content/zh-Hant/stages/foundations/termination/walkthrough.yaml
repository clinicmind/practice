sessions:
  - id: termination-s16
    title: "第 16 次會談：說再見"
    turns:
      - id: termination-s16-t01
        speaker: therapist
        text: "M，這是我們最後一次會談。這個星期我一直在想這件事。今天進來的時候，你感覺怎樣？"
      - id: termination-s16-t02
        speaker: client
        text: "我一直很怕今天。（停頓）我在想，我可不可以再來一陣子。不用每個星期。就偶爾。以防萬一。"
      - id: termination-s16-d1
        type: choice
        prompt: "M 問可不可以偶爾再來，「以防萬一」。你的實習這個月結束，結束的安排在四次會談前已經同意了。你說什麼？"
        options:
          - id: a
            text: "我們確實同意了十六次會談，你也進步得非常好。我覺得你已經準備好了。"
            fit: workable
            note: "它守住了治療架構，而守住是對的。但它用一份合約和一句稱讚來回應一種感受。M 聽到的是這件事已經關上了，於是她不說話了，而這正是她來這裡想要停止做的事。"
          - id: b
            text: "你有一部分想讓門開著，這樣這就不完全是結束。我明白。我給不了，因為我在這裡的時間這個月就結束了。我能做的，是今天和你一起留在這個結束裡。你怕的是什麼？"
            fit: strong
            note: "它溫暖地說出這個願望，用一句話誠實說明限度，然後轉向那份害怕。界線和關心在同一個回應裡。"
          - id: c
            text: "讓我看看能不能多安排幾次會談。"
            fit: weak
            note: "它出於好意，也出於你自己面對她的難過時的不自在。它承諾了你多半做不到的事，也告訴 M，結束是一件需要逃開的事。"
        actual: "你有一部分想讓門開著，這樣這就不完全是結束。我明白。我給不了，因為我在這裡的時間這個月就結束了。我能做的，是今天和你一起留在這個結束裡。你怕的是什麼？"
        rationale: "要求延長、在最後一次會談提出新問題、突然變得很開朗，都是常見的不結束的方式。守住治療架構，說出真正的理由，然後走向感受。清楚說明限度，是一種尊重。"
      - id: termination-s16-t03
        speaker: client
        text: "（小聲）就是我們發現的那件事。有人離開，然後我就不說話了。（停頓）這一次離開的人是你。"
      - id: termination-s16-t04
        speaker: therapist
        text: "對。這一次是我。而你剛剛把它說了出來，對我說，在我離開之前。"
      - id: termination-s16-t05
        speaker: client
        text: "（輕輕笑了一下，流著淚）我想這是不一樣的。"
      - id: termination-s16-d2
        type: free
        prompt: "和 M 一起回顧治療中的工作。說出具體的改變，並舉出這十六次會談中的例子。清楚表明這些是她做到的。最後問她想加上或拿走什麼。"
        actual: "我說說我看到的，如果哪裡不對你就糾正我。在我們第一次會談，你為早到道歉，還跟我說可能沒什麼。從那以後，你在難受的那一天傳訊息給 K。你跟弟弟說了十七歲時的事。你大部分星期都有畫畫。四個星期前，你告訴我我錯了，而且沒有說對不起。這些都不是發生在你身上的事。是你做到的。你想加上什麼，或拿走什麼？"
        rationale: "回顧要具體到個案能認出每一項，並且把改變放在她做了的事情上。籠統的稱讚很快就會被忘記。一張她自己行動的清單，是她可以帶走的東西。最後的問題很重要，因為回顧必須變成她的。"
      - id: termination-s16-t06
        speaker: client
        text: "我想加一項。我沒有告訴我媽。我想了很多。我決定暫時不說。（停頓）而那感覺像是決定。不是躲起來。"
      - id: termination-s16-t07
        speaker: therapist
        text: "這一項很重要。選擇告訴誰，和沒辦法告訴任何人，是兩回事。有什麼沒有改變，或者改變得不夠？"
      - id: termination-s16-t08
        speaker: client
        text: "跟她之間，沒什麼改變。她還是會說：「你就是太敏感。」我也還是會有一些晚上，坐在那裡動不了。少了。但還是會來。"
      - id: termination-s16-d3
        type: choice
        prompt: "M 說那些平平的晚上還是會來。你怎樣談將來？"
        options:
          - id: a
            text: "如果你繼續做你一直在做的事，它們應該會慢慢消失。"
            fit: weak
            note: "這是一個你守不住的承諾，畢竟她從十四歲起已經有過三次發作。如果難熬的時期來了，M 會認定是自己沒有繼續做對。"
          - id: b
            text: "以你過去的經歷，我預期某個時候還會有比較難熬的時期。目標不是永遠不會。而是你更早留意到，不說話的時間更短。我們把你的早期訊號、你會怎樣做、你會告訴誰，寫下來好嗎？"
            fit: strong
            note: "它誠實說出可能性，把目標重新設定為做得到的事，並立刻轉向一個用她自己的話寫成的具體計畫。這樣，難熬的時期就是預期之內的事，而且有一頁紙可以翻開。"
          - id: c
            text: "如果真的再出現，你隨時都可以再回來接受治療。"
            fit: workable
            note: "這是真的，值得說一次。但單獨說出來，它把解決方法放在她以外，也略過了她現在自己能做的事。"
        actual: "以你過去的經歷，我預期某個時候還會有比較難熬的時期。目標不是永遠不會。而是你更早留意到，不說話的時間更短。我們把你的早期訊號、你會怎樣做、你會告訴誰，寫下來好嗎？"
        rationale: "誠實地讓個案為挫折作好準備。一份用個案自己的話寫成的計畫，涵蓋早期訊號、第一步和一個具名的人，比鼓勵更有用。關於風險，計畫也要寫明：依照服務機構的指引，及早尋求協助。"
      - id: termination-s16-t09
        speaker: client
        text: "（一邊寫）早期訊號。很常說「沒事」。推掉 K 的約。不畫畫。對不起變多。我會怎樣做：在同一天，對一個人說一件真實的事。告訴誰：K。我弟弟。（停頓）如果超過幾個星期，也許再找治療師。"
      - id: termination-s16-t10
        speaker: therapist
        text: "這是一份在難熬的日子裡用得上的計畫。把它放在你找得到的地方。"
      - id: termination-s16-t11
        speaker: client
        text: "（把紙摺好，然後輕描淡寫地說）下個月你應該就不記得我了。這張椅子會坐著別人。"
      - id: termination-s16-d4
        type: choice
        prompt: "M 輕描淡寫地說，下個月你應該就不記得她了。你說什麼？"
        options:
          - id: a
            text: "這是那個舊的信念，對吧。「沒有人會留下。」"
            fit: weak
            note: "信念是對的，回應卻是錯的。她在試探自己對你來說是否重要，你卻用一個詮釋來回答。在治療的最後幾分鐘，先做一個人。"
          - id: b
            text: "這張椅子會坐著別人。我也不會忘記你。兩樣都是真的。我會記得那隻在碗旁邊等著的貓，還有你沒有道歉的那一天。這段工作要結束了，我覺得難過，也為你走到今天而高興。聽到這些，你有什麼感覺？"
            fit: strong
            note: "它沒有否認她說出的事實。它用只有她才認得出的具體記憶，回答底下的那個問題，並用一句話分享一份真實的感受。然後它詢問，讓這一刻仍然屬於她。"
          - id: c
            text: "我不會忘記你的。"
            fit: workable
            note: "這是真的，她也需要聽到。但這也是任何人都會說的話。沒有具體的東西，M 很難相信。"
        actual: "這張椅子會坐著別人。我也不會忘記你。兩樣都是真的。我會記得那隻在碗旁邊等著的貓，還有你沒有道歉的那一天。這段工作要結束了，我覺得難過，也為你走到今天而高興。聽到這些，你有什麼感覺？"
        rationale: "好好說再見，包括簡短而真實地讓個案知道，這段關係對你來說也是真的。保持簡短和具體，然後把焦點交還給她。對 M 來說，一段關係裡有人離開，說出來，並為此難過，這正是「沒有人會留下」從來不容許發生的經驗。"
      - id: termination-s16-t12
        speaker: client
        text: "（毫不掩飾地哭）我想這是第一次，有人離開，而我真的說了再見。好好地說。而不是……先消失。"
      - id: termination-s16-t13
        speaker: therapist
        text: "你一直留到最後。你沒有躲回沉默裡。"
      - id: termination-s16-t14
        speaker: client
        text: "（擦乾眼淚，站起來）謝謝你。所有的一切。（走到門口）我不會為哭了而說對不起。"
      - id: termination-s16-t15
        speaker: therapist
        text: "很好。再見，M。好好照顧自己。"
    notes:
      goals: "守住已同意的結束。用 M 能擁有的具體字眼回顧工作。為比較難熬的時期寫下計畫。說再見。"
      alliance: "直到最後一分鐘都完好。M 要求更多，聽到了有理由的拒絕，然後留了下來。她說出了自己害怕什麼，也聽到自己會被記得。她結束時沒有道歉。"
      formulation_update: "結果：部分改善。情緒好轉，平平的晚上少了，但仍然存在。M 現在會在當天告訴 K 和弟弟，大部分星期都有畫畫，也曾經不道歉地不同意治療師。和媽媽的關係改變不大。不告訴媽媽，現在是一個選擇。結束重演了核心主題：有人離開。而這一次 M 沒有沉默下去。仍然存在的脆弱之處：將來的失去。她有一份寫下來的計畫，包括早期訊號、第一步和具名的人。"
