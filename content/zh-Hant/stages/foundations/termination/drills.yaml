- id: termination-e01
  level: easy
  skill: review
  context: "倒數第二次會談。治療初期個案會避開打電話，現在會打了。"
  client: "真不敢相信已經十二個星期了。我真的覺得不一樣了。"
  criteria: &rv_easy
    - "說出至少一項具體的改變，並舉出治療工作中的具體例子。"
    - "把改變放在個案做了的事情上。"
    - "邀請個案補充或糾正。"
- id: termination-e02
  level: easy
  skill: review
  context: "倒數第二次會談。個案停了好幾個月之後，重新回到每週一次的合唱團。"
  client: "我姊說我好像比較像以前的自己了。"
  criteria: *rv_easy
- id: termination-e03
  level: easy
  skill: review
  context: "倒數第二次會談。你和個案一小步一小步地走到這裡。"
  client: "星期六我自己一個人去了超級市場。一年來第一次。"
  criteria: *rv_easy
- id: termination-e04
  level: easy
  skill: review
  context: "倒數第二次會談。個案以前一開始恐慌，就會離開任何地方。"
  client: "我不再因為恐慌而恐慌了，不知道這樣說你明不明白。"
  criteria: *rv_easy
- id: termination-e05
  level: easy
  skill: review
  context: "倒數第二次會談。剛開始時，個案沒辦法對經理說不。上個月他推掉了額外的班。"
  client: "你覺得改變了什麼？我自己不一定看得出來。"
  criteria: *rv_easy

- id: termination-e06
  level: easy
  skill: processing-ending
  context: "倒數第二次會談。"
  client: "所以下星期是我們最後一次了。"
  criteria: &pe_easy
    - "用平實的話說出結束，不把它說軟成別的東西。"
    - "邀請個案說出對結束的感受，並容許感受是複雜的。"
    - "不安慰，也不急著轉到將來。"
- id: termination-e07
  level: easy
  skill: processing-ending
  context: "倒數第二次會談。"
  client: "我會想念來這裡的。"
  criteria: *pe_easy
- id: termination-e08
  level: easy
  skill: processing-ending
  context: "倒數第二次會談。"
  client: "事情終於好起來了，卻要在這個時候停，感覺很奇怪。"
  criteria: *pe_easy
- id: termination-e09
  level: easy
  skill: processing-ending
  context: "倒數第二次會談。"
  client: "要結束了，我的心情很複雜。"
  criteria: *pe_easy
- id: termination-e10
  level: easy
  skill: processing-ending
  context: "倒數第二次會談。"
  client: "大家到了最後通常是什麼感覺？"
  criteria: *pe_easy

- id: termination-m01
  level: medium
  skill: review
  context: "倒數第二次會談。"
  client: "我睡得好一點了。不過我爸那邊還是老樣子。"
  criteria: &rv_medium
    - "具體說出什麼改變了，也具體說出什麼沒有改變。"
    - "不誇大進步，也不替仍然存在的問題找藉口。"
    - "把進步放在個案自己的行動上，並詢問個案的看法。"
- id: termination-m02
  level: medium
  skill: review
  context: "倒數第二次會談。治療期間，個案重新開始了兩項活動，也和經理談了工作量。"
  client: "我想主要是藥的作用吧。或者只是時間過去了。"
  criteria: *rv_medium
- id: termination-m03
  level: medium
  skill: review
  context: "倒數第二次會談。個案常常尋求你的認同。"
  client: "我做得很好，對吧？告訴我我做得很好。"
  criteria: *rv_medium
- id: termination-m04
  level: medium
  skill: review
  context: "倒數第二次會談。"
  client: "我是好了。可是我擔心那只是因為有你在。"
  criteria: *rv_medium
- id: termination-m05
  level: medium
  skill: review
  context: "倒數第二次會談。"
  client: "老實說，我以為現在會走得更遠一點。"
  criteria: *rv_medium

- id: termination-m06
  level: medium
  skill: processing-ending
  context: "最後三次會談中，個案取消了兩次。"
  client: "噢，沒關係。結束對我沒什麼影響。"
  criteria: &pe_medium
    - "平實地說出結束，並認真看待個案的說法。"
    - "試探地提出一個關於個案怎樣處理結束的觀察。"
    - "邀請個案回應，不堅持個案一定對結束有感受。"
- id: termination-m07
  level: medium
  skill: processing-ending
  context: "十六次會談中的第十五次。"
  client: "其實，有一件新的事情出現了。一件大事。我覺得我們還不能停。"
  criteria: *pe_medium
- id: termination-m08
  level: medium
  skill: processing-ending
  context: "還剩兩次會談。"
  client: "不如這次就當最後一次吧？省得拖拖拉拉。"
  criteria: *pe_medium
- id: termination-m09
  level: medium
  skill: processing-ending
  context: "最後一次會談。個案遞上一個包好的小包裹。"
  client: "我帶了一樣東西給你。只是一點小東西。"
  criteria: *pe_medium
- id: termination-m10
  level: medium
  skill: processing-ending
  context: "倒數第二次會談。個案一邊說一邊笑。"
  client: "我想你終於可以擺脫我，應該很高興吧。"
  criteria: *pe_medium

- id: termination-h01
  level: hard
  skill: review
  context: "最後一次會談。據個案自己所說，出席、睡眠和上班時間都改善了。"
  client: "什麼都沒有改變。十六個星期，我還是一模一樣。"
  criteria: &rv_hard
    - "不爭辯，不替個案打氣，也不為治療辯護。"
    - "認真看待失望，並平實地說出任何由個案自己報告過的證據。"
    - "問個案原本希望什麼會不一樣，或個案怎樣看。"
- id: termination-h02
  level: hard
  skill: review
  context: "你剛說出了三項改變。"
  client: "你列出這些，只是為了讓自己對自己的工作感覺良好。"
  criteria: *rv_hard
- id: termination-h03
  level: hard
  skill: review
  context: "最後一次會談。"
  client: "好吧，我做的事多了。我還是恨我自己。那到底有什麼意義？"
  criteria: *rv_hard
- id: termination-h04
  level: hard
  skill: review
  context: "最後一次會談。"
  client: "開始之前我還比較好。至少那時候我不用去想這些。"
  criteria: *rv_hard
- id: termination-h05
  level: hard
  skill: review
  context: "最後一次會談。你還沒有說任何關於進步的話。"
  client: "不要跟我講那套我走了多遠的演說。"
  criteria: *rv_hard

- id: termination-h06
  level: hard
  skill: processing-ending
  context: "倒數第二次會談。"
  client: "所以就這樣。你讓我打開心扉，然後就把我丟下。"
  criteria: &pe_hard
    - "以原來的力度說出個案對結束的感受。"
    - "誠實說出限度或真正的理由，不作虛假的承諾，也不辯護。"
    - "保持溫暖，邀請個案多說，同時不在界線上讓步。"
- id: termination-h07
  level: hard
  skill: processing-ending
  context: "最後一次會談。你的實習機構不容許在治療結束後和個案聯絡。"
  client: "可以給我你的電話號碼嗎？以防萬一。我不會打的。"
  criteria: *pe_hard
- id: termination-h08
  level: hard
  skill: processing-ending
  context: "還剩兩次會談。"
  client: "既然反正都要結束，最後兩次來也沒有意義。"
  criteria: *pe_hard
- id: termination-h09
  level: hard
  skill: processing-ending
  context: "你的實習即將結束。個案說的是事實。"
  client: "你停下來，只是因為你的實習結束了。這跟我有沒有準備好一點關係都沒有。"
  criteria: *pe_hard
- id: termination-h10
  level: hard
  skill: processing-ending
  context: "最後一次會談。"
  client: "每個人都會離開。你也一樣。"
  criteria: *pe_hard
