sessions:
  - id: rupture-s11
    title: "第 11 次會談：「沒關係」"
    turns:
      - id: rupture-s11-t01
        speaker: therapist
        text: "M，你好。謝謝你上星期願意配合改時間。最近怎樣？"
      - id: rupture-s11-t02
        speaker: client
        text: "不錯，謝謝。這個星期很好。工作還好。我有畫畫。（淺淺一笑）一切都沒事。"
      - id: rupture-s11-t03
        speaker: therapist
        text: "那給 K 的訊息呢？"
      - id: rupture-s11-t04
        speaker: client
        text: "這個星期不需要。都沒事。謝謝你問。"
      - id: rupture-s11-d1
        type: choice
        prompt: "M 很客氣、很簡短、「沒事」，就像第一次會談時一樣。上星期你臨時把她的會談改了兩天。你怎樣做？"
        options:
          - id: a
            text: "好。我們先看看畫，然後計畫這個星期的下一步？"
            fit: weak
            note: "你接受了「沒事」，回到議程上。這次會談會很愉快，也很空洞。退縮型破裂很容易被錯過，正正是因為個案很合作。"
          - id: b
            text: "繼續之前。今天我們之間好像有些不一樣。你對我很客氣，有點像我們第一次會談的時候。我在想，這會不會跟我上星期改了時間有關。"
            fit: strong
            note: "它此時此地、試探地說出關係中的變化，並把你自己的行動作為一個可能的原因提出來。這就是立即性：談論你們兩人之間正在發生的事。"
          - id: c
            text: "你還好嗎？你今天好像比較安靜。"
            fit: workable
            note: "你留意到了，這是有分量的。但這個問題把變化放在 M 身上，而她有一個練習得很熟的答案：「我沒事。」它沒有提到關係，也沒有提到你的部分。"
        actual: "繼續之前。今天我們之間好像有些不一樣。你對我很客氣，有點像我們第一次會談的時候。我在想，這會不會跟我上星期改了時間有關。"
        rationale: "修復的第一步是留意，第二步是說出來。對一個會退縮的個案，訊號都是安靜的：回答變短，道謝變多，「沒事」回來了，任務變成「不需要」。把你自己的行動說成一個可能的原因，會讓她回答起來比較安全。"
      - id: rupture-s11-t05
        speaker: client
        text: "噢。沒有，沒關係。真的。事情總會有變。你還有其他人要見。"
      - id: rupture-s11-t06
        speaker: therapist
        text: "那次真的是沒辦法避免的。時間撞了，我挪不開。"
      - id: rupture-s11-t07
        speaker: client
        text: "當然。我完全明白。"
      - id: rupture-s11-d2
        type: free
        prompt: "治療師剛剛為改期作了解釋和辯護，M 變得更疏遠了。寫出治療師接下來說的話。承認你剛才做了什麼，並問她的經驗。"
        actual: "我想收回剛才那番話。你跟我說沒關係，我卻用解釋自己來回應。那是為了我自己，不是為了你。我真正想知道的，是我的訊息傳來的時候，你是什麼感受。"
        rationale: "治療師在關係破裂中會變得防衛。這很平常，只要察覺到，就可以修復。後設溝通是退後一步，談論這段交流本身：你做了什麼，你認為它造成了什麼，以及你想知道什麼。留意這個修正很簡短。長篇的道歉會讓 M 反過來照顧你。"
      - id: rupture-s11-t08
        speaker: client
        text: "（停頓）我在上班時收到的。看完之後我想，好吧。就這樣了。（停頓）我以為你受夠了。我前一個星期哭了那麼多。我想，我做到了。我也把她耗盡了。"
      - id: rupture-s11-d3
        type: choice
        prompt: "M 告訴你，她把改期解讀成自己太多了的證據。你說什麼？"
        options:
          - id: a
            text: "這又是你的循環，對吧？「對他們來說會太多。」"
            fit: weak
            note: "這個連結是準確的，而這是說出它最糟的時機。它把一次由你造成的破裂，變成她的一個症狀，也讓你可以避開承認自己的部分。"
          - id: b
            text: "所以在你讓我看到比以往任何時候都多的東西之後幾天，我的訊息就來了，而它讀起來就是：太多了。這讓今天的情況說得通了。我臨時改了會談時間，也沒有給你任何理由。那部分是我的，我很抱歉。這跟你哭了多少一點關係都沒有。而且我寧願聽你親口告訴我這些，也不想你一個人扛著。"
            fit: strong
            note: "它先表明，從時間點來看，她的解讀是說得通的。然後它不找藉口地承認你做的具體事情，並平實地糾正那個意義。最後一句邀請她以後多這樣說。"
          - id: c
            text: "我永遠不會這樣看你。"
            fit: workable
            note: "這是真誠的，她也需要聽到類似的話。但單獨說出來，它就是安慰。它沒有承認你做了什麼，也等於告訴她，她的恐懼只是一個誤會。"
        actual: "所以在你讓我看到比以往任何時候都多的東西之後幾天，我的訊息就來了，而它讀起來就是：太多了。這讓今天的情況說得通了。我臨時改了會談時間，也沒有給你任何理由。那部分是我的，我很抱歉。這跟你哭了多少一點關係都沒有。而且我寧願聽你親口告訴我這些，也不想你一個人扛著。"
        rationale: "先探索，再承認你的部分。用一句話承認具體的行動，並說出它不代表什麼。和她的循環之間的連結是真的，可以留待修復穩固之後，由她自己或和她一起連起來。現在說出來，就會變成一種不道歉的方式。"
      - id: rupture-s11-t09
        speaker: client
        text: "（流淚）我今天差點沒有來。我已經打好訊息，說我太忙了。"
      - id: rupture-s11-t10
        speaker: therapist
        text: "我很高興你來了。而你剛剛趁一件事還是真的時候，把它說了出來。對我說，而且是關於我的事。"
      - id: rupture-s11-t11
        speaker: client
        text: "（帶點顫抖地笑）好像是。（停頓）其實這個星期過得不好。"
    notes:
      goals: "留意並說出一次退縮型破裂。從治療師自己的防衛回應中恢復過來。探索 M 的經驗，並承認治療師的部分。"
      alliance: "因為一次改期而破裂，一開始又被治療師的解釋弄得更糟。已修復。M 說出了她當時的想法，說自己差點沒有來，然後修正了自己對這個星期的報告。"
      formulation_update: "循環在治療裡面運轉了，正如第六次會談所預測的。在大哭之後幾天改期，被解讀成「我也把她耗盡了」。M 的回應是裝作沒事、放下任務、準備離開。打斷這個循環的，是治療師說出了變化，並承認自己的部分。對 M 來說，這是一個新的經驗：一個人的疏遠，結果並不是因為她太多了，而且這件事是可以談的。"
  - id: rupture-s12
    title: "第 12 次會談：「你每次都要拉回去我媽那裡」"
    turns:
      - id: rupture-s12-t01
        speaker: client
        text: "我這個星期好累。星期六有個大型活動，大部分晚上我都在公司待到十點。我只想睡一個月。"
      - id: rupture-s12-t02
        speaker: therapist
        text: "聽起來很累人。我在想，當你這樣撐住所有事的時候，會不會跟我們談過的你媽媽有關，跟你必須做那個撐得住的人有關。"
      - id: rupture-s12-t03
        speaker: client
        text: "（語氣尖銳）你每次都要拉回去我媽那裡。不是每件事都跟她有關。有時候我就只是累。"
      - id: rupture-s12-d1
        type: choice
        prompt: "M 公開對你表示不滿。對她來說，這是新的。你怎樣回應？"
        options:
          - id: a
            text: "我提起她，是因為那是模式開始的地方。這是我們一起同意的。"
            fit: weak
            note: "你在對你的個案捍衛你的個案概念化。關於起源你可能是對的，關於今天卻可能是錯的。她會聽到自己的反對被駁回了。"
          - id: b
            text: "你對我不滿，我覺得你說得有道理。我已經好幾次把話題帶到你媽媽身上，而今天你並沒有提到她。多說一點，我這樣做的時候，你是什麼感受。"
            fit: strong
            note: "它不退縮地說出她的感受，承認真實的部分，並邀請她多說。對一個從來沒辦法反對別人的個案來說，反對被歡迎，比任何詮釋都重要。"
          - id: c
            text: "你說得對，對不起。我們不談你媽媽了。"
            fit: workable
            note: "這不帶防衛，這是好的。但它很快就結束了這件事，也可能讓 M 學到，她的怒氣會讓別人退開。你也沒有知道她的感受。"
        actual: "你對我不滿，我覺得你說得有道理。我已經好幾次把話題帶到你媽媽身上，而今天你並沒有提到她。多說一點，我這樣做的時候，你是什麼感受。"
        rationale: "在對抗型破裂中，拉力是去辯護或去讓步。第三條路是留下來：說出怒氣，承認合理的部分，並請對方多說。記住這是誰。M 用了十一次會談同意你。她的尖銳是進步。"
      - id: rupture-s12-t04
        speaker: client
        text: "（仍然尖銳，然後慢下來）感覺你已經決定了答案是什麼。就像她一樣。「想想你自己做了什麼。」你有你的理論，而我應該要套進去。"
      - id: rupture-s12-d2
        type: choice
        prompt: "M 把你和她媽媽相比。你怎樣回應？之後又怎樣走下去？"
        options:
          - id: a
            text: "我明白為什麼會有這種感覺。但是記得，循環是我們一起建構的。那不只是我的理論。"
            fit: weak
            note: "第一句聽起來像是理解，「但是」卻把它抵銷了。她在告訴你這段關係的感覺，你卻在糾正她對事件的說法。"
          - id: b
            text: "這句話我聽進去了。如果我抓緊理論多於抓緊你，我就是在做某個版本的她做過的事，我不想這樣。我們可以試試這樣嗎？當我準備把某件事連到過去時，我會先問，如果那不是你此刻所在的地方，你就告訴我。還有一件事。你剛剛當面告訴我我錯了，而且你沒有道歉。"
            fit: strong
            note: "它把這個比較當作公平的，承認具體的風險，並為你們的合作方式提出一個具體的改變。然後它標記了她剛剛做的事，那正是她來治療時做不到的事。"
          - id: c
            text: "謝謝你告訴我。我們回到你想談的事好嗎？"
            fit: workable
            note: "它優雅地接收了不滿，並把會談交還給她。不過沒有任何事被重新協商，所以同樣的事很可能會再發生。"
        actual: "這句話我聽進去了。如果我抓緊理論多於抓緊你，我就是在做某個版本的她做過的事，我不想這樣。我們可以試試這樣嗎？當我準備把某件事連到過去時，我會先問，如果那不是你此刻所在的地方，你就告訴我。還有一件事。你剛剛當面告訴我我錯了，而且你沒有道歉。"
        rationale: "修復的最後一步是重新協商：以個案同意的方式，改變任務或你們合作方式中的某些東西。一次修復了的破裂，帶來的往往比它所打斷的介入更多。在這裡，M 反對了一個重要的人，而關係仍然存在，這直接違反了「沒有人會留下」。"
      - id: rupture-s12-t05
        speaker: client
        text: "（驚訝地笑了）我沒有道歉。（停頓）我連想都沒有想到。"
      - id: rupture-s12-t06
        speaker: therapist
        text: "沒有。而我還在這裡，我也沒有厭倦你。"
      - id: rupture-s12-t07
        speaker: client
        text: "（小聲）好。（吸一口氣）我想談談累。就只是累。"
      - id: rupture-s12-t08
        speaker: therapist
        text: "那我們就談談累。"
    notes:
      goals: "陪著一次對抗型破裂，既不辯護，也不讓步。重新協商怎樣提出和過去的連結。"
      alliance: "破裂之後比破裂之前更穩固。M 對治療師生氣，說了出來，沒有道歉，而會談繼續下去。新的共識：治療師在連到過去之前會先問。"
      formulation_update: "治療師一再回到媽媽身上的傾向，以一種小的方式重複了媽媽自己的姿態：答案早已決定，M 只能套進去。M 感受得到，也說得出來。反駁「沒有人會留下」和「我的感受是別人的負擔」的證據，現在已經存在於治療關係之內。帶到下一步：結束治療會引發同一個主題，因為這一次離開的人會是治療師。"
