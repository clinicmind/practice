  context: "你說了一句話之後，個案轉身看著窗外，已經好幾分鐘沒有說話。"
  client: "（沉默）"
  criteria: *im_hard

- id: rupture-h06
  level: hard
  skill: metacommunication
  context: "你剛問了一件個案早就告訴過你、你卻忘記了的事。"
  client: "我跟你說過了。三個星期前。你根本沒在聽。"
  criteria: &mc_hard
    - "用一句話具體承認你的部分，不找藉口，也不長篇道歉。"
    - "問那一刻對個案來說是怎樣的。"
    - "提出或詢問一個可以由此走下去的方式。"
- id: rupture-h07
  level: hard
  skill: metacommunication
  context: "上星期，個案在哭的時候，你準時結束了會談。"
  client: "上星期你就這樣在中間把我打斷。「時間到了。」"
  criteria: *mc_hard
- id: rupture-h08
  level: hard
  skill: metacommunication
  context: "個案提高了聲量。你小聲地回應。"
  client: "每次我一生氣，你就變得好冷靜、好像治療師一樣。氣死人了。"
  criteria: *mc_hard
