- id: rupture-e01
  level: easy
  skill: immediacy
  context: "個案剛說出一件痛苦的事。"
  client: "我從來沒有跟任何人說過這件事。"
  criteria: &im_easy
    - "用「我」和「你」，談論此刻你和個案之間正在發生的事。"
    - "簡單說出你留意到或感受到的，不用帶評分意味的稱讚，也不帶責備。"
    - "邀請個案說出這一刻對他來說是怎樣的。"
- id: rupture-e02
  level: easy
  skill: immediacy
  context: "第十次會談。"
  client: "今天來之前我好怕。現在來了，又覺得還好。"
  criteria: *im_easy
- id: rupture-e03
  level: easy
  skill: immediacy
  context: "第十次會談。"
  client: "每次跟你談完，我都覺得輕鬆了一點。"
  criteria: *im_easy
- id: rupture-e04
  level: easy
  skill: immediacy
  context: "個案剛剛笑了，這是你們會談以來第一次。"
  client: "這個星期我真的笑了。真心的笑。剛剛也是。"
  criteria: *im_easy
- id: rupture-e05
  level: easy
  skill: immediacy
  context: "你剛提到個案兩個星期前說過的一件事。"
  client: "噢。我不確定你會記得。"
  criteria: *im_easy

- id: rupture-e06
  level: easy
  skill: metacommunication
  context: "你問了一個問題。個案回答了另一個問題，然後停了下來。"
  client: "不好意思，你剛剛問什麼？我走神了。"
  criteria: &mc_easy
    - "把你們之間剛發生的事，當作一連串事件平實地描述出來。"
    - "語氣試探，不把你的解讀當作事實。"
    - "問個案怎樣看或怎樣經驗這件事。"
- id: rupture-e07
  level: easy
  skill: metacommunication
  context: "你和個案已經兩次同時開口。"
  client: "不好意思。沒事，你先說。"
  criteria: *mc_easy
- id: rupture-e08
  level: easy
  skill: metacommunication
  context: "個案已經看了三次時鐘。"
  client: "還剩很多時間嗎？"
  criteria: *mc_easy
- id: rupture-e09
  level: easy
  skill: metacommunication
  context: "你剛提出了一個建議。"
  client: "嗯。對。也許吧。"
  criteria: *mc_easy
- id: rupture-e10
  level: easy
  skill: metacommunication
  context: "你問到個案的爸爸，接著是一段沉默。"
  client: "……不好意思，我們剛才在談什麼？"
  criteria: *mc_easy

- id: rupture-m01
  level: medium
  skill: immediacy
  context: "今天你說的每一句話，個案都同意。"
  client: "對。好。你說得對。"
  criteria: &im_medium
    - "以體貼而具體的方式，說出此刻關係中某些令人不自在的東西。"
    - "包括你自己的經驗或不確定，不只是描述個案。"
    - "語氣試探，邀請個案說出看法，但不強求。"
- id: rupture-m02
  level: medium
  skill: immediacy
  context: "第十次會談。"
  client: "你聽這些一定聽膩了。"
  criteria: *im_medium
- id: rupture-m03
  level: medium
  skill: immediacy
  context: "個案常常把話題轉到你身上。"
  client: "總之，不要再說我了。你週末過得怎樣？"
  criteria: *im_medium
- id: rupture-m04
  level: medium
  skill: immediacy
  context: "第十次會談。"
  client: "你是唯一一個真正明白我的人。"
  criteria: *im_medium
- id: rupture-m05
  level: medium
  skill: immediacy
  context: "個案在大部分會談中都會稱讚你。"
  client: "我跟我姊說你有多厲害。老實說，沒有你我真不知道該怎麼辦。"
  criteria: *im_medium

- id: rupture-m06
  level: medium
  skill: metacommunication
  context: "每次你反映一種感受，個案就說「大概吧」，然後繼續說別的。"
  client: "大概吧。總之，另一件事是……"
  criteria: &mc_medium
    - "不帶責備地描述你們之間的一個模式或一連串事件。"
    - "包括你自己可能對此有所促成的部分。"
    - "語氣試探，並問個案怎樣看。"
- id: rupture-m07
  level: medium
  skill: metacommunication
  context: "你發現自己這次會談大部分時間都在給建議。個案變得越來越安靜。"
  client: "好。好吧。我會試試。"
  criteria: *mc_medium
- id: rupture-m08
  level: medium
  skill: metacommunication
  context: "因為你的關係，會談晚了十分鐘開始。個案說得很快。"
  client: "沒關係。我們開始吧。"
  criteria: *mc_medium
- id: rupture-m09
  level: medium
  skill: metacommunication
  context: "較早時，個案問你有沒有孩子，你把問題擋開了。之後個案一直很冷淡。"
  client: "沒有，沒什麼。"
  criteria: *mc_medium
- id: rupture-m10
  level: medium
  skill: metacommunication
  context: "你在開始時定了議程。個案幾乎沒有投入。"
  client: "你想談什麼都可以。"
  criteria: *mc_medium

- id: rupture-h01
  level: hard
  skill: immediacy
  context: "第十次會談。"
  client: "你根本沒用。你就只是坐在那裡。"
  criteria: &im_hard
    - "誠實而簡短地說出承受這句話的感覺，或你留意到你們之間的什麼。"
    - "不反擊，不辯護，也不崩潰成一連串道歉。"
    - "留在個案身邊，邀請個案多說他對你的經驗。"
- id: rupture-h02
  level: hard
  skill: immediacy
  context: "第十次會談。你是接受督導的實習生。"
  client: "我敢說你跟督導談到我的時候，你們一定笑得很開心。"
  criteria: *im_hard
- id: rupture-h03
  level: hard
  skill: immediacy
  context: "個案的語氣很冷。"
  client: "我覺得你不太喜歡我。"
  criteria: *im_hard
- id: rupture-h04
  level: hard
  skill: immediacy
  context: "第十次會談。"
  client: "你啊，過著你那種整整齊齊的好日子。你懂什麼？"
