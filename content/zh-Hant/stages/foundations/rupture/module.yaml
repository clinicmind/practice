slug: rupture
version: 1.0.0
title: "關係破裂與修復"
intro: "每一段治療都會有關係受壓的時刻。個案退開，或者反推回來。這些時刻常被稱為關係破裂。關於治療聯盟的研究顯示，被留意到並得到修復的關係破裂，和良好的治療結果有關，造成傷害的，是那些沒有被處理的破裂。修復有幾個步驟：留意，說出正在發生的事，探索個案的經驗，承認你自己的部分，以及重新協商。在這個模組，你更改了一次會談時間之後，個案 M 退縮了，後來又尖銳地告訴你，你每次都要拉回去她媽媽那裡。你會練習立即性和後設溝通。"
skills:
  - immediacy
  - metacommunication
reflection_prompts:
  - id: rupture-r1
    text: "在第十一次會談，治療師為改期辯護，讓情況變得更糟，然後收回了那番話。當個案用平板的語氣說「沒關係」，你在第一秒會做什麼？什麼能幫助你更早留意到自己的防衛？"
  - id: rupture-r2
    text: "哪一種個案你比較難陪著：變得安靜客氣的個案，還是公開對你生氣的個案？兩種情況下，你通常會怎樣做？"
  - id: rupture-r3
    text: "M 說：「感覺你已經決定了答案是什麼。」你什麼時候曾經抓緊個案概念化，多於抓緊眼前的個案？你會怎樣察覺？"
