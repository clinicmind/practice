  avoid: "接受「沒什麼」。也要避免現在回答那個私人問題，當作求和。"
rupture-m10:
  model_response: "我在開始時定了一個計畫，我不覺得那是你的計畫。我卻一直拉著我們照它走。今天你本來會選擇談什麼？"
  why: "它說出不吻合的地方，承認你在拉，並把選擇交還給個案。"
  avoid: "「這些我們真的需要談到。」它把議程放在個案之上。"
rupture-h01:
  model_response: "這很難聽，我想認真看待它。今天我確實一直往後坐。告訴我，你需要我給你什麼，卻沒有得到。"
