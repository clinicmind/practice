  avoid: "「很抱歉你有這種感覺。」它為個案的感受道歉，卻什麼都沒有承認。"
rupture-h02:
  model_response: "我確實會和督導談我們的工作。沒有人在笑。你會這樣想像，讓我很在意。我在想，你心裡是不是有一部分預期，當你不在房間裡時，就會被人取笑。"
