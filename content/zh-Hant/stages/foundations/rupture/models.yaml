rupture-e01:
  model_response: "我感受到這件事的重量。我很高興你告訴我。在這裡說了出來，是什麼感覺？"
  why: "它簡短說出這一刻對你的影響，並問個案的感受。"
  avoid: "「你真的很勇敢。」這是在打分數。這一刻需要的是兩個人之間的回應。"
rupture-e02:
  model_response: "我很高興你來了之後覺得還好。我在想，今天要和我在一起，你怕的是什麼。"
  why: "它把焦點保持在你們兩人身上，並溫和地問那份害怕。"
  avoid: "問「你怕什麼？」，彷彿答案是關於房間外面的事。"
rupture-e03:
  model_response: "聽到這個很好，我也留意到我很享受我們的時間。在這裡談話，是什麼讓事情變得輕鬆了？"
  why: "它給出一個屬於你自己的、小而誠實的回應，並問個案對這段關係的經驗。"
  avoid: "略過這句話。個案剛說了一件關於你們兩人的事。"
rupture-e04:
  model_response: "我留意到了，聽到真好。在這裡，和我一起笑，是什麼感覺？"
  why: "它簡單分享你的反應，並問這一刻的事。"
  avoid: "「這是很大的進步。」它把一個時刻變成了一次量度。"
rupture-e05:
  model_response: "我確實記得。聽起來你有一半預期我不會記得。如果我忘了，那會代表什麼？"
  why: "它停留在你們之間剛發生的事，並問那份預期。"
  avoid: "「我當然記得，這是我的工作。」它讓記得變得不帶個人色彩。"
rupture-e06:
  model_response: "沒關係。我問到你爸爸，然後你有一會兒好像去了別的地方。我可能想錯了，不過我在想，那個問題會不會跟這有關。你去了哪裡？"
  why: "它平實地描述事件的次序，提出一個試探性的連結，然後詢問。"
  avoid: "只是把問題重複一次。"
rupture-e07:
  model_response: "我們一直同時開口。我在想，我今天是不是插話插得太快。你也有這種感覺嗎？"
  why: "它輕鬆地說出這個小模式，並先看你自己的部分。"
  avoid: "「不不，你先說。」這又是同一次碰撞。"
rupture-e08:
  model_response: "大概還有十五分鐘。我留意到你看了幾次時鐘，我不太確定那是為了什麼。是有什麼想談到的，還是有什麼想快點結束？"
  why: "它回答問題，描述你看到的，承認你不知道它的意思，然後詢問。"
  avoid: "「我讓你覺得很無聊嗎？」這讓這一刻變成關於你的事。"
rupture-e09:
  model_response: "這聽起來像是一個客氣的「不要」。我可能提了一些不適合你的東西。你真實的反應是什麼？"
  why: "它試探地把不冷不熱的回覆說出來，讓個案很容易不同意你。"
  avoid: "把「也許吧」當作同意，接著就開始計畫那個建議。"
rupture-e10:
  model_response: "我問到你爸爸，然後安靜了下來，現在我們失去了線索。我在想，被問到這個問題會不會很難。剛才你心裡發生了什麼？"
  why: "它沿著步驟走回去，詢問那段沉默，而不是去填滿它。"
  avoid: "當作沉默沒有發生過，把問題重複一次。"
rupture-m01:
  model_response: "今天我說的每一句你都同意，我發現自己不太確定，你是真的同意，還是很難對我說不。我真的很想聽聽那些對不上的部分。"
  why: "它體貼地說出順從，包括你自己的不確定，並邀請不同意。"
  avoid: "「你真的同意嗎？」個案會說是。"
rupture-m02:
  model_response: "我沒有聽膩。我留意到你在看我怎樣接收，我在想，一邊說話一邊擔心這件事，是什麼感覺。"
  why: "它用很少的字誠實回答，然後轉向你們之間正在發生的事。"
  avoid: "長篇安慰。這證實了個案的工作就是留意你的狀況。"
rupture-m03:
  model_response: "還不錯，謝謝。我留意到你常常把話題轉到我身上，我在想，一個完全屬於你的小時，會不會讓你覺得不自在。"
  why: "它給出一個簡短、有禮的回答，然後把模式作為一個猜測說出來。"
  avoid: "完整交代你的週末。也要避免冷冷地說「我們在這裡是要談你的事」。"
rupture-m04:
  model_response: "我很高興你在這裡覺得被明白。聽到「唯一一個」，我心裡也揪了一下。這聽起來很孤單，而且要每星期一小時來承載，是很多的。在外面的世界是怎樣的？"
  why: "它接受這份溫暖，分享一個真實的反應，並說出藏在讚美裡的困難。"
