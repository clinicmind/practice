- id: rupture-e01
  level: easy
  skill: immediacy
  context: "The client has just disclosed something painful."
  client: "I've never told anyone that before."
  criteria: &im_easy
    - "It speaks about what is happening between you and the client right now, using 'I' and 'you'."
    - "It states what you notice or feel simply, without praise that grades the client and without blame."
    - "It invites the client to say how this moment is for them."
- id: rupture-e02
  level: easy
  skill: immediacy
  context: "Tenth session."
  client: "I was dreading coming today. Now that I'm here, it's okay."
  criteria: *im_easy
- id: rupture-e03
  level: easy
  skill: immediacy
  context: "Tenth session."
  client: "I always feel a bit lighter after I've talked to you."
  criteria: *im_easy
- id: rupture-e04
  level: easy
  skill: immediacy
  context: "The client has just laughed, for the first time in your sessions."
  client: "I actually laughed this week. Properly. And just now, too."
  criteria: *im_easy
- id: rupture-e05
  level: easy
  skill: immediacy
  context: "You have just referred to something the client said two weeks ago."
  client: "Oh. I wasn't sure you'd remember that."
  criteria: *im_easy

- id: rupture-e06
  level: easy
  skill: metacommunication
  context: "You asked a question. The client answered a different one, then stopped."
  client: "Sorry, what did you ask? I went off somewhere."
  criteria: &mc_easy
    - "It describes what has just happened between you as a plain sequence of events."
    - "It is tentative, and it does not present your reading as the fact."
    - "It asks how the client saw or experienced it."
