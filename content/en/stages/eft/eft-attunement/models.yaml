eft-attunement-e01:
  model_response: "You come in and something makes you stop in the hallway, in the quiet. It sounds as if there is something in that quiet you can't quite name yet."
  why: "It uses his own picture, the hallway and the quiet, and it treats 'I don't know why' as an open edge, not as a gap to fill."
  avoid: "'Maybe you're lonely when you get home.' It supplies an answer he said he does not have."
eft-attunement-e02:
  model_response: "You tell her 'fine', and maybe some part of you knows that isn't quite true."
  why: "It holds both things he said, side by side, and does not choose between them."
  avoid: "'Why don't you tell her how you really feel?' It is advice, and it skips the part of him that knows."
eft-attunement-e03:
  model_response: "Something keeps you at the desk long after you need to be there. Maybe it's hard to find the place where you could stop."
  why: "It stays with the pull he describes and does not explain it. 'Maybe' lets him correct it."
  avoid: "'You may be a perfectionist.' It is a label, and it ends the exploring."
eft-attunement-e04:
  model_response: "He asked you a simple question, and you found you had nothing to say. That seems to have stayed with you."
  why: "It gives back the moment as he told it and leaves the rest to him."
  avoid: "'Children often don't understand adult anger.' It explains, and it takes the weight off the moment he is still standing in."
eft-attunement-e05:
  model_response: "A break sounds like empty space, and maybe you wouldn't know what belongs in it."
  why: "It takes up his own phrase, 'what to do with one', and offers a guess he can correct."
  avoid: "'You should try one anyway. Rest is important.' Advice, and it answers everybody else's comment, not his."
eft-attunement-e06:
  model_response: "It sounds like a stone sitting in your chest. Not sharp, just heavy, and always there."
  why: "It keeps his image and his detail ('not sharp', 'just there'). 'Heavy' is the only thing it adds, and it follows from a stone."
  avoid: "'That sounds like sadness.' A label that is flatter than the image he gave you."
eft-attunement-e07:
  model_response: "Everything inside went quiet, as if someone had switched the sound off."
  why: "It stays with his sensory word, 'quiet', and extends it by one small step."
  avoid: "'So you felt shut down.' It translates his image into a term, and the image is the better part."
eft-attunement-e08:
  model_response: "Your hands were shaking before you knew anything else. It's as if your body knew first."
  why: "It puts the body first, as he did, and offers the 'knew first' as a guess."
  avoid: "'What were you angry about?' It moves to the story and leaves the hands behind."
eft-attunement-e09:
  model_response: "It's as if the house grows at night, and there's too much room around you."
  why: "It takes 'too big' and makes it something you can see. It adds no event and no explanation."
  avoid: "'Do you feel lonely at night?' It asks a question and puts a label on his image."
eft-attunement-e10:
  model_response: "You stared at the page, and it felt like it belonged to someone else."
  why: "It uses his own action, staring, and his own distance, 'not about me'."
  avoid: "'You were in shock.' It names a state for him and takes the page out of the picture."
eft-attunement-m01:
  model_response: "Everyone talked, you listened, and 'it's always like that' sounds as if it carries something. Maybe part of you stays at the edge of the table."
  why: "It picks up the weight in 'always like that' and offers one image of it, without pushing him to say more than he has."
  avoid: "'Did that feel lonely?' It asks for a feeling he has not offered, and he can simply say no."
eft-attunement-m02:
  model_response: "A small thing, and even if it feels ridiculous, it still got to you. Part of you seems to be arguing with the upset while it's still here."
  why: "It does not argue with 'ridiculous'. It uses his word and notes that two things are happening."
  avoid: "'It's not ridiculous at all.' It corrects his word and makes him defend it."
eft-attunement-m03:
  model_response: "One part of you is ready to go, and another holds on to the twelve years. Both of them sound real to you."
  why: "It keeps both sides and names neither as the right one."
  avoid: "'What would you do if you left?' It starts to solve the dilemma before he has felt it."
eft-attunement-m04:
  model_response: "'Nothing to tell,' and then you stopped. It sounds as if something is just behind that pause."
  why: "It gives back his own pause and does not ask for what is behind it."
  avoid: "'What is it that you're not telling her?' It demands the content and turns the pause into an obstacle."
eft-attunement-m05:
  model_response: "She worked hard for you, and 'we weren't close' sounds as if it has more in it than you usually say out loud."
  why: "It acknowledges what he gave, the hard work, and then hints at what he held lightly."
  avoid: "'You wish you had been closer.' It states a wish he has not voiced, with certainty."
eft-attunement-m06:
  model_response: "The ring goes through you, and your whole body braces before you've even looked at the screen."
  why: "It stays with his tension and makes it a moment in time, ring first, bracing second, in an order he can recognise."
  avoid: "'You feel anxious when the phone rings.' It is true and flat, and it leaves the moment out."
eft-attunement-m07:
  model_response: "By Thursday the smile has turned into something you're holding up. Your face aches from it."
  why: "It takes his detail, the aching face, and shows what it is like from inside."
  avoid: "'You're exhausted from pretending.' It names a motive he has not claimed."
eft-attunement-m08:
  model_response: "Everyone's celebrating, and inside it's flat, as if the light that should come on hasn't."
  why: "It holds the contrast between outside and inside and gives 'flat' one concrete picture."
  avoid: "'You must be disappointed.' It guesses at a different feeling than the one he named."
eft-attunement-m09:
  model_response: "She put her arms around you and you stood there, stiff as a plank, as if your body didn't know what to do with it."
  why: "It stays with the plank and offers a guess about what the stiffness was like."
  avoid: "'You don't like being touched?' It turns a moment into a conclusion about him."
eft-attunement-m10:
  model_response: "It sounds like ten minutes in between, sitting in the car, with the day behind you and the door ahead."
  why: "It places what he said as an in-between moment, using only his details: the car, the ten minutes, the door. What fills that space is his."
  avoid: "'You don't want to go home.' It states the meaning of the pause in his place."
eft-attunement-h01:
  model_response: "You'd like something you can actually use, and talking about feelings doesn't feel on target right now. Let's stay with the moment in that argument that matters most to you and look from there. Is that okay?"
  why: "It says yes to the request and gives back that talk of feelings feels off the mark to him. It does not argue for feelings, and it asks before taking the next step."
  avoid: "'Techniques only work if we understand your feelings first.' It argues with his request and tells him he has misjudged therapy."
eft-attunement-h02:
  model_response: "You'd rather I didn't, and I won't push. Something came close just now, though, and we can leave it for as long as you like."
  why: "It respects the 'don't', it notes honestly what both of you saw, and it gives him control of when to return."
  avoid: "'It's okay to cry here.' It overrides his 'don't' with permission he has not asked for."
eft-attunement-h03:
  model_response: "It sounds like you've been getting on with things, and nothing feels wrong to you. It may not be easy to sit here when someone else saw something."
  why: "It takes him at his word and names the strain of being sent. It does not tell him he is wrong."
  avoid: "'Your wife must be worried about you.' It sides with her and makes him the problem."
eft-attunement-h04:
  model_response: "It sounds like stress, the ordinary kind that everybody has. That's how you see it, and maybe you wouldn't want it blown up into something bigger."
  why: "It accepts his frame and names his wish, to keep it simple. It does not say that there is more."
  avoid: "'Sometimes stress is a way of covering something deeper.' It argues with his frame."
eft-attunement-h05:
  model_response: "(softly) You stopped for a long while, and 'nothing' is the word that fits for now. We can stay with the quiet."
  why: "It treats the silence as part of the work and makes no demand on him. The word 'nothing' is accepted, not challenged."
  avoid: "'I think there's something there. Can you tell me about it?' It asks him again, and he has just said no."
eft-attunement-h06:
  model_response: "Tuesday came apart, and the coffee was the one thing that held. It sounds like a day you got through by holding on to small things."
  why: "It uses his joke as a way in. It is concrete, and it stays at the level of intensity he chose."
  avoid: "'That sounds like it was really painful.' It pushes to a feeling he declined to name, and he will hear that his joke did not work."
eft-attunement-h07:
  model_response: "Crying isn't how you do things. You wiped your eyes quickly, and I'm just noticing it."
  why: "It respects his rule and describes only what could be seen. It does not name a feeling or say that he should let it out."
  avoid: "'You don't have to hold it in here.' It overrules 'I don't do crying' with an invitation he did not ask for."
eft-attunement-h08:
  model_response: "Strict, solid, no one gets past the door. It sounds as if that keeps you on firm ground in that room."
  why: "It reflects his pride in the image and offers one tentative guess about what it does for him."
  avoid: "'Does being strict get lonely?' It aims at a feeling behind his pride, and he did not ask for it."
eft-attunement-h09:
  model_response: "Quiet, just you and the pages. It sounds like a place where nothing is asked of you."
  why: "It stays inside the scene he described, and it follows the little pause on 'quiet' without saying what the pause means."
  avoid: "'Is it a relief to be away from the family?' It adds a family he has not mentioned."
eft-attunement-h10:
  model_response: "She looks at you, and you feel seen right through 'just tired'. You hate that look landing on you."
  why: "It gives back the look and what the look does to him. It takes no side about his wife and does not say what he is hiding."
  avoid: "'She's worried about you.' It defends her, and it leaves him alone with the look."
