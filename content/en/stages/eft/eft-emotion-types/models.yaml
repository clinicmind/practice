eft-emotion-types-e01:
  model_response: "Primary adaptive: sadness at a loss. The clue is 'I keep wishing she'd walk in'. The feeling fits the event and points straight to what is missed."
  why: "The feeling is direct, in proportion to the event, and it tells you what the client needs. That is what makes it adaptive."
  avoid: "Treating it as a problem to fix. This sadness is doing its job."
eft-emotion-types-e02:
  model_response: "Secondary. The clue is the chain: anger, then guilt about the anger, then anger at herself. Each feeling is about the one before."
  why: "When feelings are reactions to other feelings, you have not reached the first one yet. The first one is probably what happened when she cried."
  avoid: "Picking one of the three feelings and calling it 'the' feeling. All three are on the surface."
eft-emotion-types-e03:
  model_response: "Possibly primary maladaptive, a shame that appears whenever she is seen. The clues are 'since I was small' and that it comes with praise, which gives it no reason."
  why: "It is old, it does not fit the present event, and it makes the client want to disappear, not do something. It does not guide her."
  avoid: "Telling the client it is 'shame' as a verdict. Offer it to yourself first, as a guess."
eft-emotion-types-e04:
  model_response: "Instrumental. The clue is 'he always stops', and that she is not always upset. The crying does something to the other person."
  why: "The effect on the partner is the clue. It does not mean the client is being false. Many people learn this early and do it without noticing."
  avoid: "Calling the client manipulative. It is a guess about what the feeling does, and it is not a judgment."
eft-emotion-types-e05:
  model_response: "Primary adaptive anger. The clue is that it fits what happened and carries a clear need: 'I wanted it put right'."
  why: "It is a direct response to unfairness, and it moves the client toward what she needs. Adaptive does not mean pleasant."
  avoid: "Reading the anger as 'anger problems'. Here it is healthy and informative."
eft-emotion-types-e06:
  model_response: "Irritated nearly all the time, and it doesn't make sense to you. If you go back to the last time, what else is there, under the irritation?"
  why: "It stays with the client's words and takes one step toward what may be underneath. It offers the step as a question."
  avoid: "'I wonder if you're really angry about something else.' That is your guess, handed to the client as an answer."
eft-emotion-types-e07:
  model_response: "You keep going over it, and the guilt stays with you. When you think of how she looked just then, what do you notice?"
  why: "It stays with the guilt and turns toward the moment that probably holds something truer."
  avoid: "'You shouldn't feel guilty. Everyone snaps sometimes.' That closes the feeling before you have learned what it is about."
eft-emotion-types-e08:
  model_response: "Annoyed with yourself, about the course. If you stay with that annoyance for a moment, what else shows up?"
  why: "It uses the client's word and asks for the next thing. Annoyance with oneself is often secondary."
  avoid: "'What got in the way of finishing?' It leads to reasons and plans, and away from the feeling."
eft-emotion-types-e09:
  model_response: "Flat, not sad. And it started when the team changed. What is it like, being flat?"
  why: "It respects the client's 'not sad' and keeps the question open, with no label. The change is the clue to where the feeling might be."
  avoid: "'That sounds like loss.' It tells the client what he feels and it ignores what he said."
eft-emotion-types-e10:
  model_response: "You got defensive, and you don't know why. Let's go back to that moment. What happened inside you when he asked?"
  why: "Defensiveness is a reaction to something. This takes the client back to the instant just before it."
  avoid: "'Perhaps you felt judged.' That is your guess about what he felt, and it is stated as a fact."
eft-emotion-types-m01:
  model_response: "Likely secondary: the anger is constant and it has stopped doing anything. The clue is 'it never changes anything'. To check: slow down on the last time and ask what was there just before the anger."
  why: "'Always' and 'never changes anything' suggest a feeling that repeats without moving anywhere, often covering hurt or hopelessness. You check with a question, because you do not know."
  avoid: "Treating it as primary adaptive anger because anger sounds healthy. Healthy anger moves the person toward something."
eft-emotion-types-m02:
  model_response: "Possibly primary adaptive sadness that is being held back. The clue is the wet eyes alongside 'I feel nothing'. To check: gently reflect the wet eyes and see whether she stays with it or steps away."
  why: "The feeling is not absent. Something is interrupting it. How she responds to a gentle reflection tells you more than her words."
  avoid: "'You're clearly sad.' It contradicts her and she will defend 'nothing'."
eft-emotion-types-m03:
  model_response: "Possibly primary maladaptive fear. The clues are that it began at school and does not change with preparation. To check: ask what the fear says will happen, and listen for whether it is about the talk or about himself."
  why: "A feeling that does not respond to the facts has become fixed. What the fear says about the person is where the work often lies."
  avoid: "Offering relaxation tips. That treats a fixed feeling as a skills problem."
eft-emotion-types-m04:
  model_response: "Instrumental. The clue is that she says it because of what it does to the team. To check: ask what she feels when she is disappointed and does not say so."
  why: "The question separates the feeling from its use. There may be a real feeling underneath, and she may not have been in touch with it for a while."
  avoid: "Telling her the disappointment is not real. It may be real and also useful."
eft-emotion-types-m05:
  model_response: "Primary adaptive sadness. The clues are that it fits the event and passed, and that afterwards she reached toward her sister. To check: notice that it moved, and does not return in the same form each week."
  why: "Adaptive feelings do something and then settle. This one led her to connection, and that is the sign."
  avoid: "Worrying about an hour of crying. It was a response, and it resolved."
eft-emotion-types-m06:
  model_response: "He didn't call, and you'd rather forget it. I can follow you either way. Would you like to stay with his not calling for a moment, or leave it?"
  why: "It acknowledges what she minimised, uses her words, and offers a real choice."
  avoid: "'It sounds like it mattered a lot.' That overrules 'it's nothing' and tells her what it means."
eft-emotion-types-m07:
  model_response: "Fine with it, and still wondering why. Would you like to stay with the wondering, or is there somewhere else you'd rather go?"
  why: "It takes both parts of the sentence seriously, 'fine' and 'I don't get why'. The choice keeps it safe."
  avoid: "'That must have hurt.' You have only heard 'fine'."
eft-emotion-types-m08:
  model_response: "You laughed, and it's still with you. Would you like to say what you keep coming back to?"
  why: "It reflects the contrast and invites one step. It is easy to say no to."
  avoid: "'What did she say?' It asks for content and skips the feeling."
eft-emotion-types-m09:
  model_response: "Part of you doesn't want to cry about this. That's okay. We can go slowly, or I'm happy to hear what makes it feel stupid."
  why: "It welcomes the reluctance and gives two paths. 'Stupid' is the client's own judgment, and you do not argue with it."
  avoid: "'It's not stupid at all.' You answer the judgment and leave the feeling."
eft-emotion-types-m10:
  model_response: "Your head says fine, and the rest of you says something else. Would it be all right to listen to the rest of you for a minute?"
  why: "It keeps the split as the client described it and asks permission to move toward the side that has no words yet."
  avoid: "'Your body is telling you something is wrong.' It states what the body means."
eft-emotion-types-h01:
  model_response: "Surface: secondary, guilt and self-attack after snapping, which sounds like 'terrible parent' and 'why bother'. Beneath: unknown, something in the moment before she snapped. I would follow the moment before the snap first, because staying with the guilt would repeat what she already does."
  why: "Self-attack is a loop. A feeling that is attacking itself is not the place to go deeper. The moment before gives you a fresh feeling to work with."
  avoid: "Disputing 'terrible parent'. That would answer the verdict and leave the person alone with the loop."
eft-emotion-types-h02:
  model_response: "Surface: 'tired' and 'not angry', which looks like a feeling being held down. Beneath: possibly primary adaptive anger. I would follow the tight jaw first, gently, because the body is saying what the words are not."
  why: "A tight jaw alongside 'not angry' suggests an interrupted feeling. Start with what is visible, and ask how it is."
  avoid: "'You sound angry.' She just said she was not."
eft-emotion-types-h03:
  model_response: "Surface: annoyance with everyone, which is secondary. Before that: relief, then emptiness. I would follow the emptiness right after the relief first. It is the least explained, and the annoyance probably grew out of it."
  why: "Feelings in a sequence give you a path. Go to the one where the client's words got thin."
  avoid: "Responding to the annoyance because it is the loudest feeling."
eft-emotion-types-h04:
  model_response: "Surface: no pride, and a feeling of being a fraud. Beneath: possibly primary maladaptive shame, 'same feeling as at ten'. I would follow the fraud feeling as it is now first, and check how it sits in his body, before going back to age ten."
  why: "The old feeling is alive in the present, so you can work with it now. Going straight to age ten makes it a story about the past."
  avoid: "'What happened when you were ten?' It moves from the felt experience to history."
eft-emotion-types-h05:
  model_response: "Surface: quick forgiveness, perhaps keeping the peace. Beneath: primary adaptive anger that had no room. I would follow the anger she felt in bed first, because it came back when no one was watching."
  why: "Her night-time anger is the real feeling. The quick forgiveness may have been a way to avoid it."
  avoid: "Questioning whether she really forgave. That turns toward the forgiveness and away from the anger."
eft-emotion-types-h06:
  model_response: "I'm here. It's a lot right now. Let's slow down. Feel your feet on the floor, and breathe out slowly with me. We don't have to go anywhere."
  why: "The client is overwhelmed. The response steadies and slows, and it offers no content to explore."
  avoid: "'What's the feeling right now?' That asks for more at the moment she has too much."
eft-emotion-types-h07:
  model_response: "Okay. We won't go there. You are the one who decides, and the door stays open if you ever want it."
  why: "A no is respected at once. Taking the pressure off is what keeps the relationship steady."
  avoid: "'I understand, but it might help to look at it.' That is pressure."
eft-emotion-types-h08:
  model_response: "You want to get it out, and I'm glad you trust me. Let's take one piece today, at a pace you can keep, so you don't leave carrying it alone."
  why: "It welcomes the wish and slows the pace. The aim is to keep the client safe after the session."
  avoid: "'Go ahead, tell me everything.' It deepens at speed, and the client may regret it afterwards."
eft-emotion-types-h09:
  model_response: "You came to deal with your boss, and my questions about feelings haven't felt like that. Let's check what you want from today."
  why: "The client has told you he disagrees with the task. Fixing that comes before deepening."
  avoid: "'Feelings are important to the work.' It defends the method."
eft-emotion-types-h10:
  model_response: "You feel far away. Let's come back here slowly. Can you notice the chair under you, and the floor under your feet?"
  why: "Distance is the thing happening now. A calm return to the room comes before any content."
  avoid: "'Where did you go?' It asks for content and encourages more distance."
