# 30 drills: 10 per level, 5 per skill per level.
# Marker drills: the marker is "unclear felt sense". Some clients show it clearly and some do not.

- id: eft-focusing-e01
  level: easy
  skill: marker-identification
  context: "Early session. Task: say whether you hear the marker 'unclear felt sense' (yes or no), and give the sign."
  client: "There's something in my stomach. I can't say what it is. It's just there."
  criteria: &mk_easy
    - "It gives a clear answer about whether the marker 'unclear felt sense' is present: yes or no."
    - "It points to a specific sign in the client's words or manner, or to the lack of one."
    - "It is brief and worded as a working view."
- id: eft-focusing-e02
  level: easy
  skill: marker-identification
  context: "Early session. Task: say whether you hear the marker, and give the sign."
  client: "I'm so sad about my gran. I miss her every day. I know exactly what it is."
  criteria: *mk_easy
