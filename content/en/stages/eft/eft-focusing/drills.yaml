- id: eft-focusing-m01
  level: medium
  skill: marker-identification
  context: "Middle of therapy. Task: say whether the marker is present, give the sign, and say what you would do first, before offering to slow down."
  client: "I don't know. Something. I've been off all week. (rubs chest) Can we just talk about work?"
  criteria: &mk_medium
    - "It gives a clear answer about the marker and points to a specific sign."
    - "It says what you would do first, such as reflect, check readiness or follow the client's request, before offering the task, or why another response fits better."
    - "It is brief and worded as a working view."
