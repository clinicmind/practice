- id: eft-focusing-e06
  level: easy
  skill: focusing-guidance
  context: "Early session. The marker is present. Task: write one or two sentences that invite the client to attend to the feeling."
  client: "There's something in my stomach. I can't say what."
  criteria: &fg_easy
    - "It invites the client to attend to the body sensation or inner place, as an invitation and not an order."
    - "It is one or two short sentences. It does not name, explain or interpret the feeling."
    - "It leaves room: it sets no pace and asks nothing that needs a quick answer."
