- id: eft-focusing-m06
  level: medium
  skill: focusing-guidance
  context: "The client has been attending to a place in his chest. Task: write one or two sentences that help him check the word he found."
  client: "(after a pause) It's like a stone. A small stone."
  criteria: &fg_medium
    - "It uses the client's own word or image, unchanged, and offers no replacement word."
    - "It invites the client to check the word against the feeling, and allows the word to change or be wrong."
    - "It is short, with no interpretation."
- id: eft-focusing-m07
  level: medium
  skill: focusing-guidance
  context: "The client is searching for a word. Task: write one or two sentences that help her check it."
  client: "It's kind of... tight. No, not tight. Tense? Tight."
  criteria: *fg_medium
- id: eft-focusing-m08
  level: medium
  skill: focusing-guidance
  context: "The client has been quiet for a while. Task: write one or two sentences that help him check the image."
  client: "It feels like a closed door."
  criteria: *fg_medium
- id: eft-focusing-m09
  level: medium
  skill: focusing-guidance
  context: "The client is searching for a word. Task: write one or two sentences that help her check it."
  client: "I think the word is 'empty'. But that's not quite right."
  criteria: *fg_medium
- id: eft-focusing-m10
  level: medium
  skill: focusing-guidance
  context: "The client has been attending to a feeling in his shoulders. Task: write one or two sentences that help him check the image."
  client: "It's like a weight. Actually, it's pressing from outside, not from inside."
  criteria: *fg_medium

- id: eft-focusing-h01
  level: hard
  skill: marker-identification
  context: "Early session. Task: say what points toward the marker and what argues against offering the task now. Decide: offer now, wait, or respond another way."
  client: "There's something in my chest and I can't breathe and I don't know what's happening, please..."
  criteria: &mk_hard
    - "It names what points toward an unclear felt sense and what argues against offering the task now."
    - "It decides: offer now, wait, or respond another way, and it gives the reason."
    - "It is brief and worded as a working view."
- id: eft-focusing-h02
  level: hard
  skill: marker-identification
  context: "Middle of therapy. Task: say what points toward the marker and what argues against offering the task now. Decide."
  client: "I've got a feeling, it's all in my stomach. Don't make me look at it, okay? I'll deal with it myself."
  criteria: *mk_hard
- id: eft-focusing-h03
  level: hard
  skill: marker-identification
  context: "Middle of therapy. The client is laughing. Task: say what points toward the marker and what argues against offering the task now. Decide."
  client: "There's a weird feeling. Probably nothing. (laughs) You'd say it's about my mother, wouldn't you? Everyone would."
  criteria: *mk_hard
- id: eft-focusing-h04
  level: hard
  skill: marker-identification
  context: "Middle of therapy. Task: say what points toward the marker and what argues against offering the task now. Decide."
  client: "I don't know what this is. I've tried to work it out for weeks. I've read about it. I think it's something to do with attachment."
  criteria: *mk_hard
- id: eft-focusing-h05
  level: hard
  skill: marker-identification
  context: "Ten minutes before the end of the session. Task: say what points toward the marker and what argues against offering the task now. Decide."
  client: "I feel weird. (looks at the clock) We only have ten minutes left, right?"
  criteria: *mk_hard

- id: eft-focusing-h06
  level: hard
  skill: focusing-guidance
  context: "The client has been trying to attend to a feeling. Task: write one or two sentences. Respond to what just happened before guiding further."
  client: "I'm trying to feel it, but there's nothing. Maybe I'm doing it wrong."
  criteria: &fg_hard
    - "It responds to what the client just said or did (blank, getting bigger, asking for the answer, explaining, stopping) before guiding further."
    - "It keeps the client in control: the client can slow down, step back or stop, and you do not push on."
    - "It is short, and it does not name or explain the feeling."
