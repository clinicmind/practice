  level: medium
  skill: link-identification
  context: "Session 6."
  client: "I texted my sister three times, she didn't answer, I felt like I was nothing, so I blocked her."
  criteria: *li_medium
- id: dbt-chain-m08
  level: medium
  skill: link-identification
  context: "Session 6."
  client: "I remember the heat in my chest, then I was typing so fast I couldn't see, and I thought, I'll show them."
  criteria: *li_medium
- id: dbt-chain-m09
  level: medium
  skill: link-identification
  context: "Session 6."
  client: "I felt sick after, and I thought, there's something wrong with me, and I stayed in bed."
  criteria: *li_medium
- id: dbt-chain-m10
  level: medium
  skill: link-identification
  context: "Session 6."
  client: "It started when he didn't say hello. Just 'Send the file.' I felt small. I sent the file and then I couldn't work."
  criteria: *li_medium

- id: dbt-chain-h01
  level: hard
  skill: chain-questioning
  context: "Session 5. You have asked three questions in a row. J's voice rises."
  client: "Stop interrogating me! You sound like my manager."
  criteria: &cq_hard
    - "It notices J's reaction to the questions and responds to that first, without defending the questions."
    - "It makes the next question smaller or gives J more control, for example by offering to slow down, skip a part or choose where to start."
    - "It still points to the next step of the chain, and it does not blame J."
- id: dbt-chain-h02
  level: hard
  skill: chain-questioning
  context: "Session 5. You have asked what she ordered and how much she ate."
  client: "Why do you need so many details? It doesn't matter what I ate."
  criteria: *cq_hard
- id: dbt-chain-h03
  level: hard
  skill: chain-questioning
  context: "Session 5. You have asked what she did after she deleted the reply."
  client: "I knew you'd think it was my fault. It's always my fault."
  criteria: *cq_hard
- id: dbt-chain-h04
  level: hard
  skill: chain-questioning
  context: "Session 5. You have asked what she felt in her body. J goes quiet and looks at her hands."
  client: "(She says nothing.)"
  criteria: *cq_hard
- id: dbt-chain-h05
  level: hard
  skill: chain-questioning
  context: "Session 5. You are partway through the chain."
  client: "This is pointless. I already know what I did wrong."
  criteria: *cq_hard

- id: dbt-chain-h06
  level: hard
  skill: link-identification
  context: "Session 6. J has jumped from the email to the result."
  client: "The email made me do it. That's it."
  criteria: &li_hard
    - "It points out a link or gap that J skipped or ran together, using her own words."
    - "It offers it as something to check, for example by asking whether something happened in between. It does not correct her."
    - "It does not blame J, and it does not give the answer to what the missing link was."
- id: dbt-chain-h07
  level: hard
  skill: link-identification
  context: "Session 6. J has just described the anger and the typing."
  client: "I was just angry. It's not like I thought anything."
  criteria: *li_hard
- id: dbt-chain-h08
  level: hard
  skill: link-identification
  context: "Session 6. The client's email said 'This version isn't quite right, let's think again.'"
  client: "He thinks I'm lazy. That's what the email meant."
  criteria: *li_hard
- id: dbt-chain-h09
  level: hard
  skill: link-identification
  context: "Session 6. J told you in session 3 that the day after blocking someone she feels sick."
  client: "I felt better after I blocked him."
